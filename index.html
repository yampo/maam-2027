 volver al pueblo: terraza a la sombra frente al canal. Renovada en 2024.","tip":"Comer en el Parque permite seguir al Trianon sin desandar la subida al palacio. Las reseñas dicen que se paga la vista más que la cocina.","refs":["https://en.chateauversailles.fr/plan-your-visit/facilities/flottille","https://www.visitparisregion.com/en/la-flottille"],"conf":"media","tags":["IA","Ruta 1A","Ruta 1B","Ruta 3","Excursión"],"boro":"Versalles","sub":"RER C hasta Versailles Château Rive Gauche (~10 min a pie)","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"ver_mercado_notre_dame","n":"Mercado Notre-Dame","gname":"Marché Notre-Dame","cat":"comida","typ":"Mercado","hood":"Versalles","lat":48.8066,"lng":2.13203,"addr":"Place du Marché Notre-Dame, 78000 Versailles, Versalles","cost":12,"costN":"armar un picnic (queso, pan, fruta): ~10-15 € (estimado)","dur":0.75,"why":"Comprar acá un picnic para los jardines sale bastante más barato que comer dentro del dominio. Las naves cubiertas son del siglo XIX y el mercado sigue siendo el del barrio.","tip":"Los puestos de afuera son martes, viernes y domingo por la mañana (lista municipal 2026); las naves cierran los lunes. Queda a 10 min a pie del palacio.","refs":["https://www.versailles.fr/fileadmin/www.versailles.fr/MEDIA/economie_commerces/commerces_marches/Liste_des_marches/LISTE_DES_MARCHES_FORAINS_avec_documents_a_fournir_-_2026.pdf","https://www.visitparisregion.com/fr/marche-notre-dame"],"conf":"media","tags":["IA","Ruta 1A","Ruta 1B","Ruta 3","Excursión"],"boro":"Versalles","sub":"RER C Versailles Château Rive Gauche (~10 min a pie)","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"bru_markt","n":"Plaza del Markt","gname":"Markt","cat":"barrio","typ":"Barrio / paseo","hood":"Centro","lat":51.208611,"lng":3.223889,"addr":"Markt, 8000 Brugge, Brujas","cost":0,"costN":"gratis","dur":0.5,"main":true,"why":"Es el punto de partida natural del centro histórico que el plan propone para el día 9. Desde acá se llega caminando y en plano a casi todo: el Burg está a dos cuadras y los canales a cinco minutos.","tip":"Plaza plana y peatonal en su mayor parte, con bancos y terrazas. Las terrazas de la plaza cobran precio de vista: para comer conviene alejarse una o dos cuadras.","refs":["https://nl.wikipedia.org/wiki/Markt_(Brugge)"],"conf":"media","tags":["IA","Ruta 1A","Ruta 1B","Itinerario"],"boro":"Brujas","sub":"Bus De Lijn desde la estación de Brugge hasta la parada Markt; a pie desde la estación son ~20 min","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"bru_belfort","n":"Campanario de Brujas (Belfort)","gname":"Belfort","cat":"mirador","typ":"Mirador","hood":"Centro","lat":51.208333,"lng":3.224722,"addr":"Markt 7, 8000 Brugge, Brujas","cost":16,"costN":"16 € en temporada alta (1/4-2/11), 15 € en invierno (3/11-31/3)","dur":1.0,"main":true,"book":"El sitio oficial recomienda comprar online con anticipación; el ticket tiene horario y vence si se llega tarde","why":"Es el símbolo de la ciudad y la vista más alta del centro: desde arriba se entiende cómo los canales rodean el casco viejo. En el camino se ve el mecanismo del carillón.","tip":"Son 366 escalones, sin ascensor (así lo describe el sitio oficial: 'quite an effort'). Para gente que camina mucho es posible, pero la escalera es angosta y se cruza con quien baja. Si no quieren subir, la plaza de abajo ya vale la pena.","refs":["https://www.museabrugge.be/en/visit/locations/belfort"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B","Itinerario"],"boro":"Brujas","sub":"Bus De Lijn hasta Markt","closed":"","free":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"bru_burg","n":"Plaza Burg y Ayuntamiento","gname":"Burg / Stadhuis Brugge","cat":"arq","typ":"Monumento / edificio","hood":"Centro","lat":51.208146,"lng":3.227151,"addr":"Burg 12, 8000 Brugge, Brujas","cost":8,"costN":"la plaza es gratis; el Ayuntamiento (Stadhuis) 8 €","dur":1.0,"main":true,"why":"En una sola plaza conviven el gótico del Ayuntamiento, el Palacio del Brugse Vrije y la Basílica de la Santa Sangre. Adentro del Ayuntamiento, el Salón Gótico es uno de los interiores medievales más vistosos de Flandes.","tip":"Los fines de semana el mismo ticket del Ayuntamiento da acceso también al Brugse Vrije. A veces cierra por bodas. La Musea Brugge Card (72 h, 49 €) solo conviene si piensan entrar a cuatro o más museos de la red.","refs":["https://www.museabrugge.be/en/visit/locations/stadhuis","https://nl.wikipedia.org/wiki/Stadhuis_van_Brugge"],"conf":"media","tags":["IA","Ruta 1A","Ruta 1B","Itinerario"],"boro":"Brujas","sub":"Bus De Lijn hasta Markt; 2 cuadras a pie","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"bru_santa_sangre","n":"Basílica de la Santa Sangre","gname":"Heilig-Bloedbasiliek","cat":"arq","typ":"Iglesia / templo","hood":"Centro","lat":51.208127,"lng":3.226703,"addr":"Burg 13, 8000 Brugge, Brujas","cost":0,"costN":"entrada libre; tesoro/museo 5 €","dur":0.5,"main":true,"why":"La capilla de abajo es de las pocas románicas intactas de la ciudad y contrasta con el colorido de la de arriba. La reliquia se expone a diario para veneración, y el tesoro guarda un relicario de 1617 hecho con unos 30 kg de oro y plata.","tip":"A la capilla superior se sube por una escalera de caracol de piedra. Durante las misas solo se permite la entrada a quienes asisten. La procesión de la Santa Sangre es el Día de la Ascensión (6/5/2027).","season":"Procesión de la Santa Sangre: jueves de Ascensión (6 de mayo de 2027)","refs":["https://www.holyblood.com/homepage-of-the-basilica-of-the-holy-blood","https://www.visitbruges.be/en/things-to-do/culture-and-heritage/basiliek-van-het-heilig-bloed-basilica-holy-blood"],"conf":"media","tags":["IA","Ruta 1A","Ruta 1B","Itinerario"],"boro":"Brujas","sub":"Bus De Lijn hasta Markt; 2 cuadras a pie","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"warn":[]},{"id":"bru_canales_barco","n":"Paseo en barco por los canales","gname":"Boottochten Brugge","cat":"mirador","typ":"Barco / teleférico","hood":"Centro","lat":51.206978,"lng":3.227037,"addr":"Rozenhoedkaai, 8000 Brugge (uno de los cinco embarcaderos), Brujas","aprox":true,"cost":15,"costN":"15 € adulto (tarifa fijada por la ciudad, válida hasta el 31/12/2026)","dur":0.5,"main":true,"book":"No se reserva: el ticket se compra en el embarcadero","why":"Es 'los canales' del plan del día 9 hecho sin cansarse: muestra fachadas y patios que desde la calle no se ven. Media hora, sin paradas.","tip":"Todos los embarcaderos están al nivel del agua y se baja por escaleras, sin ascensor. El que tiene menos escalones es el de Katelijnestraat 4. Con lluvia fuerte y prolongada pueden suspender.","season":"Garantizado todos los días de marzo a octubre. De noviembre a febrero solo un embarcadero por día, por turnos.","refs":["https://www.visitbruges.be/en/things-to-do/sightseeing/bruges-boat"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B","Itinerario"],"boro":"Brujas","sub":"A pie desde el Markt; embarcaderos en Huidenvettersplein 13, Rozenhoedkaai, Wollestraat 32, Nieuwstraat 11 y Katelijnestraat 4","closed":"","free":"","src":"propuesta","must":0,"rate":0,"warn":[]},{"id":"bru_rozenhoedkaai","n":"Muelle del Rosario","gname":"Rozenhoedkaai","cat":"mirador","typ":"Mirador","hood":"Centro","lat":51.207372,"lng":3.227842,"addr":"Rozenhoedkaai, 8000 Brugge, Brujas","cost":0,"costN":"gratis","dur":0.3,"main":true,"why":"Es la postal de los canales que nombra el plan, a dos minutos del Burg y en el camino natural hacia el sur de la ciudad.","tip":"Temprano a la mañana o al anochecer hay menos gente y mejor luz. Está al lado de un embarcadero, así que se puede combinar con el barco.","refs":["https://www.visitbruges.be/en/things-to-do/culture-and-heritage/rozenhoedkaai-rosary-quay"],"conf":"media","tags":["IA","Ruta 1A","Ruta 1B","Itinerario"],"boro":"Brujas","sub":"A pie desde el Markt o el Burg (3-5 min)","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"bru_sint_jan","n":"Museo del Hospital de San Juan (Memling)","gname":"Museum Sint-Janshospitaal","cat":"museo","typ":"Museo de arte","hood":"Centro sur","lat":51.203997,"lng":3.223972,"addr":"Mariastraat 38, 8000 Brugge, Brujas","cost":15,"costN":"15 € (el sitio no lista tarifa para mayores de 65)","dur":1.5,"main":true,"closed":"lunes","why":"Memling pintó cuatro de las siete obras maestras del museo para este mismo hospital, y el relicario de Santa Úrsula está en su iglesia. Es además el gran museo de pintura flamenca que se puede ver en 2027 (ver 'dudas' sobre el Groeningemuseum).","tip":"La farmacia del s. XVII y el jardín de hierbas entran con el mismo ticket. Queda en el camino entre la iglesia de Nuestra Señora y el Beaterio: se hacen los tres juntos.","refs":["https://www.museabrugge.be/en/visit/locations/sint-janshospitaal"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B"],"boro":"Brujas","sub":"A pie desde el Markt (~8 min) por Mariastraat","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"bru_olv_kerk","n":"Iglesia de Nuestra Señora (Madonna de Miguel Ángel)","gname":"Onze-Lieve-Vrouwekerk","cat":"arq","typ":"Iglesia / templo","hood":"Centro sur","lat":51.204629,"lng":3.224481,"addr":"Mariastraat, 8000 Brugge, Brujas","cost":10,"costN":"iglesia gratis; la parte museo (Madonna y tumbas de los duques) 10 €; combinado con Gruuthusemuseum 19 €","dur":0.75,"main":true,"why":"Es la única obra de Miguel Ángel que salió de Italia en vida del artista. El museo de la iglesia guarda además las tumbas de Carlos el Temerario y María de Borgoña.","tip":"La nave se recorre gratis; solo se paga para acercarse a la Madonna y al coro. Está pegada al Hospital de San Juan.","refs":["https://www.museabrugge.be/en/visit/locations/olv-kerk-museum"],"conf":"media","tags":["IA","Ruta 1A","Ruta 1B"],"boro":"Brujas","sub":"A pie desde el Markt (~7 min) por Mariastraat","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"bru_begijnhof","n":"Beaterio y Lago del Amor","gname":"Begijnhof Ten Wijngaarde / Minnewater","cat":"parque","typ":"Parque / jardín","hood":"Sur","lat":51.201111,"lng":3.221944,"addr":"Begijnhof, 8000 Brugge, Brujas","cost":0,"costN":"gratis (beaterio e iglesia)","dur":1.0,"main":true,"why":"Es patrimonio UNESCO y el rincón más silencioso de la ciudad: todavía viven monjas benedictinas y se pide silencio. Combinado con el Minnewater es el mejor paseo verde del centro, y queda camino a la estación.","tip":"Hay bancos bajo los árboles del patio y alrededor del lago. Los portones del beaterio se cierran al anochecer: ir de día.","refs":["https://www.visitbruges.be/en/things-to-do/culture-and-heritage/begijnhof-beguinage"],"conf":"media","tags":["IA","Ruta 1A","Ruta 1B"],"boro":"Brujas","sub":"A pie desde el Markt (~15 min); está a ~10 min a pie de la estación de tren","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"bru_vlaamsche_pot","n":"De Vlaamsche Pot","gname":"De Vlaamsche Pot","cat":"comida","typ":"Restaurante","hood":"Centro","lat":51.207593,"lng":3.219802,"addr":"Helmstraat 3-5, 8000 Brugge, Brujas","cost":30,"costN":"plato principal ~25-30 € (cifra de una guía de terceros, sin fecha; el menú está en una app QR)","dur":1.5,"closed":"lunes y martes (abre mié-vie a la noche, sáb-dom desde mediodía)","book":"Reserva online con garantía de tarjeta (retienen 35 € si no se presentan). Sin reserva se puede esperar mesa.","why":"El propio local dice que su stoofvlees fue elegido el mejor de Brujas, y es el plato a probar en Flandes. Ambiente de comedor de casa, sin wifi a propósito.","tip":"No permiten compartir platos y la entrada se sirve solo con un principal: pedir uno por persona. Por la tarde también sirven waffles y panqueques.","refs":["https://www.devlaamschepot.be/","https://www.devlaamschepot.be/nl/contact","https://www.devlaamschepot.be/nl/menukaart","https://www.frommers.com/destinations/bruges/restaurants/de-vlaamsche-pot"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B"],"boro":"Brujas","sub":"A pie desde el Markt (~5 min)","free":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"bru_cambrinus","n":"Cambrinus","gname":"Bierbrasserie Cambrinus","cat":"comida","typ":"Restaurante","hood":"Centro","lat":51.209632,"lng":3.226143,"addr":"Philipstockstraat 19, 8000 Brugge, Brujas","cost":25,"costN":"carbonnade ~24 € según una guía de terceros; el menú 2025 está en PDF en su web","dur":1.5,"book":"Aceptan sin reserva ('walk-ins always welcome'); hay botón de reserva en la web","why":"Es el lugar para combinar guiso de carne a la cerveza o croquetas de camarón con una cerveza belga elegida con ayuda. Abre los siete días, lo que lo hace plan B seguro si De Vlaamsche Pot está cerrado.","tip":"Ir temprano: a la hora pico de la cena se forma cola. Pedir que recomienden una cerveza para acompañar el plato.","refs":["https://www.bierbrasseriecambrinus.eu/","https://www.st-christophers.co.uk/travel-blog/where-to-eat-in-bruges-on-a-budget/"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B"],"boro":"Brujas","sub":"A pie desde el Markt (~2 min)","closed":"","free":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"bru_old_chocolate_house","n":"The Old Chocolate House","gname":"The Old Chocolate House","cat":"comida","typ":"Café / pastelería","hood":"Centro sur","lat":51.206061,"lng":3.223075,"addr":"Mariastraat 1C, 8000 Brugge, Brujas","cost":10,"costN":"estimado: chocolate caliente + waffle; no encontré precios publicados","dur":0.75,"closed":"miércoles (según su web)","why":"El chocolate caliente se arma en la mesa con leche caliente y botones de chocolate, y el waffle es receta de la abuela. Queda en el camino hacia la iglesia de Nuestra Señora y el Hospital de San Juan.","tip":"El salón está arriba de la tienda: hay que subir una escalera. Es chico y se llena a media tarde.","refs":["https://www.oldchocolatehouse.be/"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B"],"boro":"Brujas","sub":"A pie desde el Markt (~6 min)","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"bru_brugs_beertje","n":"'t Brugs Beertje","gname":"Biercafé 't Brugs Beertje","cat":"comida","typ":"Café / pastelería","hood":"Centro","lat":51.206849,"lng":3.221697,"addr":"Kemelstraat 5, 8000 Brugge, Brujas","cost":6,"costN":"estimado por cerveza; no encontré precios publicados","dur":1.0,"why":"RateBeer lo cuenta entre los mejores destinos cerveceros del mundo, y es un café de barrio auténtico, no de terrazas para turistas. Buen final de tarde con una tabla de quesos.","tip":"Abre recién a la tarde y los horarios difieren entre fuentes (Untappd lo marca cerrado los miércoles): confirmar antes. Comida solo de picoteo.","refs":["https://www.brugsbeertje.be/"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B"],"boro":"Brujas","sub":"A pie desde el Markt (~5 min)","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"bxl_grand_place","n":"Grand-Place","gname":"Grand-Place / Grote Markt","cat":"arq","typ":"Monumento / edificio","hood":"Centro (Pentágono)","lat":50.846667,"lng":4.3525,"addr":"Grand-Place, 1000 Bruxelles, Bruselas","cost":0,"costN":"gratis; el interior del Ayuntamiento solo con visita guiada (precio no verificado)","dur":0.75,"main":true,"why":"Es la primera parada que nombra el plan para el día de Bruselas y la plaza más completa de Bélgica: gótico y barroco frente a frente. El Ayuntamiento tiene visitas guiadas al interior (Salón Gótico, sala de bodas).","tip":"Plana y peatonal, pero sin bancos: sentarse en una terraza cuesta. Las calles de los alrededores tienen restaurantes trampa para turistas con carta en diez idiomas.","refs":["https://www.visit.brussels/en/visitors/plan-your-trip/a-legendary-stay-for-history-buffs/day-1-exploring-the-historical-centre","https://en.wikipedia.org/wiki/Grand-Place"],"conf":"media","tags":["IA","Ruta 1A","Ruta 1B","Itinerario","Excursión"],"boro":"Bruselas","sub":"Tren desde Brugge a Bruxelles-Central/Brussel-Centraal y 5 min a pie","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"bxl_galerias","n":"Galerías Reales Saint-Hubert","gname":"Galeries Royales Saint-Hubert","cat":"arq","typ":"Monumento / edificio","hood":"Centro (Ilot Sacré)","lat":50.8475,"lng":4.355,"addr":"Galerie du Roi / Galerie de la Reine, 1000 Bruxelles, Bruselas","cost":0,"costN":"gratis","dur":0.5,"main":true,"why":"Son 'las galerías' del plan: arquitectura elegante a cubierto, con chocolaterías históricas, librerías y cafés. Si llueve, es el mejor tramo del día.","tip":"Plano y techado. Una tienda de Maison Dandoy está en la entrada (Galerie du Roi 2), y À la Mort Subite justo enfrente de la salida norte.","refs":["https://www.visit.brussels/en/visitors/plan-your-trip/a-legendary-stay-for-history-buffs/day-1-exploring-the-historical-centre","https://en.wikipedia.org/wiki/Royal_Saint-Hubert_Galleries"],"conf":"media","tags":["IA","Ruta 1A","Ruta 1B","Itinerario","Excursión"],"boro":"Bruselas","sub":"A 3 min a pie de Bruxelles-Central","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"bxl_mont_des_arts","n":"Monte de las Artes","gname":"Mont des Arts / Kunstberg","cat":"mirador","typ":"Mirador","hood":"Barrio Real","lat":50.843889,"lng":4.356667,"addr":"Mont des Arts, 1000 Bruxelles, Bruselas","cost":0,"costN":"gratis","dur":0.5,"main":true,"why":"Es la tercera parada del plan y la bisagra entre la ciudad baja y la alta: desde arriba se ve la torre del Ayuntamiento enmarcada. Arriba están los Museos Reales de Bellas Artes.","tip":"Es una subida: escalinatas a los costados del jardín. Para cuidar las piernas, hacer el día de abajo hacia arriba una sola vez y no ir y volver.","refs":["https://www.visit.brussels/en/visitors/plan-your-trip/the-royal-quarter","https://en.wikipedia.org/wiki/Mont_des_Arts"],"conf":"media","tags":["IA","Ruta 1A","Ruta 1B","Itinerario","Excursión"],"boro":"Bruselas","sub":"A 3 min a pie de Bruxelles-Central","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"bxl_bellas_artes","n":"Museos Reales de Bellas Artes (Old Masters y Magritte)","gname":"Musées royaux des Beaux-Arts de Belgique","cat":"museo","typ":"Museo de arte","hood":"Barrio Real","lat":50.84168,"lng":4.358238,"addr":"Rue de la Régence 3, 1000 Bruxelles, Bruselas","cost":13,"costN":"13 € cada museo, combinado 20 € (precios de una versión vieja de la web oficial, sin verificar en 2026); hay tarifa senior +65 pero no la pude leer","dur":2.5,"main":true,"closed":"lunes","free":"Primer miércoles de cada mes desde las 13:00: colecciones permanentes y Museo Magritte gratis","why":"Es la mejor colección de Bruegel del mundo fuera de Viena y la mayor de Magritte. Queda arriba del Mont des Arts, así que se suma sin desvío al recorrido del plan.","tip":"Elegir uno de los dos museos: los dos juntos son muchas horas de pie. Preguntar en boletería por la tarifa senior.","conf":"media","tags":["IA","Ruta 1A","Ruta 1B","Excursión"],"boro":"Bruselas","sub":"A 7 min a pie de Bruxelles-Central, subiendo por el Mont des Arts","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[],"refs":[]},{"id":"bxl_manneken_pis","n":"Manneken Pis","gname":"Manneken Pis","cat":"arq","typ":"Monumento / edificio","hood":"Centro","lat":50.844986,"lng":4.349993,"addr":"Rue de l'Étuve / Rue du Chêne, 1000 Bruxelles, Bruselas","cost":0,"costN":"gratis","dur":0.2,"main":true,"why":"Está en todas las guías y a tres cuadras de la Grand-Place. Lo visten con trajes distintos según la fecha, lo que lo hace más interesante que la estatua sola.","tip":"Mide unos 60 cm: mucha gente se desilusiona. Ir de pasada, de camino a Spinnekopke o Dandoy.","refs":["https://en.wikipedia.org/wiki/Manneken_Pis"],"conf":"baja","tags":["IA","Ruta 1A","Ruta 1B","Excursión"],"boro":"Bruselas","sub":"A 3 min a pie de la Grand-Place","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"bxl_spinnekopke","n":"In 't Spinnekopke","gname":"In 't Spinnekopke","cat":"comida","typ":"Restaurante","hood":"Centro (Saint-Géry / Dansaert)","lat":50.848382,"lng":4.343549,"addr":"Place du Jardin aux Fleurs 1 / Bloemenhofplein 1, 1000 Bruxelles, Bruselas","cost":30,"costN":"carta 25-45 € (Le Fooding, actualizado junio 2026)","dur":1.5,"book":"Conviene reservar: hay quejas de esperas","why":"Nuevos dueños sacaron el menú turístico y renovaron las tres salas sin perder la casa del siglo XVIII. Le Fooding recomienda las croquetas de camarón, el guiso de carne con papas fritas y la salchicha con stoemp.","tip":"Según Le Fooding cierra domingo y lunes (no lo confirmé en una fuente oficial): no sirve si la excursión cae esos días. Está fuera del circuito más turístico: se come mejor por el precio.","refs":["https://lefooding.com/nl/restaurants/int-spinnekopke-3"],"conf":"media","tags":["IA","Ruta 1A","Ruta 1B","Excursión"],"boro":"Bruselas","sub":"A 10 min a pie de la Grand-Place; metro/premetro Bourse","closed":"","free":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"bxl_mort_subite","n":"À la Mort Subite","gname":"À la Mort Subite","cat":"comida","typ":"Café / pastelería","hood":"Centro (Ilot Sacré)","lat":50.848624,"lng":4.356268,"addr":"Rue Montagne aux Herbes Potagères 7, 1000 Bruxelles, Bruselas","cost":12,"costN":"estimado: una cerveza y un plato de quesos o embutidos; sin precios leídos","dur":1.0,"why":"Uno de los cafés más antiguos de la ciudad, sigue en manos de la familia fundadora; Jacques Brel era habitual. Es para probar una gueuze o una kriek de verdad en un salón de época.","tip":"Abre todos los días desde las 11 según su web. Comida simple (quesos, fiambres, sándwiches). Aceptan tarjeta.","refs":["https://www.alamortsubite.com/"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B","Excursión"],"boro":"Bruselas","sub":"A 3 min a pie de Bruxelles-Central","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"bxl_dandoy","n":"Maison Dandoy (salón de waffles)","gname":"Maison Dandoy – Buls","cat":"comida","typ":"Café / pastelería","hood":"Centro","lat":50.846129,"lng":4.351983,"addr":"Rue Charles Buls 14, 1000 Bruxelles, Bruselas","cost":8,"costN":"estimado: un waffle con bebida; sin precios leídos","dur":0.5,"why":"Para el waffle de Bruselas o de Lieja hecho bien, sin las coberturas de los puestos turísticos. La tienda original de Rue au Beurre 31, al lado de la Grand-Place, vende el speculoos de siempre para llevarse.","tip":"La sucursal de Buls abre todos los días hasta tarde según su web. El salón de waffles está en el piso de arriba, según una guía de terceros.","refs":["https://maisondandoy.com/boutiques"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B","Excursión"],"boro":"Bruselas","sub":"A 2 min a pie de la Grand-Place","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"gan_sint_baafs","n":"Catedral de San Bavón y el Cordero Místico","gname":"Sint-Baafskathedraal","cat":"arq","typ":"Iglesia / templo","hood":"Centro","lat":51.053056,"lng":3.726667,"addr":"Sint-Baafsplein, 9000 Gent, Gante","cost":12.5,"costN":"catedral gratis; centro de visitantes del retablo 12,5 €, 16 € con recorrido de realidad aumentada (precios de Visit Gent, sin fecha)","dur":1.5,"main":true,"book":"El sitio oficial de turismo recomienda comprar online, en sintbaafskathedraal.be","why":"El Cordero Místico es una de las obras fundamentales de la pintura europea y la razón principal para ir a Gante. El recorrido con gafas de realidad aumentada, que baja a la cripta, está en español.","tip":"Una fuente indicaba que el registro superior de los paneles interiores estaba en restauración: confirmar al comprar. La catedral sola se visita gratis.","refs":["https://visit.gent.be/en/see-do/st-bavos-cathedral","https://visit.gent.be/nl/zien-doen/bezoekerscentrum-sint-baafskathedraal"],"conf":"media","tags":["IA","Ruta 1A","Ruta 1B","Excursión"],"boro":"Gante","sub":"Tren Brugge-Gent Sint-Pieters y tranvía hasta el centro (Korenmarkt)","closed":"","free":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"gan_gravensteen","n":"Castillo de los Condes","gname":"Gravensteen","cat":"arq","typ":"Palacio / castillo","hood":"Centro (Sint-Veerleplein)","lat":51.057181,"lng":3.720765,"addr":"Sint-Veerleplein 11, 9000 Gent, Gante","cost":15,"costN":"15 € (no hay tarifa senior); audioguía incluida","dur":1.5,"main":true,"book":"Online recomendado para entrada garantizada; el ticket online no se devuelve","why":"Es un castillo de verdad en medio de la ciudad, y desde las almenas se ve el casco histórico y los canales. La audioguía incluida cuenta la historia con humor.","tip":"La visita sube a las almenas por escaleras de piedra (de memoria, no lo leí en la fuente oficial). Abre todos los días.","season":"Del 4/12/2026 al 3/1/2027 hay un evento de invierno con precio distinto","refs":["https://historischehuizen.stad.gent/en/gravensteen/bezoek/plan-je-bezoek/information-prices"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B","Excursión"],"boro":"Gante","sub":"Tranvía hasta Gravensteen / Korenmarkt desde Gent Sint-Pieters","closed":"","free":"","src":"propuesta","aprox":false,"must":0,"rate":0,"warn":[]},{"id":"gan_graslei","n":"Graslei y Korenlei","gname":"Graslei / Korenlei","cat":"barrio","typ":"Barrio / paseo","hood":"Centro","lat":51.055,"lng":3.720833,"addr":"Graslei, 9000 Gent, Gante","cost":0,"costN":"gratis","dur":0.75,"main":true,"why":"Es la vista más famosa de Gante, y gratis. Entre los dos muelles y el puente de San Miguel se ven las tres torres de la ciudad alineadas.","tip":"El borde del muelle es para sentarse junto al agua, y hay barcos por los canales como en Brujas. Desde el puente de San Miguel (Sint-Michielsbrug) está la mejor foto.","refs":["https://nl.wikipedia.org/wiki/Graslei"],"conf":"media","tags":["IA","Ruta 1A","Ruta 1B","Excursión"],"boro":"Gante","sub":"Tranvía hasta Korenmarkt","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"gan_belfort","n":"Campanario de Gante","gname":"Belfort van Gent","cat":"mirador","typ":"Mirador","hood":"Centro (Botermarkt)","lat":51.053889,"lng":3.725278,"addr":"Sint-Baafsplein / Botermarkt 17, 9000 Gent, Gante","cost":13,"costN":"13 €","dur":1.0,"main":true,"why":"A diferencia del de Brujas, tiene ascensor para la mayor parte de la subida, así que es la torre más llevadera de las dos. Queda pegado a la catedral.","tip":"Hay que subir unos cien escalones hasta el primer piso y ahí tomar el ascensor. Ojo: el ascensor no se puede usar para bajar, así que se baja todo a pie. Abre todos los días.","refs":["https://historischehuizen.stad.gent/en/belfry/visit/info-tarifs"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B","Excursión"],"boro":"Gante","sub":"Tranvía hasta Korenmarkt; 3 min a pie","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"gan_klokhuys","n":"'t Klokhuys","gname":"'t Klokhuys","cat":"comida","typ":"Restaurante","hood":"Patershol","lat":51.057999,"lng":3.723498,"addr":"Corduwaniersstraat 65, 9000 Gent, Gante","cost":25,"costN":"sin precios verificados","dur":1.5,"book":"Conviene reservar: el salón es chico","why":"El waterzooi, guiso cremoso de pollo o pescado, es el plato de Gante, y este local figura en la lista oficial de Visit Gent para probarlo. El Patershol, con callecitas medievales, queda al lado del castillo.","tip":"Pedir el waterzooi. No encontré la web propia ni horarios oficiales: confirmar que abre el día de la excursión.","refs":["https://visit.gent.be/en/eat-drink/t-klokhuys"],"conf":"media","tags":["IA","Ruta 1A","Ruta 1B","Excursión"],"boro":"Gante","sub":"Tranvía hasta Gravensteen; 3 min a pie","closed":"","free":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"ams_jordaan","n":"Barrio Jordaan","gname":"Jordaan","cat":"barrio","typ":"Barrio / paseo","hood":"Jordaan","lat":52.37638889,"lng":4.88166667,"addr":"Entre Prinsengracht, Brouwersgracht, Lijnbaansgracht y Rozengracht, Ámsterdam","cost":0,"costN":"gratis","dur":2.5,"main":true,"why":"Es el Ámsterdam de casas angostas sin el gentío del centro: canales chicos como Egelantiersgracht y Bloemgracht, puentes y hofjes (patios de asilos antiguos). Los sábados la Noordermarkt tiene mercado y queda pegada a dos de los cafés de esta lista.","tip":"Todo plano. Ojo con las bicicletas: miren antes de cruzar cualquier carril rojo. Combinar con Winkel 43 o Papeneiland para sentarse.","refs":["https://en.wikipedia.org/wiki/Jordaan"],"conf":"media","tags":["IA","Ruta 1A","Ruta 1B","Itinerario"],"boro":"Ámsterdam","sub":"Tranvía 13 o 17, parada Westermarkt; o 15 min a pie desde Centraal","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"ams_canales","n":"Anillo de canales (Herengracht, Keizersgracht, Prinsengracht)","gname":"Grachtengordel","cat":"barrio","typ":"Barrio / paseo","hood":"Grachtengordel","lat":52.36626111,"lng":4.88570278,"addr":"Herengracht / Keizersgracht / Prinsengracht, Ámsterdam","cost":0,"costN":"gratis a pie; los paseos en barco se pagan aparte","dur":2.5,"main":true,"why":"Es el plan del día de llegada según la ruta: casas de comerciantes con fachadas de gablete, más de mil puentes y vistas largas sobre el agua. El tramo de la Herengracht entre Leidsestraat y Vijzelstraat (la «curva de oro») tiene las casas más grandes; Reguliersgracht, la famosa vista de los siete puentes.","tip":"Plano, pero las veredas junto al canal son angostas y sin baranda. Un paseo en barco de una hora es la forma de verlo sentados.","refs":["https://nl.wikipedia.org/wiki/Grachtengordel_(Amsterdam)"],"conf":"media","tags":["IA","Ruta 1A","Ruta 1B","Itinerario"],"boro":"Ámsterdam","sub":"A pie desde Centraal o Dam; tranvías 2, 12, 13, 17 lo cruzan","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"ams_rijksmuseum","n":"Rijksmuseum","cat":"museo","typ":"Museo de arte","hood":"Museumplein","lat":52.36,"lng":4.8853,"addr":"Museumstraat 1, Ámsterdam","cost":25,"costN":"25 € adultos (web oficial, oct-2026)","dur":3,"main":true,"book":"Entrada con horario de inicio, comprada online; en puerta solo si sobra cupo","why":"La Ronda de noche de Rembrandt y La lechera de Vermeer están acá, junto con la Galería de Honor del Siglo de Oro. La ruta lo marca con reserva: es de los que se agotan.","tip":"Sacar la entrada apenas haya fecha y elegir el primer horario. El jardín del museo es gratis y tiene bancos. Abre todos los días del año según la web oficial.","refs":["https://www.rijksmuseum.nl/en/visit","https://www.rijksmuseum.nl/en/visit/practical-info/opening-hours-and-prices"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B","Itinerario"],"boro":"Ámsterdam","sub":"Tranvía 2 o 12, parada Rijksmuseum","closed":"","free":"","src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"ams_vondelpark","n":"Vondelpark","cat":"parque","typ":"Parque / jardín","hood":"Oud-Zuid","lat":52.358,"lng":4.868,"addr":"Vondelpark, Ámsterdam","cost":0,"costN":"gratis","dur":1.5,"main":true,"why":"Es el complemento del Rijksmuseum en la ruta: se llega caminando y tiene estanques, rosaleda y senderos planos de unos 1,5 km de largo. Bueno para descansar las piernas después de tres horas de museo.","tip":"Los senderos los comparten con muchas bicicletas: caminen por los bordes. Hay bancos en todo el recorrido.","season":"La rosaleda luce de fines de primavera a otoño; en otoño, hojas.","refs":["https://en.wikipedia.org/wiki/Vondelpark"],"conf":"media","tags":["IA","Ruta 1A","Ruta 1B","Itinerario"],"boro":"Ámsterdam","sub":"Tranvía 1 o 2, parada Leidseplein / Van Baerlestraat; a 5 min del Rijksmuseum","closed":"","free":"","book":"","src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"warn":[]},{"id":"ams_vangogh","n":"Museo Van Gogh","gname":"Van Gogh Museum","cat":"museo","typ":"Museo de arte","hood":"Museumplein","lat":52.3583,"lng":4.8811,"addr":"Museumplein 6, Ámsterdam","cost":26,"costN":"25 € en 2026; 26 € desde el 1/1/2027 (web oficial)","dur":2.5,"main":true,"book":"Solo online, con hora de entrada; no se venden entradas en la puerta","why":"Recorre la vida del pintor en orden, de los campesinos oscuros de Nuenen a los girasoles y los campos de Auvers. Está a 300 m del Rijksmuseum, pero hacer los dos el mismo día es demasiado.","tip":"Comprar SOLO en tickets.vangoghmuseum.com o los revendedores que nombra el museo: la web oficial avisa de sitios con entradas falsas.","refs":["https://www.vangoghmuseum.nl/en/visit/tickets-and-ticket-prices"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B"],"boro":"Ámsterdam","sub":"Tranvía 2 o 12, parada Van Baerlestraat","closed":"","free":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"ams_annefrank","n":"Casa de Ana Frank","gname":"Anne Frank Huis","cat":"museo","typ":"Casa museo","hood":"Grachtengordel (Westermarkt)","lat":52.37525,"lng":4.88432,"addr":"Prinsengracht 263-267, Ámsterdam","cost":16.5,"costN":"16,50 € (incluye 1 € de gestión)","dur":1.5,"main":true,"book":"Solo online. Se liberan los martes a las 10:00 para la semana que cae seis semanas después","why":"Se recorre la Casa de atrás, detrás de la biblioteca giratoria, con el diario original en exhibición. Es una visita corta y muy intensa.","tip":"Escaleras muy empinadas y un escalón alto: lo dice la propia web. Poner alarma para el martes en que se liberan sus fechas. Queda en el Jordaan: se combina con el día 11.","refs":["https://www.annefrank.org/en/museum/tickets/"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B"],"boro":"Ámsterdam","sub":"Tranvía 13 o 17, parada Westermarkt","closed":"","free":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"ams_paleis","n":"Palacio Real y plaza Dam","gname":"Koninklijk Paleis Amsterdam","cat":"arq","typ":"Palacio / castillo","hood":"Centrum","lat":52.37317,"lng":4.89136,"addr":"Dam, Ámsterdam","cost":13.5,"costN":"13,50 € con audioguía incluida","dur":1.5,"main":true,"book":"Entrada online; el palacio abre unos 230 días al año, mirar el calendario","why":"La Sala del Ciudadano tiene el mundo entero dibujado en mármol en el piso; el edificio se presentaba como la octava maravilla. Sigue siendo palacio de la familia real para recepciones de Estado, por eso cierra días sueltos.","tip":"Revisar el calendario oficial antes de ir: no abre todos los días. La plaza Dam es punto de paso, no para quedarse.","refs":["https://www.paleisamsterdam.nl/en/visit/"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B"],"boro":"Ámsterdam","sub":"Tranvías 2, 4, 12, 14, 24, parada Dam; 10 min a pie de Centraal","closed":"","free":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"ams_begijnhof","n":"Begijnhof","cat":"arq","typ":"Monumento / edificio","hood":"Centrum (Spui)","lat":52.3694,"lng":4.8901,"addr":"Entrada por Spui / Gedempte Begijnensloot, Ámsterdam","cost":0,"costN":"gratis","dur":0.5,"main":true,"why":"A dos pasos del ruido del Spui se entra a un jardín silencioso rodeado de casas de los siglos XVI-XVII. Una de ellas, Het Houten Huis, es de madera y de las más antiguas de Ámsterdam.","tip":"Es un lugar donde vive gente: se pide silencio y no entrar en grupo. Plano y corto; buen respiro entre el Dam y las Negen Straatjes.","refs":["https://en.wikipedia.org/wiki/Begijnhof,_Amsterdam"],"conf":"media","tags":["IA","Ruta 1A","Ruta 1B"],"boro":"Ámsterdam","sub":"Tranvía 2 o 12, parada Spui","closed":"","free":"","book":"","src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"ams_oudekerk","n":"Oude Kerk (Iglesia Vieja)","gname":"Oude Kerk","cat":"arq","typ":"Iglesia / templo","hood":"De Wallen (Centrum)","lat":52.37411827,"lng":4.89776135,"addr":"Oudekerksplein 23, Ámsterdam","cost":null,"costN":"Precio sin verificar. se paga entrada; precio no verificado","dur":1,"why":"Iglesia gótica con techo de madera y piso hecho de lápidas; ahí está enterrada Saskia, la esposa de Rembrandt. Hoy alterna el patrimonio con exposiciones de arte actual.","tip":"Queda en pleno barrio rojo: de día es tranquilo, pero conviene saberlo antes de llegar.","refs":["https://oudekerk.nl/en/"],"conf":"media","tags":["IA","Ruta 1A","Ruta 1B"],"boro":"Ámsterdam","sub":"10 min a pie de Centraal; metro Nieuwmarkt","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"ams_rembrandthuis","n":"Casa de Rembrandt","gname":"Museum Het Rembrandthuis","cat":"museo","typ":"Casa museo","hood":"Waterlooplein (Centrum)","lat":52.36936916,"lng":4.90124965,"addr":"Jodenbreestraat 4, Ámsterdam","cost":23.5,"costN":"23,50 €; 19,50 € de 16 a 18 h (tarifas 2026 publicadas)","dur":1.5,"why":"Se ve la cocina, el dormitorio, el gabinete de curiosidades y el taller con la luz del norte en que trabajaba. Hay demostraciones de grabado y de preparación de pintura.","tip":"Casa vieja con escaleras en cada piso. Más barato en la última franja (16-18 h). Cerrado el 27 de abril de 2027 (Día del Rey).","refs":["https://www.rembrandthuis.nl/en/plan-your-visit/visitor-information/opening-hours-fees/"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B"],"boro":"Ámsterdam","sub":"Metro 51, 53 o 54, estación Waterlooplein","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"ams_hortus","n":"Jardín botánico Hortus Botanicus","gname":"Hortus Botanicus Amsterdam","cat":"parque","typ":"Parque / jardín","hood":"Plantage","lat":52.36700552,"lng":4.90789737,"addr":"Plantage Middenlaan 2A, Ámsterdam","cost":14.75,"costN":"14,75 €; solo tarjeta, no aceptan efectivo","dur":1.5,"why":"Jardín chico y caminable con invernaderos de varios climas; queda a 5 min a pie de la Casa de Rembrandt y se combinan bien.","tip":"No aceptan efectivo. El restaurante del jardín es solo para visitantes. Cierra el 25/12 y el 1/1.","refs":["https://www.dehortus.nl/en/plan-your-visit/"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B"],"boro":"Ámsterdam","sub":"Tranvía 14, parada Mr. Visserplein; metro Waterlooplein","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"ams_negenstraatjes","n":"Las Nueve Callecitas","gname":"De Negen Straatjes","cat":"tienda","typ":"Compras","hood":"Grachtengordel","lat":52.37,"lng":4.88583333,"addr":"Entre Reestraat/Wolvenstraat/Huidenstraat y Herengracht–Prinsengracht, Ámsterdam","cost":0,"costN":"gratis","dur":1,"why":"Es la forma de recorrer el anillo de canales mirando vidrieras en vez de solo agua: tiendas independientes en lugar de cadenas. Une el Dam con el Jordaan.","tip":"Plano y corto. Buena excusa para cruzar los tres canales de ida y vuelta.","refs":["https://en.wikipedia.org/wiki/De_Negen_Straatjes"],"conf":"media","tags":["IA","Ruta 1A","Ruta 1B"],"boro":"Ámsterdam","sub":"Tranvía 13 o 17, parada Westermarkt; o a pie desde el Dam","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"ams_adam_lookout","n":"Mirador A'DAM Lookout","gname":"A'DAM Lookout","cat":"mirador","typ":"Mirador","hood":"Noord","lat":52.38391667,"lng":4.90206944,"addr":"IJpromenade 4, Ámsterdam","cost":16.5,"costN":"desde 16,50 €, 2 € menos comprando online","dur":1.5,"why":"Ámsterdam es plana y casi no tiene alturas: desde acá se ve todo el centro y el puerto. El cruce en el ferry gratuito ya es un paseo en sí.","tip":"Se sube en ascensor. La hamaca «Over the Edge» sobre el vacío es opcional. Al atardecer suele llenarse.","refs":["https://www.adamlookout.com/en/"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B"],"boro":"Ámsterdam","sub":"Ferry gratuito F3 (Buiksloterweg) desde atrás de Centraal, cada 5 min","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"ams_albertcuyp","n":"Mercado Albert Cuyp","gname":"Albert Cuypmarkt","cat":"comida","typ":"Mercado","hood":"De Pijp","lat":52.35597222,"lng":4.89536111,"addr":"Albert Cuypstraat, Ámsterdam","cost":8,"costN":"arenque o stroopwafel 3-6 € (estimado)","dur":1.5,"closed":"domingo","why":"Es el lugar para probar arenque crudo en un puesto de pescado y un stroopwafel recién hecho, y de paso hacer compras para el departamento. El barrio De Pijp alrededor está lleno de cafés.","tip":"Cerrado los domingos según su web. Ir a media mañana, antes de que se llene.","refs":["https://albertcuyp-markt.amsterdam/"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B"],"boro":"Ámsterdam","sub":"Metro 52, estación De Pijp","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"ams_moeders","n":"Moeders","cat":"comida","typ":"Restaurante","hood":"Jordaan","lat":52.37181094,"lng":4.87498231,"addr":"Rozengracht 251, Ámsterdam","cost":25,"costN":"plato principal ~18-25 € (estimado, menú no leído)","dur":1.5,"book":"Solo por su web, no por teléfono; tiene 38 lugares y se llena","why":"La forma más amable de probar stamppot (puré con verduras y salchicha) y guisos holandeses. Abre todos los días, solo para la cena.","tip":"Solo cenas; reservar por la web con días de anticipación. Pueden llevar una foto de sus madres para la pared.","refs":["https://www.moeders.com/","https://www.moeders.com/en/menu"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B"],"boro":"Ámsterdam","sub":"Tranvía 13 o 17, parada Marnixstraat/Rozengracht","closed":"","free":"","main":false,"src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"ams_pancakebakery","n":"The Pancake Bakery","gname":"The Pancake Bakery","cat":"comida","typ":"Restaurante","hood":"Jordaan / Grachtengordel","lat":52.37762004,"lng":4.88619413,"addr":"Prinsengracht 191, Ámsterdam","cost":14,"costN":"almuerzo/cena desde 9 €","dur":1,"why":"Los pannenkoeken holandeses son finos y grandes, dulces o salados (con tocino y queso, por ejemplo); acá hay más de 75. Queda a 300 m de la Casa de Ana Frank.","tip":"Solo reservan para grupos de 6 o más: ir a una hora tranquila para no hacer cola.","refs":["https://pancake.nl/"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B"],"boro":"Ámsterdam","sub":"Tranvía 13 o 17, parada Westermarkt","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"ams_foodhallen","n":"Foodhallen","cat":"comida","typ":"Mercado","hood":"Oud-West","lat":52.36682734,"lng":4.86833255,"addr":"Bellamyplein 51, Ámsterdam","cost":15,"costN":"12-18 € por plato (estimado)","dur":1,"why":"Sirve para que cada uno elija: hay croquetas holandesas (bitterballen), comida indonesia, panqueques y mucho más bajo un mismo techo. Abre todos los días salvo el 25 de diciembre.","tip":"A la noche y los fines de semana hay que pelear la mesa; mejor a la hora del almuerzo. Está a 15 min a pie del Vondelpark.","refs":["https://www.foodhallen.nl/amsterdam/"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B"],"boro":"Ámsterdam","sub":"Tranvía 17, parada Ten Katestraat","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"ams_winkel43","n":"Winkel 43","cat":"comida","typ":"Café / pastelería","hood":"Jordaan","lat":52.37908515,"lng":4.88622164,"addr":"Noordermarkt 43, Ámsterdam","cost":7,"costN":"porción de tarta + café ~7-9 € (estimado)","dur":0.75,"why":"Su appeltaart alta, con mucha manzana y canela, es la que todas las guías nombran. Tiene una de las terrazas más soleadas del barrio.","tip":"Pedir la tarta con nata (met slagroom). Los sábados, con el mercado de la Noordermarkt, hay cola.","refs":["https://www.winkel43.nl/"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B"],"boro":"Ámsterdam","sub":"Tranvía 13 o 17, parada Westermarkt; 10 min a pie","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"ams_papeneiland","n":"Café 't Papeneiland","gname":"Café 't Papeneiland","cat":"comida","typ":"Café / pastelería","hood":"Jordaan","lat":52.3804586,"lng":4.88795388,"addr":"Prinsengracht 2, Ámsterdam","cost":7,"costN":"tarta + café ~7 € (estimado)","dur":0.75,"why":"Uno de los bares más antiguos de la ciudad, con azulejos de Delft y estufa; también es conocido por su tarta de manzana. La esquina da a dos de los canales más fotografiados.","tip":"Es chico: si está lleno, volver más tarde. Vale como alternativa a Winkel 43 en el mismo paseo.","refs":["https://www.papeneiland.nl/"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B"],"boro":"Ámsterdam","sub":"10 min a pie de Centraal","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"ams_smalle","n":"Café 't Smalle","gname":"Café 't Smalle","cat":"comida","typ":"Café / pastelería","hood":"Jordaan","lat":52.37673051,"lng":4.88413349,"addr":"Egelantiersgracht 12, Ámsterdam","cost":6,"costN":"café o cerveza ~4-6 € (estimado)","dur":0.75,"why":"Tiene la terraza flotante sobre el Egelantiersgracht, uno de los canales más lindos del Jordaan. Por dentro, madera, vitrales y aire del siglo XVIII.","tip":"La terraza es mínima y se llena con sol: ir a media mañana. Cocina corta (sándwiches, sopas).","refs":["https://www.cityzeum.com/cafe-t-smalle","https://www.indagare.com/destinations/europe/netherlands/amsterdam/jordaan/restaurants/cafe-t-smalle/"],"conf":"media","tags":["IA","Ruta 1A","Ruta 1B"],"boro":"Ámsterdam","sub":"Tranvía 13 o 17, parada Westermarkt","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"haa_grote_markt","n":"Grote Markt de Haarlem","gname":"Grote Markt (Haarlem)","cat":"barrio","typ":"Barrio / paseo","hood":"Centro","lat":52.38136667,"lng":4.63590556,"addr":"Grote Markt, Haarlem","cost":0,"costN":"gratis","dur":2,"main":true,"why":"Haarlem es la excursión que nombra la ruta: una ciudad del Siglo de Oro más chica y tranquila que Ámsterdam, con casco antiguo plano y calles peatonales. La Grote Markt es el centro de todo y desde ahí se hacen a pie los demás lugares de esta lista.","tip":"Todo plano y compacto: los cinco lugares de Haarlem están a menos de 15 min a pie entre sí. Los lunes cierran el Frans Hals y el Teylers.","refs":["https://en.wikipedia.org/wiki/Grote_Markt,_Haarlem"],"conf":"media","tags":["IA","Ruta 1A","Ruta 1B","Itinerario","Excursión"],"boro":"Haarlem","sub":"Tren desde Amsterdam Centraal a Haarlem (unos 15 min); 10 min a pie desde la estación","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"haa_bavo","n":"Iglesia de San Bavón","gname":"Grote of St.-Bavokerk","cat":"arq","typ":"Iglesia / templo","hood":"Centro","lat":52.381241,"lng":4.637871,"addr":"Grote Markt 22, Haarlem","cost":4,"costN":"4 € adultos (web oficial)","dur":1,"main":true,"closed":"domingo","why":"El órgano ocupa una pared entera y es de los más famosos del mundo; Mozart lo tocó a los 10 años. Frans Hals está enterrado en el piso de la nave.","tip":"Cerrada a la visita los domingos y en algunos feriados. La web anuncia conciertos de órgano: si coincide, vale la pena.","refs":["https://www.bavo.nl/en/visit-the-bavo/opening-hours-and-pricing/"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B","Excursión"],"boro":"Haarlem","sub":"10 min a pie de la estación de Haarlem","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"haa_franshals","n":"Museo Frans Hals","gname":"Frans Hals Museum (Hof)","cat":"museo","typ":"Museo de arte","hood":"Groot Heiligland","lat":52.37660616,"lng":4.63368974,"addr":"Groot Heiligland 62, Haarlem","cost":18.5,"costN":"18,50 € adultos","dur":2,"main":true,"closed":"lunes","why":"Tiene los grandes retratos de grupo de Frans Hals, el maestro del retrato suelto y risueño del Siglo de Oro. El edificio, con patio-jardín, era un hofje para ancianos.","tip":"Abre de martes a domingo. Es más tranquilo que los museos de Ámsterdam y no hace falta reservar con semanas.","refs":["https://www.franshalsmuseum.nl/en/tickets/"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B","Excursión"],"boro":"Haarlem","sub":"15 min a pie de la estación de Haarlem","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"haa_teylers","n":"Museo Teylers","gname":"Teylers Museum","cat":"museo","typ":"Museo de arte","hood":"Spaarne","lat":52.3804,"lng":4.6403,"addr":"Spaarne 16, Haarlem","cost":18.5,"costN":"18,50 € adultos (precios 2026 publicados)","dur":1.5,"main":true,"closed":"lunes","why":"La Sala Oval original del siglo XVIII sigue como era: vitrinas de madera con minerales y aparatos eléctricos de época. Es un museo sobre cómo se miraba el mundo hace 240 años.","tip":"Cerrado los lunes. Si eligen solo un museo en Haarlem, este es el más distinto a lo que ya vieron en Ámsterdam.","refs":["https://www.teylersmuseum.nl/en/visiting-the-museum/practical-information/opening-hours-and-admission-fees"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B","Excursión"],"boro":"Haarlem","sub":"10 min a pie de la Grote Markt","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"haa_adriaan","n":"Molino De Adriaan","gname":"Molen De Adriaan","cat":"arq","typ":"Monumento / edificio","hood":"Spaarne","lat":52.38388889,"lng":4.64277778,"addr":"Papentorenvest 1A, Haarlem","cost":7.5,"costN":"7,50 € adultos, visita guiada","dur":1,"book":"Turnos de media hora con 12 lugares, conviene comprar online","why":"Es un molino que funciona y se visita por dentro con guía; desde el balcón se ve el Spaarne y el centro de Haarlem. Alternativa al plan Zaanse Schans para quien quiera ver un molino sin salir de Haarlem.","tip":"Adentro hay escaleras de molino, empinadas. Puede cambiar el horario por clima o por falta de voluntarios.","season":"Del 1 de noviembre al 1 de marzo cierra martes, miércoles y jueves.","refs":["https://www.molenadriaan.nl/en/opening-times/"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B","Excursión"],"boro":"Haarlem","sub":"10 min a pie de la estación de Haarlem","closed":"","free":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"warn":[]},{"id":"haa_tenboom","n":"Casa de Corrie ten Boom","gname":"Corrie ten Boom Huis","cat":"museo","typ":"Casa museo","hood":"Centro","lat":52.38226237,"lng":4.63535954,"addr":"Barteljorisstraat 19, Haarlem","cost":null,"costN":"Precio sin verificar. precio no verificado","dur":1,"book":"Solo con visita guiada; reservar con al menos 5 días de anticipación","why":"Se ve el escondite detrás de una pared falsa en el dormitorio de Corrie. Es la contracara en Haarlem de la Casa de Ana Frank, y mucho menos concurrida.","tip":"Visitas guiadas de martes a sábado, en neerlandés e inglés, de alrededor de una hora. Casa angosta con escaleras.","refs":["https://www.corrietenboom.com/en/home"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B","Excursión"],"boro":"Haarlem","sub":"5 min a pie de la Grote Markt","closed":"","free":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"haa_proveniershof","n":"Proveniershof","gname":"Proveniershof","cat":"arq","typ":"Monumento / edificio","hood":"Grote Houtstraat","lat":52.37722222,"lng":4.63111111,"addr":"Grote Houtstraat 140, Haarlem","cost":0,"costN":"gratis","dur":0.5,"why":"Haarlem tiene una veintena de hofjes, patios de asilos antiguos escondidos detrás de un portón; el Proveniershof es de los más grandes y queda sobre la calle comercial principal.","tip":"Se vive ahí: silencio, y algunos solo abren en horarios determinados. Si el portón está cerrado, no se entra.","refs":["https://nl.wikipedia.org/wiki/Proveniershof"],"conf":"media","tags":["IA","Ruta 1A","Ruta 1B","Excursión"],"boro":"Haarlem","sub":"10 min a pie de la Grote Markt","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"haa_jopenkerk","n":"Jopenkerk","gname":"Jopenkerk Haarlem","cat":"comida","typ":"Restaurante","hood":"Centro","lat":52.38119424,"lng":4.62989098,"addr":"Gedempte Voldersgracht 2, Haarlem","cost":20,"costN":"plato principal ~16-24 € (estimado, menú no leído)","dur":1.5,"why":"Se come bajo los vitrales de una iglesia, con la cervecería a la vista. Cervezas hechas en Haarlem con recetas históricas de la ciudad.","tip":"Abre todos los días. Queda de camino entre la estación y la Grote Markt: sirve para el almuerzo.","refs":["https://www.jopenkerk.nl/"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B","Excursión"],"boro":"Haarlem","sub":"5 min a pie de la estación de Haarlem","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"zaa_zaanse_schans","n":"Zaanse Schans","gname":"Zaanse Schans","cat":"barrio","typ":"Pueblo para caminar","hood":"Zaandam","lat":52.47388889,"lng":4.81638889,"addr":"Schansend 7, Zaandam, Zaanse Schans","cost":0,"costN":"el pueblo es de acceso libre; Ticket Zaanse Schans 29,50 € (museos, talleres y 2 molinos)","dur":4,"main":true,"why":"Es la otra excursión que propone la ruta: la imagen de postal de Holanda, con molinos que siguen moliendo pintura, especias y aceite. El pueblo se recorre gratis; se paga para entrar a molinos y museos.","tip":"Con el Ticket conviene si van a entrar a más de dos lugares; si no, pagar sueltos. Su web publica un calendario de días tranquilos y llenos: elegir uno tranquilo y llegar temprano, antes de los ómnibus de turistas.","refs":["https://www.dezaanseschans.nl/en/plan-your-visit/","https://www.dezaanseschans.nl/en/discover/windmills/"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B","Itinerario","Excursión"],"boro":"Zaanse Schans","sub":"Tren desde Amsterdam Centraal a Zaandijk Zaanse Schans; unos 15 min a pie cruzando el puente","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"zaa_dekat","n":"Molino De Kat","gname":"Verfmolen De Kat","cat":"arq","typ":"Monumento / edificio","hood":"Kalverringdijk","lat":52.47496194,"lng":4.81782839,"addr":"Kalverringdijk 29, Zaandam, Zaanse Schans","cost":null,"costN":"Precio sin verificar. incluido en el Ticket Zaanse Schans (29,50 €); entrada suelta no verificada","dur":0.75,"main":true,"why":"El molinero muestra cómo se muelen piedras y tierras para hacer pigmentos con la fuerza del viento. Es el molino más interesante para entrar de toda la Zaanse Schans.","tip":"Para subir a la galería del molino hay una escalera casi vertical: se puede ver la planta baja sin subir.","refs":["https://www.dezaanseschans.nl/en/discover/windmills/"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B","Excursión"],"boro":"Zaanse Schans","sub":"Dentro de la Zaanse Schans","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"zaa_zaansmuseum","n":"Museo Zaans","gname":"Zaans Museum","cat":"museo","typ":"Museo de historia y otros","hood":"Schansend","lat":52.47363268,"lng":4.82232391,"addr":"Schansend 7, Zaandam, Zaanse Schans","cost":3.5,"costN":"7 € adultos; 3,50 € mayores de 65 (ticketera oficial); también entra en el Ticket Zaanse Schans","dur":1,"why":"Explica por qué esta zona fue la primera región industrial de Europa, movida a viento: chocolate, galletas, pintura. Incluye la exposición sobre cómo la Zaanse Schans se volvió el símbolo de «la verdadera Holanda».","tip":"Buen lugar techado si llueve, con café adentro. Pidan tarifa de mayores de 65.","refs":["https://zaansmuseum.nl/en/","https://zaansmuseum.nl/en/tickets/"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B","Excursión"],"boro":"Zaanse Schans","sub":"Dentro de la Zaanse Schans, junto al estacionamiento","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"zaa_dekraai","n":"Panquequería De Kraai","gname":"Pannenkoekenrestaurant De Kraai","cat":"comida","typ":"Restaurante","hood":"Kraaienpad","lat":52.47291709,"lng":4.82060694,"addr":"Kraaienpad 1, Zaandam, Zaanse Schans","cost":15,"costN":"panqueque ~12-18 € (estimado); 10% de descuento con el Ticket Zaanse Schans","dur":1,"why":"Es la opción para almorzar sin salir del pueblo: panqueques holandeses enormes, dulces o salados. Lo recomienda la propia web de la Zaanse Schans.","tip":"En días llenos, comer temprano (antes de las 12). El Ticket da 10% de descuento.","refs":["https://www.dezaanseschans.nl/en/discover/hospitality/"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B","Excursión"],"boro":"Zaanse Schans","sub":"Dentro de la Zaanse Schans","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"fra_romerberg","n":"Römerberg y el Römer","gname":"Römerberg","cat":"arq","typ":"Monumento / edificio","hood":"Altstadt","lat":50.11027778,"lng":8.68222222,"addr":"Römerberg, 60311 Frankfurt am Main","cost":0,"costN":"Gratis la plaza","dur":1.0,"main":true,"why":"Es el corazón de la ciudad vieja: el Römer fue ayuntamiento desde el siglo XV y en su Kaisersaal se celebraban los banquetes de coronación de los emperadores. Pegado está el barrio de la Nueva Altstadt (proyecto Dom-Römer), casas de entramado reconstruidas sobre el trazado medieval entre la plaza y la catedral. A pasos queda la Paulskirche, donde se reunió el primer parlamento alemán en 1848.","tip":"Todo es plano y a pie. El Kaisersaal se puede visitar entrando por el patio, pero la ciudad avisa que cierra sin previo aviso por actos oficiales: no lo pongan como plato fuerte. La Paulskirche está en plan de saneamiento; no pude confirmar si se puede entrar.","refs":["https://mail.frankfurt-inklusiv.de/fileadmin/user_upload/downloads_andere/ffm_barrierefrei.pdf"],"conf":"baja","tags":["IA","Ruta 1A","Ruta 1B","Itinerario"],"boro":"Frankfurt","sub":"U4/U5 Dom/Römer","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"fra_dom","n":"Catedral de Frankfurt (Kaiserdom San Bartolomé)","gname":"Kaiserdom St. Bartholomäus","cat":"arq","typ":"Iglesia / templo","hood":"Altstadt","lat":50.11055556,"lng":8.685,"addr":"Domplatz 1, 60311 Frankfurt am Main","cost":0,"costN":"Entrada gratis; la torre ~3 € (fuente de terceros, sin fecha)","dur":0.75,"main":true,"why":"Es el edificio que explica por qué Frankfurt importa: acá elegían a los emperadores alemanes. La torre de 95 m es la silueta clásica de la ciudad vieja y su mirador a 66 m da la mejor vista del Römerberg con el skyline detrás.","tip":"La torre son unas 328 escaleras en caracol angosta: solo si las rodillas están bien. La catedral en sí no tiene escalones complicados y queda a 3 minutos del Römerberg.","refs":["https://tourispo.de/sehenswuerdigkeit/kaiserdom-st-bartholomaeus_preise-und-oeffnungszeiten.html"],"conf":"baja","tags":["IA","Ruta 1A","Ruta 1B"],"boro":"Frankfurt","sub":"U4/U5 Dom/Römer","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"fra_eiserner_steg","n":"Puente de hierro (Eiserner Steg)","gname":"Eiserner Steg","cat":"mirador","typ":"Mirador","hood":"Altstadt / Sachsenhausen","lat":50.1081,"lng":8.6822,"addr":"Eiserner Steg, 60311 Frankfurt am Main","cost":0,"costN":"Gratis","dur":0.5,"main":true,"why":"Es el cruce a pie del Main que propone la ruta: el puente original es de 1869 y el actual de 1911-12. Desde el medio se ve de un lado la catedral y la ciudad vieja y del otro los rascacielos, que es la foto de Frankfurt.","tip":"Tiene escaleras en los dos extremos para subir al tablero; mejor al atardecer. Del lado sur se baja directo al paseo del Museumsufer.","refs":["https://en.wikipedia.org/wiki/Eiserner_Steg"],"conf":"media","tags":["IA","Ruta 1A","Ruta 1B","Itinerario"],"boro":"Frankfurt","sub":"U4/U5 Dom/Römer","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"fra_sachsenhausen","n":"Alt-Sachsenhausen","gname":"Alt-Sachsenhausen","cat":"barrio","typ":"Barrio / paseo","hood":"Sachsenhausen","lat":50.10638889,"lng":8.6875,"addr":"Klappergasse / Große Rittergasse, 60594 Frankfurt am Main","aprox":true,"cost":0,"costN":"Gratis","dur":1.5,"main":true,"why":"Es el destino del cruce del Main que marca la ruta y el lugar donde vive la cultura del Apfelwein, la sidra seca de Frankfurt que se sirve en jarra de piedra (Bembel). Las tabernas más auténticas, como Wagner y Zum Gemalten Haus, están unas cuadras más al sur, sobre la Schweizer Straße.","tip":"El núcleo de Klappergasse es muy de bares turísticos de noche; para comer de verdad, caminar 10 minutos hasta la Schweizer Straße. Adoquines: calzado firme.","refs":["https://en.wikipedia.org/wiki/Sachsenhausen_(Frankfurt_am_Main)"],"conf":"baja","tags":["IA","Ruta 1A","Ruta 1B","Itinerario"],"boro":"Frankfurt","sub":"Tranvía 14/15/16/18 Frankensteiner Platz o a pie por el Eiserner Steg","closed":"","free":"","book":"","src":"propuesta","must":0,"rate":0,"season":"","warn":[]},{"id":"fra_museumsufer","n":"Orilla de los Museos (Museumsufer)","gname":"Museumsufer","cat":"parque","typ":"Paseo / costa","hood":"Sachsenhausen","lat":50.106,"lng":8.67858333,"addr":"Schaumainkai, 60596 Frankfurt am Main","cost":0,"costN":"Gratis el paseo","dur":1.0,"main":true,"why":"Es la caminata llana más linda de Frankfurt: el césped junto al agua con la vista del skyline enfrente, y en el camino el Städel, el Liebieghaus (escultura) y el Museo de Artes Aplicadas.","tip":"Plano, con bancos a lo largo de la orilla. Los sábados por la mañana hay mercado de pulgas en este tramo (de terceros, no lo verifiqué).","refs":["https://de.wikipedia.org/wiki/Museumsufer_Frankfurt"],"conf":"baja","tags":["IA","Ruta 1A","Ruta 1B"],"boro":"Frankfurt","sub":"Tranvía 15/16 Schweizer-/Gartenstraße; o a pie desde el Eiserner Steg","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"fra_staedel","n":"Museo Städel","gname":"Städel Museum","cat":"museo","typ":"Museo de arte","hood":"Sachsenhausen","lat":50.1031,"lng":8.674,"addr":"Schaumainkai 63, 60596 Frankfurt am Main","cost":19,"costN":"19 € general / 17 € reducido; martes de 15 a 18 h, 10 €","dur":2.5,"main":true,"closed":"lunes","free":"Martes desde las 15 h a 10 € (no gratis)","why":"Es el museo que justifica quedarse en Frankfurt: Durero, Cranach, Vermeer, Rembrandt, Monet y el retrato de Goethe en la campiña romana de Tischbein. Es manejable en una mañana y tiene café adentro.","tip":"Guardarropa gratis y obligatorio para mochilas y paraguas. Prestan banquetas plegables para la colección permanente y sillas de ruedas. No leí quién entra con la tarifa reducida: preguntar si aplica a jubilados.","refs":["https://www.staedelmuseum.de/en","https://www.staedelmuseum.de/en/visit"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B"],"boro":"Frankfurt","sub":"Tranvía 15/16 Otto-Hahn-Platz; U1/U2/U3/U8 Schweizer Platz","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"fra_goethe_haus","n":"Casa de Goethe y Museo del Romanticismo Alemán","gname":"Frankfurter Goethe-Haus / Deutsches Romantik-Museum","cat":"museo","typ":"Casa museo","hood":"Altstadt","lat":50.1112009,"lng":8.6775928,"addr":"Großer Hirschgraben 23-25, 60311 Frankfurt am Main","cost":12,"costN":"12 € (cubre las dos casas)","dur":1.5,"main":true,"why":"Goethe nació y creció acá: se ven la cocina, la biblioteca del padre y el teatro de títeres que lo marcó de chico. El museo nuevo del Romanticismo, adosado, tiene manuscritos y pintura de la época.","tip":"La casa histórica solo se recorre por escaleras (cuatro pisos, sin ascensor); el edificio nuevo sí es accesible. Entradas solo en la boletería, no online. Abre todos los días.","refs":["https://freies-deutsches-hochstift.de/en/visit/information/"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B"],"boro":"Frankfurt","sub":"U1-U3/U6-U8 Willy-Brandt-Platz; S Hauptwache","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"fra_main_tower","n":"Mirador del Main Tower","gname":"Main Tower Aussichtsplattform","cat":"mirador","typ":"Mirador","hood":"Bankenviertel","lat":50.1125,"lng":8.67222222,"addr":"Neue Mainzer Straße 52-58, 60311 Frankfurt am Main","cost":9,"costN":"9 € adulto (+0,50 € online); 6 € reducido","dur":1.0,"main":true,"why":"Es la única torre de Frankfurt con mirador público y la ciudad se entiende desde arriba: el Main, la ciudad vieja chiquita y los rascacielos alrededor ('Mainhattan'). Llega hasta el Taunus en día claro.","tip":"Ascensor hasta arriba, sin escaleras largas. La terraza es al aire libre: con viento o lluvia no vale la pena (hay una tarifa rebajada 'por restricción meteorológica'). Ir con cielo despejado, idealmente al atardecer.","refs":["https://www.maintower.de/en/","https://www.maintower.de/en/eintrittspreise-oeffnungszeiten/"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B"],"boro":"Frankfurt","sub":"S-Bahn Taunusanlage; U1-U3/U6-U8 Willy-Brandt-Platz","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"fra_palmengarten","n":"Palmengarten","gname":"Palmengarten","cat":"parque","typ":"Parque / jardín","hood":"Westend","lat":50.12361111,"lng":8.65555556,"addr":"Siesmayerstraße 63, 60323 Frankfurt am Main","cost":8,"costN":"8 € jubilados desde 67 años (los dos califican); adulto 10 € hasta el 7/2/2027, 9 € después","dur":2.0,"why":"Es el plan verde y tranquilo de Frankfurt: invernaderos de palmeras, cactus y orquídeas, rosaleda y estanques, con bancos por todos lados. Sirve también como plan de día gris porque buena parte es bajo techo.","tip":"Llevar documento para la tarifa de jubilado. Prestan sillas de ruedas con reserva. Terraza de la Villa Leonhardi para un café. Si van en primavera, es temporada de flor.","season":"Primavera es su mejor momento (floración); en otoño los invernaderos siguen igual.","refs":["https://www.palmengarten.de/en/visit/palmengarten.html"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B"],"boro":"Frankfurt","sub":"U6/U7 Westend (entrada Siesmayerstraße); U4/U6/U7 Bockenheimer Warte (entrada Palmengartenstraße)","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"warn":[]},{"id":"fra_kleinmarkthalle","n":"Kleinmarkthalle","gname":"Kleinmarkthalle","cat":"comida","typ":"Mercado","hood":"Altstadt","lat":50.11270833,"lng":8.68305556,"addr":"Hasengasse 5-7, 60311 Frankfurt am Main","cost":10,"costN":"Comer de pie en un puesto 5-15 €","dur":1.0,"main":true,"closed":"domingo y feriados","why":"Es el mejor lugar para comprar para cocinar en el Airbnb y probar lo local sin restaurante: salchichas de Frankfurt, Grüne Soße (salsa verde de siete hierbas), quesos y Apfelwein.","tip":"Cerrado domingos y feriados. A mediodía se llena de oficinistas: mejor a media mañana. Muchos puestos son para comer de pie.","refs":["https://kleinmarkthalle.com/"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B"],"boro":"Frankfurt","sub":"U4/U5 Dom/Römer; U/S Konstablerwache","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"fra_wagner","n":"Apfelweinwirtschaft Wagner","gname":"Apfelwein Wagner","cat":"comida","typ":"Restaurante","hood":"Sachsenhausen","lat":50.1006073,"lng":8.6822508,"addr":"Schweizer Straße 71, 60594 Frankfurt am Main","cost":20,"costN":"Plato principal ~15-25 € (estimado; no leí la carta)","dur":1.5,"main":true,"book":"Conviene reservar para la noche (online o +49 69 61 25 65)","why":"Es la taberna de Apfelwein clásica: mesas largas compartidas, jarra Bembel y cocina de Frankfurt (schnitzel con Grüne Soße, costillas de cerdo con chucrut). La lleva la tercera generación de la familia; publicó menú semanal de octubre de 2026, o sea que está abierta.","tip":"Se comparte mesa con desconocidos: es parte de la gracia. El Apfelwein es ácido; si no les gusta, pedirlo 'süß gespritzt' (con gaseosa dulce).","refs":["https://www.apfelwein-wagner.com/"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B"],"boro":"Frankfurt","sub":"U1/U2/U3/U8 Schweizer Platz","closed":"","free":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"fra_gemalten_haus","n":"Zum Gemalten Haus","gname":"Zum Gemalten Haus","cat":"comida","typ":"Restaurante","hood":"Sachsenhausen","lat":50.1007042,"lng":8.6818571,"addr":"Schweizer Straße 67, 60594 Frankfurt am Main","cost":18,"costN":"Plato principal ~12-22 € (estimado; no leí la carta)","dur":1.5,"main":true,"closed":"lunes y martes","book":"Solo aceptan reserva desde 4 personas: de a dos se llega y se pide mesa","why":"Es una de las Apfelweinwirtschaften más antiguas, de la misma familia hace tres generaciones, y la más fotogénica por los murales. Especialidades: costillas con chucrut, Grüne Soße premiada, Handkäs mit Musik (queso con cebolla en vinagre).","tip":"Cierra lunes y martes y tiene vacaciones de verano (en 2026, del 13 al 28 de julio). Está a media cuadra de Wagner: si una está llena, la otra.","refs":["https://www.zumgemaltenhaus.de/"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B"],"boro":"Frankfurt","sub":"U1/U2/U3/U8 Schweizer Platz","free":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"fra_wacker","n":"Wacker's Kaffee","gname":"Wacker's Kaffee","cat":"comida","typ":"Café / pastelería","hood":"Altstadt","lat":50.1120874,"lng":8.6792963,"addr":"Kornmarkt 9, 60311 Frankfurt am Main","cost":4,"costN":"Café ~3-5 € (estimado)","dur":0.5,"closed":"domingo","why":"Es el café histórico de Frankfurt: tuestan ellos mismos, en tostado lento, en su planta de Fechenheim, y el local del Kornmarkt es una parada de barrio con olor a café recién tostado, a pasos de la Casa de Goethe.","tip":"Local chico, mucho de pie o banqueta; ideal para un café al paso y comprar café en grano. Cerrado los domingos.","refs":["https://www.visitfrankfurt.travel/en/gastro/wackers-kaffee"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B"],"boro":"Frankfurt","sub":"U/S Hauptwache; U4/U5 Dom/Römer","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"fra_laumer","n":"Café Laumer","gname":"Café Laumer","cat":"comida","typ":"Café / pastelería","hood":"Westend","lat":50.1180489,"lng":8.6624476,"addr":"Bockenheimer Landstraße 67, 60325 Frankfurt am Main","cost":10,"costN":"Torta y café ~8-12 € (estimado)","dur":1.0,"why":"Es la casa de tortas tradicional de Frankfurt (Kaffee und Kuchen), con su propia pastelería desde 1919. Queda a 10 minutos a pie del Palmengarten: buena pausa en el mismo día.","tip":"Pasó por una quiebra y la ciudad la arrendó a un consorcio nuevo; hay reseñas de febrero de 2026 que la dan abierta, pero no hallé la web oficial funcionando. Las reseñas sobre el servicio son dispares.","refs":["https://tablejourney.com/germany/frankfurt/cafes/cafe-laumer/","https://essenundtrinken.journal-frankfurt.de/gastro_news/restauranttests-34/Traditionsgastronomie-Caf-Laumer-gerettet-12632.html"],"conf":"media","tags":["IA","Ruta 1A","Ruta 1B"],"boro":"Frankfurt","sub":"U6/U7 Westend","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"rin_ruedesheim","n":"Rüdesheim y la Drosselgasse","gname":"Drosselgasse, Rüdesheim am Rhein","cat":"barrio","typ":"Pueblo para caminar","hood":"Rüdesheim","lat":49.978341,"lng":7.920766,"addr":"Drosselgasse, 65385 Rüdesheim am Rhein, Valle del Rin","cost":0,"costN":"Gratis","dur":1.5,"main":true,"why":"Es el arranque del día del Rin que propone la ruta: de acá sale el barco y el teleférico al Niederwald. La Drosselgasse es un callejón de 144 m lleno de tabernas de vino con música; la Brömserburg, castillo de mil años, queda a pocos cientos de metros.","tip":"La Drosselgasse es muy turística: pasarla, pero comer o tomar vino en otro lado. Todo el centro es plano y está junto al embarcadero y la estación. Pedir un 'Rüdesheimer Kaffee' (café con brandy Asbach flambeado) es el ritual local.","refs":["https://de.wikipedia.org/wiki/Drosselgasse"],"conf":"baja","tags":["IA","Ruta 1A","Ruta 1B","Itinerario","Excursión"],"boro":"Valle del Rin","sub":"Tren regional RB10 desde Frankfurt Hbf hasta Rüdesheim (Rhein)","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"rin_niederwald","n":"Teleférico y monumento del Niederwald","gname":"Seilbahn Rüdesheim / Niederwalddenkmal","cat":"mirador","typ":"Mirador","hood":"Rüdesheim","lat":49.98102778,"lng":7.89983333,"addr":"Oberstraße 37, 65385 Rüdesheim am Rhein (estación del valle), Valle del Rin","cost":12,"costN":"Precio individual 2026 no publicado donde lo busqué; el folleto oficial da 11 € ida y vuelta para grupos de 20+, así que calcular algo más","dur":1.5,"main":true,"why":"Es la mejor vista del Rin de todo el día: la telecabina pasa por encima de los viñedos en pendiente y arriba se ve el codo del río hacia Bingen y la entrada a la garganta de los castillos. El 'Ringticket' combina teleférico, sendero por el bosque, telesilla a Assmannshausen y barco de vuelta a Rüdesheim.","tip":"La estación de arriba no tiene barreras. El sendero del bosque hasta la telesilla de Assmannshausen es de varios km: hermoso, pero suma caminata a un día ya largo. Si el plan es el barco hasta Bacharach/St. Goar, alcanza con subir y bajar en el teleférico.","season":"Temporada principal hasta el 1/11 (en 2026); después abre en período navideño (19/11-23/12 en 2026). El Ringticket valió del 21/3 al 1/11 en 2026.","refs":["https://www.rheinsteig.de/en/a-ruedesheim-cable-car","https://www.ruedesheim.de/fileadmin/ruedesheim/Docs/Erlebnis-Brosch%C3%BCre_2026.pdf"],"conf":"media","tags":["IA","Ruta 1A","Ruta 1B","Excursión"],"boro":"Valle del Rin","sub":"Estación del valle a pie desde la estación de Rüdesheim","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"warn":[]},{"id":"rin_barco_kd","n":"Barco por el Rin: Rüdesheim–Bacharach–St. Goar","gname":"KD Köln-Düsseldorfer, Rüdesheim–Loreley","cat":"mirador","typ":"Barco / teleférico","hood":"Rüdesheim","lat":49.9773,"lng":7.9238,"addr":"Rheinstraße (embarcadero KD), 65385 Rüdesheim am Rhein, Valle del Rin","aprox":true,"cost":27,"costN":"Precio 2027 sin publicar; terceros dan ~27 € ida Rüdesheim–St. Goar y apenas unos euros más ida y vuelta","dur":2.0,"main":true,"why":"Es el centro del día: de Rüdesheim a Bacharach es ~1 h y a St. Goar ~1 h 55 (horario 2026), con un castillo en cada curva (Rheinstein, Reichenstein, Pfalz en medio del río, Gutenfels) y la Loreley justo después de St. Goar. Sentados en cubierta, sin caminar.","tip":"Ir río abajo (Rüdesheim → St. Goar) y volver en tren por la orilla izquierda (RB26 St. Goar/Bacharach → Bingen, y ferry o tren a Rüdesheim/Frankfurt): es más rápido. Llevar abrigo para cubierta. Con el Rin bajo se suspende: pasó en agosto de 2026.","season":"Servicio diario de abril a mediados de octubre (en 2026: 4/4 al 18/10). De mediados de octubre a abril solo hay un servicio de invierno Rüdesheim–St. Goarshausen que sale si se junta un mínimo de pasajeros.","refs":["https://www.k-d.com/en/","https://www.k-d.com/en/product/ruedesheim-loreley-tour/","https://www.k-d.com/en/product/winterfahrplan-mittelrhein/"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B","Itinerario","Excursión"],"boro":"Valle del Rin","sub":"Embarcadero KD de Rüdesheim, a pie desde la estación","closed":"","free":"","book":"","src":"propuesta","must":0,"rate":0,"warn":[]},{"id":"rin_bacharach","n":"Bacharach","gname":"Bacharach","cat":"barrio","typ":"Pueblo para caminar","hood":"Bacharach","lat":50.06111111,"lng":7.76944444,"addr":"Oberstraße, 55422 Bacharach, Valle del Rin","cost":0,"costN":"Gratis","dur":1.5,"main":true,"why":"Es la parada que nombra la ruta y la más linda para bajar del barco: una calle principal (Oberstraße) de casas de entramado, la muralla medieval con torres y viñedos que bajan hasta el pueblo. Es chico: se recorre entero en una hora.","tip":"La calle principal es plana; todo lo que sube (muralla, capilla, castillo Stahleck) es con escaleras. El tren de vuelta para en el pueblo.","refs":["https://www.bacharach.de/en/a-das-alte-haus"],"conf":"baja","tags":["IA","Ruta 1A","Ruta 1B","Itinerario","Excursión"],"boro":"Valle del Rin","sub":"Embarcadero de Bacharach; tren RB26 (Mainz–Koblenz), estación Bacharach","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"rin_bacharach_muralla","n":"Capilla de Werner y torre Postenturm","gname":"Wernerkapelle / Postenturm, Bacharach","cat":"mirador","typ":"Mirador","hood":"Bacharach","lat":50.06059,"lng":7.7662901,"addr":"Bacharach (sobre la iglesia de San Pedro), Valle del Rin","cost":0,"costN":"Gratis","dur":1.0,"why":"La capilla de Werner es un esqueleto gótico sin techo, muy fotogénico, a medio camino del castillo Stahleck. Siguiendo hasta la torre Postenturm se tiene la postal clásica de Bacharach con el río.","tip":"Es subida con escalones: unos 10-15 minutos desde la Oberstraße. Hacerla solo si sobra energía después del barco.","refs":["https://de.wikipedia.org/wiki/Wernerkapelle_(Bacharach)"],"conf":"baja","tags":["IA","Ruta 1A","Ruta 1B","Excursión"],"boro":"Valle del Rin","sub":"A pie desde el centro de Bacharach","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"rin_st_goar","n":"St. Goar","gname":"Sankt Goar","cat":"barrio","typ":"Pueblo para caminar","hood":"St. Goar","lat":50.15,"lng":7.71666667,"addr":"Heerstraße, 56329 St. Goar, Valle del Rin","aprox":true,"cost":0,"costN":"Gratis","dur":1.0,"main":true,"why":"Es el otro final de barco que propone la ruta: más lejos que Bacharach, así que se ve más río y se pasa frente a la Loreley. El paseo junto al agua mira a St. Goarshausen y al castillo de Katz enfrente.","tip":"Si se elige St. Goar en vez de Bacharach, son casi 2 h de barco: llegar temprano a Rüdesheim. Hay ferry al otro lado (St. Goarshausen).","refs":["https://www.rheinsteig.de/en/a-burg-rheinfels"],"conf":"baja","tags":["IA","Ruta 1A","Ruta 1B","Itinerario","Excursión"],"boro":"Valle del Rin","sub":"Embarcadero de St. Goar; tren RB26 (Mainz–Koblenz), estación St. Goar","closed":"","free":"","book":"","src":"propuesta","must":0,"rate":0,"season":"","warn":[]},{"id":"rin_rheinfels","n":"Castillo de Rheinfels","gname":"Burg Rheinfels","cat":"arq","typ":"Palacio / castillo","hood":"St. Goar","lat":50.15413056,"lng":7.70442778,"addr":"Schlossberg, 56329 St. Goar, Valle del Rin","cost":6,"costN":"6 € adulto; 4 € reducido","dur":1.5,"main":tr
