<script>
/* El tema elegido se aplica acá, en el <head>, ANTES de que se dibuje nada. Si
   esperara al bloque grande de la app, cada apertura arrancaría clara y saltaría
   a oscuro: un fogonazo blanco a la noche, que es justo cuando se usa el oscuro.
   La preferencia es del APARATO y no del plan: no va en el estado que se
   exporta y se funde entre viajeros, sino en su propia clave. */
(function () {
  try {
    var t = localStorage.getItem('trips_tema');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>

.ilab{font-size:10.5px;font-weight:750;letter-spacing:.05em;color:var(--mut)}
.ib{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);font-size:12px;
  font-weight:750;background:var(--field);display:grid;place-items:center;transition:.12s}
.ib.v0{background:var(--v0-bg);color:var(--mut3)}
.ib.v1{background:var(--v1-bg);color:var(--v1-fg);border-color:var(--v1-bd)}
.ib.v2{background:var(--g-bg);color:var(--g-fg);border-color:var(--g-bd)}
/* «Sin opinar»: nadie dijo nada todavía. Borde punteado y «?»: se tiene que ver
   que FALTA algo, no que alguien eligió «quizás». */
.ib.vn{background:var(--field);color:var(--mut);border-style:dashed}
.ptags{display:flex;flex-wrap:wrap;gap:4px}
.ptag{font-size:10.5px;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:1px 7px;cursor:pointer;background:var(--card)}
.ptag i{font-style:normal;opacity:.7;margin-left:3px}
.ptag.on{background:var(--b-bg);color:var(--b-fg);border-color:transparent;font-weight:650}
/* La barra de etiquetas va en su propia fila: son varias y se eligen de a muchas. */
.tagbar{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:-4px 0 12px}
.tagbar .ptag{font-size:12px;padding:3px 9px}
/* Con 3+ viajeros la fila muestra un chip resumen en vez de N selectores: en un
   iPhone de 375px no entran, y 44px es un target táctil de verdad — los .ib de
   22px nunca lo fueron, y cada toque errado escribe estado sin deshacer. */
.intsum{min-width:44px;height:28px;padding:0 9px;border-radius:9px;background:var(--t-bg);
  color:var(--t-fg);font-size:12px;font-weight:750;letter-spacing:.06em;
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
/* En la ficha y la tarjeta, con muchos viajeros cada uno se lleva su renglón.
   Tiene que SEGUIR envolviendo: con nowrap, los selectores del tercero y el
   cuarto desaparecen de la pantalla (body lleva overflow-x:clip) en vez de
   romper visiblemente. */
.ints.multi .iw{flex:1 1 100%}
/* Campos del formulario de lugar */
.fl{display:block;margin-bottom:9px;font-size:11.5px;font-weight:700;color:var(--mut);
  letter-spacing:.03em}
.fl .search,.fl .bnote,.fl select{margin-top:3px;width:100%;font-weight:400;
  letter-spacing:normal;color:var(--ink);font-size:14px}
#frm{max-height:44vh;overflow-y:auto;padding-right:2px}
@media print{.ints,.intsum{display:none}}
.mustbtn{font-size:11px;font-weight:700;border:1.5px solid var(--line);background:var(--card);
  color:var(--mut2);border-radius:8px;padding:3px 8px;cursor:pointer;white-space:nowrap}
.mustbtn.on{background:var(--must-bg);border-color:var(--must-bd);color:var(--must-fg)}
.mustbtn.off{background:var(--mustoff-bg);border-color:var(--mustoff-bd);color:var(--mustoff-fg)}
.prow .mustbtn{padding:2px 6px;flex:none}
.addbtn{margin-left:auto;max-width:100%;font-size:11.5px;font-weight:700;color:var(--accent-ink);
  border:1.5px solid var(--add-bd);border-radius:9px;padding:5px 9px;background:var(--add-bg)}

/* ── mapa ── */
#map{height:min(66vh,560px);border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--sh);
  background:var(--mapbg);z-index:1}
.mk{border-radius:50%;border:2.5px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.35)}
/* Referencia de paso: anillo hueco, para que se lea distinto de una parada del día */
.mkpaso{width:15px;height:15px;background:#fff;border:3px solid;box-shadow:0 1px 4px rgba(0,0,0,.3)}
/* Pin de la vista de conjunto: el número del día es la identidad, el color acompaña */
.mdchip{cursor:pointer;font-size:11.5px;padding:3px 9px 3px 5px;font-weight:600}
.mdchip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.mdia{min-width:22px;height:22px;padding:0 3px;border-radius:11px;border:2px solid #fff;color:#fff;
  font:700 11.5px/18px ui-sans-serif,system-ui,sans-serif;text-align:center;
  box-shadow:0 1px 4px rgba(0,0,0,.35);box-sizing:border-box}
.mnum{display:grid;place-items:center;color:#fff;font-size:11px;font-weight:800;
  border-radius:50%;border:2.5px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.4)}
.leaflet-popup-content{margin:11px 13px;font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
.leaflet-popup-content h4{margin:0 0 5px;font-size:14.5px}
/* El mismo globo en el mapa de Google (InfoWindow): blanco en los dos modos. */
.mpop{margin:2px 3px;font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;color:var(--pop-ink)}
.mpop h4{margin:0 0 5px;font-size:14.5px}

/* ── tablas ── */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r);border:1px solid var(--line);
  box-shadow:var(--sh);background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:13px}
th{background:var(--navy);color:#fff;text-align:left;padding:10px 12px;font-size:11.5px;
  font-weight:700;letter-spacing:.03em;position:sticky;top:0}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top;line-height:1.5}
tr.hl td{background:var(--hi)}
tr.bad td{background:var(--bad)}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:650}

/* ── modal ── */
.ov{position:fixed;inset:0;background:rgba(16,26,36,.55);z-index:1200;display:none;
  align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.ov.on{display:flex}
.sheet{background:var(--card);border-radius:18px 18px 0 0;width:100%;max-width:620px;
  max-height:86vh;overflow-y:auto;padding:18px 18px calc(24px + env(safe-area-inset-bottom))}
@media(min-width:640px){.ov{align-items:center}.sheet{border-radius:18px;max-height:82vh}}
.grab{width:38px;height:4px;background:var(--line);border-radius:4px;margin:0 auto 14px}
.opt{display:block;width:100%;text-align:left;padding:12px 13px;border-radius:11px;
  border:1px solid var(--line);margin-bottom:7px;font-size:14px;background:var(--card)}
.opt:hover{background:var(--hover)}
.opt b{display:block;font-size:12px;color:var(--mut);font-weight:650;margin-top:2px}

/* ── bottom bar ── */
.bar{position:fixed;bottom:0;left:0;width:100vw;max-width:100vw;background:var(--barbg);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:950;
  padding:9px 14px calc(9px + env(safe-area-inset-bottom))}
.barin{max-width:1180px;margin:0 auto;display:flex;gap:8px;align-items:center;min-width:0}
.barin>.stat{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barin>.spacer{flex:0 1 auto}
.barin .btn{flex:0 0 auto}
@media(max-width:420px){.barin{gap:6px}.barin .btn{padding:9px 11px;font-size:12.5px}}
.btn{padding:9px 14px;border-radius:11px;font-size:13px;font-weight:650;
  background:var(--navy);color:#fff}
.btn.ghost{background:var(--t-bg);color:var(--ink)}
.btn.sm{padding:7px 11px;font-size:12px}
.stat{font-size:11.5px;color:var(--mut);line-height:1.35}

/* La estacionalidad de un lugar: cuándo NO opera. Es un bloque y no un chip
   porque el texto tiene varias líneas —«cierra por nieve de fin de noviembre a
   mediados de abril», con el porqué— y el border-radius de píldora del chip
   sobre seis renglones dibuja un óvalo. Se vio en pantalla, no se dedujo. */
.temporada{margin:10px 0 0;padding:8px 11px;border-radius:9px;
           background:var(--temp-bg);border:1px solid var(--temp-bd);color:var(--temp-fg);
           font-size:12.5px;font-weight:600;line-height:1.45}
/* Los avisos operativos de un lugar: la zona está mal, hay dos sucursales y
   esta no es la buena, el lugar cerró. No son decoración — son lo que evita
   cruzar una ciudad al pedo — así que van arriba, antes de los datos. */
.avisos{margin:10px 0 0;padding:9px 12px 9px 26px;border-radius:9px;
        background:var(--avisos-bg);border:1px solid var(--warn-bd);font-size:13px;line-height:1.5}
.avisos li{margin:3px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13.5px}
.kv dt{font-weight:700;color:var(--navy-ink);white-space:nowrap}
.kv dd{margin:0}
details{border:1px solid var(--line);border-radius:12px;background:var(--card);
  margin-bottom:9px;box-shadow:var(--sh);overflow:hidden}
summary{padding:13px 15px;font-weight:680;font-size:14px;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸ ";color:var(--accent-ink);font-weight:800}
details[open] summary::before{content:"▾ "}
details .dbody{padding:0 15px 15px}

/* ══════════════════════════════════════════════════════════════════════════
   V2 · rediseño para el uso real: parado en la calle, una mano, 10 segundos.
   Todo lo de abajo pisa a lo de arriba a propósito (misma especificidad,
   más tarde en el archivo), así el CSS original queda como referencia.
   ══════════════════════════════════════════════════════════════════════════ */

/* ── cromo superior: header + pestañas en UN solo sticky ──────────────────
   Antes los dos eran sticky top:0 y el header tapaba las pestañas al
   scrollear: cambiar de pestaña obligaba a volver arriba de todo. */
.topbar{position:sticky;top:0;z-index:900;box-shadow:0 2px 16px rgba(20,41,61,.16)}
header{position:static;z-index:auto;box-shadow:none;
  padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
.brand{font-size:15.5px;font-weight:750;display:flex;align-items:baseline;gap:8px;
  min-width:0;overflow:hidden}
.brand small{display:inline;font-size:11.5px;font-weight:500;opacity:.75;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:0}
.iconbtn{width:33px;height:33px;font-size:14px;border-radius:9px}
nav.tabs{position:static;z-index:auto;border-bottom:1px solid var(--line)}
.tab{padding:11px 12px 9px;font-size:13px}

main{padding-top:12px}

/* ── tira de días: más baja, y hoy se ve ─────────────────────────────────── */
.days{gap:6px;padding-bottom:11px}
.dbtn{min-width:0;padding:7px 11px;border-radius:11px}
.dbtn .dd{font-size:14px;font-weight:750;margin:0;letter-spacing:-.01em}
.dbtn .dw{font-size:10.5px;font-weight:600;color:var(--mut);margin-top:1px}
.dbtn.on .dw{color:rgba(255,255,255,.8)}
.dbtn.today{outline:2px solid var(--gold);outline-offset:1px}
.dbtn .hoylb{display:block;font-size:9px;font-weight:800;letter-spacing:.1em;
  color:var(--gold);text-transform:uppercase}

/* ── AHORA: la respuesta a "¿qué toca?" ──────────────────────────────────── */
.ahora{margin:0 0 13px;border-radius:15px;overflow:hidden;background:var(--navy);
  color:#fff;box-shadow:0 4px 20px rgba(20,41,61,.22)}
.ahlb{display:flex;align-items:center;gap:9px;padding:8px 14px;
  background:rgba(255,255,255,.09);font-size:10.5px;font-weight:800;
  letter-spacing:.13em;text-transform:uppercase;color:rgba(255,255,255,.86)}
.ahlb .sp{flex:1}
.ahhoy{font-size:10.5px;font-weight:750;letter-spacing:.04em;text-transform:none;
  background:rgba(255,255,255,.16);color:#fff;padding:4px 10px;border-radius:8px}
.ahmain{padding:12px 14px 12px}
.aht{font-size:12px;font-weight:750;color:#7fd4ae;letter-spacing:.03em}
.ahn{font-size:19px;font-weight:700;line-height:1.24;margin:3px 0 5px;letter-spacing:-.015em;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ahd{font-size:12.5px;line-height:1.5;color:rgba(255,255,255,.74)}
.ahnext{padding:10px 14px;border-top:1px solid rgba(255,255,255,.14);
  font-size:12.5px;line-height:1.45;color:rgba(255,255,255,.78)}
.ahnext b{color:#fff}
.ahacts{display:flex;gap:7px;padding:11px 14px calc(13px);flex-wrap:wrap;
  border-top:1px solid rgba(255,255,255,.14)}
.ahbtn{background:var(--accent);color:#fff;padding:10px 15px;border-radius:11px;
  font-size:13.5px;font-weight:750;text-decoration:none;display:inline-block;
  flex:0 1 auto;min-width:0;max-width:100%;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;text-align:center}
.ahbtn.g2{background:rgba(255,255,255,.15);color:#fff}
.ahora.pre{background:#1d3a52}
.ahora.fin{background:#3a3630}

/* ── cabecera del día: el título manda, el porqué se despliega ───────────── */
.dhead{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh);padding:13px 14px;margin-bottom:12px}
.dhead h2{font-size:18px;font-weight:700;line-height:1.25;margin-bottom:7px}
.dhead .dchips{display:flex;gap:6px;flex-wrap:wrap}
/* El «base:» del día 5 es una frase entera ("JGStay SoHo → New Jersey (la ÚNICA
   noche…"): con `white-space:nowrap` el chip medía 359 px dentro de 317 y el texto
   quedaba cortado — invisible, porque `overflow-x:clip` lo tapa sin avisar. Envuelve. */
.dhead .dchips .chip{white-space:normal;text-align:left;line-height:1.4;max-width:100%}
.dporque{margin-top:10px;border:0;box-shadow:none;background:none;border-radius:0}
.dporque summary{padding:0;font-size:12px;font-weight:700;color:var(--accent-ink)}
.dporque .dbody{padding:9px 0 0}
.dporque p{margin:0 0 8px;font-size:13px;line-height:1.55;color:var(--mut)}
.dporque p:last-child{margin-bottom:0}

/* ── el bloque de itinerario ─────────────────────────────────────────────
   `.itb` es la clase nueva: `.blk` a secas la sigue usando Reservas y no se
   toca. Plegado por defecto — el texto completo está a un toque, no borrado. */
.blk.itb{display:flex;gap:9px;padding:10px 12px;align-items:flex-start;
  border-bottom:1px solid var(--line)}
.itb .tmw{flex:0 0 46px;padding-top:1px}
.itb .tm{font-size:13.5px;font-weight:800;color:var(--navy-ink);letter-spacing:-.02em;
  padding:0;background:none;border:0;width:100%;text-align:left}
.itb input.tm{border:1px solid var(--line);border-radius:7px;padding:3px 4px;
  background:var(--field);font-weight:700;font-size:13px}
.itb.on .tmw{flex:0 0 56px}
.itb .tmend{font-size:10px;color:var(--mut);margin-top:1px}
.itb .btog{cursor:pointer;-webkit-tap-highlight-color:rgba(193,68,14,.07)}
.bhead{display:flex;gap:7px;align-items:flex-start}
.cdot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:6px;
  box-shadow:0 0 0 2px var(--ring)}
.bttl{font-size:14.5px;font-weight:650;line-height:1.34;letter-spacing:-.008em;
  color:var(--ink);flex:1;min-width:0;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.itb.hi .bttl,.itb.star .bttl{font-size:15.5px;font-weight:700}
.bsub{font-size:12.5px;line-height:1.45;color:var(--mut);margin:2px 0 0 15px;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.bfacts{font-size:11px;color:var(--facts);margin:3px 0 0 15px;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bfacts .mas{color:var(--mut3);font-weight:800}
.stx{color:var(--gold)}
.bfacts .ojo{color:var(--ojo);font-weight:750}
.bfacts .cerr{color:var(--red);font-weight:750}
/* logística: es pegamento entre paradas, no plan. Una línea y gris. */
.itb.logi{padding:7px 12px;background:var(--soft4)}
.itb.logi .bttl{font-size:12.5px;font-weight:500;color:var(--logi);-webkit-line-clamp:2}
.itb.logi .tm{font-size:12px;font-weight:700;color:var(--logi-tm)}
.itb.done .bttl{text-decoration:line-through}
.itb.on{background:var(--on-bg)}
.itb.on .bttl{-webkit-line-clamp:unset;display:block}
/* estado respecto del reloj (solo cuando el día que mirás es hoy) */
.itb.past{opacity:.62}
.itb.past.done{opacity:.4}
.itb.now{background:var(--now);box-shadow:inset 3.5px 0 0 var(--gold)}
.itb.now .bttl{font-weight:750}
.itb.flash{animation:fl 1.3s ease}
@keyframes fl{0%,100%{background:var(--now)}30%{background:var(--flash)}}
@media(prefers-reduced-motion:reduce){.itb.flash{animation:none}}
/* detalle desplegado: acá vuelve TODO lo que la v1 mostraba siempre */
.bdet{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.bdet .btxt{font-size:13.5px;line-height:1.55}
.bedit{margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);
  display:flex;gap:6px;align-items:center}
.bedit .mini{font-size:13px;opacity:.55;border:1px solid var(--line);border-radius:8px;
  padding:3px 10px;background:var(--field)}
.bedit .lb{font-size:10.5px;color:var(--mut);letter-spacing:.05em;text-transform:uppercase;flex:1}
.bedit .del{color:var(--red);border-color:var(--del-bd);margin-left:auto}
/* columna de acción: plegado, SOLO lo que se usa caminando */
.itb .bact{flex:0 0 auto;display:flex;flex-direction:column;gap:5px;align-items:center;
  padding-top:1px}
.itb .ck{width:26px;height:26px;border-radius:8px;font-size:13px}
.goto{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
  background:var(--goto-bg);color:var(--g-fg);font-weight:800;font-size:14px;text-decoration:none;
  border:1px solid var(--goto-bd)}
.plegar{margin-top:9px;font-size:11px;font-weight:700;color:var(--mut);
  border:1px dashed var(--line);border-radius:8px;padding:4px 10px}
.itb.logi .bact .ck{width:22px;height:22px;font-size:11px}
/* traslado entre paradas: se queda, es info de calle pura */
.trav{padding:5px 12px 5px 57px;font-size:11.5px}

/* ── barra inferior ──────────────────────────────────────────────────────── */
.bar .stat{font-size:11.5px}
#bAhora{background:var(--accent);padding:10px 16px;font-size:13.5px;font-weight:750}

.hint{font-size:11px;color:var(--mut);margin:2px 0 10px;text-align:center}

/* ── MODO OSCURO ──────────────────────────────────────────────────────────
   Dos entradas al mismo bloque: «Automático» sigue al teléfono (la media
   query) y «Oscuro» lo fuerza (data-theme en <html>). «Claro» pone
   data-theme="light", que apaga la media query aunque el teléfono esté en
   oscuro. El atributo lo pone un script del <head> ANTES de dibujar. */
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){
  color-scheme:dark;
  --pop-ink:#22303c;
  --bg:#101418; --card:#181d23; --field:#1f252d; --hover:#222932; --soft:#14191e;
  --soft2:#14191e; --soft4:#14191e; --ink:#e7ebef; --mut:#9ba5b0; --mut2:#8f97a2;
  --mut3:#6c7480; --why:#c3cbd4; --facts:#8d97a3; --line:#2b323b; --navy:#1c3550;
  --navy-ink:#a8c4e4; --accent:#c1440e; --accent-ink:#f2895a; --gold:#d9a040;
  --green:#2e7d4f; --red:#e5586b; --ring:rgba(24,29,35,.9); --barbg:rgba(24,29,35,.94);
  --mapbg:#1b2027; --t-bg:#262c34; --t-fg:#c3cad3; --g-bg:#15301f; --g-fg:#86cfa0;
  --g-bd:#2b5a3d; --ok-bg:#15301f; --ok-bd:#2b5a3d; --goto-bg:#15301f; --goto-bd:#2b5a3d;
  --hi:#14261b; --o-bg:#3a2416; --o-fg:#f2a676; --r-bg:#3a1a20; --r-fg:#f29aa6;
  --b-bg:#172638; --b-fg:#9cc3ea; --info-bg:#172638; --info-bd:#2a4561; --p-bg:#261d38;
  --p-fg:#c4a9ec; --warn-bg:#33270f; --warn-bd:#5c4718; --warn-fg:#f0c67a;
  --avisos-bg:#33270f; --temp-bg:#3a2416; --temp-bd:#6a4223; --temp-fg:#f3b07a;
  --add-bg:#3a2416; --add-bd:#6a4223; --bad:#3a1f17; --v0-bg:#22282f; --v1-bg:#362a12;
  --v1-fg:#f0c06a; --v1-bd:#6a5320; --must-bg:#362a12; --must-bd:#7a6227;
  --must-fg:#f0c86a; --mustoff-bg:#22282f; --mustoff-bd:#3a414a; --mustoff-fg:#9a948b;
  --ojo:#f0c06a; --on-bg:#1d2229; --now:#2e2614; --flash:#4a3a16; --del-bd:#5a2a33;
  --ajeno-bg:#15191e; --ajeno-bd:#3a4049; --ajeno-fg:#8e8a83; --logi:#8d97a3;

<script>
/* ═══════════ LA RED, PARA CUANDO EL SCRIPT NO LLEGA ═══════════
   Toda la app vive en UN bloque de <script> de casi un megabyte. Si ese bloque
   no llega entero —una bajada cortada por mala señal, una copia a medias
   guardada en el cache del navegador— el navegador no muestra ningún error:
   dibuja el HTML estático que sí llegó y deja el resto en blanco. Queda el
   encabezado vacío, la barra de abajo, y nada en el medio.

   Eso pasó de verdad: el archivo creció de 568 KB a 946 KB, una bajada se cortó,
   el navegador cacheó el pedazo, y la app quedó en blanco sin decir por qué.
   Media hora de buscar el bug en el lugar equivocado, porque desde otro
   navegador andaba perfecto.

   Esta red va en su PROPIO bloque, arriba de todo, para que sobreviva aunque el
   grande venga cortado. Si a los seis segundos la app no marcó que arrancó, lo
   cuenta y ofrece recargar salteando el cache. Un mensaje que se puede leer vale
   infinitamente más que una pantalla blanca cuando estás parado en la calle. */
(function () {
  function avisar() {
    if (window.__ARRANCO) return;
    var d = document.createElement('div');
    d.setAttribute('style',
      'margin:24px auto;max-width:520px;padding:18px 20px;border-radius:12px;' +
      'background:#fff6e8;border:1px solid #f0d6a8;color:#5a3a10;' +
      'font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif');
    d.innerHTML =
      '<b style="display:block;margin-bottom:6px;font-size:16px">La app no se cargó entera</b>' +
      'El navegador se quedó con una copia incompleta, casi siempre por una ' +
      'descarga cortada. Los datos están bien: hay que bajarla de nuevo.' +
      '<button id="__recargar" style="display:block;margin-top:14px;padding:10px 18px;' +
      'border:0;border-radius:9px;background:#14293d;color:#fff;font-size:14px;' +
      'font-weight:600;cursor:pointer">Recargar de cero</button>' +
      '<div style="margin-top:10px;font-size:13px;opacity:.75">Si vuelve a pasar, ' +
      'recargá manteniendo apretado Shift.</div>';
    var donde = document.querySelector('main') || document.body;
    donde.appendChild(d);
    var b = document.getElementById('__recargar');
    if (b) b.onclick = function () {
      // Con un parámetro distinto cada vez: así el navegador no puede servir la
      // copia rota que ya tiene guardada.
      location.replace(location.pathname + '?recarga=' + new Date().getTime());
    };
  }
  if (document.readyState === 'complete') setTimeout(avisar, 6000);
  else window.addEventListener('load', function () { setTimeout(avisar, 6000); });
})();
</script>

ica/parque-del-capricho"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B","Ruta 2","Ruta 3","Ya conocen la ciudad"],"boro":"Madrid","sub":"Metro El Capricho (L5)","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"warn":[]},{"id":"mad_botanico","n":"Real Jardín Botánico","cat":"parque","typ":"Parque / jardín","hood":"Paseo del Prado","lat":40.41087,"lng":-3.691398,"addr":"Plaza de Murillo, 2, Madrid","cost":1,"costN":"General 4 €; reducida mayores de 65: 1 € (sin exposición)","dur":1.5,"why":"Está pegado al Prado y mucha gente pasa de largo. Son terrazas en pendiente suave con bancos a la sombra: un descanso perfecto después del museo.","tip":"Lleva 1 € con más de 65. Las terrazas suben un poco hacia el fondo, con rampas.","season":"Mejor en primavera (floración) u otoño (colores)","refs":["https://www.esmadrid.com/informacion-turistica/real-jardin-botanico"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B","Ruta 2","Ruta 3","Ya conocen la ciudad"],"boro":"Madrid","sub":"Metro Atocha o Estación del Arte (L1), Banco de España (L2)","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"warn":[]},{"id":"mad_madrid_rio_matadero","n":"Madrid Río y Matadero","gname":"Matadero Madrid","cat":"parque","typ":"Parque / jardín","hood":"Arganzuela","lat":40.39188333,"lng":-3.6985,"addr":"Paseo de la Chopera, 14 (Matadero), Madrid","cost":0,"costN":"Acceso libre","dur":2.5,"why":"Si estuvieron antes de 2011 no lo vieron: la autopista se soterró y quedó un paseo plano de varios kilómetros junto al río, con puentes antiguos y nuevos. En Matadero, las naves del viejo matadero tienen exposiciones gratuitas.","tip":"Todo plano. Se puede hacer por tramos: de la Ermita de San Antonio de la Florida hacia el sur, y volver en metro desde Legazpi.","refs":["https://www.esmadrid.com/informacion-turistica/madrid-rio","https://www.esmadrid.com/informacion-turistica/matadero-madrid"],"conf":"alta","ta ecánicas de Recaredo","closed":"","free":"","book":"","src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"tol_san_juan_reyes","n":"Monasterio de San Juan de los Reyes","cat":"arq","typ":"Iglesia / templo","hood":"Judería","lat":39.85769444,"lng":-4.03158333,"addr":"Calle de los Reyes Católicos, 17, Toledo","cost":4,"costN":"4 €; incluido en la Pulsera Turística (14 €)","dur":0.75,"main":true,"why":"El claustro es de los más bellos de España, con naranjos en el patio y el piso alto de artesonado mudéjar. En la fachada cuelgan las cadenas de los cautivos cristianos liberados en Granada.","tip":"El claustro bajo tiene bancos; al piso alto se sube por escalera. Desde aquí se baja al Puente de San Martín.","refs":["https://www.toledomonumental.com/"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B","Ruta 2","Ruta 3","Excursión"],"boro":"Toledo","sub":"Tren AVE desde Madrid-Atocha a Toledo (unos 33 min); de la estación al casco, bus urbano o escaleras mecánicas de Recaredo","closed":"","free":"","book":"","src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"tol_mirador_valle","n":"Mirador del Valle","cat":"mirador","typ":"Mirador","hood":"Carretera de Circunvalación","lat":39.8505,"lng":-4.0243,"addr":"Carretera de Circunvalación (Ermita del Valle), Toledo","aprox":true,"cost":0,"costN":"Gratis","dur":0.75,"main":true,"why":"Es la vista del cuadro de El Greco: la ciudad entera sobre su peñón, abrazada por el Tajo. Al atardecer la piedra se pone dorada.","tip":"A pie es lejos y por la banquina de la carretera: mejor en taxi (pedir que espere) o el bus turístico. Ir al final del día, antes de volver a Madrid.","conf":"baja","tags":["IA","Ruta 1A","Ruta 1B","Ruta 2","Ruta 3","Excursión"],"boro":"Toledo","sub":"Desde el casco: taxi, bus turístico o caminata larga cruzando el puente de Alcántara o de San Martín por la carretera","closed":"","free":"","book":"","src":"propuesta","gname":"","must":0,"rate":0,"season":"","warn":[],"refs":[]},{"id":"tol_mazapan_santo_tome","n":"Mazapanes Santo Tomé","gname":"Santo Tomé – obrador de mazapán","cat":"comida","typ":"Café / pastelería","hood":"Judería","lat":39.85669484417301,"lng":-4.027387728248498,"addr":"Calle de Santo Tomé, 3 (también en Plaza de Zocodover, 17), Toledo","cost":9,"costN":"Caja de mazapán surtido desde 8,80 € (tienda online)","dur":0.25,"why":"El mazapán es el dulce de Toledo y este obrador lo hace desde 1856. La tienda de la calle de Santo Tomé queda a pasos de la iglesia del Greco.","tip":"Comprar una caja chica para el viaje; las figuritas («delicias») son el formato clásico.","refs":["https://www.mazapan.com/"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B","Ruta 2","Ruta 3","Excursión"],"boro":"Toledo","sub":"Tren AVE desde Madrid-Atocha a Toledo (unos 33 min); de la estación al casco, bus urbano o escaleras mecánicas de Recaredo","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"seg_acueducto","n":"Acueducto de Segovia","cat":"arq","typ":"Monumento / edificio","hood":"Plaza del Azoguejo","lat":40.94788888888889,"lng":-4.117805555555556,"addr":"Plaza del Azoguejo, Segovia","cost":0,"costN":"Gratis","dur":0.75,"main":true,"why":"Dos mil años en pie con piedras encajadas sin mortero. Se ve mejor subiendo las escaleras junto a él hasta el nivel del canal, donde se aprecia el largo total.","tip":"La escalera del lado del Postigo del Consuelo es empinada y con barandas: hay que tomarse tiempo. Desde la plaza, la calle Real sube suave hasta la Catedral.","conf":"media","tags":["IA","Ruta 1A","Ruta 1B","Ruta 2","Ruta 3","Excursión"],"boro":"Segovia","sub":"Tren AVE de Madrid-Chamartín a Segovia-Guiomar (unos 30 min) y bus urbano al Acueducto; o bus directo desde Moncloa","closed":"","free":"","book":"","src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[],"refs":[]},{"id":"seg_catedral","n":"Catedral de rsión"],"boro":"Segovia","sub":"Tren AVE de Madrid-Chamartín a Segovia-Guiomar (unos 30 min) y bus urbano al Acueducto; o bus directo desde Moncloa","closed":"","src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"seg_meson_candido","n":"Mesón de Cándido","cat":"comida","typ":"Restaurante","hood":"Plaza del Azoguejo","lat":40.9482,"lng":-4.1182,"addr":"Plaza del Azoguejo, 5, Segovia","aprox":true,"cost":35,"costN":"Carta no leída; calcular 30-45 € con cochinillo","dur":1.5,"main":true,"book":"Reservar, sobre todo fin de semana","why":"El ritual del cochinillo partido con el canto de un plato nació aquí. Además del cochinillo: judiones de La Granja, cordero asado y ponche segoviano de postre.","tip":"Pedir mesa con vista al Acueducto. Si el cochinillo pesa, compartir una ración y pedir judiones.","refs":["https://mesondecandido.es/"],"conf":"media","tags":["IA","Ruta 1A","Ruta 1B","Ruta 2","Ruta 3","Excursión"],"boro":"Segovia","sub":"Tren AVE de Madrid-Chamartín a Segovia-Guiomar (unos 30 min) y bus urbano al Acueducto; o bus directo desde Moncloa","closed":"","free":"","src":"propuesta","gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"lon_south_bank","n":"South Bank (paseo por el Támesis)","gname":"Queen's Walk, South Bank","cat":"barrio","typ":"Barrio / paseo","hood":"South Bank","lat":51.508,"lng":-0.11,"addr":"Queen's Walk, London SE1, Londres","cost":0,"costN":"gratis","dur":3,"main":true,"why":"Es la tarde del día de llegada en la ruta: unos 4 km llanos junto al río con el Parlamento, el London Eye, la Tate Modern, el Globe de Shakespeare y la Catedral de San Pablo enfrente, cruzando el Millennium Bridge. Todo se ve desde afuera sin pagar entrada.","tip":"Es plano y tiene bancos a lo largo del río. Si se cansan, a mitad de camino (Southwark o Blackfriars) hay metro. Borough Market y el George Inn quedan a pocas cuadras del final, en London Bridge.","refs":["https://en.wikipedia.org/wiki/South_Bank"],"conf":"media","tags":["IA","Ruta 1A","Ruta 1B","Ruta 3","Itinerario"],"boro":"Londres","sub":"Westminster (Jubilee, District, Circle) para empezar; London Bridge (Jubilee, Northern) para volver","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"lon_abadia_westminster","n":"Abadía de Westminster","gname":"Westminster Abbey","cat":"arq","typ":"Iglesia / templo","hood":"Westminster","lat":51.49944444,"lng":-0.1275,"addr":"20 Deans Yard, London SW1P 3PA, Londres","cost":35,"costN":"£29 mayores de 65 (£32 adulto); audioguía incluida","dur":2,"main":true,"why":"Acá se coronaron los reyes ingleses desde Guillermo el Conquistador y se casaron Guillermo y Catalina. Adentro están las tumbas de Isabel I, el Rincón de los Poetas (Chaucer, Dickens) y las tumbas de Newton y Darwin.","tip":"Es iglesia activa: los domingos no se visita como turista y puede cerrar sin aviso. Asistir a un servicio es gratis (entrada por la Gran Puerta Oeste), pero no se recorre. Para ir más tranquilos, temprano.","refs":["https://www.westminster-abbey.org/visit-us/prices-and-entry-times"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B","Ruta 3","Itinerario"],"boro":"Londres","sub":"Westminster (Jubilee, District, Circle) o St James's Park (District, Circle)","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"lon_parlamento_big_ben","n":"Parlamento y Big Ben","gname":"Palace of Westminster","cat":"arq","typ":"Palacio / castillo","hood":"Westminster","lat":51.49916667,"lng":-0.12472222,"addr":"Parliament Square, London SW1A 0AA, Londres","cost":0,"costN":"gratis desde afuera; las visitas guiadas del interior son pagas","dur":0.5,"main":true,"why":"La postal de Londres: el palacio neogótico sobre el río y la torre de Isabel, con la campana Big Ben. La mejor vista es desde Westminster Bridge o desde la otra orilla, al arrancar el paseo del South Bank.","tip":"Verlo desde el puente y desde la oril  (District, Circle)","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"lon_buckingham","n":"Palacio de Buckingham","gname":"Buckingham Palace","cat":"arq","typ":"Palacio / castillo","hood":"St James's","lat":51.50083333,"lng":-0.14194444,"addr":"London SW1A 1AA, Londres","cost":0,"costN":"gratis desde afuera; Salones de Estado £33 adulto (39 €) anticipado, solo en verano","dur":1,"main":true,"why":"La fachada, la estatua de la reina Victoria y el cambio de guardia son gratis. Por dentro solo se visita en verano, así que en primavera u otoño, casi seguro, se ve desde la reja.","tip":"El cambio de guardia junta mucha gente: conviene llegar con tiempo y ubicarse sobre el Mall o en la escalinata del monumento a Victoria. No anoté días ni horarios: confirmarlos en la web del ejército británico la semana del viaje.","season":"Los Salones de Estado abren solo en verano (en 2026, del 9/7 al 27/9). En primavera u otoño se ve solo por fuera.","refs":["https://www.visitlondon.com/things-to-do/sightseeing/london-attraction/buckingham-palace"],"conf":"media","tags":["IA","Ruta 1A","Ruta 1B","Ruta 3","Itinerario"],"boro":"Londres","sub":"Green Park (Victoria, Jubilee, Piccadilly) o St James's Park (District, Circle)","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"warn":[]},{"id":"lon_trafalgar","n":"Trafalgar Square","gname":"Trafalgar Square","cat":"arq","typ":"Monumento / edificio","hood":"Westminster / Charing Cross","lat":51.50805556,"lng":-0.12805556,"addr":"Trafalgar Square, London WC2N 5DN, Londres","cost":0,"costN":"gratis","dur":0.5,"main":true,"why":"Es el punto de encuentro de Londres y la puerta de la National Gallery. Desde la escalinata se ve el Whitehall hasta el Big Ben.","tip":"La escalinata de la National Gallery es buen lugar para sentarse a mirar la plaza.","refs":["https://en.wikipedia.org/wiki/Trafalgar_Square"],"conf":"media","tags":["IA","Ruta 1A","Ruta 1B","R "src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"lon_hyde_park","n":"Hyde Park","gname":"Hyde Park","cat":"parque","typ":"Parque / jardín","hood":"Hyde Park / Kensington","lat":51.50861111,"lng":-0.16361111,"addr":"London W2 2UH, Londres","cost":0,"costN":"gratis","dur":2,"main":true,"why":"Unido a Kensington Gardens suma 250 hectáreas: el lago Serpentine, el Speakers' Corner, el Memorial a Diana y, en el extremo oeste, el Palacio de Kensington. Cruzarlo a pie lleva directo a Notting Hill.","tip":"Es grande: cruzarlo de punta a punta son unos 4 km. Hay reposeras pagas y bancos junto al Serpentine. Desde el extremo oeste, Notting Hill está a 15 minutos subiendo por Kensington Church Street (ahí está el Churchill Arms).","refs":["https://en.wikipedia.org/wiki/Hyde_Park,_London"],"conf":"media","tags":["IA","Ruta 1A","Ruta 1B","Ruta 3","Itinerario"],"boro":"Londres","sub":"Hyde Park Corner (Piccadilly) o Marble Arch (Central)","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"lon_notting_hill","n":"Notting Hill y Portobello Road","gname":"Portobello Road Market","cat":"barrio","typ":"Barrio / paseo","hood":"Notting Hill","lat":51.51618,"lng":-0.20517,"addr":"Portobello Road, London W11, Londres","cost":0,"costN":"gratis","dur":2,"main":true,"why":"Calles de casas pintadas de colores y el mercado de Portobello, que se estira más de un kilómetro: antigüedades, platería y libros arriba, frutas y ropa más abajo.","tip":"El sábado es el día grande de antigüedades (también el viernes) y el más lleno: llegar temprano. Portobello Road es en bajada desde Notting Hill Gate; para volver, mejor tomar el metro en Ladbroke Grove que desandarla.","refs":["https://timeout.com/london/shopping/portobello-road-market-3"],"conf":"media","tags":["IA","Ruta 1A","Ruta 1B","Ruta 3","Itinerario"],"boro":"Londres","sub":"Notting Hill Gate (Central, District, Circle) o Ladbroke Grove (Hammersmith & City, Circle)","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"lon_barco_greenwich","n":"Barco por el Támesis a Greenwich","gname":"Uber Boat by Thames Clippers","cat":"mirador","typ":"Barco / teleférico","hood":"Westminster → Greenwich","lat":51.501901,"lng":-0.123223,"addr":"Westminster Pier, Victoria Embankment, London SW1A 2JH, Londres","cost":16,"costN":"~£13,50 con tarjeta contactless (16 €), según tabla de zonas Central+Este; no verificado al día","dur":1,"why":"Es la ida que propone la ruta: pasa por debajo de los puentes, frente a la Torre de Londres, el Tower Bridge y los muelles de Canary Wharf, y deja en el muelle de Greenwich, al lado del Cutty Sark.","tip":"Se paga tocando con la tarjeta contactless o con Oyster en el muelle, como el metro. Ojo: no entra en el tope diario del transporte. Sentarse atrás, al aire libre, para ver. La vuelta conviene en DLR desde Cutty Sark.","refs":["https://www.thamesclippers.com/plan-your-journey/ticket-information","https://www.TfL.gov.uk/fares/find-fares/river-fares"],"conf":"media","tags":["IA","Ruta 1A","Ruta 1B","Ruta 3","Itinerario"],"boro":"Londres","sub":"Westminster Pier (junto a la estación Westminster) o London Eye Pier / Tower Pier","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"lon_greenwich_barrio","n":"Greenwich","gname":"Greenwich","cat":"barrio","typ":"Barrio / paseo","hood":"Greenwich","lat":51.48,"lng":0.0,"addr":"Greenwich, London SE10, Londres","cost":0,"costN":"caminarlo es gratis; las entradas van aparte","dur":5,"main":true,"why":"El conjunto de la Armada (Old Royal Naval College de Wren, el Cutty Sark, el Museo Marítimo) más el parque con el Observatorio en la colina. Se arma un día entero sin metro.","tip":"Todo queda cerca del muelle, menos el Observatorio, que está arriba de una cuesta empinada. El Museo Marítimo y la Queen's House son gratis.","refs":["http is y tiene ascensor.","refs":["https://en.wikipedia.org/wiki/Tate_Modern"],"conf":"media","tags":["IA","Ruta 1A","Ruta 1B","Ruta 3"],"boro":"Londres","sub":"Southwark (Jubilee) o Blackfriars (District, Circle)","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"lon_observatorio_greenwich","n":"Observatorio Real de Greenwich","gname":"Royal Observatory Greenwich","cat":"museo","typ":"Museo de historia y otros","hood":"Greenwich","lat":51.477,"lng":-0.0147,"addr":"Blackheath Avenue, London SE10 8XJ, Londres","cost":29,"costN":"£24 adulto (29 €); pase de día Observatorio + Cutty Sark £38 (45 €). La web no muestra tarifa de mayores.","dur":1.5,"main":true,"why":"Se pone un pie en cada hemisferio sobre la línea del meridiano y se ven los relojes de Harrison, que resolvieron la longitud en el mar. La explanada de enfrente es la mejor vista de Greenwich con Canary Wharf atrás, y esa es gratis.","tip":"La subida por el parque es corta pero empinada. Por Blackheath Avenue, a la izquierda del observatorio, la cuesta es más suave. La vista desde la estatua de Wolfe no se paga.","refs":["https://www.rmg.co.uk/plan-your-visit"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B","Ruta 3"],"boro":"Londres","sub":"Cutty Sark (DLR) y subir por Greenwich Park","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"lon_cutty_sark","n":"Cutty Sark","gname":"Cutty Sark","cat":"museo","typ":"Museo de historia y otros","hood":"Greenwich","lat":51.48277778,"lng":-0.00972222,"addr":"King William Walk, London SE10 9HT, Londres","cost":26,"costN":"£22 adulto (26 €); con Observatorio, pase de día £38","dur":1,"main":true,"why":"Se recorre la cubierta y la bodega, y por debajo se camina bajo el casco de cobre suspendido. Cuenta la carrera del té con China y la lana con Australia.","tip":"Desde el muelle del barco está a 50 metros. Si van a entrar también al Observatorio, el pase de día combinado sale más barato.","refs":["https://www.rmg.co.uk/plan-your-visit"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B","Ruta 3"],"boro":"Londres","sub":"Cutty Sark (DLR) o Greenwich Pier","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"lon_painted_hall","n":"Old Royal Naval College y Painted Hall","gname":"Old Royal Naval College - Painted Hall","cat":"arq","typ":"Palacio / castillo","hood":"Greenwich","lat":51.4829059,"lng":-0.0060857,"addr":"King William Walk, London SE10 9NN, Londres","cost":21,"costN":"Painted Hall £17,50 adulto (21 €); patios y capilla gratis","dur":1.5,"main":true,"free":"Primer domingo de cada mes, £5 con reserva anticipada (no es gratis, es reducido).","why":"Thornhill tardó 19 años en pintar el techo del comedor de los marinos (1707-1726). La capilla y los patios, con las dos cúpulas gemelas frente al Támesis, se recorren gratis.","tip":"Aunque no paguen el Painted Hall, caminen los patios entre el muelle y la Queen's House: es la mejor vista de Greenwich al nivel del río.","refs":["https://www.ianvisits.co.uk/venues/?p=91"],"conf":"media","tags":["IA","Ruta 1A","Ruta 1B","Ruta 3"],"boro":"Londres","sub":"Cutty Sark (DLR) o Greenwich Pier","closed":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"lon_museo_maritimo","n":"Museo Marítimo Nacional y Queen's House","gname":"National Maritime Museum","cat":"museo","typ":"Museo de historia y otros","hood":"Greenwich","lat":51.481111,"lng":-0.005556,"addr":"Romney Road, London SE10 9NF, Londres","cost":0,"costN":"gratis los dos","dur":1.5,"why":"Gratis. El museo tiene el uniforme con el que mataron a Nelson en Trafalgar. La Queen's House, de Inigo Jones, tiene la escalera de caracol «Tulip» y el retrato de la Armada de Isabel I.","tip":"Buen refugio si llueve en Greenwich. Está al pie del parque: se puede hacer antes de subir al Observatorio.","refs":["https://www.rmg.co.uk/plan-your-visit"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B","Ruta 3"],"boro":"Londres","sub":"Cutty Sark (DLR)","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"lon_greenwich_park","n":"Greenwich Park","gname":"Greenwich Park","cat":"parque","typ":"Parque / jardín","hood":"Greenwich","lat":51.4773,"lng":0.0,"addr":"London SE10 8QY, Londres","cost":0,"costN":"gratis","dur":1.5,"main":true,"why":"Desde la colina junto al Observatorio se ve toda la composición de Wren con el río y los rascacielos de Canary Wharf detrás. Abajo hay jardín de flores y ciervos en un sector cerrado.","tip":"La cuesta es corta pero fuerte. Hay bancos en la subida y arriba.","refs":["https://en.wikipedia.org/wiki/Greenwich_Park"],"conf":"media","tags":["IA","Ruta 1A","Ruta 1B","Ruta 3"],"boro":"Londres","sub":"Cutty Sark (DLR) o Greenwich (DLR, tren)","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"lon_rules","n":"Rules","gname":"Rules","cat":"comida","typ":"Restaurante","hood":"Covent Garden","lat":51.5108285,"lng":-0.1231906,"addr":"34-35 Maiden Lane, London WC2E 7LB, Londres","cost":36,"costN":"plato principal ~£26-35 (31-42 €); pastel de carne y riñón £26,25 en mayo 2026","dur":1.5,"main":true,"book":"Reservar.","why":"Es el «gusto» del viaje en Londres: salones de terciopelo rojo con caricaturas y cuadros de dos siglos, y caza de su propia finca en los Peninos. Dickens y Chaplin comían acá.","tip":"Pedir el pastel de carne y riñón o la caza de estación, y de postre el sticky toffee pudding. Al mediodía es más tranquilo. Sin código de vestimenta estricto, pero se va arreglado.","season":"La caza (perdiz, urogallo, faisán) es de otoño-invierno; las fuentes no coinciden si arranca en agosto o noviembre.","refs":["https://menupedia.us/rules-menu/","https://mesprestiges.com/en/london/places/rules-covent-garden","https://www.cp24.com/news/world/2026/07/10/inside-the-228-year-old-london-restaurant-that-time-forgot/"],"conf":"media","tags":["IA","Ruta 1A","Ruta 1B","Ruta 3"],"boro":"Londres","sub":"Covent Garden (Piccadilly) o Charing Cross (Northern, Bakerloo)","closed":"","free":"","src":"propuesta","aprox":false,"must":0,"rate":0,"warn":[]},{"id":"lon_golden_hind","n":"The Golden Hind","gname":"The Golden Hind","cat":"comida","typ":"Restaurante","hood":"Marylebone","lat":51.5179888,"lng":-0.1509597,"addr":"73 Marylebone Lane, London W1U 2PN, Londres","cost":24,"costN":"plato principal hasta ~£25 (hasta 30 €) según OpenTable","dur":1,"why":"El fish and chips de siempre, con mesas y servicio, en un local de 1914. Pescado de Grimsby y masa casera.","tip":"Pedir abadejo (haddock) o bacalao con mushy peas. Queda cerca de la Wallace Collection y de Oxford Street.","refs":["https://www.opentable.co.uk/r/the-golden-hind-london"],"conf":"media","tags":["IA","Ruta 1A","Ruta 1B","Ruta 3"],"boro":"Londres","sub":"Bond Street (Central, Jubilee, Elizabeth)","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"lon_george_inn","n":"The George Inn","gname":"The George Inn","cat":"comida","typ":"Restaurante","hood":"Southwark / Borough","lat":51.5041902,"lng":-0.0899937,"addr":"75-77 Borough High Street, London SE1 1NH, Londres","cost":null,"costN":"Precio sin verificar. sin precios publicados; pub de cadena Greene King, platos de pub (pastel, fish and chips, asado del domingo)","dur":1.5,"why":"Una posada de diligencias de 1676 con galerías de madera sobre un patio empedrado; Dickens la menciona en «La pequeña Dorrit». Queda a dos cuadras de Borough Market y del final del South Bank.","tip":"Comida de pub honesta, no gastronómica: se va por el lugar. El patio es lindo con buen tiempo. La galería de arriba no siempre está abierta.","refs":["https://www.visitlondon.com/things-to-do/place/165027-george-inn","https://camra.org.uk/pubs/george-london-158364"],"conf":"media","tags":["IA","Ruta 1A","Ruta 1B","Ruta 3"],"boro":"Londres","sub":"London Bridge (Jubilee, Northern) o Borough (Northern)","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"lon_churchill_arms","n":"The Churchill Arms","gname":"The Churchill Arms","cat":"comida","typ":"Restaurante","hood":"Kensington","lat":51.5069,"lng":-0.1947,"addr":"119 Kensington Church Street, London W8 7LN, Londres","cost":null,"costN":"Precio sin verificar. precio actual no verificado; las fuentes viejas lo dan como barato y una reseña de mayo 2026 menciona cargo por servicio","dur":1.5,"why":"La fachada tapada de flores es una de las más fotografiadas de Londres, y adentro está lleno de recuerdos de Churchill. Hace más de 30 años sirve cocina tailandesa en el invernadero del fondo: un pub inglés que funciona como tailandés.","tip":"Queda justo en el camino de Hyde Park / Kensington a Notting Hill: almuerzo natural para el día 5. Se llena; ir temprano.","refs":["https://www.visitlondon.com/things-to-do/place/51197389-the-churchill-arms","https://www.tripadvisor.com/g186338-d718509"],"conf":"media","tags":["IA","Ruta 1A","Ruta 1B","Ruta 3"],"boro":"Londres","sub":"Notting Hill Gate (Central, District, Circle)","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"lon_goddards","n":"Goddards at Greenwich","gname":"Goddards at Greenwich","cat":"comida","typ":"Restaurante","hood":"Greenwich","lat":51.4813718,"lng":-0.0083905,"addr":"22 King William Walk, London SE10 9HU, Londres","cost":7,"costN":"pastel con puré ~£5,40-6,10 (7 €) según una reseña; puede haber subido","dur":0.75,"why":"El almuerzo obrero de Londres: pastel de carne picada con puré y salsa verde de perejil (liquor), en un local de azulejos frente al Cutty Sark. Barato y con historia.","tip":"Pedir el minced beef pie con mash y liquor. Las anguilas (jellied eels) son para valientes. Las fuentes no coinciden en qué días abre: confirmar antes.","refs":["https://www.visitgreenwich.org.uk/food-and-drink/goddards-at-greenwich","https://www.visitlondon.com/things-to-do/place/27250578-goddards-at-greenwich","https://www.theinfatuation.com/london/reviews/goddards-at-greenwich"],"conf":"media","tags":["IA","Ruta 1A","Ruta 1B","Ruta 3"],"boro":"Londres","sub":"Cutty Sark (DLR) o Greenwich Pier","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"lon_maison_bertaux","n":"Maison Bertaux","gname":"Maison Bertaux","cat":"comida","typ":"Café / pastelería","hood":"Soho","lat":51.51332,"lng":-0.13025,"addr":"28 Greek Street, London W1D 5DQ, Londres","cost":null,"costN":"Precio sin verificar. precio no verificado","dur":0.75,"why":"Fundada por un comunero de París en 1871 y llevada hoy por dos hermanas. Tortas y masas de vitrina, mesitas en la vereda y un salón de té arriba con exposiciones.","tip":"No toma reservas. El salón de arriba es por escalera. Queda a 10 minutos de Covent Garden y a dos cuadras de Bar Italia.","refs":["https://en.wikipedia.org/wiki/Maison_Bertaux","https://mesprestiges.com/en/london/places/maison-bertaux-soho","https://www.theinfatuation.com/london/reviews/maison-bertaux"],"conf":"media","tags":["IA","Ruta 1A","Ruta 1B","Ruta 3"],"boro":"Londres","sub":"Leicester Square (Northern, Piccadilly) o Tottenham Court Road (Central, Northern, Elizabeth)","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"lon_bar_italia","n":"Bar Italia","gname":"Bar Italia","cat":"comida","typ":"Café / pastelería","hood":"Soho","lat":51.5133868,"lng":-0.1313484,"addr":"22 Frith Street, London W1D 4RF, Londres","cost":null,"costN":"Precio sin verificar. precio no verificado","dur":0.5,"why":"El café de los italianos de Soho desde 1949, con barra de fórmica, la tele siempre con fútbol y una placa azul afuera: en el piso de arriba, en 1926, Baird hizo la primera demostración pública de la televisión.","tip":"Un espresso parado en la barra, a la italiana. Para sentarse, las mesas de la vereda sobre Frith Street.","refs":["https://en.wikipedia.org/wiki/Bar_Italia","https://mesprestiges.com/en/london/places/bar-italia-soho"],"conf":"media","tags":["IA","Ruta 1A","Ruta 1B","Ruta 3"],"boro":"Londres","sub":"Tottenham Court Road (Central, Northern, Elizabeth) o Leicester Square (Northern, Piccadilly)","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"lon_monmouth_borough","n":"Monmouth Coffee (Borough)","gname":"Monmouth Coffee Company","cat":"comida","typ":"Café / pastelería","hood":"Southwark","lat":51.5055045,"lng":-0.0914259,"addr":"2 Park Street, London SE1 9AB, Londres","cost":null,"costN":"Precio sin verificar. precio no verificado","dur":0.5,"why":"Desde 1978, antes de que existiera la palabra «especialidad», tuesta su propio café en Bermondsey. Es la parada de café natural en la mañana de compras en Borough Market.","tip":"Viernes y sábado la fila es larga. Pocos asientos: se toma en la mesa comunal o se lleva.","refs":["https://www.timeout.com/london/restaurants/monmouth-coffee-company","https://boroughmarket.org.uk/traders/monmouth-coffee/"],"conf":"media","tags":["IA","Ruta 1A","Ruta 1B","Ruta 3"],"boro":"Londres","sub":"London Bridge (Jubilee, Northern)","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"lon_regency_cafe","n":"Regency Café","gname":"Regency Cafe","cat":"comida","typ":"Café / pastelería","hood":"Westminster / Pimlico","lat":51.494001,"lng":-0.132195,"addr":"17-19 Regency Street, London SW1P 4BY, Londres","cost":11,"costN":"desayuno completo ~£9 (11 €), precio de una reseña reciente","dur":0.75,"why":"El «greasy spoon» clásico, intacto desde 1946, con la fachada negra y los azulejos de época; salió en varias películas. Desayuno inglés completo a precio de barrio, a 10 minutos de la Abadía.","tip":"Se pide en el mostrador y te llaman a los gritos cuando está listo. Al mediodía hay fila; media mañana es más tranquilo. Buen arranque para el día de Westminster.","refs":["https://www.theinfatuation.com/london/reviews/regency-cafe","https://www.visitlondon.com/things-to-do/place/51197421-regency-cafe","https://www.hardens.com/uk-london/tag/regency-cafe/"],"conf":"media","tags":["IA","Ruta 1A","Ruta 1B","Ruta 3"],"boro":"Londres","sub":"Pimlico (Victoria) o St James's Park (District, Circle)","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"par_ile_cite","n":"Île de la Cité","cat":"barrio","typ":"Barrio / paseo","hood":"1º / 4º arrondissement","lat":48.85472,"lng":2.3475,"addr":"Île de la Cité, 75004 París","cost":0,"costN":"caminarla es gratis","dur":2,"main":true,"why":"Es el punto cero de la ciudad: en dos horas a pie se juntan la catedral, la Sainte-Chapelle, el Pont Neuf y la punta de la isla. Ya la conocen, pero después del incendio de 2019 la catedral reabierta cambia la visita.","tip":"Bajar a la punta oeste (Square du Vert-Galant) por la escalera del Pont Neuf: hay bancos al nivel del agua. Todo plano.","refs":["https://en.wikipedia.org/wiki/%C3%8Ele_de_la_Cit%C3%A9"],"conf":"baja","tags":["IA","Ruta 1A","Ruta 1B","Ruta 3","Itinerario","Ya conocen la ciudad"],"boro":"París","sub":"Metro Cité (línea 4)","closed":"","free":"","book":"","src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"par_notre_dame","n":"Catedral de Notre-Dame","gname":"Cathédrale Notre-Dame de Paris","cat":"arq","typ":"Iglesia / templo","hood":"Île de la Cité","lat":48.85306,"lng":2.35,"addr":"6 Parvis Notre-Dame – Pl. Jean-Paul II, 75004 París","cost":0,"costN":"entrada a la nave gratis; las torres se pagan aparte","dur":1,"main":true,"why":"Si la vieron antes de 2019, ahora es otra: la piedra limpia muestra la nave clara y luminosa, y la aguja y el techo son reconstruidos. Es la visita que justifica volver al centro clásico.","tip":"La cola de la nave avanza rápido pero es al sol; temprano es mejor. Las torres son cientos de escalones sin ascensor: para ellos, con la nave alcanza.","refs":["https://en.wikipedia.org/wiki/Notre-Dame_de_Paris"],"conf":"baja","tags":["IA","Ruta 1A","Ruta 1B","Ruta 3","Itinerario","Ya conocen la ciudad"],"boro":"París","sub":"Metro Cité (4) o RER B/C Saint-Michel–Notre-Dame","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"par_marais","n":"Le Marais","cat":"barrio","typ":"Barrio / paseo","hood":"3º / 4º arrondissement","lat":48.86,"lng":2.36083,"addr":"Le Marais, 75003/75004 París","cost":0,"dur":3,"main":true,"why":"Es el barrio que mejor conserva el París anterior a Haussmann: patios de hôtels particuliers (Sully, Carnavalet) que se pueden cruzar libremente. Encaja con la Place des Vosges, el museo Carnavalet (gratis) y el Marché des Enfants Rouges.","tip":"El pasaje del jardín del Hôtel de Sully conecta la rue Saint-Antoine con la Place des Vosges: atajo con bancos. Domingos hay mucha gente en la rue des Rosiers.","refs":["https://en.wikipedia.org/wiki/The_Marais"],"conf":"baja","tags":["IA","Ruta 1A","Ruta 1B","Ruta 3","Itinerario","Ya conocen la ciudad"],"boro":"París","sub":"Metro Saint-Paul (1) o Chemin Vert (8)","costN":"","closed":"","free":"","book":"","src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"par_louvre","n":"Museo del Louvre","gname":"Musée du Louvre","cat":"museo","typ":"Museo de arte","hood":"1º arrondissement","lat":48.8611,"lng":2.3358,"addr":"Rue de Rivoli, 75001 París","cost":22,"costN":"Con pasaporte español (EEE): 22 €. 32 € visitantes de fuera del EEE desde el 14/01/2026 (antes 22 €); los del EEE pagan menos","dur":3,"main":true,"book":"Entrada con horario reservada online","why":"Ya lo conocen, así que conviene ir a una sola sección que no hayan visto (p. ej. los apartamentos de Napoleón III o las salas de escultura francesa del ala Richelieu) en vez de la Gioconda otra vez. El PDF lo pone con reserva.","tip":"Entrar por la Porte des Lions o el Carrousel suele tener menos cola que la pirámide. Hay bancos en casi todas las salas grandes; es un museo de muchos kilómetros: elegir de antemano.","refs":["https://ulysse.com/news/louvre-versailles-tarifs-touristes-extra-europeens","https://en.wikipedia.org/wiki/Louvre"],"conf":"media","tags":["IA","Ruta 1A","Ruta 1B","Ruta 3","Itinerario","Ya conocen la ciudad"],"boro":"París","sub":"Metro Palais Royal–Musée du Louvre (1, 7)","closed":"","free":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"par_tullerias","n":"Jardín de las Tullerías","gname":"Jardin des Tuileries","cat":"parque","typ":"Parque / jardín","hood":"1º arrondissement","lat":48.8639,"lng":2.3261,"addr":"Place de la Concorde / Rue de Rivoli, 75001 París","cost":0,"dur":1,"main":true,"why":"Es el tramo de descanso natural después del Louvre, camino al Sena. En la punta oeste está el Musée de l'Orangerie con los Nenúfares de Monet, por si quieren algo corto.","tip":"Las sillas de metal verdes alrededor de los estanques son gratis y se pueden mover: ideales para sentarse a la sombra. Senderos de gravilla, planos.","refs":["https://en.wikipedia.org/wiki/Tuileries_Garden"],"conf":"baja","tags":["IA","Ruta 1A","Ruta 1B","Ruta 3","Itinerario","Ya conocen la ciudad"],"boro":"París","sub":"Metro Tuileries (1) o Concorde (1, 8, 12)","costN":"","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"par_sena_paseo","n":"Caminata por el Sena hasta la Torre Eiffel","cat":"barrio","typ":"Barrio / paseo","hood":"1º / 8º / 7º arrondissement","lat":48.8638,"lng":2.3135,"addr":"Pont Alexandre III, 75008 París (punto medio)","aprox":true,"cost":0,"dur":1.5,"main":true,"why":"El tramo de la Concorde al Pont Alexandre III y la Torre se hace por la margen peatonalizada del río, sin autos. Es la forma de llegar a la Torre viendo los puentes en vez de en metro.","tip":"Ir por el muelle bajo (al nivel del agua) cuando se pueda: hay rampas y bancos. Unos 4 km planos; si se cansan, el RER C corre en paralelo por la otra orilla.","conf":"baja","tags":["IA","Ruta 1A","Ruta 1B","Ruta 3","Itinerario","Ya conocen la ciudad"],"boro":"París","sub":"Empieza en metro Concorde (1, 8, 12); termina en RER C Champ de Mars o metro Bir-Hakeim (6)","costN":"","closed":"","free":"","book":"","src":"propuesta","gname":"","must":0,"rate":0,"season":"","warn":[],"refs":[]},{"id":"par_torre_eiffel","n":"Torre Eiffel","gname":"Tour Eiffel","cat":"mirador","typ":"Mirador","hood":"7º arrondissement","lat":48.85822,"lng":2.2945,"addr":"Av. Gustave Eiffel, 75007 París","cost":37.7,"costN":"Cima en ascensor 37,70 € desde el 11/01/2027 (36,70 € en 2026); 2º piso en ascensor 23,50 € (2026)","dur":2,"main":true,"book":"Comprar solo en toureiffel.paris (los revendedores cobran más)","why":"Si ya subieron, no hace falta repetir: verla desde abajo, desde el Trocadéro o al anochecer cuando centellea es gratis. Si nunca subieron a la cima, es la vista más alta de la ciudad.","tip":"El acceso al pie tiene control de seguridad con cola. Para ellos, el 2º piso en ascensor ya da la mejor vista (la cima queda muy alta y se ve 'plano').","refs":["https://www.toureiffel.paris/sites/default/files/2026-10/tarifs_2027_fr.pdf","https://www.toureiffel.paris/fr/tarifs-janv-2026"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B","Ruta 3","Itinerario","Ya conocen la ciudad"],"boro":"París","sub":"Metro Bir-Hakeim (6) o RER C Champ de Mars–Tour Eiffel","closed":"","free":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"par_montmartre","n":"Montmartre","cat":"barrio","typ":"Barrio / paseo","hood":"18º arrondissement","lat":48.88694,"lng":2.34111,"addr":"Montmartre, ne","why":"La mejor colección impresionista del mundo, más manejable que el Louvre. El reloj gigante del 5º piso da al Sena y a Montmartre.","tip":"Ir directo al 5º piso (impresionistas) en ascensor y bajar. Hay cafetería detrás del reloj. Según terceros cierra los lunes.","refs":["https://www.guide-tourisme-france.com/VISITER/musee-orsay--paris-365.htm","https://en.wikipedia.org/wiki/Mus%C3%A9e_d%27Orsay"],"conf":"media","tags":["IA","Ruta 1A","Ruta 1B","Ruta 3","Itinerario","Ya conocen la ciudad"],"boro":"París","sub":"RER C Musée d'Orsay o metro Solférino (12)","closed":"","free":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"par_saint_germain","n":"Saint-Germain-des-Prés","cat":"barrio","typ":"Barrio / paseo","hood":"6º arrondissement","lat":48.85389,"lng":2.33444,"addr":"Saint-Germain-des-Prés, 75006 París","cost":0,"dur":2,"main":true,"why":"La iglesia de Saint-Germain (siglo XI, restaurada hace poco con sus pinturas de colores) es gratis y poco visitada. Alrededor: rue de Furstenberg, rue de Buci y las galerías de arte.","tip":"El Flore y Les Deux Magots ya los conocen y son caros: para café, mejor Polidor o el Luxemburgo. Todo plano.","refs":["https://en.wikipedia.org/wiki/Saint-Germain-des-Pr%C3%A9s"],"conf":"baja","tags":["IA","Ruta 1A","Ruta 1B","Ruta 3","Itinerario","Ya conocen la ciudad"],"boro":"París","sub":"Metro Saint-Germain-des-Prés (4) o Mabillon (10)","costN":"","closed":"","free":"","book":"","src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"par_luxemburgo","n":"Jardín de Luxemburgo","gname":"Jardin du Luxembourg","cat":"parque","typ":"Parque / jardín","hood":"6º arrondissement","lat":48.84694,"lng":2.33722,"addr":"Rue de Médicis / Rue de Vaugirard, 75006 París","cost":0,"dur":1.5,"main":true,"why":"El parque donde los parisinos se sientan a leer. Lo menos visto: el verger (huerto de manzanos y perales) en la esquina sudoeste, el rucher (colmenas) y la Fuente Médicis." se (3) o Palais Royal (1, 7)","costN":"","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"par_passage_panoramas","n":"Passage des Panoramas","cat":"arq","typ":"Monumento / edificio","hood":"2º arrondissement","lat":48.87111,"lng":2.34167,"addr":"11 Bd Montmartre, 75002 París","cost":0,"dur":0.75,"why":"Encadena con el Passage Jouffroy y el Passage Verdeau del otro lado del bulevar: casi un kilómetro de galerías techadas con tiendas de bastones, juguetes y libros viejos. Queda frente al Bouillon Chartier.","tip":"Recorrido de lluvia ideal: Panoramas → cruzar el bulevar → Jouffroy → Verdeau, y almorzar en Chartier.","refs":["https://en.wikipedia.org/wiki/Passage_des_Panoramas"],"conf":"baja","tags":["IA","Ruta 1A","Ruta 1B","Ruta 3","Ya conocen la ciudad"],"boro":"París","sub":"Metro Grands Boulevards (8, 9)","costN":"","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"par_coulee_verte","n":"Coulée verte René-Dumont","gname":"Coulée verte René-Dumont (Promenade plantée)","cat":"parque","typ":"Paseo / costa","hood":"12º arrondissement","lat":48.84635,"lng":2.3778,"addr":"Avenue Daumesnil (Viaduc des Arts), 75012 París","cost":0,"dur":1.5,"why":"El paseo que inspiró la High Line de Nueva York: 4,5-4,7 km sobre un viaducto y después en trinchera, sin autos. Abajo, en las arcadas del Viaduc des Arts, hay talleres de artesanos.","tip":"Se sube por escaleras desde la rue de Lyon / avenue Daumesnil; paris.fr lista ascensores en algunos accesos pero varios figuraban fuera de servicio. Bancos a lo largo. Con hacer el tramo hasta el Jardin de Reuilly (~1,5 km) alcanza.","refs":["https://www.paris.fr/equipements/coulee-verte-rene-dumont-1772","https://en.wikipedia.org/wiki/Coul%C3%A9e_verte_Ren%C3%A9-Dumont"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B","Ruta 3","Ya conocen la ciudad"],"boro":"París","sub": "","warn":[]},{"id":"par_mouffetard","n":"Rue Mouffetard","cat":"barrio","typ":"Barrio / paseo","hood":"Barrio Latino, 5º","lat":48.84194,"lng":2.34972,"addr":"Rue Mouffetard, 75005 París","cost":0,"dur":1,"why":"El tramo de abajo (cerca de Saint-Médard) es mercado de calle con queserías, fruterías y panaderías: ideal para comprar para cocinar en el Airbnb. La Contrescarpe es la plaza que describía Hemingway.","tip":"En bajada desde la Contrescarpe; se puede seguir hasta la Grande Mosquée (10 min) para el té.","refs":["https://en.wikipedia.org/wiki/Rue_Mouffetard"],"conf":"baja","tags":["IA","Ruta 1A","Ruta 1B","Ruta 3","Ya conocen la ciudad"],"boro":"París","sub":"Metro Place Monge o Censier-Daubenton (7)","costN":"","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"par_chartier","n":"Bouillon Chartier (Grands Boulevards)","gname":"Bouillon Chartier Grands Boulevards","cat":"comida","typ":"Restaurante","hood":"9º arrondissement","lat":48.87333,"lng":2.34361,"addr":"7 Rue du Faubourg Montmartre, 75009 París","cost":22,"costN":"plato principal 8-12 €; comida completa ~20-25 € sin bebida","dur":1,"book":"No toma reservas: cola en la puerta","why":"Monumento histórico donde se come cocina francesa clásica (huevo mayo, pot-au-feu, confit) a precio de los años 90. Abre todos los días del año.","tip":"Ir temprano (antes del mediodía o antes de las 19): la cola avanza rápido. El mozo anota la cuenta en el mantel de papel. Hay otra sucursal en Montparnasse.","refs":["https://www.bouillon-chartier.com/","https://www.parisgourmand.com/nos-meilleurs-restaurants-pour-paques/paques-au-bouillon-chartier-grands-boulevards.html"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B","Ruta 3","Ya conocen la ciudad"],"boro":"París","sub":"Metro Grands Boulevards (8, 9)","closed":"","free":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"par_polidor","n":"Polidor","cat":"comida","typ":"Restaurante","hood":"Odéon, 6º","lat":48.84972,"lng":2.34,"addr":"41 Rue Monsieur-le-Prince, 75006 París","cost":25,"costN":"plato principal ~13-22 € (terceros, sin fecha); menú ~25 €","dur":1.25,"book":"Reserva desde su web","why":"Lo frecuentaban Joyce, Hemingway y Boris Vian; el salón casi no cambió desde el siglo XIX y aparece en 'Medianoche en París'. Cocina de bistró sencilla: bœuf bourguignon, blanquette, tarte Tatin.","tip":"A dos cuadras del Luxemburgo: buen cierre del día de Saint-Germain. El menú del mediodía es lo más barato.","refs":["https://www.polidor.com/","https://en.wikipedia.org/wiki/Polidor"],"conf":"media","tags":["IA","Ruta 1A","Ruta 1B","Ruta 3","Ya conocen la ciudad"],"boro":"París","sub":"Metro Odéon (4, 10)","closed":"","free":"","main":false,"src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"par_chez_janou","n":"Chez Janou","cat":"comida","typ":"Restaurante","hood":"Le Marais, 3º","lat":48.85669,"lng":2.36727,"addr":"2 Rue Roger Verlomme, 75003 París","cost":35,"costN":"almuerzo ~18 € (fórmula); a la noche ~40-60 € por persona (terceros)","dur":1.25,"book":"Conviene reservar (botón en su web)","why":"Cocina de Provenza y una carta de unos 80 pastis. Famoso por la mousse de chocolate servida de un bol grande. Encaja con la visita a la Place des Vosges y Carnavalet.","tip":"A mediodía es más barato y tranquilo; las reseñas de 2025 se quejan del servicio en horas pico.","refs":["https://www.chezjanou.com/","https://rankeat.fr/restaurants/chez-janou-paris-3e"],"conf":"media","tags":["IA","Ruta 1A","Ruta 1B","Ruta 3","Ya conocen la ciudad"],"boro":"París","sub":"Metro Chemin Vert (8)","closed":"","free":"","main":false,"src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"par_bofinger","n":"Brasserie Bofinger","gname":"Bofinger","cat":"comida","typ":"Restaurante","hood":"Bastille, 4º","lat":48.8539,"lng":2.36785,"addr":"5-7 Rue de la Bastille, 75004 París","cost":30,"costN":"plato principal 19,50-41,50 €; menú almuerzo 19,90 € (2 pasos, días de semana); menú Bofinger 35,90 €","dur":1.5,"book":"Reservar por web o al 01 42 72 87 82","why":"Brasserie de fin de siglo XIX con cúpula de vidrio y madera tallada; la especialidad es la choucroute (desde 19,50 €). Queda en el arranque de la Coulée verte.","tip":"El menú de almuerzo de 19,90 € entre semana es la forma razonable de conocerla.","refs":["https://www.bofingerparis.com/","https://www.bofingerparis.com/menus-carte/"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B","Ruta 3","Ya conocen la ciudad"],"boro":"París","sub":"Metro Bastille (1, 5, 8)","closed":"","free":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"par_enfants_rouges","n":"Mercado de los Enfants Rouges","gname":"Marché des Enfants Rouges","cat":"comida","typ":"Mercado","hood":"Le Marais, 3º","lat":48.8628,"lng":2.362,"addr":"39 Rue de Bretagne, 75003 París","cost":15,"costN":"plato en un puesto ~12-18 € (estimado)","dur":1,"why":"Almuerzo informal en mesas compartidas: cocina marroquí, japonesa, italiana o francesa, más fruterías y queserías para llevar al Airbnb.","tip":"Se llena al mediodía; llegar antes de las 12:15. Pocos asientos y sin respaldo.","refs":["https://en.wikipedia.org/wiki/March%C3%A9_des_Enfants-Rouges"],"conf":"baja","tags":["IA","Ruta 1A","Ruta 1B","Ruta 3","Ya conocen la ciudad"],"boro":"París","sub":"Metro Filles du Calvaire (8) o Temple (3)","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"par_mosquee_te","n":"Salón de té de la Gran Mezquita","gname":"Salon de thé de la Grande Mosquée de Paris","cat":"comida","typ":"Café / pastelería","hood":"Jardin des Plantes, 5º","lat":48.84178,"lng":2.35565,"addr":"39 Rue Geoffroy-Saint-Hilaire, 75005 París","cost":6,"costN":"té de menta y una pastelería, unos pocos euros (sin precio verificado)","dur":0.75,"why":"La mezquita cumplió 100 años en julio de 2026. Un vaso de té en el patio de mosaicos, frente al Jardin des Plantes, es una de las paradas más baratas y distintas de París.","tip":"La entrada al salón de té (39 rue Geoffroy-Saint-Hilaire) es distinta de la visita a la mezquita (2 place du Puits-de-l'Ermite) y no se comunican por dentro. Al lado, el Jardin des Plantes tiene bancos de sobra.","refs":["https://www.pariszigzag.fr/bar-restaurant/restaurant/salon-the-grande-mosquee-paris/","https://www.sortiraparis.com/lieux/350-mosquee-de-paris"],"conf":"media","tags":["IA","Ruta 1A","Ruta 1B","Ruta 3","Ya conocen la ciudad"],"boro":"París","sub":"Metro Place Monge (7)","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"par_stohrer","n":"Pastelería Stohrer","gname":"Stohrer","cat":"comida","typ":"Café / pastelería","hood":"Montorgueil, 2º","lat":48.86521,"lng":2.34682,"addr":"51 Rue Montorgueil, 75002 París","cost":6,"costN":"una pieza de pastelería, pocos euros (sin precio verificado)","dur":0.5,"why":"Fundada por el pastelero de la reina María Leszczyńska; su decoración pintada es del siglo XIX. El baba au rhum y el puits d'amour son las especialidades de la casa.","tip":"Es para llevar, no tiene salón. La rue Montorgueil es peatonal: comprar y seguir caminando hasta los pasajes cubiertos.","refs":["https://stohrer.fr/"],"conf":"media","tags":["IA","Ruta 1A","Ruta 1B","Ruta 3","Ya conocen la ciudad"],"boro":"París","sub":"Metro Sentier (3) o Étienne Marcel (4)","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"par_berthillon","n":"Berthillon","cat":"comida","typ":"Café / pastelería","hood":"Île Saint-Louis, 4º","lat":48.85174,"lng":2.3567,"addr":"31 Rue Saint-Louis en l'Île, 75004 París","cost":5,"costN":"un helado, pocos euros (sin precio verificado)","dur":0.5,"why":"La Île Saint-Louis, detrás de Notre-Dame, es el paseo más tranquilo del centro, y Berthillon es la excusa para cruzar.","tip":"Según terceros cierra lunes y martes; varios cafés de la isla venden su helado si está cerrado. Los muelles de la isla tienen bancos al nivel del agua.","season":"Cierra en verano (mediados de julio a fines de agosto, según terceros)","refs":["https://www.cityzeum.com/des-glaces-chargees-d-hitoire","https://www.gillespudlowski.com/?p=45072"],"conf":"media","tags":["IA","Ruta 1A","Ruta 1B","Ruta 3","Ya conocen la ciudad"],"boro":"París","sub":"Metro Pont Marie (7)","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"warn":[]},{"id":"ver_palacio","n":"Palacio de Versalles","gname":"Château de Versailles","cat":"arq","typ":"Palacio / castillo","hood":"Versalles","lat":48.8047,"lng":2.1203,"addr":"Place d'Armes, 78000 Versailles, Versalles","cost":32,"costN":"Con pasaporte español (EEE): 32 € (3 € menos). Pasaporte (palacio + Trianon + jardines): 35 € abril-octubre / 25 € noviembre-marzo; 3 € menos con documento del EEE; desde las 16 h (alta) o 15 h (baja) 28 € / 18 €","dur":2.5,"main":true,"closed":"lunes","book":"Franja horaria obligatoria para el palacio, online; las reservas abren 3 meses antes","free":"Primer domingo del mes de diciembre a marzo, para todos (igual hay que reservar franja)","why":"El PDF lo pone como la jornada más larga del viaje. Para quien ya fue, vale la pena con el Pasaporte por lo que se suele saltear: el Trianon y el Hameau, más que repetir los salones.","tip":"Con franja de tarde para el palacio, la web oficial recomienda empezar por el Trianon (abre a las 12) y los jardines. Los salones se recorren de pie y con mucha gente: pedir la audioguía en la app gratis. Cerrado los lunes.","refs":["https://www.chateauversailles.fr/tarification-2026","https://www.chateauversailles.fr/preparer-ma-visite/billets-tarifs","https://www.chateauversailles.fr/preparer-ma-visite/conditions-gratuite"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B","Ruta 3","Itinerario","Excursión"],"boro":"Versalles","sub":"RER C hasta Versailles Château Rive Gauche (~10 min a pie)","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"ver_jardines","n":"Jardines de Versalles","gname":"Jardins du Château de Versailles","cat":"parque","typ":"Parque / jardín","hood":"Versalles","lat":48.80806,"lng":2.10833,"addr":"Château de Versailles, 78000 Versailles, Versalles","cost":12,"costN":"Con pasaporte español (EEE): 12 € los días con pago. abril-octubre: 15 € (12 € EEE) los días de Grandes Eaux Musicales / Jardins Musicaux; incluidos en el Pasaporte. Noviembre-marzo: gratis","dur":3,"main":true,"why":"Son kilómetros de caminata: el PDF los marca como la jornada más larga. En temporada alta las fuentes funcionan con música barroca y los bosquetes cerrados se abren.","tip":"Hay un trencito (petit train) entre el palacio, el Trianon y el Gran Canal para ahorrar piernas; también alquiler de carritos eléctricos. Senderos de gravilla y una bajada fuerte desde la terraza (que después hay que subir).","season":"De abril a octubre hay fuentes funcionando con música (Grandes Eaux / Jardins Musicaux) y se pagan; en temporada baja son gratis pero sin fuentes","refs":["https://www.chateauversailles.fr/tarification-2026","https://www.chateauversailles.fr/preparer-ma-visite/conditions-gratuite"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B","Ruta 3","Itinerario","Excursión"],"boro":"Versalles","sub":"RER C hasta Versailles Château Rive Gauche (~10 min a pie)","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"warn":[]},{"id":"ver_trianon","n":"Dominio de Trianon y Aldea de la Reina","gname":"Domaine de Trianon / Hameau de la Reine","cat":"arq","typ":"Palacio / castillo","hood":"Versalles","lat":48.81564,"lng":2.10968,"addr":"Domaine de Trianon, 78000 Versailles, Versalles","cost":12,"costN":"Con pasaporte español (EEE): 12 €. 15 € (12 € EEE) todo el año; incluido en el Pasaporte","dur":2.5,"closed":"lunes","why":"La parte que casi nadie ve en una primera visita y la más agradable: el Petit Trianon es una casa a escala humana, y el Hameau es una aldea de granja de juguete con lago y huerta.","tip":"Abre a las 12 según la web oficial. Del palacio al Hameau hay más de 2 km: usar el trencito. Sin franja horaria: se entra cuando se llega.","refs":["https://www.chateauversailles.fr/tarification-2026"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B","Ruta 3","Excursión"],"boro":"Versalles","sub":"RER C hasta Versailles Château Rive Gauche (~10 min a pie)","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"ver_grand_canal","n":"Gran Canal","gname":"Grand Canal","cat":"parque","typ":"Paseo / costa","hood":"Versalles","lat":48.80966,"lng":2.10104,"addr":"Parc du Château de Versailles, 78000 Versailles, Versalles","cost":0,"costN":"el Parque es gratis para peatones; botes y bicicletas se alquilan aparte","dur":1,"why":"Es el eje de los jardines y la parte del Parque que es gratis siempre. Pasear por la orilla o cruzarlo en bote es el respiro del día.","tip":"Bancos y sombra a lo largo de la orilla; los alrededores son planos. El restaurante La Flottille está en la cabecera.","season":"Los botes de remo funcionan en temporada (sin fechas verificadas)","refs":["https://www.chateauversailles.fr/preparer-ma-visite/conditions-gratuite"],"conf":"media","tags":["IA","Ruta 1A","Ruta 1B","Ruta 3","Excursión"],"boro":"Versalles","sub":"RER C hasta Versailles Château Rive Gauche (~10 min a pie)","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"warn":[]},{"id":"ver_flottille","n":"La Flottille","cat":"comida","typ":"Restaurante","hood":"Versalles","lat":48.81198,"lng":2.10313,"addr":"Parc du Château de Versailles, 78000 Versailles, Versalles","cost":25,"costN":"carta 15-35 € (terceros)","dur":1.25,"why":"Es la opción para comer adentro del dominio sin
