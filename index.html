ue,"why":"Se recorre a su aire, por patios, murallas y túneles de minas: es el castillo más 'para explorar' de la zona, y desde arriba se ve la Loreley y el castillo Katz enfrente.","tip":"Está bastante más arriba que el pueblo: subida empinada de ~20 min, o taxi. Adentro hay terreno irregular y túneles oscuros (llevar linterna del celular). Con nieve o hielo cierra.","season":"En temporada abre todos los días y el museo desde Semana Santa. En invierno, según fuentes viejas, solo fines de semana; entre octubre y marzo hay veda por murciélagos que afecta a las galerías. Hay obras de saneamiento previstas hasta 2028.","refs":["https://www.rheinsteig.de/en/a-burg-rheinfels"],"conf":"media","tags":["IA","Ruta 1A","Ruta 1B","Excursión"],"boro":"Valle del Rin","sub":"Subida a pie (o taxi) desde el pueblo de St. Goar","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"warn":[]},{"id":"rin_altes_haus","n":"Altes Haus (Bacharach)","gname":"Restaurant Altes Haus","cat":"comida","typ":"Restaurante","hood":"Bacharach","lat":50.0603615,"lng":7.7679385,"addr":"Oberstraße 61, 55422 Bacharach, Valle del Rin","cost":20,"costN":"Plato principal ~15-25 € (estimado; no leí la carta)","dur":1.25,"why":"Comer adentro del edificio más fotografiado del valle: entramado intacto, que se salvó de los incendios de 1900, y que Robert Stolz eligió para su opereta de 1932. Cocina alemana sencilla con vino de la zona.","tip":"No pude confirmar horarios ni que abra en 2027: llamar antes (+49 6743 1209). Las reseñas dicen carta corta y servicio a veces lento; si está cerrado, hay otras tabernas sobre la misma Oberstraße.","refs":["https://www.bacharach.de/en/a-das-alte-haus"],"conf":"media","tags":["IA","Ruta 1A","Ruta 1B","Excursión"],"boro":"Valle del Rin","sub":"A pie desde el embarcadero o la estación de Bacharach","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"rin_klostercafe","n":"Abadía de Santa Hildegarda y su café","gname":"Abtei St. Hildegard / Klostercafé","cat":"comida","typ":"Café / pastelería","hood":"Eibingen, Rüdesheim","lat":49.9925,"lng":7.92805556,"addr":"Klosterweg 1, 65385 Rüdesheim am Rhein, Valle del Rin","cost":8,"costN":"Café y torta ~6-10 € (estimado)","dur":1.0,"closed":"lunes","why":"La abadía es la heredera de la de Hildegarda de Bingen y su iglesia neorrománica pintada es la gran visita tranquila de Rüdesheim. El café es un emprendimiento de inclusión, con pan y tortas horneados en el convento y platos con recetas de Hildegarda.","tip":"Queda arriba, entre viñedos: la caminata desde el pueblo es en subida, mejor en taxi. Cerrado los lunes. Encaja si el barco se descarta (temporada baja).","refs":["https://www.ruedesheim.de/fileadmin/ruedesheim/Docs/Erlebnis-Brosch%C3%BCre_2026.pdf"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B","Excursión"],"boro":"Valle del Rin","sub":"Taxi o caminata cuesta arriba desde el centro de Rüdesheim","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"hei_altstadt","n":"Casco antiguo de Heidelberg (Hauptstraße)","gname":"Heidelberger Altstadt / Hauptstraße","cat":"barrio","typ":"Barrio / paseo","hood":"Altstadt","lat":49.41083333,"lng":8.70638889,"addr":"Hauptstraße, 69117 Heidelberg","cost":0,"costN":"Gratis","dur":2.0,"main":true,"why":"Es la ciudad universitaria más antigua de Alemania (1386) y su casco viejo está entero: la Hauptstraße va de Bismarckplatz a la plaza del Mercado y la Kornmarkt, con la Universidad Vieja, la cárcel de estudiantes (Studentenkarzer) y las tabernas estudiantiles en el camino.","tip":"Todo plano. La Hauptstraße es larga: entrar por Bismarckplatz y caminarla hacia el este deja en la Kornmarkt, justo donde sale el funicular al castillo.","refs":["https://de.wikipedia.org/wiki/Heidelberger_Altstadt"],"conf":"baja","tags":["IA","Ruta 1A","Ruta 1B","Itinerario","Excursión"],"boro":"Heidelberg","sub":"Tren desde Frankfurt a Heidelberg Hbf, y bus o tranvía hasta Bismarckplatz","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"hei_schloss","n":"Castillo de Heidelberg","gname":"Schloss Heidelberg","cat":"arq","typ":"Palacio / castillo","hood":"Altstadt","lat":49.4105568,"lng":8.7153078,"addr":"Schlosshof 1, 69117 Heidelberg","cost":12,"costN":"12 € desde el 1/1/2027 (11 € en 2026); incluye funicular ida y vuelta, patio, el Gran Tonel y el Museo Alemán de Farmacia. Visita guiada +6 €","dur":2.5,"main":true,"why":"La ruina romántica más famosa de Alemania: fachadas renacentistas, una torre volada por los franceses en 1693 y, en el sótano, el Gran Tonel de 220.000 litros. La terraza da la vista clásica sobre los techos, el Puente Viejo y el Neckar.","tip":"Tomar el funicular desde la Kornmarkt: la entrada lo incluye y evita una cuesta empinada. La guiada (en alemán o inglés) es la única forma de ver interiores. Ojo con otoño de 2027: ver 'season'.","season":"El funicular dejaría de funcionar de principios de octubre de 2027 a fines de marzo de 2028 por obras en el puente de la estación Schloss, con bus de reemplazo (era una propuesta a votar por el concejo el 15/10/2026).","refs":["https://www.schloss-heidelberg.de/en/visitor-information","https://www.heidelberg24.de/heidelberg/bergbahn-mehrere-monate-gesperrt-baustelle-heidelberg-94540047.html"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B","Itinerario","Excursión"],"boro":"Heidelberg","sub":"Funicular (Bergbahn) desde la estación Kornmarkt hasta la estación Schloss","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"warn":[]},{"id":"hei_philosophenweg","n":"Camino de los Filósofos (Philosophenweg)","gname":"Philosophenweg","cat":"mirador","typ":"Mirador","hood":"Neuenheim","lat":49.415,"lng":8.70027778,"addr":"Philosophenweg, 69120 Heidelberg","cost":0,"costN":"Gratis","dur":2.0,"main":true,"why":"Es 'el mejor paseo del tramo' según la ruta: la vista de frente del castillo sobre la ciudad y el río, que no se tiene desde ningún otro lado. Pasa por el Philosophengärtchen, un jardincito con un busto de Eichendorff y vista abierta hasta la llanura del Rin.","tip":"La subida es lo duro: desde el Puente Viejo el Schlangenweg es zigzag con tramos de escalera, y del lado de Neuenheim los primeros ~700 m son muy empinados. Después es casi llano. Tomarlo con calma, de ida subir y de vuelta bajar por el otro extremo.","refs":["https://de.wikipedia.org/wiki/Philosophenweg_(Heidelberg)"],"conf":"media","tags":["IA","Ruta 1A","Ruta 1B","Itinerario","Excursión"],"boro":"Heidelberg","sub":"A pie cruzando el Puente Viejo (por el Schlangenweg) o desde Neuenheim","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"hei_alte_bruecke","n":"Puente Viejo (Alte Brücke)","gname":"Karl-Theodor-Brücke (Alte Brücke)","cat":"arq","typ":"Monumento / edificio","hood":"Altstadt","lat":49.41425278,"lng":8.70954722,"addr":"Alte Brücke, 69117 Heidelberg","cost":0,"costN":"Gratis","dur":0.5,"main":true,"why":"Es la foto de Heidelberg: la puerta barroca con cascos en punta, el castillo arriba y el río debajo. Además es el paso obligado hacia el Philosophenweg.","tip":"Llano. Al pie de la puerta está el mono de bronce con espejo que todos tocan.","refs":["https://de.wikipedia.org/wiki/Alte_Br%C3%BCcke_(Heidelberg)"],"conf":"baja","tags":["IA","Ruta 1A","Ruta 1B","Excursión"],"boro":"Heidelberg","sub":"A pie desde la plaza del Mercado","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"hei_heiliggeist","n":"Iglesia del Espíritu Santo y plaza del Mercado","gname":"Heiliggeistkirche / Marktplatz","cat":"arq","typ":"Iglesia / templo","hood":"Altstadt","lat":49.41222222,"lng":8.70944444,"addr":"Marktplatz, 69117 Heidelberg","cost":0,"costN":"Gratis la iglesia (la torre se paga aparte, precio no verificado)","dur":0.5,"main":true,"why":"Es la iglesia mayor de Heidelberg y fue panteón de los electores del Palatinado; durante siglos estuvo dividida por un muro entre católicos y protestantes. Desde la plaza se ve el castillo encima.","tip":"Plano; buena parada para sentarse en la plaza entre el castillo y el Philosophenweg.","refs":["https://de.wikipedia.org/wiki/Heiliggeistkirche_(Heidelberg)"],"conf":"baja","tags":["IA","Ruta 1A","Ruta 1B","Excursión"],"boro":"Heidelberg","sub":"A pie desde la Hauptstraße","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"hei_roter_ochsen","n":"Zum Roten Ochsen","gname":"Zum Roten Ochsen","cat":"comida","typ":"Restaurante","hood":"Altstadt","lat":49.4127874,"lng":8.7134002,"addr":"Hauptstraße 217, 69117 Heidelberg","cost":22,"costN":"Plato principal ~16-26 € (estimado; no leí la carta)","dur":1.5,"main":true,"book":"Reservar (+49 6221 20977 o desde su web)","why":"Es la taberna de estudiantes más famosa de Heidelberg: paredes llenas de fotos, inscripciones y recuerdos de las corporaciones estudiantiles de casi dos siglos. Cocina casera: pecho de buey hervido, Schäufele, ragú de ciervo, Käsespätzle.","tip":"Su web hoy solo anuncia cocina viernes y sábado a la noche, y 'fuera de eso, a convenir': no es para el almuerzo de una excursión de día. Si el día de Heidelberg no cae viernes o sábado, ir a la Schnitzelbank.","refs":["https://www.roterochsen.de/"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B","Excursión"],"boro":"Heidelberg","sub":"A pie desde la Kornmarkt / plaza del Mercado","closed":"","free":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"hei_schnitzelbank","n":"Weinstube Schnitzelbank","gname":"Weinstube Schnitzelbank","cat":"comida","typ":"Restaurante","hood":"Altstadt","lat":49.4114714,"lng":8.7023168,"addr":"Bauamtsgasse 7, 69117 Heidelberg","cost":18,"costN":"Plato principal ~14-22 € (estimado; no leí la carta)","dur":1.5,"why":"Cocina regional del Palatinado y Baden con vinos de la zona: schnitzels, Pfälzer Saumagen, albóndigas de hígado, Käsespätzle. Se come sobre los viejos bancos de tonelero, de ahí el nombre.","tip":"Local muy chico y lleno: no atienden bien el teléfono, se reserva por mail (info@schnitzelbank-heidelberg.de) o se llega. Según su web, de lunes a viernes abre a la tarde y los fines de semana también al mediodía.","refs":["https://www.schnitzelbank-heidelberg.de/home/","https://www.heidelberg24.de/heidelberg/deutsche-kueche-heidelberg-besten-restaurants-trinken-essen-94316669.html"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 1B","Excursión"],"boro":"Heidelberg","sub":"A pie desde la Hauptstraße","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"hei_knoesel","n":"Chocolatería Knösel (Studentenkuss)","gname":"Chocolaterie Knösel","cat":"comida","typ":"Café / pastelería","hood":"Altstadt","lat":49.4125514,"lng":8.7090106,"addr":"Haspelgasse 16, 69117 Heidelberg","cost":3,"costN":"Un bombón, pocos euros (precio no verificado)","dur":0.25,"main":true,"why":"La historia: los estudiantes no podían acercarse a las chicas de los internados, vigiladas por sus institutrices, y el chocolatero Fridolin Knösel inventó en 1863 un bombón para regalarles como 'beso'. Se sigue haciendo con la receta original varias veces por semana.","tip":"Es la compra-recuerdo de Heidelberg, a media cuadra de la Heiliggeistkirche y camino al Puente Viejo.","refs":["https://www.heidelberg24.de/heidelberg/studentenkuss-heidelberger-schokolade-infos-chocolaterie-knoesel-94460083.html"],"conf":"media","tags":["IA","Ruta 1A","Ruta 1B","Excursión"],"boro":"Heidelberg","sub":"A pie desde la plaza del Mercado","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"avi_casco_antiguo","n":"Casco antiguo de Avilés","cat":"barrio","typ":"Barrio / paseo","hood":"La Villa","lat":43.555364,"lng":-5.922005,"addr":"Plaza de España, 33402 Avilés","cost":0,"costN":"gratis","dur":2,"main":true,"why":"Es lo que el plan marca para el día en Avilés. Calles con soportales (Galiana, Rivero, La Ferrería) que permiten caminar bajo techo aunque llueva, y palacios como Valdecarzana y Camposagrado a pocos pasos uno de otro.","tip":"Todo es plano y corto. Si ya lo conocen, conviene combinarlo con el Museo de la Historia Urbana, que cuenta lo que están viendo.","refs":["https://www.turismoasturias.es/es/descubre/cultura/museos-y-espacios-culturales/colecciones-museograficas/museo-de-la-historia-urbana-de-aviles"],"conf":"media","tags":["IA","Ruta 1A","Ruta 3","Itinerario","Ya conocen la ciudad"],"boro":"Avilés","sub":"A pie desde la estación de tren y autobuses de Avilés","closed":"","free":"","book":"","src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"avi_ria","n":"Paseo de la ría de Avilés","cat":"parque","typ":"Paseo / costa","hood":"Sabugo / El Muelle","lat":43.558606,"lng":-5.921847,"addr":"Parque del Muelle, Avilés (punto de partida)","aprox":true,"cost":0,"costN":"gratis","dur":1.5,"main":true,"why":"El plan lo nombra junto al casco antiguo. Une el centro con el Niemeyer cruzando la ría por una pasarela, y deja ver lo que fue el puerto industrial de la ciudad.","tip":"Plano. El punto marcado es el Parque del Muelle, donde arranca; no es un sendero con un trazado oficial que haya podido verificar.","conf":"baja","tags":["IA","Ruta 1A","Ruta 3","Itinerario","Ya conocen la ciudad"],"boro":"Avilés","sub":"A pie desde el casco antiguo","closed":"","free":"","book":"","src":"propuesta","gname":"","must":0,"rate":0,"season":"","warn":[],"refs":[]},{"id":"avi_niemeyer","n":"Centro Niemeyer","gname":"Centro Cultural Internacional Oscar Niemeyer","cat":"arq","typ":"Monumento / edificio","hood":"Isla de la Innovación","lat":43.557443,"lng":-5.91771,"addr":"Avenida del Zinc s/n, Avilés","cost":0,"costN":"la plaza exterior es libre; las exposiciones y espectáculos se pagan aparte (precio no verificado)","dur":1,"main":true,"why":"La única obra de Niemeyer en España. La plaza blanca se recorre gratis y da la mejor vista del casco antiguo al otro lado de la ría.","tip":"Ya lo conocen seguramente: vale si hay una exposición nueva. Mirar la programación antes.","conf":"media","tags":["IA","Ruta 1A","Ruta 3","Ya conocen la ciudad"],"boro":"Avilés","sub":"A pie por la pasarela sobre la ría desde el centro","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[],"refs":[]},{"id":"avi_galiana","n":"Calle Galiana","cat":"barrio","typ":"Barrio / paseo","hood":"La Villa","lat":43.553605,"lng":-5.925241,"addr":"Calle Galiana, Avilés","cost":0,"costN":"gratis","dur":0.5,"main":true,"why":"La calle más fotografiada de Avilés: soportales continuos, casas bajas y el abrevadero de piedra. Hoy es más de bares que de tiendas.","tip":"Empedrado irregular: mejor calzado con suela gruesa. Bajo los soportales se camina seco.","refs":["https://www.turismoasturias.es/organiza-tu-viaje/donde-comer/restaurantes/tierra-astur"],"conf":"media","tags":["IA","Ruta 1A","Ruta 3","Ya conocen la ciudad"],"boro":"Avilés","sub":"A pie desde la Plaza de España","closed":"","free":"","book":"","src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"avi_sabugo","n":"Sabugo e Iglesia vieja de Sabugo","gname":"Iglesia vieja de Sabugo","cat":"barrio","typ":"Barrio / paseo","hood":"Sabugo","lat":43.559964,"lng":-5.923283,"addr":"Plaza del Carbayedo, Avilés","cost":0,"costN":"exterior gratis","dur":0.75,"why":"Lo que suele quedar afuera de la primera visita: el barrio que era otro pueblo, separado de la villa por la ría. La plaza del Carbayedo tiene casas con galería y la iglesia vieja, románica de transición.","tip":"Queda a dos pasos del Parque del Muelle: se encadena con el paseo de la ría.","conf":"media","tags":["IA","Ruta 1A","Ruta 3","Ya conocen la ciudad"],"boro":"Avilés","sub":"A pie desde el Parque del Muelle","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[],"refs":[]},{"id":"avi_mhua","n":"Museo de la Historia Urbana de Avilés","gname":"Museo de la Historia Urbana de Avilés","cat":"museo","typ":"Museo de historia y otros","hood":"La Villa","lat":43.557153,"lng":-5.921795,"addr":"Calle de La Ferrería 35, Avilés","cost":0,"costN":"gratis","dur":1,"closed":"lunes","why":"Probablemente no lo vieron: explica en maquetas y documentos lo que ya caminaron, incluido el salto industrial con ENSIDESA en los años 50.","tip":"Recorrido de sentido único: se entra por La Ferrería y se sale a la plaza de Camposagrado. Aforo limitado y solo visitas individuales o familiares. Tiene escaleras entre plantas: preguntar por ascensor.","refs":["https://www.turismoasturias.es/es/descubre/cultura/museos-y-espacios-culturales/colecciones-museograficas/museo-de-la-historia-urbana-de-aviles"],"conf":"media","tags":["IA","Ruta 1A","Ruta 3","Ya conocen la ciudad"],"boro":"Avilés","sub":"A pie, en el casco antiguo","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"avi_ferrera","n":"Parque de Ferrera","cat":"parque","typ":"Parque / jardín","hood":"La Villa","lat":43.556111,"lng":-5.922222,"addr":"Avilés, junto a la Calle Galiana","cost":0,"costN":"gratis","dur":0.75,"main":true,"why":"Ocho hectáreas de jardín en pleno centro: una parte de jardín francés junto al palacio y otra de pradera y arboleda. El lugar natural para sentarse entre paseo y paseo.","tip":"Bancos y sombra. Plano.","conf":"media","tags":["IA","Ruta 1A","Ruta 3","Ya conocen la ciudad"],"boro":"Avilés","sub":"A pie desde la Calle Galiana","closed":"","free":"","book":"","src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[],"refs":[]},{"id":"avi_salinas_anclas","n":"Museo de Anclas y Peñona de Salinas","gname":"Museo de Anclas Philippe Cousteau","cat":"mirador","typ":"Mirador","hood":"Salinas (Castrillón)","lat":43.574303,"lng":-5.960062,"addr":"La Peñona, Salinas, Castrillón, Avilés","cost":0,"costN":"gratis, visita libre","dur":1.5,"why":"Un plan cerca de Avilés que quizá no hicieron: mirador sobre el Cantábrico al final de un paseo marítimo largo y plano por la playa de Salinas. Entre las anclas hay una atribuida al galeón Nuestra Señora de Atocha y un busto de Philippe Cousteau.","tip":"Ir caminando por el paseo de la playa y subir a La Peñona por la tarde. Hace viento: llevar abrigo.","refs":["https://www.vivirasturias.com/museos/i/54647274/museo-de-anclas-philippe-cousteau","https://www.turismoasturias.es/es/descubre/cultura/museos-y-espacios-culturales/otros-espacios/museo-de-las-anclas"],"conf":"media","tags":["IA","Ruta 1A","Ruta 3","Ya conocen la ciudad"],"boro":"Avilés","sub":"Salinas está a unos 5 km de Avilés; bus urbano/interurbano (línea no verificada)","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"avi_tierra_astur","n":"Sidrería Tierra Astur Avilés","gname":"Tierra Astur Avilés","cat":"comida","typ":"Sidrería","hood":"La Villa","lat":43.555274,"lng":-5.922682,"addr":"Calle San Francisco 4, 33402 Avilés","cost":null,"costN":"Precio sin verificar. precio no verificado","dur":1.5,"why":"Es la única sidrería de Avilés con la marca de garantía «Sidrerías de Asturias» del Principado (listado de agosto de 2026): sidra escanciada como corresponde y cocina asturiana.","tip":"Es una cadena asturiana (también tiene locales en Oviedo y Gijón): segura más que sorprendente. Pedir sidra por botella; la escancian en la mesa.","refs":["https://www.asturias.es/documents/4911212/4919814/listado-sidrerias-diciembre.pdf/9bc1d9a1-6339-1f2a-d00f-11fbd5013dba","https://www.turismoasturias.es/organiza-tu-viaje/donde-comer/restaurantes/tierra-astur"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 3","Ya conocen la ciudad"],"boro":"Avilés","sub":"A pie desde la Plaza de España","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"cud_pueblo","n":"Cudillero: la plaza de la Marina y el anfiteatro","gname":"Cudillero","cat":"barrio","typ":"Pueblo para caminar","hood":"Cudillero","lat":43.563326,"lng":-6.145806,"addr":"Plaza de la Marina, Cudillero","cost":0,"costN":"gratis","dur":2,"main":true,"why":"La excursión que propone el plan. La postal es la plaza junto al puerto, rodeada por las casas encaramadas a la ladera; desde abajo no se ve que cada calle es una escalera.","tip":"Todo lo que no es la plaza se sube por escaleras y cuestas empinadas. Hacerlo de a poco, con la vuelta siempre de bajada hacia el puerto.","refs":["https://www.omio.es/autobuses/aviles/cudillero-ctxcj"],"conf":"media","tags":["IA","Ruta 1A","Ruta 3","Itinerario","Excursión"],"boro":"Cudillero","sub":"ALSA desde la estación de autobuses de Avilés hasta la calle principal de Cudillero (unos 30 min según Omio, sin verificar con ALSA); el tren de cercanías llega a una estación lejos del puerto","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"cud_mirador_pico","n":"Mirador del Pico","cat":"mirador","typ":"Mirador","hood":"Cudillero","lat":43.562368,"lng":-6.145994,"addr":"Calle San José, Cudillero","cost":0,"costN":"gratis","dur":0.5,"main":true,"why":"La foto clásica de Cudillero se saca desde arriba, no desde la plaza.","tip":"Es la subida más exigente: escalones. Hay un camino señalizado de miradores; ir sin apuro y bajar por el otro lado.","conf":"media","tags":["IA","Ruta 1A","Ruta 3","Excursión"],"boro":"Cudillero","sub":"A pie desde la plaza de la Marina (subida por escaleras)","closed":"","free":"","book":"","src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[],"refs":[]},{"id":"cud_garita","n":"Mirador de la Garita-Atalaya","cat":"mirador","typ": o, fabada, chorizo a la sidra).","refs":["https://www.asturias.es/documents/4911212/4919814/listado-sidrerias-diciembre.pdf/9bc1d9a1-6339-1f2a-d00f-11fbd5013dba"],"conf":"alta","tags":["IA","Ruta 1A","Ruta 3","Itinerario","Excursión"],"boro":"Oviedo","sub":"A pie desde la Catedral","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"ovi_piguena","n":"Sidrería El Pigüeña","gname":"El Pigüeña","cat":"comida","typ":"Sidrería","hood":"Centro","lat":43.363991,"lng":-5.844012,"addr":"Calle Gascona 2, 33001 Oviedo","cost":null,"costN":"Precio sin verificar. precio no verificado","dur":1.5,"why":"Una de las sidrerías clásicas de Gascona, en el listado oficial «Sidrerías de Asturias» de agosto de 2026.","tip":"Las raciones son grandes: con dos o tres para los dos alcanza.","refs":["https://www.asturias.es/documents/4911212/4919814/listado-sidrerias-diciembre.pdf/9bc1d9a1-6339-1f2a-d00f-11fbd5013dba"],"conf":"media","tags":["IA","Ruta 1A","Ruta 3","Excursión"],"boro":"Oviedo","sub":"A pie desde la Catedral","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"ovi_la_finca","n":"Sidrería La Finca","gname":"La Finca","cat":"comida","typ":"Sidrería","hood":"Centro","lat":43.3642,"lng":-5.8445,"addr":"Calle Gascona 4, 33001 Oviedo","aprox":true,"cost":null,"costN":"Precio sin verificar. precio no verificado","dur":1.5,"why":"Alternativa en la misma cuadra, también en el listado oficial de agosto de 2026: si una está llena, se cruza a la otra.","tip":"No pude verificar la coordenada exacta del local (está al lado del n.º 2).","refs":["https://www.asturias.es/documents/4911212/4919814/listado-sidrerias-diciembre.pdf/9bc1d9a1-6339-1f2a-d00f-11fbd5013dba"],"conf":"media","tags":["IA","Ruta 1A","Ruta 3","Excursión"],"boro":"Oviedo","sub":"A pie desde la Catedral","closed":"","free":"","book":"","main":false,"src":"propuesta","must":0,"rate":0,"season":"", a Ribeira y las bodegas. El de abajo une la Ribeira con el muelle de Gaia a nivel del agua.","tip":"Recorrido sin subidas: metro hasta Jardim do Morro (Gaia), mirador de la Serra do Pilar, cruzar el tablero de arriba hacia Porto, y al revés si se quiere terminar en Gaia: bajar al muelle en el teleférico. Arriba sopla viento y no hay bancos; vértigo: la baranda es baja respecto de la altura.","refs":["https://en.wikipedia.org/wiki/Dom_Lu%C3%ADs_I_Bridge"],"conf":"media","tags":["IA","Ruta 2","Ruta 3","Itinerario"],"boro":"Oporto","sub":"Tablero superior: metro línea D, estaciones São Bento (lado Porto) o Jardim do Morro (lado Gaia)","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"opo_clerigos","n":"Torre dos Clérigos","gname":"Torre e Igreja dos Clérigos","cat":"mirador","typ":"Mirador","hood":"Centro histórico","lat":41.14583,"lng":-8.61417,"addr":"R. de São Filipe de Nery, 4050-546 Porto, Oporto","cost":10,"costN":"Torre + Museo 10 € (precio general; no hay tarifa sénior publicada). Sólo torre 5 € en la entrada nocturna de temporada","dur":1.25,"main":true,"book":"Entrada online recomendada para no hacer cola","why":"Desde arriba se ve Oporto entero en 360°: el río, Gaia, la catedral y el mar a lo lejos. La entrada incluye la iglesia, con su planta elíptica, y el museo de la hermandad.","tip":"240 escalones, la escalera se angosta mucho al final y se sube y baja por el mismo lugar. Hay un recorrido accesible con una sala que simula la vista para quien no quiera subir. Ir temprano: a media mañana se juntan grupos.","refs":["https://www.torredosclerigos.pt/en/ticket-office/","https://www.torredosclerigos.pt/en/planning-a-visit-to-clerigos/","https://en.wikipedia.org/wiki/Cl%C3%A9rigos_Church"],"conf":"alta","tags":["IA","Ruta 2","Ruta 3","Itinerario"],"boro":"Oporto","sub":"Metro São Bento o Aliados (línea D)","closed":"","free":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"opo_bolhao","n":"Mercado do Bolhão","gname":"Mercado do Bolhão","cat":"comida","typ":"Mercado","hood":"Bolhão / Santa Catarina","lat":41.14934,"lng":-8.607123,"addr":"Rua Formosa, Porto, Oporto","cost":0,"costN":"entrada gratis","dur":1,"main":true,"closed":"domingo","why":"Dos pisos de puestos de fruta, pescado, embutidos, quesos y flores alrededor de un patio, más tiendas y restaurantes en el perímetro. Es el lugar para comprar para el Airbnb: frescos de la estación y conservas.","tip":"Cierra los domingos (y los restaurantes también). Mejor de mañana, cuando los puestos de pescado están llenos. Tiene ascensores entre pisos. Al lado: Capela das Almas y la calle Santa Catarina con el Majestic.","refs":["https://mercadobolhao.pt/","https://www.openstreetmap.org/relation/3046626"],"conf":"alta","tags":["IA","Ruta 2","Ruta 3","Itinerario"],"boro":"Oporto","sub":"Metro Bolhão (líneas A, B, C, E, F)","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"opo_gaia_cais","n":"Muelle de Vila Nova de Gaia","gname":"Cais de Gaia","cat":"barrio","typ":"Barrio / paseo","hood":"Vila Nova de Gaia","lat":41.137862,"lng":-8.615449,"addr":"Avenida de Diogo Leite, Vila Nova de Gaia, Oporto","cost":0,"costN":"gratis","dur":1,"main":true,"why":"Desde acá se tiene la mejor vista de la Ribeira de frente. Es plano, con los rabelos amarrados y los carteles de las bodegas en los techos; las bodegas que se visitan están en el muelle o en las calles de atrás.","tip":"Las bodegas del muelle (Cálem, Sandeman) no tienen cuesta; las de Taylor's y Graham's están más arriba, con subida empinada. Elegir según las piernas del día.","refs":["https://www.openstreetmap.org/way/1079535206"],"conf":"media","tags":["IA","Ruta 2","Ruta 3","Itinerario"],"boro":"Oporto","sub":"A pie por el tablero de abajo del puente Dom Luís I desde la Ribeira; o metro Jardim do Morro (línea D) + teleférico","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"opo_gaia_calem","n":"Bodega Cálem","gname":"Caves Cálem","cat":"comida","typ":"Bodega (vino)","hood":"Vila Nova de Gaia","lat":41.1378,"lng":-8.614,"addr":"Avenida de Diogo Leite 344, Vila Nova de Gaia, Oporto","aprox":true,"cost":null,"costN":"Precio sin verificar. precio no verificado (el sitio oficial no respondió)","dur":1.25,"main":true,"book":"Conviene reservar la visita con horario","why":"Es la bodega más a mano: sobre el muelle, sin subir nada, a pocos minutos del puente. La visita recorre las barricas y termina en cata de varios oportos.","tip":"Es la opción sin cuestas. Hay visitas con fado: preguntar si interesa. Comprobar idioma de la visita al reservar.","conf":"baja","tags":["IA","Ruta 2","Ruta 3","Itinerario"],"boro":"Oporto","sub":"A pie desde la Ribeira por el tablero de abajo del puente (unos 5 min)","closed":"","free":"","src":"propuesta","must":0,"rate":0,"season":"","warn":[],"refs":[]},{"id":"opo_gaia_taylors","n":"Bodega Taylor's","gname":"Taylor's Port","cat":"comida","typ":"Bodega (vino)","hood":"Vila Nova de Gaia","lat":41.13394,"lng":-8.61435,"addr":"Rua do Choupelo 250, 4400-088 Vila Nova de Gaia, Oporto","cost":null,"costN":"Precio sin verificar. precio no publicado en la página leída; la visita incluye 3 vinos (Chip Dry, LBV y Tawny 10 años)","dur":1.5,"main":true,"book":"Reserva en taylor.pt","why":"La visita es audioguiada desde el celular, también en español, con películas y objetos, y termina con tres oportos de cata: un blanco seco, un LBV y un tawny de 10 años. Tiene jardín y terraza con vista al río.","tip":"Llevar auriculares propios (la audioguía va por el teléfono con un QR). La calle de subida es empinada y empedrada: tomarla con calma o ir en taxi y bajar caminando.","refs":["https://www.taylor.pt/en/visit-taylors"],"conf":"alta","tags":["IA","Ruta 2","Ruta 3","Itinerario"],"boro":"Oporto","sub":"A pie desde el muelle de Gaia (subida empinada por Rua do Choupelo)","closed":"","free":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"opo_gaia_grahams","n":"Bodega Graham's","gname":"Graham's Port Lodge","cat":"comida","typ":"Bodega (vino)","hood":"Vila Nova de Gaia","lat":41.137432,"lng":-8.624091,"addr":"Rua do Agro 141, Vila Nova de Gaia, Oporto","cost":null,"costN":"Precio sin verificar. precio no verificado (la web carga los precios por JavaScript)","dur":1.5,"main":true,"book":"Reserva en grahams-port.com","why":"Es la de mejor vista de las grandes: desde la terraza se ve todo el frente de Oporto. Se visitan las naves de 1890 con barricas y la cata ofrece varios niveles, de oportos jóvenes a tawnies viejos.","tip":"Queda a unos 15-20 min a pie del puente con cuesta al final. Mejor ir en taxi y volver caminando cuesta abajo por el muelle.","refs":["https://www.grahams-port.com/visits-tastings","https://www.openstreetmap.org/way/349865471"],"conf":"media","tags":["IA","Ruta 2","Ruta 3","Itinerario"],"boro":"Oporto","sub":"A pie desde el muelle de Gaia hacia el oeste (subida); o taxi","closed":"","free":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"opo_caminata_douro","n":"Caminata junto al Duero hasta Foz","gname":"Marginal do Douro (Ribeira – Massarelos – Cantareira – Foz)","cat":"barrio","typ":"Barrio / paseo","hood":"Massarelos / Lordelo do Ouro / Foz","lat":41.1445,"lng":-8.642,"addr":"Rua de Monchique – Rua da Restauração – Av. Dom Carlos I, Oporto","aprox":true,"cost":0,"costN":"gratis","dur":2.5,"main":true,"why":"Es el día plano de Oporto: el río a un costado todo el camino, pasando bajo el puente da Arrábida, por el barrio pescador de la Cantareira y hasta el faro donde el Duero entra al mar. El tranvía 1 corre al lado, así que se puede cortar en cualquier parada.","tip":"Ir de este a oeste para terminar en el mar con la tarde y volver en tranvía. A mitad de camino, en Massarelos, está el Museo del Tranvía (cerrado los lunes). El tramo de la Rua de Monchique tiene vereda angosta con tráfico. Coordenada: punto medio aproximado.","refs":["https://www.stcp.pt/pt/porto-tram-city-tour"],"conf":"media","tags":["IA","Ruta 2","Ruta 3","Itinerario"],"boro":"Oporto","sub":"Inicio: Ribeira (metro São Bento). Vuelta: tranvía 1 desde Passeio Alegre","closed":"","free":"","book":"","src":"propuesta","must":0,"rate":0,"season":"","warn":[]},{"id":"opo_tranvia_1","n":"Tranvía histórico línea 1","gname":"Elétrico 1 (Infante – Passeio Alegre)","cat":"barrio","typ":"Barrio / paseo","hood":"Ribeira – Foz","lat":41.1407,"lng":-8.6152,"addr":"Paragem Infante, Rua Nova da Alfândega, Porto, Oporto","aprox":true,"cost":null,"costN":"Precio sin verificar. boleto sólo a bordo; precio no leído (la web lo carga por JavaScript). Vale también el passe mensual Andante y el Porto Card","dur":0.5,"main":true,"why":"Une la Ribeira con Foz por la orilla del río en coches de madera de principios del siglo XX. Es el regreso perfecto de la caminata: todos los días, aproximadamente cada 20 minutos según STCP.","tip":"El boleto se compra sólo arriba, al conductor: llevar efectivo por las dudas. Subirse en la terminal de Passeio Alegre para asegurar asiento; los coches son de banco de madera y escalón alto. La línea 18 sube de Massarelos al Carmo, cerca de Clérigos.","refs":["https://www.stcp.pt/pt/porto-tram-city-tour"],"conf":"alta","tags":["IA","Ruta 2","Ruta 3","Itinerario"],"boro":"Oporto","sub":"Paradas terminales: Infante (junto a la iglesia de São Francisco) y Passeio Alegre","closed":"","free":"","book":"","src":"propuesta","must":0,"rate":0,"season":"","warn":[]},{"id":"opo_foz","n":"Foz do Douro","gname":"Foz do Douro","cat":"barrio","typ":"Barrio / paseo","hood":"Foz do Douro","lat":41.15,"lng":-8.667,"addr":"Foz do Douro, Porto, Oporto","cost":0,"costN":"gratis","dur":2,"main":true,"why":"Donde el río se encuentra con el Atlántico: un paseo marítimo plano con el faro de Felgueiras y el fuerte de São João Baptista, calles de casas burguesas y cafés frente al mar. Es el Oporto tranquilo, lejos de las cuestas del centro.","tip":"La Avenida do Brasil sigue plana hacia el norte a lo largo de las playas. Con oleaje fuerte el muelle del faro se moja: no meterse hasta la punta. Para merendar, la confitería Tavi está a dos cuadras.","refs":["https://en.wikipedia.org/wiki/Foz_do_Douro"],"conf":"media","tags":["IA","Ruta 2","Ruta 3","Itinerario"],"boro":"Oporto","sub":"Tranvía 1 hasta Passeio Alegre; bus 500 desde São Bento / Ribeira","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"opo_passeio_alegre","n":"Jardim do Passeio Alegre y Farolim de Felgueiras","gname":"Jardim do Passeio Alegre","cat":"parque","typ":"Parque / jardín","hood":"Foz do Douro","lat":41.148265,"lng":-8.670228,"addr":"Rua do Passeio Alegre, Porto, Oporto","cost":0,"costN":"gratis","dur":1,"why":"Es el final de la caminata y del tranvía: palmeras, obeliscos de piedra del siglo XVIII y bancos frente a la boca del río. Siguiendo la costa se llega al Farolim de Felgueiras, el faro chico en la punta del rompeolas.","tip":"Buen lugar para sentarse antes de tomar el tranvía de vuelta, que sale de acá. Hay baños públicos en el jardín (verificar en el lugar).","refs":["https://www.openstreetmap.org/relation/8521873","https://www.openstreetmap.org/node/1675107645"],"conf":"media","tags":["IA","Ruta 2","Ruta 3","Itinerario"],"boro":"Oporto","sub":"Tranvía 1 y 18, parada Passeio Alegre","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"opo_serra_pilar","n":"Mirador de la Serra do Pilar y Jardim do Morro","gname":"Mosteiro da Serra do Pilar","cat":"mirador","typ":"Mirador","hood":"Vila Nova de Gaia","lat":41.13833,"lng":-8.6075,"addr":"Largo de Avis, Vila Nova de Gaia, Oporto","cost":0,"costN":"mirador gratis","dur":0.75,"main":true,"why":"Es la vista clásica de Oporto: la Ribeira, la catedral y el tablero superior del puente de frente, con el río abajo. El Jardim do Morro, al pie, tiene bancos y sombra.","tip":"Llegando en metro no hay que subir nada. Al atardecer se llena. De acá se baja al muelle en el teleférico o por escaleras empinadas.","refs":["https://en.wikipedia.org/wiki/Monastery_of_Serra_do_Pilar","https://www.openstreetmap.org/relation/21319956"],"conf":"media","tags":["IA","Ruta 2","Ruta 3"],"boro":"Oporto","sub":"Metro línea D, estación Jardim do Morro","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"opo_teleferico_gaia","n":"Teleférico de Gaia","gname":"Teleférico de Gaia","cat":"mirador","typ":"Barco / teleférico","hood":"Vila Nova de Gaia","lat":41.137616,"lng":-8.612911,"addr":"Cais de Gaia / Jardim do Morro, Vila Nova de Gaia, Oporto","cost":7,"costN":"un sentido 7 €; ida y vuelta 10 €","dur":0.25,"why":"Resuelve la bajada (o subida) entre el tablero superior del puente y las bodegas sin escaleras, mirando los techos de las bodegas y el río.","tip":"Usarlo de bajada después de cruzar el puente por arriba: así el día 2 es todo en bajada. Boleto válido 30 días.","refs":["https://gaiacablecar.com/pt/precos-horarios/"],"conf":"alta","tags":["IA","Ruta 2","Ruta 3"],"boro":"Oporto","sub":"Estación alta junto al metro Jardim do Morro (línea D); estación baja en el muelle de Gaia","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"opo_museu_carro_electrico","n":"Museo del Tranvía","gname":"Museu do Carro Eléctrico","cat":"museo","typ":"Museo de historia y otros","hood":"Massarelos","lat":41.1477056,"lng":-8.6328361,"addr":"Alameda Basílio Teles 51, 4150-127 Porto, Oporto","cost":4,"costN":"sénior (65+) 4 €; adulto 8 €","dur":1,"closed":"lunes","why":"Queda justo en el camino de la caminata a Foz y sirve de parada a cubierto: una nave llena de tranvías de distintas épocas de Oporto, con las máquinas de la vieja central.","tip":"Cerrado los lunes. Es todo en planta baja. Con el boleto de tranvía hay descuento.","refs":["https://www.museudocarroelectrico.pt/","https://www.museudocarroelectrico.pt/visitar/"],"conf":"alta","tags":["IA","Ruta 2","Ruta 3"],"boro":"Oporto","sub":"Tranvía 1 o 18, parada Museu do Carro Eléctrico","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"opo_sao_bento","n":"Estación de São Bento","gname":"Estação de São Bento","cat":"arq","typ":"Monumento / edificio","hood":"Centro histórico","lat":41.1455917,"lng":-8.6105722,"addr":"Praça de Almeida Garrett, Porto, Oporto","cost":0,"costN":"gratis","dur":0.33,"main":true,"why":"Los paneles de azulejo azul y blanco de Jorge Colaço cuentan escenas de la historia de Portugal y de la vida rural. Es una parada de 20 minutos camino de la Ribeira o la catedral.","tip":"Es estación en uso: mirar los paneles desde los costados del vestíbulo. Hay bancos en el andén.","refs":["https://pt.wikipedia.org/wiki/Esta%C3%A7%C3%A3o_Ferrovi%C3%A1ria_de_Porto-S%C3%A3o_Bento"],"conf":"media","tags":["IA","Ruta 2","Ruta 3"],"boro":"Oporto","sub":"Metro São Bento (línea D)","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"opo_se","n":"Catedral de Oporto","gname":"Sé do Porto","cat":"arq","typ":"Iglesia / templo","hood":"Sé","lat":41.14278,"lng":-8.61139,"addr":"Terreiro da Sé, Porto, Oporto","cost":null,"costN":"Precio sin verificar. iglesia gratis; el claustro se paga (precio no verificado)","dur":1,"main":true,"why":"Desde el atrio se ve la Ribeira y Gaia desde arriba. El claustro gótico está forrado de azulejos barrocos y desde el atrio se baja al tablero superior del puente en pocos minutos.","tip":"Combinar con el puente: Sé → tablero superior → Serra do Pilar, todo casi plano. Desde la Ribeira, en cambio, se llega por escaleras muy empinadas.","refs":["https://pt.wikipedia.org/wiki/S%C3%A9_do_Porto"],"conf":"media","tags":["IA","Ruta 2","Ruta 3"],"boro":"Oporto","sub":"Metro São Bento (línea D), 5 min de subida","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"opo_bolsa","n":"Palacio de la Bolsa","gname":"Palácio da Bolsa","cat":"arq","typ":"Palacio / castillo","hood":"Ribeira","lat":41.14139,"lng":-8.61528,"addr":"Rua Ferreira Borges, 4050-253 Porto, Oporto","cost":null,"costN":"Precio sin verificar. visita guiada obligatoria; precio no leído en la página oficial","dur":0.75,"main":true,"book":"Visita sólo guiada, 30 min; turnos en español. Comprar online o en la boletería","why":"Por dentro es un muestrario del Oporto rico del siglo XIX: el Patio de las Naciones con cúpula de vidrio y el Salón Árabe, imitación de la Alhambra en estuco dorado. La visita guiada dura media hora y hay turnos en español.","tip":"Cierra algunos días por eventos (en 2026 avisaba cierres puntuales): comprobar antes de ir. Hay escalinata de mármol. Al lado, la iglesia de São Francisco.","refs":["https://www.palaciodabolsa.com/","https://booking.visitportoandnorth.travel/pt/experiencias/palacio-da-bolsa/visita-guiada-ao-palacio-da-bolsa/"],"conf":"alta","tags":["IA","Ruta 2","Ruta 3"],"boro":"Oporto","sub":"Metro São Bento (línea D) y 10 min a pie en bajada; tranvía 1 parada Infante","closed":"","free":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"opo_sao_francisco","n":"Iglesia de San Francisco","gname":"Igreja de São Francisco","cat":"arq","typ":"Iglesia / templo","hood":"Ribeira","lat":41.141016,"lng":-8.61574,"addr":"Rua do Infante Dom Henrique, Porto, Oporto","cost":null,"costN":"Precio sin verificar. se paga entrada (precio no verificado)","dur":0.75,"main":true,"why":"Afuera es una iglesia gótica sobria; adentro, casi todo es madera tallada y dorada del siglo XVIII, incluido un Árbol de Jesé. Es de lo más impactante del barroco portugués y está a pasos de la Bolsa.","tip":"Las catacumbas tienen escaleras. Combinar con la Bolsa y tomar el tranvía 1 en Infante, que está enfrente.","refs":["https://en.wikipedia.org/wiki/Church_of_S%C3%A3o_Francisco_(Porto)"],"conf":"baja","tags":["IA","Ruta 2","Ruta 3"],"boro":"Oporto","sub":"Tranvía 1, parada Infante; metro São Bento + bajada","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"opo_lello","n":"Librería Lello","gname":"Livraria Lello","cat":"tienda","typ":"Compras","hood":"Centro histórico","lat":41.14694,"lng":-8.61472,"addr":"Rua das Carmelitas 144, Porto, Oporto","cost":null,"costN":"Precio sin verificar. entrada paga; el valor se descuenta de la compra de un libro (precio no verificado)","dur":0.5,"main":true,"book":"Entrada con hora online (tickets.livrarialello.pt)","why":"La escalera roja de curvas y el techo de vitral la hicieron famosa. La entrada funciona como voucher: lo pagado se descuenta al comprar un libro, así que si se compra algo sale gratis.","tip":"Cola larga a cualquier hora sin entrada con horario; adentro está muy lleno. A 100 m de Clérigos e Igreja do Carmo.","refs":["https://www.livrarialello.pt/"],"conf":"media","tags":["IA","Ruta 2","Ruta 3"],"boro":"Oporto","sub":"Metro São Bento o Aliados (línea D)","closed":"","free":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"opo_capela_almas","n":"Capilla de las Almas","gname":"Capela das Almas","cat":"arq","typ":"Iglesia / templo","hood":"Santa Catarina","lat":41.149833,"lng":-8.605548,"addr":"Rua de Santa Catarina 428, Porto, Oporto","cost":0,"costN":"gratis (se ve desde la calle)","dur":0.25,"main":true,"why":"Toda la fachada lateral es un mural de azulejo azul con la vida de San Francisco y Santa Catarina: se ve desde la vereda en cinco minutos. Está a una cuadra del Bolhão.","tip":"Combinar con el Bolhão y bajar por la peatonal Santa Catarina hasta el Majestic, en bajada.","refs":["https://www.openstreetmap.org/way/365610859"],"conf":"media","tags":["IA","Ruta 2","Ruta 3"],"boro":"Oporto","sub":"Metro Bolhão (líneas A, B, C, E, F)","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"opo_carmo","n":"Iglesia del Carmo","gname":"Igreja do Carmo","cat":"arq","typ":"Iglesia / templo","hood":"Centro histórico","lat":41.1475,"lng":-8.61611,"addr":"Rua do Carmo, Porto, Oporto","cost":0,"costN":"el panel se ve gratis desde la calle","dur":0.25,"main":true,"why":"El costado está cubierto por un enorme mural de azulejos azules; al lado, la iglesia de las Carmelitas, separada por una casa de un metro de ancho. A dos minutos de Clérigos y Lello.","tip":"Frente a la plaza de Gomes Teixeira; la Leitaria da Quinta do Paço está a la vuelta para un éclair.","refs":["https://pt.wikipedia.org/wiki/Igreja_do_Carmo_(Porto)","https://www.openstreetmap.org/way/697432093"],"conf":"media","tags":["IA","Ruta 2","Ruta 3"],"boro":"Oporto","sub":"Metro Aliados o São Bento (línea D); tranvía 18 parada Carmo","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"opo_palacio_cristal","n":"Jardines del Palacio de Cristal","gname":"Jardins do Palácio de Cristal","cat":"parque","typ":"Parque / jardín","hood":"Massarelos","lat":41.1472,"lng":-8.62667,"addr":"Rua de Dom Manuel II, Porto, Oporto","cost":0,"costN":"gratis","dur":1.25,"main":true,"why":"Paseos de árboles, pavos reales sueltos y terrazas con vista al Duero y al puente da Arrábida. Es el mejor lugar del centro para caminar a la sombra y sentarse.","tip":"Los senderos hacia los miradores del río bajan bastante: hay que volver a subir. Muchos bancos.","refs":["https://pt.wikipedia.org/wiki/Jardins_do_Pal%C3%A1cio_de_Cristal"],"conf":"media","tags":["IA","Ruta 2","Ruta 3"],"boro":"Oporto","sub":"Tranvía 18 o bus; 10 min a pie desde Carmo","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"opo_cafe_santiago","n":"Café Santiago","gname":"Café Santiago","cat":"comida","typ":"Restaurante","hood":"Baixa / Batalha","lat":41.14575,"lng":-8.6045,"addr":"Rua Passos Manuel 226, 4000-382 Porto, Oporto","aprox":true,"cost":null,"costN":"Precio sin verificar. precio no verificado","dur":1,"main":true,"closed":"domingo","why":"La francesinha (pan, fiambres, carne, queso gratinado y salsa picante de cerveza) es el plato de Oporto, y esta es una de sus referencias desde hace décadas. Cocina casera, ambiente de café de barrio.","tip":"Una francesinha es muy pesada: compartir una entre dos con ensalada. Cierra los domingos. Se hace cola al mediodía; tiene dos locales más a metros (Santiago F, en Passos Manuel 198, y Santiago da Praça, en Praça dos Poveiros 88).","refs":["https://cafesantiago.pt/"],"conf":"alta","tags":["IA","Ruta 2","Ruta 3"],"boro":"Oporto","sub":"Metro Bolhão o Aliados; a pasos de la Praça da Batalha","free":"","book":"","src":"propuesta","must":0,"rate":0,"season":"","warn":[]},{"id":"opo_casa_guedes","n":"Casa Guedes","gname":"Casa Guedes Tradicional","cat":"comida","typ":"Restaurante","hood":"Baixa / Poveiros","lat":41.145999,"lng":-8.603457,"addr":"Praça dos Poveiros 130, 4000-393 Porto, Oporto","cost":null,"costN":"Precio sin verificar. precio no verificado","dur":0.75,"main":true,"why":"El sándwich de pernil de cerdo asado, con queso de la Serra derretido si se pide, es la comida rápida de Oporto. Comida barata y sabrosa a 5 minutos del Bolhão.","tip":"No toman reservas: orden de llegada. Abre todos los días. Tiene sucursal en el muelle de Gaia (Avenida de Diogo Leite 56) para el día de las bodegas.","refs":["https://casaguedes.pt/espacos/","https://casaguedes.pt/sobre-nos/"],"conf":"alta","tags":["IA","Ruta 2","Ruta 3"],"boro":"Oporto","sub":"Metro Bolhão; Praça dos Poveiros","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"opo_dona_gina","n":"Café da D. Gina (en el Bolhão)","gname":"Café da D. Gina","cat":"comida","typ":"Restaurante","hood":"Bolhão","lat":41.14934,"lng":-8.607123,"addr":"Mercado do Bolhão (puesto R02), Rua Formosa, Porto, Oporto","cost":null,"costN":"Precio sin verificar. precio no verificado","dur":1,"closed":"domingo","why":"Comida casera portuguesa a la hora del almuerzo, en un puesto histórico del mercado que lleva más de 30 años: lo que comen los que trabajan ahí. Encaja con la mañana de compras en el Bolhão.","tip":"Sólo almuerzo, de lunes a sábado (horario de invierno según el mercado). Se reserva por teléfono.","refs":["https://mercadobolhao.pt/restaurantes/17-cafe-da-d-gina/"],"conf":"alta","tags":["IA","Ruta 2","Ruta 3"],"boro":"Oporto","sub":"Metro Bolhão","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"opo_majestic","n":"Café Majestic","gname":"Majestic Café","cat":"comida","typ":"Café / pastelería","hood":"Santa Catarina","lat":41.147168,"lng":-8.60664,"addr":"Rua de Santa Catarina 112, 4000-442 Porto, Oporto","cost":null,"costN":"Precio sin verificar. más caro que un café común; precio no verificado","dur":0.75,"main":true,"closed":"domingo","why":"Espejos, maderas, techos de yeso y sillones de cuero: es el café histórico de Oporto, abierto desde el 2 de diciembre de 1922. Vale más por el lugar que por la carta.","tip":"Abre de lunes a sábado. Para evitar cola, ir a primera hora o a media tarde, y pedir algo simple: un galão y una tostada.","refs":["https://www.cafemajestic.com/pt/Utilidades/Homepage.aspx","https://www.cafemajestic.com/pt/Majestic-Cafe/Historia.aspx"],"conf":"alta","tags":["IA","Ruta 2","Ruta 3"],"boro":"Oporto","sub":"Metro Bolhão (líneas A, B, C, E, F)","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"opo_guarany","n":"Café Guarany","gname":"Café Guarany","cat":"comida","typ":"Café / pastelería","hood":"Aliados","lat":41.1468,"lng":-8.6112,"addr":"Avenida dos Aliados 85/89, 4000-066 Porto, Oporto","aprox":tru ":0,"rate":0,"season":"","warn":[]},{"id":"lis_praca_comercio","n":"Praça do Comércio y Arco de la Rua Augusta","gname":"Praça do Comércio / Arco da Rua Augusta","cat":"arq","typ":"Monumento / edificio","hood":"Baixa","lat":38.7075,"lng":-9.136389,"addr":"Praça do Comércio, 1100-148 Lisboa","cost":0,"costN":"La plaza es gratis; subir a la terraza del arco se paga (precio no verificado)","dur":1,"main":true,"why":"Fue la puerta de entrada a Lisboa por el río: el palacio real estaba acá hasta que el terremoto de 1755 lo destruyó. Desde el Cais das Colunas, al pie de la plaza, se ve el Tajo y el puente 25 de Abril.","tip":"La terraza del arco se sube en ascensor y un tramo final de escalera de caracol: preguntar antes si les pesa. Al atardecer el Cais das Colunas tiene escalones donde sentarse.","refs":["https://www.wikidata.org/wiki/Q999002","https://www.wikidata.org/wiki/Q637590"],"conf":"media","tags":["IA","Ruta 2","Ruta 3"],"boro":"Lisboa","sub":"Metro Terreiro do Paço (azul); tranvía 15E","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"lis_chiado","n":"Chiado","gname":"Chiado","cat":"barrio","typ":"Barrio / paseo","hood":"Chiado","lat":38.710556,"lng":-9.142222,"addr":"Largo do Chiado / Rua Garrett, 1200 Lisboa","cost":0,"costN":"Gratis","dur":2,"main":true,"why":"Es el barrio de Fernando Pessoa: su estatua está sentada en la vereda de A Brasileira. Ahí están la Livraria Bertrand (de 1732, considerada la librería en funcionamiento más antigua del mundo), el Teatro São Carlos y las ruinas del Convento do Carmo.","tip":"Desde la Baixa se sube por escaleras y cuestas: mejor salir por la estación de metro Baixa-Chiado, cuya salida a Chiado tiene escaleras mecánicas largas, y bajar caminando.","refs":["https://www.wikidata.org/wiki/Q601430"],"conf":"media","tags":["IA","Ruta 2","Ruta 3","Itinerario"],"boro":"Lisboa","sub":"Metro Baixa-Chiado (azul/verde)","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"lis_alfama","n":"Alfama","gname":"Alfama","cat":"barrio","typ":"Barrio / paseo","hood":"Alfama","lat":38.71222,"lng":-9.13,"addr":"Alfama, 1100 Lisboa","cost":0,"costN":"Gratis","dur":3,"main":true,"why":"Sobrevivió casi entero al terremoto de 1755, así que conserva el trazado medieval de origen árabe: becos, ropa tendida, azulejos y casas de fado. Es la cuna del fado; el Museu do Fado está al pie del barrio.","tip":"El día con más cuestas del viaje (lo dice el propio itinerario). Truco: subir en el tranvía 28 o el bus 737 hasta arriba (Portas do Sol / Castelo) y bajar caminando hacia el río. Calzado con suela que agarre: el empedrado (calçada) resbala, sobre todo mojado.","conf":"media","tags":["IA","Ruta 2","Ruta 3","Itinerario"],"boro":"Lisboa","sub":"Tranvía 28 (paradas Sé o Largo das Portas do Sol); bus 737","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[],"refs":[]},{"id":"lis_castelo","n":"Castillo de San Jorge","gname":"Castelo de São Jorge","cat":"arq","typ":"Palacio / castillo","hood":"Alfama / Castelo","lat":38.71389,"lng":-9.13333,"addr":"Rua de Santa Cruz do Castelo, 1100-129 Lisboa","cost":14,"costN":"Adulto 17 €; mayores de 65: 14 € (con documento)","dur":2,"main":true,"why":"Desde las murallas se ve toda la ciudad: la Baixa a los pies, el Tajo y el puente. Los jardines interiores tienen sombra de olivos y alcornoques y pavos reales sueltos; se recorren las almenas de la ciudadela.","tip":"Llegar en bus 737 ahorra la subida más dura. Las almenas tienen escalones altos y sin baranda en partes: no hace falta subirlas todas, la vista desde la explanada ya vale. El museo interno está cerrado temporalmente por obras (2026). Cierra solo 1/1, 1/5, 24, 25 y 31/12.","refs":["https://castelodesaojorge.pt/en/plan-your-visit/choose-your-ticket/","https://castelodesaojorge.pt/en/plan-your-visit/schedules/"],"conf":"alta","tags":["IA","Ruta 2","Ruta 3","Itinerario"],"boro":"Lisboa","sub":"Bus 737 hasta la puerta; tranvía 28 (Largo das Portas do Sol, y subir a pie)","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"lis_se","n":"Catedral de Lisboa (Sé)","gname":"Sé de Lisboa","cat":"arq","typ":"Iglesia / templo","hood":"Alfama","lat":38.709722,"lng":-9.133056,"addr":"Largo da Sé, 1100-585 Lisboa","cost":null,"costN":"Precio sin verificar. Precio no verificado (la nave y el claustro/tesoro tienen entrada aparte)","dur":0.75,"main":true,"why":"Es la iglesia más antigua de Lisboa, levantada tras la reconquista de 1147 sobre una antigua mezquita. Queda en el camino natural de subida a Alfama, así que se ve de pasada.","tip":"La foto clásica es con el tranvía 28 pasando por delante. Está en cuesta: es buena parada para descansar a la sombra en la subida.","conf":"baja","tags":["IA","Ruta 2","Ruta 3"],"boro":"Lisboa","sub":"Tranvía 28 (parada Sé)","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[],"refs":[]},{"id":"lis_mir_santa_luzia","n":"Mirador de Santa Luzia","gname":"Miradouro de Santa Luzia","cat":"mirador","typ":"Mirador","hood":"Alfama","lat":38.711689,"lng":-9.130209,"addr":"Largo de Santa Luzia, 1100-487 Lisboa","cost":0,"costN":"Gratis","dur":0.5,"main":true,"why":"Los paneles de azulejo de la pared muestran la Praça do Comércio antes del terremoto y la toma de Lisboa a los moros. A cincuenta metros está el de Portas do Sol, con la vista más abierta sobre Alfama.","tip":"Tiene bancos bajo la pérgola de buganvillas. Está en el recorrido del 28: se puede llegar sin subir a pie. Mucha gente al atardecer.","refs":["https://www.wikidata.org/wiki/Q6837314"],"conf":"media","tags":["IA","Ruta 2","Ruta 3","Itinerario"],"boro":"Lisboa","sub":"Tranvía 28 o bus 737 (Largo das Portas do Sol)","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"lis_  a Alfama: desde acá se ve el castillo y Graça del otro lado del valle de la Baixa, con un mapa de azulejo que identifica cada cosa. Jardín con bancos y quiosco.","tip":"Subir en el Elevador da Glória (funicular de 1885) desde Restauradores evita una cuesta muy empinada; bajar a pie por la Calçada da Glória, que es corta.","refs":["https://www.wikidata.org/wiki/Q6672039"],"conf":"media","tags":["IA","Ruta 2","Ruta 3"],"boro":"Lisboa","sub":"Elevador (funicular) da Glória desde Restauradores (metro azul)","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"lis_carmo","n":"Convento do Carmo","gname":"Convento do Carmo / Museu Arqueológico do Carmo","cat":"arq","typ":"Monumento / edificio","hood":"Chiado","lat":38.712222,"lng":-9.14,"addr":"Largo do Carmo, 1200-092 Lisboa","cost":null,"costN":"Precio sin verificar. Precio no verificado","dur":0.75,"main":true,"why":"Los arcos góticos abiertos al cielo son el recuerdo más visible del terremoto. En el ábside funciona un pequeño museo arqueológico. El Largo do Carmo, delante, es una plaza tranquila con árboles y una fuente.","tip":"Desde la Baixa se llega sin subir a pie por la pasarela del Elevador de Santa Justa (que suele tener cola larga) o por la salida de Chiado del metro.","refs":["https://www.wikidata.org/wiki/Q1470414"],"conf":"baja","tags":["IA","Ruta 2","Ruta 3"],"boro":"Lisboa","sub":"Metro Baixa-Chiado; o Elevador de Santa Justa desde la Baixa","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"lis_belem_jeronimos","n":"Monasterio de los Jerónimos","gname":"Mosteiro dos Jerónimos","cat":"arq","typ":"Iglesia / templo","hood":"Belém","lat":38.697778,"lng":-9.206111,"addr":"Praça do Império, 1400-206 Lisboa","cost":18,"costN":"Claustro 18 € (tarifa normal oficial); la iglesia se visita sin pagar. Descuento para mayores no verificado","dur":1.5,"main":true,"why":"El claustro de dos pisos, todo tallado con cuerdas, conchas y motivos marinos, es la obra cumbre del estilo manuelino. En la iglesia están las tumbas de Vasco da Gama y de Camões.","tip":"La cola del claustro es larga: comprar la entrada online antes. La iglesia tiene fila aparte y es gratis. Entre los Jerónimos y la Torre son ~1,5 km planos por jardines junto al río.","refs":["https://www.museusemonumentos.pt/pt/pagina/bilhetes"],"conf":"media","tags":["IA","Ruta 2","Ruta 3","Itinerario"],"boro":"Lisboa","sub":"Tranvía 15E desde Praça da Figueira / Praça do Comércio; o tren de Cascais desde Cais do Sodré hasta Belém","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"lis_belem_torre","n":"Torre de Belém","gname":"Torre de Belém","cat":"arq","typ":"Monumento / edificio","hood":"Belém","lat":38.691667,"lng":-9.216111,"addr":"Av. Brasília, 1400-038 Lisboa","cost":15,"costN":"Normal 15 €; terceros dicen 7,50 € para mayores (no leído en la fuente oficial)","dur":1,"main":true,"closed":"Lunes (y 1/1, Domingo de Pascua, 1/5, 13/6, 25/12)","why":"Fue la puerta de salida y llegada de las naves a Oriente: se construyó para defender la entrada del río. Su decoración manuelina incluye un rinoceronte de piedra, el primero que se vio en Europa.","tip":"Por dentro es una escalera de caracol angosta y empinada, de un solo sentido por tramos: con rodillas delicadas, verla por fuera desde el jardín ya vale. Según terceros reabrió en mayo de 2026 tras una restauración, con entrada por horario.","refs":["https://www.museusemonumentos.pt/pt/museus-e-monumentos/torre-de-belem","https://www.lisbontourism.org/belem-tower/"],"conf":"alta","tags":["IA","Ruta 2","Ruta 3","Itinerario"],"boro":"Lisboa","sub":"Tranvía 15E (parada Largo da Princesa) o tren de Cascais (estación Belém) + 15 min a pie","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"lis_belem_padrao","n":"Monumento a los Descubrimientos","gname":"Padrão dos Descobrimentos","cat":"mirador","typ":"Mirador","hood":"Belém","lat":38.693676,"lng":-9.20569,"addr":"Av. Brasília, 1400-038 Lisboa","cost":null,"costN":"Precio sin verificar. Ver el monumento es gratis; el mirador de arriba se paga (precio no verificado)","dur":0.75,"main":true,"why":"Delante, en el piso, hay una gran rosa de los vientos con un mapamundi de mármol que marca las rutas y fechas de los viajes portugueses. Arriba hay mirador con ascensor sobre el Tajo, los Jerónimos y la Torre.","tip":"El mapamundi del piso se ve gratis y es lo mejor. Entre los Jerónimos y el río hay que cruzar las vías y la avenida por un paso subterráneo con escaleras.","refs":["https://www.wikidata.org/wiki/Q1133712"],"conf":"baja","tags":["IA","Ruta 2","Ruta 3"],"boro":"Lisboa","sub":"Tranvía 15E (parada Mosteiro dos Jerónimos) y cruzar por el paso subterráneo","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"lis_gulbenkian","n":"Museo Calouste Gulbenkian","gname":"Museu Calouste Gulbenkian","cat":"museo","typ":"Museo de arte","hood":"Avenidas Novas","lat":38.736667,"lng":-9.154167,"addr":"Av. de Berna 45A, 1067-001 Lisboa","cost":null,"costN":"Precio sin verificar. Precio no verificado; la Fundación da 20% de descuento a mayores de 65 con su Cartão Gulbenkian","dur":2.5,"main":true,"closed":"Martes","why":"Es una colección de tamaño manejable (se ve en dos horas sin agotarse) con piezas de primer nivel: arte egipcio, alfombras persas, pintura europea y la sala de joyas art nouveau de René Lalique. Reabrió en 2026 después de un año y medio de obras.","tip":"El jardín de la Fundación, con estanques y bancos, es gratis y vale por sí solo para descansar. Es plano y fuera del circuito turístico: buen plan para un día de lluvia o de piernas cansadas.","refs":["https://gulbenkian.pt/museu/reabertura-do-museu-calouste-gulbenkian/"],"conf":"media","tags":["IA","Ruta 2","Ruta 3"],"boro":"Lisboa","sub":"Metro São Sebastião o Praça de Espanha (azul)","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"lis_belem_pasteis","n":"Pastéis de Belém","gname":"Antiga Confeitaria de Belém (Pastéis de Belém)","cat":"comida","typ":"Café / pastelería","hood":"Belém","lat":38.697509,"lng":-9.203228,"addr":"Rua de Belém 84-92, 1300-085 Lisboa","cost":4,"costN":"Un pastel ~1,40 € (reportaje de mayo 2026); con café, 3-5 € por persona","dur":0.75,"main":true,"why":"Es el lugar que nombra el itinerario: la receta salió del monasterio de al lado y se hace a mano cada día desde 1837. Los pastéis salen tibios y se comen con canela y azúcar impalpable.","tip":"La cola de la calle es para llevar. Para sentarse, entrar directo: hay varias salas grandes hacia el fondo y se toma la primera mesa que se libere. Abre todos los días. Temprano a la mañana hay menos gente.","refs":["https://www.pasteisdebelem.pt/en/","https://www.wikidata.org/wiki/Q3091352"],"conf":"alta","tags":["IA","Ruta 2","Ruta 3","Itinerario"],"boro":"Lisboa","sub":"Tranvía 15E (parada Mosteiro dos Jerónimos)","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"lis_brasileira","n":"Café A Brasileira","gname":"A Brasileira","cat":"comida","typ":"Café / pastelería","hood":"Chiado","lat":38.710692,"lng":-9.142047,"addr":"Rua Garrett 120, 1200-205 Lisboa","cost":3,"costN":"Café en la barra ~1-2 €; en mesa y terraza es más caro (precios no verificados)","dur":0.5,"main":true,"why":"Fue el café de los escritores y artistas de principios del siglo XX; el interior conserva los espejos, la madera tallada y la barra larga. Pedir una 'bica' (el expreso lisboeta) en la barra es la experiencia original.","tip":"La terraza es cara y la foto con la estatua de Pessoa tiene cola; adentro, en la barra, se toma un café rápido a precio normal.","refs":["https://www.wikidata.org/wiki/Q2547006"],"conf":"baja","tags":["IA","Ruta 2","Ruta 3"],"boro":"Lisboa","sub":"Metro Baixa-Chiado (azul/verde)","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"lis_confeitaria_nacional","n":"Confeitaria Nacional","gname":"Confeitaria Nacional","cat":"comida","typ":"Café / pastelería","hood":"Baixa","lat":38.7128,"lng":-9.1377,"addr":"Praça da Figueira 18B, 1100-241 Lisboa","aprox":true,"cost":4,"costN":"Pastel + café 3-5 € (estimado, no verificado)","dur":0.5,"why":"Abrió en 1829 y fue proveedora de la casa real desde 1873; dice haber introducido el Bolo Rei en Portugal en 1875. El salón con vitrinas de madera y espejos es de época.","tip":"Queda en plena Baixa plana: buena pausa del primer día. Además del pastel de nata, probar el bolo rei (en temporada navideña) o un 'pão de ló'.","refs":["https://www.confeitarianacional.com/"],"conf":"media","tags":["IA","Ruta 2","Ruta 3"],"boro":"Lisboa","sub":"Metro Rossio (verde); tranvía 15E (Praça da Figueira)","closed":"","free":"","book":"","main":false,"src":"propuesta","must":0,"rate":0,"season":"","warn":[]},{"id":"lis_trindade","n":"Cervejaria Trindade","gname":"Cervejaria Trindade","cat":"comida","typ":"Restaurante","hood":"Chiado / Bairro Alto","lat":38.712499,"lng":-9.142592,"addr":"Rua Nova da Trindade 20, 1200-303 Lisboa","cost":30,"costN":"Rango 20-50 € por persona (Turismo de Lisboa)","dur":1.5,"main":true,"why":"Se come en salas que fueron parte de uno de los primeros conventos de Lisboa, con paneles de azulejo del siglo XIX. Cocina portuguesa de cervecería: mariscos, bife à Trindade, bacalao.","tip":"Abre todos los días y hasta tarde. Para un gusto 'razonable': un bife o un bacalao y cerveza, sin entrar en mariscos al peso.","refs":["https://www.visitlisboa.com/pt-pt/locais/cervejaria-trindade","https://www.wikidata.org/wiki/Q1056404"],"conf":"alta","tags":["IA","Ruta 2","Ruta 3"],"boro":"Lisboa","sub":"Metro Baixa-Chiado (azul/verde)","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"lis_casa_alentejo","n":"Casa do Alentejo","gname":"Casa do Alentejo","cat":"comida","typ":"Restaurante","hood":"Baixa / Restauradores","lat":38.71588,"lng":-9.13986,"addr":"Rua das Portas de Santo Antão 58, 1150-268 Lisboa","cost":20,"costN":"Plato principal 12-20 € (estimado, no verificado)","dur":1.5,"why":"Detrás de una puerta anónima hay un patio morisco y una escalera de azulejos del antiguo Palácio Alverca; es la casa regional de los alentejanos en Lisboa. Platos del Alentejo: migas, carne de porco à alentejana, quesos.","tip":"Aunque no coman, vale entrar a ver el patio y la escalera. La taberna de abajo es más barata (petiscos y platos del día). La calle Portas de Santo Antão está llena de captadores de restaurantes: no hacerles caso.","refs":["https://www.timeout.pt/lisboa/pt/restaurantes/casa-do-alentejo","https://www.wikidata.org/wiki/Q10343917"],"conf":"media","tags":["IA","Ruta 2","Ruta 3"],"boro":"Lisboa","sub":"Metro Restauradores (azul) o Rossio (verde)","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"lis_velho_eurico","n":"O Velho Eurico","gname":"O Velho Eurico","cat":"comida","typ":"Restaurante","hood":"Mouraria","lat":38.713,"lng":-9.1355,"addr":"Largo de São Cristóvão 3-4, 1100-513 Lisboa","aprox":true,"cost":20,"costN":"~20 € por persona según Time Out (crítica de 2020; platos 7,50-9,50 € entonces)","dur":1.5,"why":"Una tasca antigua renovada por cocineros jóvenes que mantuvieron la cocina de siempre: bacalhau à Brás (el plato de la casa), choco con tinta, iscas de cebolada, arroz doce de postre. Queda a mitad de la bajada del castillo.","tip":"Es chica y se llena: ir temprano o reservar por su Instagram. Según Time Out cierra domingo y lunes (dato de 2020-2024: confirmarlo).","refs":["https://www.timeout.pt/lisboa/pt/restaurantes/o-velho-eurico"],"conf":"media","tags":["IA","Ruta 2","Ruta 3"],"boro":"Lisboa","sub":"Tranvía 28 o bus 737 (Largo Rodrigues de Freitas / Castelo)","closed":"","free":"","book":"","main":false,"src":"propuesta","must":0,"rate":0,"season":"","warn":[]},{"id":"lis_ramiro","n":"Cervejaria Ramiro","gname":"Cervejaria Ramiro","cat":"comida","typ":"Restaurante","hood":"Intendente","lat":38.7206,"lng":-9.1357,"addr":"Av. Almirante Reis 1H, 1150-007 Lisboa","aprox":true,"cost":40,"costN":"Mariscos al peso: 30-50 € por persona si se elige con cuidado (estimado)","dur":1.5,"main":true,"why":"Es la experiencia lisboeta de mariscos sin ceremonia: gambas al ajillo, almejas à Bulhão Pato, percebes, y al final un prego (sándwich de lomo) como 'postre'. Ambiente ruidoso de cervecería, no de restaurante elegante.","tip":"Es el 'gusto' del viaje, no el de todos los días: pedir por unidad o por 100-200 g, no 'un kilo'. No toma reservas comunes: hay cola, conviene ir temprano al mediodía. Según Time Out cierra los lunes (dato viejo, confirmarlo).","refs":["https://www.timeout.pt/lisboa/pt/restaurantes/cervejaria-ramiro"],"conf":"media","tags":["IA","Ruta 2","Ruta 3"],"boro":"Lisboa","sub":"Metro Intendente (verde)","closed":"","free":"","book":"","src":"propuesta","must":0,"rate":0,"season":"","warn":[]},{"id":"lis_timeout_market","n":"Mercado da Ribeira (Time Out Market)","gname":"Time Out Market Lisboa","cat":"comida","typ":"Mercado","hood":"Cais do Sodré","lat":38.707089,"lng":-9.145718,"addr":"Av. 24 de Julho, 1200-479 Lisboa","cost":15,"costN":"Plato 10-18 € en los puestos (estimado)","dur":1,"main":true,"why":"Es la forma de probar varias cocinas de Lisboa en una comida, sentados en mesas largas, sin reservar. Está pegado a la estación del tren a Cascais y Belém: buen almuerzo de paso.","tip":"Abre todos los días. Al mediodía del fin de semana es difícil encontrar mesa: ir antes de las 12:30. La parte de mercado tradicional (frutas, pescado) funciona temprano a la mañana y sirve para hacer las compras del Airbnb.","refs":["https://www.timeout.pt/time-out-market-lisboa/pt","https://www.wikidata.org/wiki/Q1517035"],"conf":"alta","tags":["IA","Ruta 2","Ruta 3"],"boro":"Lisboa","sub":"Metro y tren Cais do Sodré (verde; línea de Cascais)","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"sin_centro","n":"Sintra (centro histórico)","gname":"Sintra - Vila","cat":"barrio","typ":"Pueblo para caminar","hood":"Sintra Vila","lat":38.79916667,"lng":-9.38833333,"addr":"Largo Rainha Dona Amélia, 2710 Sintra","cost":0,"costN":"Gratis pasear; el tren se paga con la tarjeta de transporte","dur":6,"main":true,"why":"Es la excursión clásica desde Lisboa: en un día se combinan el pueblo, el Palacio Nacional y uno de los palacios de la sierra (Pena o Regaleira). Con microclima húmedo y verde, se siente distinto a Lisboa.","tip":"No intentar todo: elegir un palacio de la sierra y el centro. Salir temprano de Rossio. A Pena se sube en el bus 434 (Scotturb) desde la estación: subir a pie es una cuesta larga y empinada. Llevar abrigo: suele estar más fresco y con niebla que Lisboa.","refs":["https://www.parquesdesintra.pt/en/parks-monuments/park-and-national-palace-of-pena/","https://www.parquesdesintra.pt/en/parks-monuments/national-palace-of-sintra/"],"conf":"media","tags":["IA","Ruta 2","Ruta 3","Itinerario","Excursión"],"boro":"Sintra","sub":"Tren CP línea de Sintra desde Rossio hasta Sintra (~40 min) y 10-15 min a pie","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"sin_palacio_nacional","n":"Palacio Nacional de Sintra","gname":"Palácio Nacional de Sintra","cat":"arq","typ":"Palacio / castillo","hood":"Sintra Vila","lat":38.797778,"lng":-9.390833,"addr":"Largo Rainha Dona Amélia, 2710-616 Sintra","cost":10,"costN":"Visita esencial: adulto 13 €, mayores de 65 10 €; jardines gratis","dur":1.5,"main":true,"why":"Es el palacio real mejor conservado de Portugal, usado por la corte durante casi ocho siglos. Tiene la mayor colección de azulejos mudéjares del país y salas como la de las Urracas o la de los Cisnes, con techos pintados.","tip":"Es el más accesible de Sintra: está en el pueblo, sin bus de montaña. Buena opción si no quieren la subida a Pena. La boletería cierra de 12 a 13 pero hay máquinas automáticas.","refs":["https://www.parquesdesintra.pt/en/parks-monuments/national-palace-of-sintra/","https://www.wikidata.org/wiki/Q532399"],"conf":"alta","tags":["IA","Ruta 2","Ruta 3","Excursión"],"boro":"Sintra","sub":"Desde la estación de Sintra: 10-15 min a pie, o bus 434/435","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"sin_pena","n":"Palacio da Pena","gname":"Parque e Palácio Nacional da Pena","cat":"arq","typ":"Palacio / castillo","hood":"Serra de Sintra","lat":38.787778,"lng":-9.390556,"addr":"Estrada da Pena, 2710-609 Sintra","cost":18,"costN":"Visita esencial: adulto 20 €, mayores de 65 18 €. Solo parque: 12 €/10 €. Visita completa: 45 €/35 €","dur":3,"main":true,"book":"Entrada al palacio con fecha y hora fijas: comprar online antes","why":"Es la imagen de Sintra: torres amarillas y rojas, mezcla de estilos manuelino, morisco y gótico, encima de un bosque. Desde las terrazas se ve hasta el Atlántico y, con día claro, Lisboa.","tip":"Comprar el horario con anticipación y llegar con margen: si se pierde el turno, no se entra. Desde la entrada del parque al palacio hay una cuesta fuerte: tomar la lanzadera del parque (Pena Shuttle). Con niebla la vista desaparece: mirar el pronóstico.","season":"La niebla de la sierra es frecuente en cualquier época; tapa la vista desde las terrazas.","refs":["https://www.parquesdesintra.pt/en/parks-monuments/park-and-national-palace-of-pena/","https://www.wikidata.org/wiki/Q213369"],"conf":"alta","tags":["IA","Ruta 2","Ruta 3","Excursión"],"boro":"Sintra","sub":"Bus 434 (Scotturb) desde la estación de Sintra; dentro del parque, lanzadera 'Pena Shuttle' cada 15 min","closed":"","free":"","src":"propuesta","aprox":false,"must":0,"rate":0,"warn":[]},{"id":"sin_regaleira","n":"Quinta da Regaleira","gname":"Quinta da Regaleira","cat":"parque","typ":"Parque / jardín","hood":"Sintra Vila","lat":38.796353,"lng":-9.396031,"addr":"Rua Barbosa du Bocage 5, 2710-567 Sintra","cost":null,"costN":"Precio sin verificar. Precio no verificado (su sitio no se pudo leer)","dur":2,"main":true,"why":"Su 'Pozo Iniciático' es una torre invertida de 27 m con escalera en espiral que baja hacia la tierra, y termina en túneles que salen a un lago. Es un jardín para recorrer, más que un palacio para mirar.","tip":"Queda a pie del pueblo, sin bus de montaña: alternativa a Pena. El pozo son muchos escalones de piedra, a veces húmedos; los túneles son oscuros y con piso irregular. Se puede disfrutar el jardín sin bajar al pozo.","refs":["https://www.wikidata.org/wiki/Q2630165"],"conf":"baja","tags":["IA","Ruta 2","Ruta 3","Excursión"],"boro":"Sintra","sub":"10 min a pie desde el centro histórico de Sintra; bus 435","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"sin_mouros","n":"Castillo de los Moros","gname":"Castelo dos Mouros","cat":"mirador","typ":"Mirador","hood":"Serra de Sintra","lat":38.792542,"lng":-9.389597,"addr":"Estrada da Pena, 2710-609 Sintra","cost":null,"costN":"Precio sin verificar. Precio no verificado","dur":1.5,"main":true,"why":"Caminar por la muralla da la vista más amplia de la zona: Pena en la cima vecina, el pueblo abajo y el mar. Es el complemento natural de Pena, porque comparten la parada del bus.","tip":"Es la visita más exigente de Sintra: muchos escalones de piedra desparejos y tramos expuestos al viento, sin sombra. Solo si las piernas están frescas; si no, alcanza con Pena.","refs":["https://www.wikidata.org/wiki/Q1049008"],"conf":"baja","tags":["IA","Ruta 2","Ruta 3","Excursión"],"boro":"Sintra","sub":"Bus 434 (Scotturb) desde la estación de Sintra","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"sin_piriquita","n":"Casa Piriquita","gname":"Piriquita","cat":"comida","typ":"Café / pastelería","hood":"Sintra Vila","lat":38.7975,"lng":-9.3895,"addr":"Rua das Padarias 1-5, 2710-603 Sintra","aprox":true,"cost":4,"costN":"Travesseiro + café 3-5 € (estimado)","dur":0.5,"main":true,"why":"El travesseiro (hojaldre relleno de crema de almendra y huevo) se inventó acá, y las queijadas son el dulce histórico de Sintra. Es la pausa clásica entre palacio y palacio.","tip":"Suele haber cola: pedir para llevar es más rápido. Queda en una calle en subida corta desde la plaza del Palacio Nacional.","refs":["https://www.wikidata.org/wiki/Q132158143"],"conf":"baja","tags":["IA","Ruta 2","Ruta 3","Excursión"],"boro":"Sintra","sub":"5 min a pie del Palacio Nacional","closed":"","free":"","book":"","src":"propuesta","must":0,"rate":0,"season":"","warn":[]},{"id":"cas_paredao","n":"Paseo marítimo Cascais–Estoril","gname":"Paredão Cascais–Estoril","cat":"parque","typ":"Paseo / costa","hood":"Cascais / Estoril","lat":38.70264,"lng":-9.40016,"addr":"Av. Marginal, entre Praia da Conceição (Cascais) y São João do Estoril","aprox":true,"cost":0,"costN":"Gratis; tren Cais do Sodré–Cascais con la tarjeta de transporte","dur":2,"main":true,"why":"Es la alternativa plana a Sintra que propone el itinerario: unos 3 km de Cascais a Estoril pegados al agua, pasando por las playas de Conceição, Tamariz y Poça. Como el tren sigue la costa, se puede cortar en cualquier estación.","tip":"Ir con el tren a Cascais y caminar hacia Estoril; si sobran piernas, seguir hasta São João. Hay bares de playa y bancos todo el camino. Con marea alta y oleaje fuerte, algunos tramos se mojan. Sentarse del lado derecho del tren a la ida para ver el mar.","season":"Todo el año; en verano las playas se llenan y el paseo también. En primavera y otoño es ideal: sol sin calor.","refs":["https://www.wikidata.org/wiki/Q48873277"],"conf":"baja","tags":["IA","Ruta 2","Ruta 3","Itinerario","Excursión"],"boro":"Cascais","sub":"Tren línea de Cascais desde Cais do Sodré: bajar en Cascais (terminal) y volver desde Estoril o São João do Estoril","closed":"","free":"","book":"","src":"propuesta","must":0,"rate":0,"warn":[]},{"id":"cas_centro","n":"Cascais (centro histórico)","gname":"Cascais","cat":"barrio","typ":"Pueblo para caminar","hood":"Cascais","lat":38.6969,"lng":-9.4206,"addr":"Largo 5 de Outubro, 2750 Cascais","aprox":true,"cost":0,"costN":"Gratis","dur":2,"main":true,"why":"Calles peatonales con calçada en dibujos de ondas, la playa de pescadores (Praia da Ribeira), la Cidadela del siglo XVI y la marina. Es plano y compacto: se recorre sin cansarse.","tip":"La lonja de pescado junto a la Praia da Ribeira tiene subasta por la tarde en días de pesca. Para comer barato, alejarse dos calles del paseo principal.","refs":["https://www.wikidata.org/wiki/Q17390148"],"conf":"baja","tags":["IA","Ruta 2","Ruta 3","Itinerario","Excursión"],"boro":"Cascais","sub":"Tren línea de Cascais, estación Cascais (terminal, ~40 min desde Cais do Sodré)","closed":"","free":"","book":"","src":"propuesta","must":0,"rate":0,"season":"","warn":[]},{"id":"cas_boca_inferno","n":"Boca do Inferno","gname":"Boca do Inferno","cat":"mirador","typ":"Mirador","hood":"Cascais","lat":38.691042,"lng":-9.431003,"addr":"Av. Rei Humberto II de Itália, 2750-642 Cascais","cost":0,"costN":"Gratis","dur":0.75,"main":true,"why":"Con mar movido, las olas entran en la gruta y salen en chorros de espuma. El camino desde Cascais pasa por la Cidadela y Santa Marta, con el faro y la Casa das Histórias.","tip":"Con mar calmo impresiona poco: mirar el oleaje antes. Las barandas cubren la zona principal; no salirse a las rocas. Camino plano pero con viento.","refs":["https://www.wikidata.org/wiki/Q888949"],"conf":"media","tags":["IA","Ruta 2","Ruta 3","Excursión"],"boro":"Cascais","sub":"20-25 min a pie desde la estación de Cascais por el paseo costero, o bus urbano","closed":"","f
