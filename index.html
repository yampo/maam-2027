ree":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"cas_paula_rego","n":"Casa de las Historias Paula Rego","gname":"Casa das Histórias Paula Rego","cat":"museo","typ":"Museo de arte","hood":"Cascais","lat":38.695278,"lng":-9.423889,"addr":"Av. da República 300, 2750-475 Cascais","cost":null,"costN":"Precio sin verificar. Precio no verificado (su sitio no se pudo leer)","dur":1.5,"why":"El edificio, de un premio Pritzker, es una de las obras de arquitectura contemporánea más reconocidas de Portugal. Adentro, la obra de Paula Rego: cuentos y escenas familiares contados con una mirada inquietante.","tip":"Queda camino a la Boca do Inferno, sin cuestas. Tiene cafetería con terraza al jardín.","refs":["https://www.wikidata.org/wiki/Q9698241"],"conf":"baja","tags":["IA","Ruta 2","Ruta 3","Excursión"],"boro":"Cascais","sub":"10 min a pie desde la estación de Cascais","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"cas_estoril","n":"Estoril: Casino y Jardín","gname":"Casino Estoril / Jardim do Casino","cat":"arq","typ":"Monumento / edificio","hood":"Estoril","lat":38.706944,"lng":-9.3975,"addr":"Av. Dr. Stanley Ho, 2765-190 Estoril, Cascais","cost":0,"costN":"Gratis ver el edificio y el jardín","dur":0.75,"main":true,"why":"Durante la guerra, Portugal neutral fue paso de refugiados, espías y reyes en el exilio; Ian Fleming frecuentó este casino y se dice que le inspiró Casino Royale. El jardín en pendiente suave une el casino con la estación y la playa de Tamariz.","tip":"Es el final natural del paseo marítimo: de acá sale el tren de vuelta a Lisboa, al pie del jardín.","conf":"baja","tags":["IA","Ruta 2","Ruta 3","Itinerario","Excursión"],"boro":"Cascais","sub":"Tren línea de Cascais, estación Estoril","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[],"refs":[]},{"id":"cas_santini","n":"Santini","gname":"Santini Cascais","cat":"comida","typ":"Café / pastelería","hood":"Cascais","lat":38.6975,"lng":-9.421,"addr":"Av. Valbom 28F, 2750-508 Cascais","aprox":true,"cost":4,"costN":"Helado 3-5 € (estimado)","dur":0.3,"main":true,"why":"Es el helado histórico de la costa: Attilio Santini abrió en 1949 y entre sus clientes estuvieron los reyes exiliados que vivían en Estoril y Cascais. Sabores de fruta portuguesa como frutos rojos o maracuyá.","tip":"Suele haber cola en verano, pero avanza rápido. Sin asientos para todos: comerlo caminando hacia la playa.","conf":"baja","tags":["IA","Ruta 2","Ruta 3","Excursión"],"boro":"Cascais","sub":"5 min a pie desde la estación de Cascais","closed":"","free":"","book":"","src":"propuesta","must":0,"rate":0,"season":"","warn":[],"refs":[]},{"id":"sev_santa_cruz","n":"Barrio de Santa Cruz","cat":"barrio","typ":"Barrio / paseo","hood":"Santa Cruz","lat":37.385,"lng":-5.99027778,"addr":"Entre la Catedral, el Alcázar y los Jardines de Murillo, Sevilla","cost":0,"costN":"Gratis","dur":2,"main":true,"why":"Es el plan del día de llegada en la ruta: el barrio más caminable del centro, todo plano y a la sombra de calles angostas. Plazas como Doña Elvira, Santa Cruz y los Venerables, y el callejón del Agua junto a la muralla del Alcázar.","tip":"Plano y sin cuestas, pero empedrado: calzado firme. Al atardecer hay menos grupos de turistas. Hay bancos en las plazas y en los Jardines de Murillo, al borde del barrio.","refs":["https://es.wikipedia.org/wiki/Santa_Cruz_(Sevilla)"],"conf":"media","tags":["IA","Ruta 2","Itinerario"],"boro":"Sevilla","sub":"Metro L1 o tranvía T1, parada Puerta de Jerez; desde ahí 5-10 min a pie","closed":"","free":"","book":"","src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"sev_alcazar","n":"Real Alcázar de Sevilla","cat":"arq","typ":"Palacio / castillo","hood":"Santa Cruz","lat":37.38442615,"lng":-5.99118663,"addr":"Patio de Banderas, s/n, 41004 Sevilla","cost":8,"costN":"General 15,50 €; mayores de 65 con documento 8 € (ordenanza 2025). Cuarto Real Alto +5,50 €.","dur":3,"main":true,"book":"Reservar online con anticipación: la ruta lo marca entre lo que se agota","why":"El Palacio de Pedro I es lo mejor del mudéjar en España: yeserías, azulejos y el Patio de las Doncellas. Los jardines son enormes y con mucha sombra, ideales para descansar entre salas. La entrada general incluye además el Antiquarium (bajo las Setas) y el Museo de la Cerámica de Triana.","tip":"Llevar el pasaporte para la tarifa de mayores de 65. Ir a primera hora. Los jardines tienen bancos y fuentes; la planta alta (Cuarto Real Alto) es aparte, con escaleras y visita guiada. Guardar la entrada: sirve para el Museo de la Cerámica de Triana.","refs":["https://alcazarsevilla.org/wp-content/uploads/2025/02/BOP-ORDENANZA-PATRONATO-2025.pdf"],"conf":"alta","tags":["IA","Ruta 2","Itinerario"],"boro":"Sevilla","sub":"Metro L1 o tranvía T1, parada Puerta de Jerez / Archivo de Indias","closed":"","free":"","src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"sev_catedral","n":"Catedral de Sevilla","cat":"arq","typ":"Iglesia / templo","hood":"Centro / Santa Cruz","lat":37.38574216,"lng":-5.99309556,"addr":"Av. de la Constitución, s/n, 41004 Sevilla (entrada por la Puerta de San Cristóbal)","cost":7,"costN":"Tarifas 2026: general 13 € online / 14 € taquilla; mayores de 65 7 € online / 8 € taquilla. Incluye Giralda e Iglesia del Salvador.","dur":2,"main":true,"book":"Comprar online (más barato y aforo limitado)","free":"Visita pública gratuita los domingos según agenda litúrgica, desde las 17:00 en la taquilla de la Puerta del Príncipe (web oficial)","why":"Es el día 10 de la ruta junto con el Alcázar. Adentro: el retablo mayor (el más grande de la cristiandad), la tumba de Colón llevada por cuatro reyes y el Patio de los Naranjos, que es la antigua mezquita. La misma entrada vale para la Giralda y para la Iglesia del Salvador.","tip":"Comprar online: 1 € menos y sin cola. Llevar pasaporte para la tarifa reducida. La visita estimada es de 75 min más la Giralda. Los horarios cambian por culto.","refs":["https://www.catedraldesevilla.es/visita-cultural/horarios-y-tarifas/","https://www.catedraldesevilla.es/en/hours-and-rates-for-the-cultural-visit-2026/"],"conf":"alta","tags":["IA","Ruta 2","Itinerario"],"boro":"Sevilla","sub":"Tranvía T1, parada Archivo de Indias; Metro L1 Puerta de Jerez","closed":"","src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"sev_giralda","n":"Giralda","cat":"mirador","typ":"Mirador","hood":"Centro / Santa Cruz","lat":37.38614,"lng":-5.99238,"addr":"Av. de la Constitución, s/n, 41004 Sevilla (dentro de la visita a la Catedral)","cost":0,"costN":"Incluida en la entrada de la Catedral","dur":0.75,"main":true,"why":"La mejor vista de Sevilla desde el centro: se ven los techos de la Catedral, el Alcázar y el río. La torre es la antigua mezquita almohade con el campanario renacentista encima.","tip":"No hay escaleras: se sube por rampas, unas 35, pensadas para que subiera un jinete. Es largo pero gradual, y se puede parar en cada tramo. Tiene control de acceso propio dentro de la visita.","refs":["https://www.catedraldesevilla.es/visita-cultural/horarios-y-tarifas/"],"conf":"media","tags":["IA","Ruta 2","Itinerario"],"boro":"Sevilla","sub":"Tranvía T1, parada Archivo de Indias","closed":"","free":"","book":"","src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"sev_plaza_espana","n":"Plaza de España","cat":"arq","typ":"Monumento / edificio","hood":"Parque de María Luisa","lat":37.3770804,"lng":-5.98690073,"addr":"Av. de Isabel la Católica, 41004 Sevilla","cost":0,"costN":"Gratis; las barcas del canal se pagan aparte","dur":1,"main":true,"why":"Es la postal de Sevilla y forma parte del día 11 de la ruta. Cada provincia de España tiene su banco de azulejos con mapa y una escena de su historia. Los puentes sobre el canal son de cerámica.","tip":"Todo plano, con mucha sombra en las galerías. Al mediodía el sol pega fuerte en la explanada: mejor de mañana o al atardecer. Los bancos de azulejo sirven para sentarse.","refs":["https://es.wikipedia.org/wiki/Plaza_de_Espa%C3%B1a_(Sevilla)"],"conf":"media","tags":["IA","Ruta 2","Itinerario"],"boro":"Sevilla","sub":"Metro L1, parada Prado de San Sebastián; tranvía T1, parada Prado de San Sebastián","closed":"","free":"","book":"","src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"sev_maria_luisa","n":"Parque de María Luisa","cat":"parque","typ":"Parque / jardín","hood":"Parque de María Luisa","lat":37.374821,"lng":-5.988573,"addr":"Paseo de las Delicias, s/n, 41013 Sevilla","cost":0,"costN":"Gratis","dur":1.5,"main":true,"why":"Es el pulmón del centro y une en un solo paseo la Plaza de España y la Plaza de América. Tiene glorietas de azulejo dedicadas a escritores (Bécquer, Cervantes), la Isleta de los Patos y árboles grandes que dan sombra de verdad.","tip":"Plano y lleno de bancos. En días de calor es el refugio natural entre la Plaza de España y el centro. En la Plaza de América, en el extremo sur, están el Museo de Artes y Costumbres Populares y el Arqueológico.","refs":["https://en.wikipedia.org/wiki/Parque_de_Mar%C3%ADa_Luisa"],"conf":"media","tags":["IA","Ruta 2","Itinerario"],"boro":"Sevilla","sub":"Metro L1 o tranvía T1, parada Prado de San Sebastián o Puerta de Jerez","closed":"","free":"","book":"","src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"sev_triana","n":"Triana","cat":"barrio","typ":"Barrio / paseo","hood":"Triana","lat":37.38358056,"lng":-6.0052,"addr":"Entrada por el Puente de Isabel II, Plaza del Altozano, Sevilla","cost":0,"costN":"Gratis","dur":2.5,"main":true,"why":"Está en el día 11 de la ruta. Se cruza el Puente de Isabel II (1852), con la vista del río y la Torre del Oro, y se camina por la calle Betis frente al agua. En la calle Alfarería y San Jorge quedan talleres de cerámica, y en Pagés del Corro y Antillano Campos están los bares de tapas del barrio.","tip":"Todo plano. El Mercado de Triana y el Museo de la Cerámica (incluido con la entrada del Alcázar) son buenas paradas bajo techo. La calle Betis tiene bancos frente al río; al atardecer es la mejor vista de Sevilla.","refs":["https://es.wikipedia.org/wiki/Triana_(Sevilla)"],"conf":"media","tags":["IA","Ruta 2","Itinerario"],"boro":"Sevilla","sub":"Metro L1, parada Plaza de Cuba; o a pie cruzando el Puente de Triana (Isabel II) desde el centro","closed":"","free":"","book":"","src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"sev_setas","n":"Las Setas (Metropol Parasol)","gname":"Setas de Sevilla","cat":"mirador","typ":"Mirador","hood":"Encarnación","lat":37.39325278,"lng":-5.99188056,"addr":"Plaza de la Encarnación, s/n, 41003 Sevilla","cost":16,"costN":"Mirador desde 16 € (web oficial, sin tarifa de mayores publicada)","dur":1.5,"main":true,"why":"Cierra el día 11 de la ruta. Se sube en ascensor y se camina una pasarela ondulada con vista de 360° sobre los techos y la Giralda. En la planta baja hay un mercado de abastos y en el sótano el Antiquarium, con restos romanos (incluido con la entrada del Alcázar).","tip":"Ir al atardecer: la luz sobre la ciudad es lo mejor. La entrada incluye un audiovisual y, de abril a octubre, el espectáculo de luces 'Aurora' desde las 21:30. La pasarela tiene tramos en pendiente, con barandas.","refs":["https://setasdesevilla.com/","https://en.wikipedia.org/wiki/Metropol_Parasol"],"conf":"alta","tags":["IA","Ruta 2","Itinerario"],"boro":"Sevilla","sub":"Bus urbano a la Encarnación, o 10 min a pie desde la Catedral por la calle Sierpes","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"sev_torre_oro","n":"Torre del Oro","cat":"arq","typ":"Monumento / edificio","hood":"El Arenal","lat":37.38245515,"lng":-5.99629608,"addr":"Paseo de Cristóbal Colón, s/n, 41001 Sevilla","cost":1.5,"costN":"General 3 €; pensionistas / mayores de 65 1,50 € (guías de terceros)","dur":0.75,"main":true,"free":"Varias guías dicen que los lunes es gratis; no confirmado en fuente oficial","why":"Controlaba el puerto por donde entraba el oro de América. El museo naval es chico y la terraza de arriba da al Guadalquivir y a Triana. Está sobre el paseo del río, que lleva caminando a la Plaza de Toros y al Puente de Triana.","tip":"Para subir a la terraza hay escaleras estrechas. Si las escaleras pesan, vale igual verla desde afuera y seguir el paseo del río, que es plano y con bancos.","refs":["https://www.hoteles.net/sevilla/torre-del-oro-sevilla.html","https://en.wikipedia.org/wiki/Torre_del_Oro"],"conf":"media","tags":["IA","Ruta 2"],"boro":"Sevilla","sub":"Metro L1 o tranvía T1, parada Puerta de Jerez (5 min a pie)","closed":"","book":"","src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"sev_casa_pilatos","n":"Casa de Pilatos","cat":"arq","typ":"Palacio / castillo","hood":"San Bartolomé","lat":37.3902394,"lng":-5.9872491,"addr":"Plaza de Pilatos, 1, 41003 Sevilla","cost":12,"costN":"Planta principal 12 € (incluye audioguía); planta alta +6 €. Sin descuento de mayores publicado.","dur":1.5,"main":true,"why":"Es como un Alcázar en chico y sin multitudes: patio principal con azulejos del XVI, esculturas romanas y jardines. Sigue siendo casa de una familia noble, y la planta alta se ve en visita guiada.","tip":"Buena alternativa si el Alcázar está agotado. La planta baja es toda a nivel; la alta tiene escalera. La entrada incluye audioguía en español.","refs":["https://www.fundacionmedinaceli.org/monumentos/pilatos/"],"conf":"alta","tags":["IA","Ruta 2"],"boro":"Sevilla","sub":"Bus urbano C5 o 10 min a pie desde la Catedral","closed":"","free":"","book":"","src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"sev_bellas_artes","n":"Museo de Bellas Artes de Sevilla","cat":"museo","typ":"Museo de arte","hood":"Museo / San Vicente","lat":37.39265,"lng":-6.00013,"addr":"Plaza del Museo, 9, 41001 Sevilla","cost":0,"costN":"1,50 €; gratis para ciudadanos de la UE con documento (guías)","dur":1.5,"main":true,"why":"Después del Prado, es la mejor colección de pintura barroca española. La iglesia del convento, con los Murillo, es lo más impactante. El edificio tiene tres patios con azulejos y árboles.","tip":"Con pasaporte español la entrada es gratis. Hay bancos en las salas y en los patios. Los domingos por la mañana hay un mercadillo de pintura en la Plaza del Museo.","refs":["https://www.hoteles.net/sevilla/museo-bellas-artes-sevilla.html","https://en.wikipedia.org/wiki/Museo_de_Bellas_Artes_de_Sevilla"],"conf":"media","tags":["IA","Ruta 2"],"boro":"Sevilla","sub":"Bus urbano a Plaza de Armas, o 15 min a pie desde la Catedral","closed":"","free":"","book":"","src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"sev_archivo_indias","n":"Archivo General de Indias","cat":"arq","typ":"Monumento / edificio","hood":"Centro","lat":37.38477778,"lng":-5.99308333,"addr":"Av. de la Constitución, 3, 41004 Sevilla","cost":0,"costN":"Gratis (guías de terceros)","dur":0.75,"main":true,"why":"Está entre la Catedral y el Alcázar, así que entra en el mismo día. Exhiben documentos originales de la colonización de América, incluida la de la Audiencia de Buenos Aires y el Virreinato del Río de la Plata: para quien vive en Buenos Aires tiene un interés especial. El edificio es de Juan de Herrera, el arquitecto de El Escorial.","tip":"La exposición está en la planta alta, a la que se sube por una gran escalera de mármol. Es corta y fresca: buen descanso del sol entre la Catedral y el Alcázar.","refs":["https://www.hoteles.net/sevilla/archivo-indias-sevilla.html","https://es.wikipedia.org/wiki/Archivo_General_de_Indias"],"conf":"media","tags":["IA","Ruta 2"],"boro":"Sevilla","sub":"Tranvía T1, parada Archivo de Indias","closed":"","free":"","book":"","src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"sev_salvador","n":"Iglesia del Salvador","gname":"Iglesia Colegial del Divino Salvador","cat":"arq","typ":"Iglesia / templo","hood":"Alfalfa","lat":37.3900673,"lng":-5.9926867,"addr":"Plaza del Salvador, 3, 41004 Sevilla","cost":0,"costN":"Incluida en la entrada de la Catedral (tarifa 2026)","dur":0.75,"why":"Ya está pagada con la entrada de la Catedral y casi nadie la usa. Tiene once retablos barrocos dorados en una sola nave, de lo más recargado de España. La plaza de afuera es de las más vivas del centro a la hora del vermut.","tip":"Conviene hacerla otro día que la Catedral, para no saturarse de retablos. Queda a pasos de la calle Sierpes, del Bar El Comercio y de la confitería La Campana.","refs":["https://www.catedraldesevilla.es/visita-cultural/horarios-y-tarifas/"],"conf":"alta","tags":["IA","Ruta 2"],"boro":"Sevilla","sub":"10 min a pie desde la Catedral; tranvía T1 Plaza Nueva y 5 min a pie","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"sev_duenas","n":"Palacio de las Dueñas","cat":"arq","typ":"Palacio / castillo","hood":"San Juan de la Palma","lat":37.39472222,"lng":-5.98916667,"addr":"Calle Dueñas, 5, 41003 Sevilla","cost":12,"costN":"Alrededor de 12 € general y 9-10 € reducida (precio no confirmado en web oficial)","dur":1.25,"why":"Antonio Machado nació acá ('Mi infancia son recuerdos de un patio de Sevilla' se refiere a este patio). Tiene patios con limoneros, jardines, y la colección de arte y recuerdos de la duquesa de Alba Cayetana.","tip":"Combina con las Setas y El Rinconcillo, que están a cinco minutos. La visita principal es en planta baja y patios.","refs":["https://www.civitatis.com/es/sevilla/entrada-palacio-duenas/","https://es.wikipedia.org/wiki/Palacio_de_las_Due%C3%B1as_(Sevilla)"],"conf":"media","tags":["IA","Ruta 2"],"boro":"Sevilla","sub":"5 min a pie desde las Setas","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"sev_rinconcillo","n":"El Rinconcillo","cat":"comida","typ":"Bar de tapas / taberna","hood":"Santa Catalina","lat":37.3933406,"lng":-5.9882942,"addr":"Calle Gerona, 40, 41003 Sevilla","cost":20,"costN":"Tapas 3-5 €; raciones 10-18 € (estimado)","dur":1.25,"main":true,"why":"Lleva más de 350 años abierto, con su barra de madera, azulejos y jamones colgados. Su plato insignia son las espinacas con garbanzos, y anotan la cuenta con tiza sobre la barra. Reseñas de abril de 2026 confirman que sigue abierto.","tip":"Pedir espinacas con garbanzos y bacalao con tomate. La barra es de pie; para sentarse está el comedor de atrás. Según la temporada cierra unas semanas en agosto.","refs":["https://gastroranking.es/r/el-rinconcillo-3_45131/","https://www.andalucia.org/en/sevilla-where-to-eat-el-rinconcillo"],"conf":"media","tags":["IA","Ruta 2"],"boro":"Sevilla","sub":"5 min a pie desde las Setas","closed":"","free":"","book":"","src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"sev_las_columnas","n":"Bodega Santa Cruz (Las Columnas)","gname":"Bodega Santa Cruz Las Columnas","cat":"comida","typ":"Bar de tapas / taberna","hood":"Santa Cruz","lat":37.3860394,"lng":-5.9907674,"addr":"Calle Rodrigo Caro, 1, 41004 Sevilla","cost":12,"costN":"Tapas y montaditos 2,50-4 € (estimado)","dur":0.75,"main":true,"why":"Es el bar de barrio de Santa Cruz, con locales y turistas mezclados. Los montaditos (el de pringá es el clásico) y las tapas cuestan poco, y la cuenta la anotan con tiza en la barra.","tip":"Es de pie y se llena al mediodía. Mejor fuera de hora o tomar algo rápido después de la Catedral. Pedir montadito de pringá.","refs":["https://www.frommers.com/destinations/seville/restaurants/bodega-santa-cruz","https://www.andalucia.org/en/sevilla-where-to-eat-bodega-santa-cruz-las-columnas"],"conf":"media","tags":["IA","Ruta 2"],"boro":"Sevilla","sub":"Tranvía T1, parada Archivo de Indias","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"sev_casa_morales","n":"Casa Morales","cat":"comida","typ":"Bar de tapas / taberna","hood":"El Arenal","lat":37.3865275,"lng":-5.9946141,"addr":"Calle García de Vinuesa, 11, 41001 Sevilla","cost":18,"costN":"Tapas 3-5 € (estimado)","dur":1,"main":true,"why":"Sigue en la misma familia desde 1850. En la sala de atrás se come entre tinajas gigantes de vino. Lo clásico: solomillo al whisky, carrillada y vermut de grifo.","tip":"Muy concurrido al mediodía: ir temprano. Hay algunas mesitas de madera y barriles para apoyarse.","refs":["https://www.frommers.com/destinations/seville/restaurants/casa-morales","https://tablejourney.com/spain/seville/casual-dining/casa-morales/"],"conf":"media","tags":["IA","Ruta 2"],"boro":"Sevilla","sub":"Metro L1 o tranvía T1, parada Puerta de Jerez / Archivo de Indias","closed":"","free":"","book":"","src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"sev_golondrinas","n":"Las Golondrinas","gname":"Bar Las Golondrinas","cat":"comida","typ":"Bar de tapas / taberna","hood":"Triana","lat":37.3848669,"lng":-6.0055122,"addr":"Calle Antillano Campos, 26, 41010 Sevilla","cost":15,"costN":"Tapas 3-4 € (estimado)","dur":1,"main":true,"why":"Es el bar de tapas de Triana, para el día que se cruza el río. Su especialidad es la punta de solomillo a la plancha y los champiñones al ajillo, a precio de barrio.","tip":"Es chico y se llena: ir al abrir, al mediodía o a la noche. Hay un segundo local a la vuelta, en Pagés del Corro 76, por si el primero está lleno.","refs":["https://www.frommers.com/destinations/seville/restaurants/las-golondrinas","https://www.barcelo.com/guia-turismo/es/espana/sevilla/que-ver/donde-comer-en-triana/"],"conf":"media","tags":["IA","Ruta 2"],"boro":"Sevilla","sub":"Metro L1, parada Plaza de Cuba; o cruzar el Puente de Triana a pie","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"sev_eslava","n":"Eslava","cat":"comida","typ":"Bar de tapas / taberna","hood":"San Lorenzo","lat":37.3975489,"lng":-5.9969243,"addr":"Calle Eslava, 3, 41002 Sevilla","cost":25,"costN":"Tapas 3,50-5 €; platos en el restaurante 15-25 € (estimado)","dur":1.5,"main":true,"book":"Reservar si se quiere mesa en el restaurante; la barra es sin reserva","why":"Para el día del gusto: cocina sevillana moderna, pero sin pasar a precio de alta cocina. Lo famoso es la yema sobre bizcocho de boletus y el 'cigarro para Bécquer'. Está en San Lorenzo, un barrio sin turistas al lado de la Alameda.","tip":"Reservar mesa para sentarse cómodos. Ir temprano para la barra (sin reserva). Pedir la yema de huevo sobre bizcocho de setas.","refs":["https://www.theinfatuation.com/seville/reviews/eslava","https://gastroranking.es/r/eslava_45233/"],"conf":"media","tags":["IA","Ruta 2"],"boro":"Sevilla","sub":"Bus urbano a la Alameda de Hércules / San Lorenzo, o 15 min a pie desde las Setas","closed":"","free":"","src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"sev_mercado_triana","n":"Mercado de Triana","cat":"comida","typ":"Mercado","hood":"Triana","lat":37.3857499,"lng":-6.0035503,"addr":"Calle San Jorge, s/n (Plaza del Altozano), 41010 Sevilla","cost":10,"costN":"Tapas en los puestos 3-6 € (estimado)","dur":1,"main":true,"why":"Puestos de verdura, pescado y aceitunas donde compran los del barrio, y barras para tapear en el mismo mercado. Es lo más práctico para quien cocina en el Airbnb. Bajo el mercado se ven los restos del castillo de la Inquisición (Centro de Interpretación).","tip":"Ir a la mañana, cuando los puestos están completos. Buen lugar para comprar y para un tapeo informal. Es plano y techado.","refs":["https://es.wikipedia.org/wiki/Triana_(Sevilla)"],"conf":"baja","tags":["IA","Ruta 2"],"boro":"Sevilla","sub":"Al cruzar el Puente de Triana, en la Plaza del Altozano; Metro L1 Plaza de Cuba","closed":"","free":"","book":"","src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"sev_el_comercio","n":"Bar El Comercio","cat":"comida","typ":"Café / pastelería","hood":"Centro / Alfalfa","lat":37.3908057,"lng":-5.9923604,"addr":"Calle Lineros, 9, 41004 Sevilla","cost":5,"costN":"Ración de churros alrededor de 2,50 €; con chocolate más (guía)","dur":0.5,"main":true,"why":"Muchos dicen que tiene los mejores churros de Sevilla, y el chocolate es tan espeso que la cuchara se queda parada. Conserva la barra y los azulejos de época.","tip":"Ir temprano para desayunar. Para sentarse puede haber espera; la barra es más rápida. Según una guía no abre los domingos (no confirmado).","refs":["https://www.theinfatuation.com/seville/reviews/bar-el-comercio","https://devourtours.com/blog/best-churros-in-seville/"],"conf":"media","tags":["IA","Ruta 2"],"boro":"Sevilla","sub":"A pasos de la Plaza del Salvador; tranvía T1 Plaza Nueva y 5 min a pie","closed":"","free":"","book":"","src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"sev_la_campana","n":"Confitería La Campana","cat":"comida","typ":"Café / pastelería","hood":"Centro","lat":37.3925807,"lng":-5.994848,"addr":"Calle Sierpes, 1, 41004 Sevilla","cost":6,"costN":"Café y pastel 4-7 € (estimado)","dur":0.5,"main":true,"why":"Es la pastelería histórica de Sevilla, en manos de la cuarta generación. Es famosa por las yemas, los merengues, las lenguas de almendra y, en Semana Santa, las torrijas. Queda en el camino entre la Catedral y las Setas.","tip":"Pedir algo típico sevillano: yemas o un polvorón. Es buena parada para sentarse a mitad del paseo por Sierpes.","refs":["https://www.timeout.com/es/sevilla/tiendas/confiteria-la-campana","https://tablejourney.com/spain/seville/bakeries/confiteria-la-campana/"],"conf":"media","tags":["IA","Ruta 2"],"boro":"Sevilla","sub":"Plaza de la Campana, 10 min a pie de la Catedral por Sierpes","closed":"","free":"","book":"","src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"sev_ochoa","n":"Confitería Ochoa","cat":"comida","typ":"Café / pastelería","hood":"Centro","lat":37.3911565,"lng":-5.9945224,"addr":"Calle Sierpes, 45, 41004 Sevilla","cost":6,"costN":"Café y pastel 4-7 € (estimado)","dur":0.5,"why":"Más tranquila que La Campana y con mesas para sentarse. Es famosa por sus pasteles de té, las palmeras de chocolate y, en enero, el roscón de reyes. Hay reseñas de abril de 2026.","tip":"Buena para la merienda sentados.","refs":["https://tablejourney.com/spain/seville/bakeries/confiteria-ochoa/","https://gastroranking.es/r/confiteria-ochoa_44312/"],"conf":"media","tags":["IA","Ruta 2"],"boro":"Sevilla","sub":"Calle Sierpes, 5 min a pie desde la Plaza del Salvador","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"cad_casco_antiguo","n":"Casco antiguo de Cádiz","cat":"barrio","typ":"Barrio / paseo","hood":"Casco antiguo","lat":36.531,"lng":-6.2973,"addr":"Centro histórico (punto de referencia: Plaza de las Flores), Cádiz","aprox":true,"cost":0,"costN":"gratis","dur":3,"main":true,"why":"Es el núcleo de la visita de los tres días: casi todo lo de esta lista queda a menos de 15 minutos a pie entre sí. La Torre Tavira cuenta que la ciudad tuvo 134 torres-mirador desde las que los comerciantes vigilaban la llegada de sus barcos de Indias en el siglo XVIII. Plaza de las Flores, Mercado, Catedral y Pópulo forman un recorrido natural.","tip":"Terreno llano: es una de las ciudades más cómodas de Andalucía para caminar. Hay bancos en las plazas (Flores, Candelaria, Mina, San Juan de Dios). Las calles son estrechas y con sombra, se agradece en días de calor.","refs":["https://torretavira.com/horarios-tarifas-y-localizacion","https://torretavira.com/visita-a-la-torre-tavira"],"conf":"media","tags":["IA","Ruta 2","Itinerario"],"boro":"Cádiz","sub":"Estación de tren de Cádiz (Renfe, Cercanías C-1 y Media Distancia), en el borde del casco; después todo a pie","closed":"","free":"","book":"","src":"propuesta","gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"cad_la_caleta","n":"Playa de La Caleta y Balneario de la Palma","gname":"Playa de La Caleta","cat":"parque","typ":"Paseo / costa","hood":"La Viña","lat":36.528477,"lng":-6.306497,"addr":"Avenida Duque de Nájera, Cádiz","cost":0,"costN":"gratis","dur":1.5,"main":true,"why":"Es la postal de Cádiz y el lugar clásico para ver la puesta de sol sobre el Atlántico. Desde la playa sale el espigón hacia el Castillo de San Sebastián, y a un lado está el Castillo de Santa Catalina: se combinan en un mismo paseo. El barrio de La Viña, el de los bares de pescado, empieza justo detrás.","tip":"Ir al atardecer. El paseo por la avenida es llano y con barandas; para bajar a la arena hay escaleras/rampas. En verano se llena.","season":"En verano la playa se llena; en primavera u otoño es más un paseo que un día de playa.","conf":"media","tags":["IA","Ruta 2","Itinerario"],"boro":"Cádiz","sub":"A pie desde el casco (unos 15 min desde la Plaza de las Flores)","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"warn":[],"refs":[]},{"id":"cad_vuelta_peninsula","n":"Vuelta a la península por el paseo marítimo (Campo del Sur, Alameda Apodaca)","gname":"Avenida Campo del Sur","cat":"mirador","typ":"Mirador","hood":"Perímetro del casco","lat":36.528667,"lng":-6.299208,"addr":"Avenida Campo del Sur, Cádiz","aprox":true,"cost":0,"costN":"gratis","dur":2.5,"main":true,"why":"Es el plan del día 13 de la ruta. El Campo del Sur es el malecón frente al Atlántico, con la Catedral y las casas de colores mirando al mar; después vienen La Caleta, los dos castillos, el Parque Genovés y la Alameda Apodaca sobre la bahía. Todo plano y siempre con el mar al lado.","tip":"Unos 5-6 km si se da la vuelta completa (cálculo sobre el mapa, no medido). Se puede cortar en cualquier punto y volver al centro en pocas cuadras. Con viento de levante el Campo del Sur salpica: llevar abrigo liviano.","conf":"media","tags":["IA","Ruta 2","Itinerario"],"boro":"Cádiz","sub":"A pie; se puede empezar en Puertas de Tierra o en la Catedral","closed":"","free":"","book":"","src":"propuesta","must":0,"rate":0,"season":"","warn":[],"refs":[]},{"id":"cad_mercado_central","n":"Mercado Central de Abastos","gname":"Mercado Central de Cádiz","cat":"comida","typ":"Mercado","hood":"Centro","lat":36.530413,"lng":-6.29821,"addr":"Plaza de la Libertad, s/n, Cádiz","cost":15,"costN":"estimado: tapas y raciones en los puestos del rincón gastronómico, unos 15 € por persona","dur":1.5,"main":true,"why":"Es el lugar para ver el pescado de la bahía y comer algo barato de pie o en mesas altas: freidurías, marisco cocido, embutidos. Alrededor (Plaza de las Flores, Plaza Libertad) están la Churrería La Guapa y la Freiduría Las Flores.","tip":"Ir por la mañana para ver los puestos de pescado en actividad; el rincón gastronómico funciona también a mediodía. Para cocinar en el Airbnb, es el mejor sitio para comprar pescado. Según un artículo de 2026 el edificio estaba terminando obras de reforma.","refs":["https://www.hola.com/cocina/noticias/20250530832934/mejores-restaurantes-y-gastronomia-de-cadiz/","https://www.diariobahiadecadiz.com/cadiz/la-plaza-de-cadiz-protagoniza-el-cupon-de-la-once-del-martes"],"conf":"media","tags":["IA","Ruta 2","Itinerario"],"boro":"Cádiz","sub":"A pie, junto a la Plaza de las Flores","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"cad_torre_tavira","n":"Torre Tavira y cámara oscura","gname":"Torre Tavira","cat":"mirador","typ":"Mirador","hood":"Centro","lat":36.5319575,"lng":-6.2984001,"addr":"Calle Marqués del Real Tesoro, 10, Cádiz","cost":6,"costN":"general 8 €; mayores de 65: 6 € (web oficial)","dur":0.75,"main":true,"book":"Reserva previa por la web oficial: aforo reducido, la web dice que es imprescindible","why":"La cámara oscura proyecta la ciudad en vivo sobre una pantalla mientras un guía la va recorriendo: es la mejor introducción a Cádiz. Después se sale a la azotea, el punto más alto del casco. La visita dura 45 minutos.","tip":"NO tiene ascensor (la web lo explica: Patrimonio lo rechazó). Son tres pisos de escalera en tramos cortos, con descansos. Cierra solo el 25/12, el 1/1 y el 6/1. Ir el primer día ayuda a ubicarse.","refs":["https://torretavira.com/horarios-tarifas-y-localizacion","https://torretavira.com/visita-a-la-torre-tavira"],"conf":"alta","tags":["IA","Ruta 2","Itinerario"],"boro":"Cádiz","sub":"A pie, a dos cuadras del Mercado Central","closed":"","free":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"cad_catedral","n":"Catedral de Cádiz","gname":"Catedral de la Santa Cruz de Cádiz","cat":"arq","typ":"Iglesia / templo","hood":"Pópulo / San Juan","lat":36.5289521,"lng":-6.2953183,"addr":"Plaza de la Catedral, Cádiz","cost":11,"costN":"general 12 €; mayores de 65: 11 € (web oficial). Incluye la Torre del Reloj; la visita con audioguía se estima en 1,5 h","dur":1.5,"main":true,"why":"La cripta, bajo el nivel del mar, guarda la tumba de Manuel de Falla. Desde la Torre del Reloj (también llamada de Poniente) se ve toda la ciudad rodeada de agua. La misma entrada vale para otros templos del casco (la web nombra Santa Cueva, San Felipe Neri, Capilla del Pópulo y Hospital de Mujeres).","tip":"La subida a la torre es por rampa, sin escalones (según guías; la web oficial no lo detalla): cansa pero es pareja. Los domingos la catedral abre recién a la tarde. Ahorra comprar online.","refs":["https://catedraldecadiz.com/horarios-visita-turistica/","https://catedraldecadiz.com/torre-del-poniente/"],"conf":"alta","tags":["IA","Ruta 2"],"boro":"Cádiz","sub":"A pie; a unos 10 min de la estación de tren","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"cad_populo","n":"Barrio del Pópulo","gname":"El Pópulo","cat":"barrio","typ":"Barrio / paseo","hood":"El Pópulo","lat":36.530866,"lng":-6.29495,"addr":"Entre Plaza de la Catedral y Plaza de San Juan de Dios, Cádiz","aprox":true,"cost":0,"costN":"gratis","dur":1,"main":true,"why":"Calles chiquitas que se recorren en media hora y que concentran el Teatro Romano, la Capilla del Pópulo y los arcos de la Rosa, del Pópulo y de los Blancos. Termina en la Plaza de San Juan de Dios, con el Ayuntamiento y terrazas.","tip":"Combinarlo con la Catedral y el Teatro Romano en una misma mañana: están pegados.","conf":"media","tags":["IA","Ruta 2"],"boro":"Cádiz","sub":"A pie, detrás de la Catedral","closed":"","free":"","book":"","src":"propuesta","must":0,"rate":0,"season":"","warn":[],"refs":[]},{"id":"cad_teatro_romano","n":"Teatro Romano de Cádiz","cat":"museo","typ":"Museo de historia y otros","hood":"El Pópulo","lat":36.528264,"lng":-6.29367,"addr":"Calle Mesón, 12 (acceso), Cádiz","cost":0,"costN":"gratis (según guías)","dur":0.75,"why":"Es uno de los teatros romanos más antiguos de España y se ve una parte (alrededor de un 30%) del original. El centro de interpretación tiene cinco salas con maquetas y óculos en el suelo para ver partes que siguen enterradas.","tip":"Es corto y gratis: buen complemento a la Catedral. Los horarios cambian por obras de conservación; mirarlo el día antes.","conf":"media","tags":["IA","Ruta 2"],"boro":"Cádiz","sub":"A pie, a 5 min de la Catedral","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[],"refs":[]},{"id":"cad_san_felipe_neri","n":"Oratorio de San Felipe Neri","cat":"arq","typ":"Iglesia / templo","hood":"Centro (cerca de Plaza de Mina)","lat":36.532856,"lng":-6.299798,"addr":"Calle Santa Inés / San José, Cádiz","cost":4,"costN":"general 5 €; mayores de 65: 4 € (fuente de terceros; otra más vieja da 3 €)","dur":0.5,"why":"Aquí sesionaron las Cortes de Cádiz en 1811-1812 y se aprobó, el 19 de marzo de 1812, la primera constitución liberal española, en la que participaron también diputados americanos. Tiene una Inmaculada de Murillo en el altar mayor.","tip":"Visita corta. Los lunes, según una guía, cierra; confirmarlo. La entrada de la Catedral también se puede comprar acá.","refs":["https://www.andalucia.org/en/cadiz-cultural-tourism-oratorio-de-san-felipe-neri","https://catedraldecadiz.com/horarios-visita-turistica/"],"conf":"media","tags":["IA","Ruta 2"],"boro":"Cádiz","sub":"A pie","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"cad_museo","n":"Museo de Cádiz","cat":"museo","typ":"Museo de arte","hood":"Plaza de Mina","lat":36.53504313,"lng":-6.29625242,"addr":"Plaza de Mina, s/n, Cádiz","cost":1.5,"costN":"gratis para ciudadanos de la UE; 1,50 € el resto (según terceros, no confirmado en la web oficial)","dur":1.5,"main":true,"why":"Tiene los dos sarcófagos fenicios antropomorfos (un hombre y una mujer), la pieza estrella: Cádiz se fundó como Gadir hace unos 3.000 años. Arriba, una serie de santos y monjes de Zurbarán. La Plaza de Mina, enfrente, es una de las más lindas y sombreadas de la ciudad.","tip":"Barato y en un edificio cómodo. Buen plan para una hora de calor o de lluvia.","refs":["https://www.museum.de/en/museen/museo-de-cadiz"],"conf":"baja","tags":["IA","Ruta 2"],"boro":"Cádiz","sub":"A pie","closed":"","free":"","book":"","src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"cad_santa_catalina","n":"Castillo de Santa Catalina","cat":"arq","typ":"Palacio / castillo","hood":"La Caleta","lat":36.5327654,"lng":-6.3080657,"addr":"Calle Antonio Burgos, Cádiz","cost":0,"costN":"gratis (salvo algunos actos)","dur":0.75,"why":"Se construyó tras el saqueo anglo-holandés de 1596. Se recorren los baluartes con vistas a La Caleta y al Castillo de San Sebastián, y adentro suele haber exposiciones de artistas locales.","tip":"Entra en el mismo paseo que La Caleta y el Parque Genovés. Algún evento de pago puede cerrar el acceso general.","refs":["https://www.eldebate.com/espana/andalucia/cadiz/20241030/este-castillo-gaditano-esconde-ventana-paraiso_240077.html"],"conf":"media","tags":["IA","Ruta 2"],"boro":"Cádiz","sub":"A pie, en el paseo de La Caleta","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"cad_san_sebastian","n":"Castillo de San Sebastián","cat":"arq","typ":"Palacio / castillo","hood":"La Caleta","lat":36.52824536,"lng":-6.31597815,"addr":"Paseo Fernando Quiñones (espigón de La Caleta), Cádiz","cost":0,"costN":"gratis cuando abre","dur":1,"why":"El paseo por el espigón ya vale la pena: se camina sobre el mar hacia la ciudad vista de afuera. El castillo estuvo cerrado de 2018 a 2024; reabrió en agosto de 2024 y superó las 100.000 visitas en seis semanas.","tip":"Su apertura en 2026-2027 NO está confirmada: averiguar antes. El espigón es llano pero sin sombra y con viento.","refs":["https://www.diariobahiadecadiz.com/cadiz/el-castillo-de-san-sebastian-seguira-abierto-ha-superado-ya-las-100000-visitas","https://diariobahiadecadiz.com/cadiz/2500-gaditanos-y-turistas-se-pasean-al-dia-por-el-castillo-de-san-sebastian-la-reapertura-ha-tenido-una-gran-acogida"],"conf":"media","tags":["IA","Ruta 2"],"boro":"Cádiz","sub":"A pie, por el espigón que sale de La Caleta","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"cad_parque_genoves","n":"Parque Genovés","cat":"parque","typ":"Parque / jardín","hood":"Frente a la bahía, oeste del casco","lat":36.535744,"lng":-6.304335,"addr":"Avenida Doctor Gómez Ulla, Cádiz","cost":0,"costN":"gratis","dur":0.75,"why":"Es la pausa verde de la vuelta a la península: sombra, bancos y una cascada, todo plano. Queda justo en el camino entre La Caleta y la Alameda.","tip":"Buen lugar para sentarse a mitad de la caminata del día 13.","conf":"baja","tags":["IA","Ruta 2"],"boro":"Cádiz","sub":"A pie, entre La Caleta y la Alameda Apodaca","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[],"refs":[]},{"id":"cad_vina","n":"Barrio de La Viña","cat":"barrio","typ":"Barrio / paseo","hood":"La Viña","lat":36.529743,"lng":-6.303126,"addr":"Calle Virgen de la Palma y alrededores, Cádiz","aprox":true,"cost":0,"costN":"gratis","dur":1,"main":true,"why":"Es el barrio para comer: acá están Casa Manteca y El Faro, y la calle Virgen de la Palma está llena de bares de pescado. Es también el barrio del Carnaval.","tip":"Ideal para cerrar la tarde de La Caleta con unas tapas. Si coincide con Carnaval (febrero) se llena.","refs":["https://www.hola.com/cocina/noticias/20250530832934/mejores-restaurantes-y-gastronomia-de-cadiz/"],"conf":"media","tags":["IA","Ruta 2"],"boro":"Cádiz","sub":"A pie, de camino a La Caleta","closed":"","free":"","book":"","src":"propuesta","gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"cad_puertas_tierra","n":"Puertas de Tierra","cat":"arq","typ":"Monumento / edificio","hood":"Límite del casco antiguo","lat":36.52607,"lng":-6.288705,"addr":"Plaza de la Constitución, Cádiz","cost":0,"costN":"verla por fuera es gratis; la visita al baluarte/mirador no la verifiqué","dur":0.5,"why":"Marca la entrada al Cádiz antiguo: todo lo que queda adentro es el casco histórico. Hay un mirador en lo alto del baluarte. Es un buen punto para empezar o terminar el Campo del Sur.","tip":"Si llegan en tren, queda de paso.","conf":"baja","tags":["IA","Ruta 2"],"boro":"Cádiz","sub":"A pie desde la estación de tren (unos 5 min)","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[],"refs":[]},{"id":"cad_casa_manteca","n":"Casa Manteca","cat":"comida","typ":"Bar de tapas / taberna","hood":"La Viña","lat":36.5300525,"lng":-6.3035926,"addr":"Calle Corralón de los Carros, 66, Cádiz","cost":15,"costN":"estimado: tapas; Directo al Paladar la cuenta entre los bares más baratos de Cádiz","dur":1,"why":"Es la taberna más conocida de Cádiz y sigue siendo barata. Se pide chicharrones de Cádiz, chacinas, atún en manteca y una manzanilla. La familia abrió en 2023 «Arte Puro», a unos 50 m en la misma calle, con la misma carta y precios, para cuando la original desborda.","tip":"Se come de pie en la barra o en la vereda; se llena al mediodía y de noche: ir temprano. Las fuentes no coinciden en el cierre semanal: confirmar.","refs":["https://andalucia.org/en/cadiz-where-to-eat-taberna-casa-manteca","https://www.planomato.com/es/cadiz/n/arte-puro-casa-manteca","https://www.directoalpaladar.com/viajes/gastroguia-cadiz-mejores-bares-restaurantes-ciudad-para-comer-bien-barato"],"conf":"media","tags":["IA","Ruta 2"],"boro":"Cádiz","sub":"A pie","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"cad_el_faro","n":"El Faro de Cádiz (barra)","gname":"Restaurante El Faro","cat":"comida","typ":"Restaurante","hood":"La Viña","lat":36.528583,"lng":-6.303818,"addr":"Calle San Félix, 15, Cádiz","cost":30,"costN":"estimado; la barra es bastante más barata que el comedor","dur":1.5,"book":"Reserva online para el comedor; para el mismo día, solo por teléfono (+34 956 211 068)","why":"Es la referencia de la cocina gaditana clásica. Se pide tortillitas de camarones, tomate aliñado, papas aliñás con melva y pescado del día. La barra deja probar la misma cocina en tapas sin el precio del comedor.","tip":"Para un gusto razonable: tapas en la barra. Para el comedor, reservar.","refs":["https://www.elfarodecadiz.com/","https://www.hola.com/cocina/noticias/20250530832934/mejores-restaurantes-y-gastronomia-de-cadiz/"],"conf":"alta","tags":["IA","Ruta 2"],"boro":"Cádiz","sub":"A pie","closed":"","free":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"cad_las_flores","n":"Freiduría Las Flores","cat":"comida","typ":"Bar de tapas / taberna","hood":"Centro","lat":36.531078,"lng":-6.297531,"addr":"Plaza Topete, 4, Cádiz","aprox":true,"cost":15,"costN":"estimado: pescado frito por peso o raciones","dur":1,"why":"El pescaíto frito es EL plato de Cádiz y este es el lugar clásico para probarlo. Pedir cazón en adobo, choco, boquerones y tortillitas de camarones. Reseñas de abril de 2026 destacan que la fritura no es grasosa.","tip":"Se puede pedir un cartucho para llevar y comerlo sentados en la plaza. Siempre está llena pero va rápido. Hay una segunda sede (Las Flores II) en la calle Brasil, junto a la playa, fuera del casco.","refs":["https://www.inyourpocket.com/spain/cadiz/venues/freiduria-las-flores","https://andalucia.org/en/cadiz-where-to-eat-freiduria-las-flores","https://gastroranking.es/r/freiduria-las-flores_11413/"],"conf":"media","tags":["IA","Ruta 2"],"boro":"Cádiz","sub":"A pie, junto al Mercado","closed":"","free":"","book":"","main":false,"src":"propuesta","gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"cad_la_sorpresa","n":"Taberna La Sorpresa","cat":"comida","typ":"Bar de tapas / taberna","hood":"Centro (entre Catedral y Plaza de las Flores)","lat":36.53035,"lng":-6.296617,"addr":"Calle Arbolí, 4, Cádiz","cost":25,"costN":"precio medio 20-30 € por persona (según guías)","dur":1.2,"book":"Conviene reservar","why":"Es el lugar para probar el atún de almadraba de la costa de Cádiz (Barbate, Zahara) en tapas. Reseñas de abril de 2026 confirman que sigue abierta. Es un poco más cara que las otras, pero la calidad lo justifica.","tip":"Las fuentes coinciden en que cierra los lunes, pero no es la web oficial: confirmar. Reservar.","refs":["https://gastroranking.es/r/taberna-la-sorpresa_89924/","https://www.directoalpaladar.com/viajes/gastroguia-cadiz-mejores-bares-restaurantes-ciudad-para-comer-bien-barato"],"conf":"media","tags":["IA","Ruta 2"],"boro":"Cádiz","sub":"A pie","closed":"","free":"","main":false,"src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"cad_royalty","n":"Café Royalty","cat":"comida","typ":"Café / pastelería","hood":"Plaza de la Candelaria","lat":36.530932,"lng":-6.295517,"addr":"Plaza de la Candelaria, s/n, Cádiz","cost":8,"costN":"estimado para café y tarta; como restaurante los principales van de 21 a 32 € (carta web)","dur":1,"why":"Cerró en los años 30 y fue restaurado y reabierto; el salón con techos pintados es lo que se viene a ver. Para un café con tarta casera o picatostes a media tarde es un gusto razonable; comer acá es caro.","tip":"Ir a merendar, no a comer. Las mesas de la plaza son cómodas para descansar a mitad de paseo.","refs":["https://www.caferoyalty.com/","https://www.hola.com/cocina/noticias/20250530832934/mejores-restaurantes-y-gastronomia-de-cadiz/"],"conf":"alta","tags":["IA","Ruta 2"],"boro":"Cádiz","sub":"A pie","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"cad_la_guapa","n":"Churrería La Guapa","cat":"comida","typ":"Café / pastelería","hood":"Centro","lat":36.531128,"lng":-6.298171,"addr":"Plaza de la Libertad, 1, Cádiz","cost":3,"costN":"estimado","dur":0.3,"why":"Fundada a fines del siglo XIX por Carmen Pecci, apodada «La Guapa». Hace dos tipos de churros: finos y gordos (masa más ligera). Es el desayuno gaditano típico antes de entrar al Mercado.","tip":"No tiene mesas: se compran y se comen con café en un bar de la plaza que lo permita. Ir temprano, por la mañana.","refs":["https://www.salir.com/los-mejores-churros-de-cadiz-art-1789.html","https://theculturetrip.com/europe/spain/articles/the-best-places-for-churros-in-cadiz"],"conf":"media","tags":["IA","Ruta 2"],"boro":"Cádiz","sub":"A pie, en la Plaza de la Libertad","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"cad_la_manzanilla","n":"Taberna La Manzanilla","cat":"comida","typ":"Bar de tapas / taberna","hood":"Centro (Plaza de la Candelaria)","lat":36.53165,"lng":-6.294153,"addr":"Calle Feduchy, 9, Cádiz","cost":4,"costN":"estimado: una copa","dur":0.5,"why":"Es para tomar un vino, no para comer: barricas, azulejos y casi un siglo sin cambiar. Sirve como aperitivo de Jerez antes de ir a las bodegas.","tip":"Pedir una manzanilla en rama. Hay poco lugar para sentarse.","refs":["https://www.directoalpaladar.com/viajes/gastroguia-cadiz-mejores-bares-restaurantes-ciudad-para-comer-bien-barato"],"conf":"media","tags":["IA","Ruta 2"],"boro":"Cádiz","sub":"A pie","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"jer_tio_pepe","n":"Bodegas Tío Pepe (González Byass)","gname":"Bodegas Tío Pepe","cat":"comida","typ":"Bodega (vino)","hood":"Centro (junto al Alcázar)","lat":36.680899,"lng":-6.14314,"addr":"Calle Manuel María González, 12, Jerez de la Frontera","cost":26.9,"costN":"«Tio Pepe experience» 26,90 € por adulto, 1 h 30 min, en español (web oficial). Hay versiones con más vinos y tapas por algo más","dur":1.5,"main":true,"book":"Reservar online en tiopepe.com","why":"La visita recorre las bodegas centenarias, explica cómo se hace el jerez y termina con cata. Queda pegada al Alcázar y la Catedral, así que se arma el día sin moverse del centro. La ruta pide «Jerez (bodegas)» y esta es la más completa para una primera vez.","tip":"Hay que pedir el idioma español al reservar. Son 1 h 30 min mayormente de pie y caminando por la bodega: llano.","season":"Semana Mundial del Enoturismo 2026: 2-8 de noviembre, con visitas especiales en las bodegas del Marco de Jerez.","refs":["https://www.tiopepe.com/es-en/experiences/tio-pepe-experience"],"conf":"alta","tags":["IA","Ruta 2","Itinerario","Excursión"],"boro":"Jerez","sub":"Tren Cercanías C-1 Cádiz–Jerez (unos 40 min, de memoria); desde la estación de Jerez, unos 1,5 km a pie o taxi","closed":"","free":"","src":"propuesta","aprox":false,"must":0,"rate":0,"warn":[]},{"id":"jer_lustau","n":"Bodegas Lustau","cat":"comida","typ":"Bodega (vino)","hood":"Centro","lat":36.684578,"lng":-6.130719,"addr":"Calle Arcos, 53, Jerez de la Frontera","cost":18,"costN":"visita estándar 18 € con cinco vinos y un vermut; completa 28 € (Lonely Planet, sin confirmar en la web oficial)","dur":1,"book":"Reservar con anticipación","why":"Más chica e íntima que Tío Pepe y con fama de dar mucha cata por el precio: visita de una hora y cinco jereces. Es la alternativa si quieren ver una segunda bodega o algo menos turístico.","tip":"Queda cerca de la estación: se puede hacer al llegar o antes de volver.","refs":["https://andalucia.org/en/jerez-de-la-frontera-visitas-bodegas-lustau","https://www.frommers.com/destinations/jerez-de-la-frontera/attractions/bodegas-lustau"],"conf":"media","tags":["IA","Ruta 2","Itinerario","Excursión"],"boro":"Jerez","sub":"Tren Cercanías C-1 Cádiz–Jerez (unos 40 min, de memoria); desde la estación de Jerez, unos 700 m a pie (la más cercana a la estación)","closed":"","free":"","main":false,"src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"jer_real_escuela","n":"Real Escuela Andaluza del Arte Ecuestre","cat":"teatro","typ":"Espectáculo","hood":"Norte del centro (Palacio del Recreo de las Cadenas)","lat":36.693427,"lng":-6.136436,"addr":"Avenida Duque de Abrantes, s/n, Jerez de la Frontera (de memoria; OpenStreetMap da calle Pizarro)","cost":21,"costN":"general 21 €, preferente 27 € (andalucia.org, tarifas posiblemente viejas); revendedores desde 18 €","dur":1.5,"main":true,"book":"Imprescindible comprar la entrada con anticipación","why":"Es el otro emblema de Jerez además del vino: caballos de pura raza española con jinetes de traje goyesco, coreografiados con música española, unos 90 minutos. Los días sin función se pueden ver los entrenamientos y los museos del arte ecuestre y del enganche.","tip":"El espectáculo es solo algunos días de la semana y cambia con la temporada: elegir el día de la excursión según el calendario. Butacas en gradas.","season":"Los días de función cambian según el mes: verificar el calendario oficial al fijar la fecha.","refs":["https://www.realescuela.org/visitas-y-exhibiciones/exhibicion-como-bailan-los-caballos-andaluces/","https://andalucia.org/en/jerez-de-la-frontera-cultural-tourism-fundacion-real-escuela-andaluza-del-arte-ecuestre","https://www.atrapalo.com/entradas/como-bailan-los-caballos-andaluces-en-jerez_e38212/"],"conf":"media","tags":["IA","Ruta 2","Excursión"],"boro":"Jerez","sub":"Tren Cercanías C-1 Cádiz–Jerez (unos 40 min, de memoria); desde la estación de Jerez, unos 1,7 km a pie o taxi","closed":"","free":"","src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"warn":[]},{"id":"jer_alcazar","n":"Alcázar de Jerez","gname":"Alcázar de Jerez de la Frontera","cat":"arq","typ":"Palacio / castillo","hood":"Centro","lat":36.680769,"lng":-6.139869,"addr":"Calle del Aire / Alameda Vieja, Jerez de la Frontera","cost":5,"costN":"general 5 €; pensionistas 1,80 € (folleto municipal de 2020, puede haber cambiado)","dur":1.2,"main":true,"free":"Lunes, una hora a mediodía, gratis (folleto municipal de 2020; la hora cambia según la estación)","why":"Es lo más antiguo de Jerez: la mezquita convertida en capilla, los baños árabes y los jardines se ven en una hora. Queda al lado de Tío Pepe y de la Catedral.","tip":"La cámara oscura obliga a subir a la torre por escalera. Jardines con sombra para descansar entre bodega y bodega.","refs":["https://www.jerez.es/fileadmin/Documentos/Alcazar/08-Agosto_y_Sept_2020/AUGUST_AND_SEPTEMBER_2020_OPENING_HOURS.pdf"],"conf":"media","tags":["IA","Ruta 2","Excursión"],"boro":"Jerez","sub":"Tren Cercanías C-1 Cádiz–Jerez (unos 40 min, de memoria); desde la estación de Jerez, unos 1,2 km a pie","closed":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"jer_catedral","n":"Catedral de Jerez","gname":"Catedral de San Salvador","cat":"arq","typ":"Iglesia / templo","hood":"Centro","lat":36.681911,"lng":-6.140936,"addr":"Plaza de la Encarnación, s/n, Jerez de la Frontera","cost":null,"costN":"Precio sin verificar. precio no verificado (revendedores desde unos US$15 con audioguía; la entrada combina con la iglesia de San Miguel)","dur":0.75,"why":"Está entre el Alcázar y Tío Pepe: verla por fuera no cuesta nada y la escalinata es una de las fotos de Jerez.","tip":"Por fuera alcanza si el día viene cargado. La escalinata es grande, pero hay acceso lateral.","refs":["https://www.tiqets.com/es/entradas-catedral-de-jerez-l271024"],"conf":"baja","tags":["IA","Ruta 2","Excursión"],"boro":"Jerez","sub":"Tren Cercanías C-1 Cádiz–Jerez (unos 40 min, de memoria); desde la estación de Jerez, unos 1,3 km a pie","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"jer_el_pasaje","n":"Tabanco El Pasaje","cat":"comida","typ":"Bar de tapas / taberna","hood":"Centro (cerca de Plaza del Arenal)","lat":36.68283,"lng":-6.136203,"addr":"Calle Santa María, 8, Jerez de la Frontera (OpenStreetMap lo ubica sobre la calle Mesones, en la esquina)","cost":20,"costN":"estimado: jerez a copa y tapas","dur":1.5,"why":"Es la forma más jerezana de comer: jerez de barril, tapas de chicharrones o guisos, y flamenco sin micrófonos que arranca en cualquier momento. Un artículo de mayo de 2026 confirma que sigue igual.","tip":"Para el flamenco hay pases fijos: preguntar en el local al llegar a Jerez. Se llena; mesas pocas.","refs":["https://www.pelliclemag.com/home/2026/5/18/do-you-play-flamenco-music-dancing-and-sherry-in-jerez-tabanco-bars","https://andalucia.org/en/jerez-de-la-frontera-where-to-eat-tabanco-el-pasaje","https://gastroranking.es/r/tabanco-el-pasaje_864/"],"conf":"media","tags":["IA","Ruta 2","Excursión"],"boro":"Jerez","sub":"Tren Cercanías C-1 Cádiz–Jerez (unos 40 min, de memoria); desde la estación de Jerez, unos 900 m a pie","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"vej_casco","n":"Casco histórico y murallas de Vejer","cat":"barrio","typ":"Pueblo para caminar","hood":"Recinto amurallado","lat":36.253607,"lng":-5.962731,"addr":"Recinto amurallado (punto de referencia: Plaza de España), Vejer","aprox":true,"cost":0,"costN":"gratis","dur":3,"main":true,"why":"La oficina de turismo propone un recorrido de un día que se hace a pie: La Plazuela, Mirador de la Cobijada, Puerta Cerrada, el Castillo, el Arco de las Monjas, la Iglesia del Divino Salvador, el Arco de la Segur, la Plaza de España y la calle Corredera, que es un mirador natural sobre el campo. Se conservan los cuatro arcos originales: Segur, Villa, Sancho IV y Puerta Cerrada.","tip":"Es TODO cuesta: calles empinadas y empedradas. Calzado firme, pausas y agua. Empezar por la Oficina de Turismo para el plano gratuito.","season":"En verano hace mucho calor y el pueblo tiene poca sombra: caminarlo a la mañana.","refs":["https://turismovejer.es/vejer-en-un-dia/"],"conf":"alta","tags":["IA","Ruta 2","Itinerario","Excursión"],"boro":"Vejer","sub":"Bus Cádiz–Vejer (Transportes Comes, integrado en el Consorcio de Transporte de la Bahía de Cádiz, 44 km). En el pueblo, el apeadero de la Av. Los Remedios queda a unos 500 m en subida de la Plaza de España","closed":"","free":"","book":"","src":"propuesta","gname":"","must":0,"rate":0,"warn":[]},{"id":"vej_plaza_espana","n":"Plaza de España de Vejer","gname":"Plaza de España","cat":"arq","typ":"Monumento / edificio","hood":"Debajo del recinto amurallado","lat":36.253607,"lng":-5.962731,"addr":"Plaza de España, Vejer de la Frontera","cost":0,"costN":"gratis","dur":0.5,"main":true,"why":"Es el centro social del pueblo: terrazas, bancos y la fuente de mediados del siglo XX que es la foto clásica de Vejer. Buen punto para sentarse a descansar después de las cuestas.","tip":"Lugar para el café o la comida al aire libre.","refs":["https://turismovejer.es/vejer-en-un-dia/","https://www.barcelo.com/guia-turismo/es/espana/cadiz/que-ver/vejer-de-la-frontera/"],"conf":"alta","tags":["IA","Ruta 2","Excursión"],"boro":"Vejer","sub":"Bus Cádiz–Vejer (Transportes Comes, integrado en el Consorcio de Transporte de la Bahía de Cádiz, 44 km). En el pueblo, el apeadero de la Av. Los Remedios queda a unos 500 m en subida de la Plaza de España","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"vej_castillo","n":"Castillo de Vejer","cat":"arq","typ":"Palacio / castillo","hood":"Recinto amurallado","lat":36.252795,"lng":-5.963537,"addr":"Calle Castillo, Vejer de la Frontera","cost":null,"costN":"Precio sin verificar. no verificado","dur":0.5,"why":"Desde las almenas del patio de armas se ve todo el pueblo blanco y el campo hasta la costa. Fue residencia de los duques de Medina Sidonia; la puerta en arco de herradura es el resto árabe más apreciado.","tip":"Es el punto más alto: subir con calma. La visita es corta.","refs":["https://turismovejer.es/vejer-en-un-dia/"],"conf":"alta","tags":["IA","Ruta 2","Excursión"],"boro":"Vejer","sub":"Bus Cádiz–Vejer (Transportes Comes, integrado en el Consorcio de Transporte de la Bahía de Cádiz, 44 km). En el pueblo, el apeadero de la Av. Los Remedios queda a unos 500 m en subida de la Plaza de España","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"vej_divino_salvador","n":"Iglesia del Divino Salvador","cat":"arq","typ":"Iglesia / templo","hood":"Recinto amurallado","lat":36.253991,"lng":-5.964416,"addr":"Calle del Piostigo, Vejer de la Frontera","cost":null,"costN":"Precio sin verificar. no verificado","dur":0.4,"why":"Se ven las dos etapas de la iglesia: cabecera gótico-mudéjar del XIV y ampliación gótica de fines del XV, más el retablo mayor de cedro de Francisco de Villegas (siglo XVII). El campanario es el antiguo minarete.","tip":"Al rodearla se llega al Arco de la Segur y al Arco de las Monjas, que son las otras dos fotos del pueblo.","refs":["https://turismovejer.es/vejer-en-un-dia/"],"conf":"alta","tags":["IA","Ruta 2","Excursión"],"boro":"Vejer","sub":"Bus Cádiz–Vejer (Transportes Comes, integrado en el Consorcio de Transporte de la Bahía de Cádiz, 44 km). En el pueblo, el apeadero de la Av. Los Remedios queda a unos 500 m en subida de la Plaza de España","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"vej_cobijada","n":"Mirador de la Cobijada","gname":"Mirador de las Cobijadas","cat":"mirador","typ":"Mirador","hood":"Junto a la muralla","lat":36.252432,"lng":-5.964317,"addr":"Mirador de las Cobijadas, Vejer de la Frontera","cost":0,"costN":"gratis","dur":0.3,"why":"El traje (manto y saya negros, de origen castellano de los siglos XVI-XVII) es el símbolo del pueblo, y el mirador da una de las mejores vistas. Queda en el camino natural de La Plazuela al casco amurallado.","tip":"Parada rápida con vista; tiene fuente de agua.","refs":["https://turismovejer.es/vejer-en-un-dia/"],"conf":"alta","tags":["IA","Ruta 2","Excursión"],"boro":"Vejer","sub":"Bus Cádiz–Vejer (Transportes Comes, integrado en el Consorcio de Transporte de la Bahía de Cádiz, 44 km). En el pueblo, el apeadero de la Av. Los Remedios queda a unos 500 m en subida de la Plaza de España","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"vej_mercado_san_francisco","n":"Mercado de San Francisco","cat":"comida","typ":"Mercado","hood":"La Plazuela","lat":36.254115,"lng":-5.965908,"addr":"Calle San Francisco, Vejer de la Frontera","cost":15,"costN":"estimado","dur":1,"why":"Permite que cada uno elija lo que quiere en distintos puestos, sin pagar un restaurante. Queda en La Plazuela, la entrada al casco viniendo del bus.","tip":"Probar las tortas vejeriegas y el atún de la costa cercana. Una reseña de octubre de 2025 dice que no todo está al mismo nivel: mirar antes de pedir.","refs":["https://gastroranking.es/r/mercado-de-san-francisco_148411/"],"conf":"media","tags":["IA","Ruta 2","Excursión"],"boro":"Vejer","sub":"Bus Cádiz–Vejer (Transportes Comes, integrado en el Consorcio de Transporte de la Bahía de Cádiz, 44 km). En el pueblo, el apeadero de la Av. Los Remedios queda a unos 500 m en subida de la Plaza de España","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"mal_alcazaba","n":"Alcazaba de Málaga","cat":"arq","typ":"Palacio / castillo","hood":"Centro Histórico","lat":36.72118144,"lng":-4.41574649,"addr":"Calle Alcazabilla 2, Málaga","cost":3,"costN":"General 7 €; reducida 3 € para ciudadanos UE mayores de 65 o jubilados (llevar pasaporte/DNI). Conjunta con Gibralfaro: 10 € / reducida 5 €","dur":1.5,"main":true,"free":"Domingos desde las 14:00 (según la web oficial, 'actualmente')","why":"Es el monumento más importante de Málaga: palacio nazarí-taifa con patios, fuentes y dos recintos amurallados, con vistas al puerto. Es un aperitivo de la Alhambra que van a ver en Granada, a menor escala y sin la batalla por la entrada.","tip":"Comprar la entrada CONJUNTA con Gibralfaro: con pasaporte español y más de 65 sale 5 € por persona. El recorrido es en subida, con rampas empedradas y escalones de piedra resbaladizos: calzado con suela que agarre. El domingo a la tarde gratis = mucha gente.","refs":["https://alcazabaygibralfaro.malaga.eu/es/visitas/horarios-y-tarifas/","https://es.wikipedia.org/wiki/Alcazaba_de_M%C3%A1laga"],"conf":"alta","tags":["IA","Ruta 2","Itinerario"],"boro":"Málaga","sub":"A pie desde el centro; la entrada está en calle Alcazabilla, junto al Teatro Romano","closed":"","book":"","src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"mal_gibralfaro","n":"Castillo de Gibralfaro","cat":"mirador","typ":"Mirador","hood":"Monte Gibralfaro","lat":36.72322259,"lng":-4.411637,"addr":"Camino de Gibralfaro 11, Málaga","cost":0,"costN":"Incluido en la entrada conjunta con la Alcazaba (10 € / reducida 5 €); sola: 7 € / reducida 3 €","dur":1.5,"main":true,"free":"Domingos desde las 14:00 (web oficial)","why":"La vista más completa de Málaga: la plaza de toros, el puerto, la catedral y la costa desde lo alto de las murallas. Tiene un pequeño centro de interpretación sobre la guarnición militar.","tip":"El plan dice 'subida a pie': es una cuesta empinada con tramos de escalones, unos 20-30 minutos sin sombra. Para gente de 70 que camina mucho es posible, pero se hace temprano o en día fresco y con agua. Alternativa: subir en bus o taxi y BAJAR caminando, que cansa mucho menos. El Mirador de Gibralfaro, a mitad de la cuesta, tiene bancos.","refs":["https://alcazabaygibralfaro.malaga.eu/es/visitas/horarios-y-tarifas/","https://es.wikipedia.org/wiki/Castillo_de_Gibralfaro"],"conf":"alta","tags":["IA","Ruta 2","Itinerario"],"boro":"Málaga","sub":"Subida a pie desde la Alcazaba/Paseo de Reding, o bus EMT que sube al castillo (línea 35 según guías, no verificada en fuente oficial)","closed":"","book":"","src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"mal_atarazanas","n":"Mercado Central de Atarazanas","cat":"comida","typ":"Mercado","hood":"Centro Histórico","lat":36.718408,"lng":-4.4240607,"addr":"Calle Atarazanas 10, Málaga","cost":10,"costN":"Tapa de pescaíto frito 3-6 € en las barras laterales (estimado de guías)","dur":1.0,"main":true,"why":"La puerta de entrada es un arco nazarí del siglo XIV que sobrevivió del antiguo astillero (eso significa 'atarazanas'), y adentro hay un gran vitral con la historia de la ciudad. Es el lugar para comprar fruta, pescado, aceitunas y queso para el Airbnb, y para comer boquerones fritos en la barra.","tip":"Ir a la mañana: el pescado se ve mejor antes de las 11 y por la tarde está cerrado. Las barras de tapas son de pie, a los codazos y hay que pedir en voz alta. Según las guías cierra los domingos (no lo leí en fuente oficial).","refs":["https://doeatbetterexperience.com/es/blog/mercado-atarazanas-malaga/","https://www.barcelo.com/guia-turismo/es/espana/malaga/que-ver/mercado-de-ataranzas/"],"conf":"media","tags":["IA","Ruta 2","Itinerario"],"boro":"Málaga","sub":"A pie desde la Alameda Principal / calle Larios","closed":"","free":"","book":"","src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"mal_teatro_romano","n":"Teatro Romano de Málaga","cat":"arq","typ":"Monumento / edificio","hood":"Centro Histórico","lat":36.72118868,"lng":-4.41687142,"addr":"Calle Alcazabilla s/n, Málaga","cost":0,"costN":"Gratis (Junta de Andalucía)","dur":0.5,"main":true,"closed":"lunes","why":"Estuvo enterrado bajo un edificio hasta 1951 y hoy se ve entero desde la calle, con la Alcazaba encima: es la foto clásica de Málaga. El centro de interpretación explica en 15 minutos cómo funcionaba.","tip":"Se combina con la Alcazaba sin moverse: misma calle. Gradas de piedra sin barandas; se puede ver todo desde abajo.","refs":["https://www.juntadeandalucia.es/aaiicc/enclaves/enclave-arqueologico-teatro-romano-de-malaga","https://es.wikipedia.org/wiki/Teatro_romano_de_M%C3%A1laga"],"conf":"alta","tags":["IA","Ruta 2"],"boro":"Málaga","sub":"A pie; calle Alcazabilla, al lado de la Alcazaba","free":"","book":"","src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"mal_catedral","n":"Catedral de Málaga ('La Manquita')","gname":"Santa Iglesia Catedral Basílica de la Encarnación","cat":"arq","typ":"Iglesia / templo","hood":"Centro Histórico","lat":36.720042,"lng":-4.42012,"addr":"Calle Molina Lario 9, Málaga","cost":9,"costN":"General 10 €; mayores de 65: 9 € (con audioguía)","dur":1.0,"main":true,"why":"La llaman 'la Manquita' porque le falta la segunda torre: la plata se desvió, según la tradición, a la independencia de EE.UU. Adentro, la sillería del coro tallada en parte por Pedro de Mena y unas bóvedas altísimas.","tip":"Los fines de semana no se visita durante la misa. La subida a las cubiertas (más de 200 escalones de caracol) está suspendida por obras en el tejado según su web: no contar con ella.","refs":["https://malagacatedral.com/visita-cultural/tarifas-y-horarios/","https://malagacatedral.com/visita-cultural/visita-a-las-cubiertas-de-la-catedral/"],"conf":"alta","tags":["IA","Ruta 2"],"boro":"Málaga","sub":"A pie; a dos cuadras de calle Larios","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"mal_museo_picasso","n":"Museo Picasso Málaga","cat":"museo","typ":"Museo de arte","hood":"Centro Histórico","lat":36.721771,"lng":-4.41847,"addr":"Palacio de Buenavista, Calle San Agustín 8, Málaga","cost":11,"costN":"General 13 €; reducida 11 € para mayores de 65","dur":1.5,"main":true,"free":"Domingos, las dos últimas horas de apertura (la taquilla cierra media hora antes); también 28/2, 18/5, 27/9 y 27/10","why":"Recorre toda la vida de Picasso, que nació a 300 m de acá, con obras que la familia eligió para su ciudad natal. En el sótano se ven restos fenicios y romanos encontrados al hacer el museo.","tip":"El domingo gratis se llena: si les da lo mismo, mejor pagar la reducida un día de semana a primera hora. Tiene bancos en las salas y ascensor.","refs":["https://www.museopicassomalaga.org/visita"],"conf":"alta","tags":["IA","Ruta 2"],"boro":"Málaga","sub":"A pie; calle San Agustín, entre la catedral y la Alcazaba","closed":"","book":"","src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"mal_merced","n":"Plaza de la Merced y Casa Natal de Picasso","gname":"Fundación Picasso Museo Casa Natal","cat":"barrio","typ":"Barrio / paseo","hood":"La Merced","lat":36.7240728,"lng":-4.417559,"addr":"Plaza de la Merced 15, Málaga","cost":0,"costN":"La plaza es gratis; la Casa Natal cobra entrada (precio no verificado)","dur":0.75,"main":true,"why":"La plaza es la sala de estar del centro: bancos a la sombra, una estatua de Picasso sentado en uno de ellos y terrazas. En la esquina está el piso donde nació, con objetos de la familia y obra gráfica.","tip":"Buen lugar para descansar entre la Alcazaba y el centro: bancos con sombra. La Casa Natal es chica (45 min alcanza).","refs":["https://es.wikipedia.org/wiki/Museo_Casa_Natal_de_Picasso"],"conf":"media","tags":["IA","Ruta 2"],"boro":"Málaga","sub":"A pie desde la Alcazaba (5 min)","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"mal_museo_malaga","n":"Museo de Málaga (Palacio de la Aduana)","cat":"museo","typ":"Museo de arte","hood":"Centro","lat":36.71989879,"lng":-4.41713096,"addr":"Plaza de la Aduana s/n, Málaga","cost":0,"costN":"Gratis para ciudadanos de la UE (según guías; no leído en la web oficial)","dur":1.5,"why":"Pintura andaluza del siglo XIX y una sala arqueológica con piezas fenicias, romanas y árabes de la provincia. Con pasaporte español no cuesta nada, y el patio central con columnas es un remanso.","tip":"Ideal para la tarde de calor o de lluvia. Llevar el pasaporte. Tiene ascensores.","refs":["https://es.wikipedia.org/wiki/Museo_de_M%C3%A1laga","https://www.salir.com/museos-gratis-en-malaga-art-2972.html"],"conf":"media","tags":["IA","Ruta 2"],"boro":"Málaga","sub":"A pie; frente al Paseo del Parque, al lado de la Alcazaba","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"mal_thyssen","n":"Museo Carmen Thyssen Málaga","cat":"museo","typ":"Museo de arte","hood":"Centro Histórico","lat":36.7215964,"lng":-4.4228895,"addr":"Calle Compañía 10, Málaga","cost":8,"costN":"General 12 €; reducida 8 € (no leí quiénes entran en la reducida); con yacimiento 15 / 10 €","dur":1.5,"closed":"lunes","why":"La mejor colección de pintura andaluza costumbrista: bandoleros, ferias, patios y paisajes de Sevilla y Granada del siglo XIX, justo antes de que vayan a verlos en persona. Edificio de palacio renacentista con patio.","tip":"Museo mediano, recorrible en hora y media sin agotarse. Preguntar en taquilla si aplica la reducida por edad.","refs":["https://www.carmenthyssenmalaga.org/visita"],"conf":"alta","tags":["IA","Ruta 2"],"boro":"Málaga","sub":"A pie; calle Compañía, a una cuadra de la Plaza de la Constitución","free":"","book":"","main":false,"src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"mal_pompidou","n":"Centre Pompidou Málaga","cat":"museo","typ":"Museo de arte","hood":"Muelle Uno","lat":36.7190384,"lng":-4.413261,"addr":"Pasaje Doctor Carrillo Casaux s/n, Muelle Uno, Málaga","cost":4,"costN":"Permanente 7 € / reducida 4 € (mayores de 65); permanente + temporal 9 € / 5,50 €","dur":1.25,"closed":"martes","free":"Domingos desde las 16:00 hasta el cierre; 18/5 y 27/9","why":"Arte del siglo XX (Picasso, Miró, Frida Kahlo, Bacon) en una colección que rota, en un espacio subterráneo chico y sin cansancio. El cubo de colores es la referencia visual del puerto.","tip":"Cierra los MARTES, no los lunes como casi todo. Se combina con el paseo por el Muelle Uno.","refs":["https://centrepompidou-malaga.eu/visita/"],"conf":"alta","tags":["IA","Ruta 2"],"boro":"Málaga","sub":"A pie; Muelle Uno, al final del Paseo del Parque","book":"","main":false,"src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"mal_muelle_parque","n":"Paseo del Parque, Muelle Uno y La Farola","cat":"parque","typ":"Parque / jardín","hood":"Centro / La Malagueta","lat":36.7201618,"lng":-4.4142161,"addr":"Paseo del Parque, Málaga","cost":0,"dur":1.5,"main":true,"why":"Un kilómetro de jardín botánico al aire libre (palmeras, ficus gigantes) seguido del muelle con barcos y del faro 'La Farola', y al final la playa de La Malagueta. Es la caminata plana por excelencia de Málaga.","tip":"Todo llano y lleno de bancos. Ideal al atardecer, después de la Alcazaba que queda justo encima.","refs":["https://es.wikipedia.org/wiki/La_Farola_de_M%C3%A1laga"],"conf":"media","tags":["IA","Ruta 2"],"boro":"Málaga","sub":"A pie desde la Alameda; el paseo es plano","costN":"","closed":"","free":"","book":"","src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"mal_larios","n":"Calle Larios y centro histórico","gname":"Calle Marqués de Larios","cat":"barrio","typ":"Barrio / paseo","hood":"Centro Histórico","lat":36.71982778,"lng":-4.42162222,"addr":"Calle Marqués de Larios, Málaga","cost":0,"dur":1.5,"main":true,"why":"Calle peatonal de mármol pulido con edificios de fines del XIX iguales entre sí, que desemboca en la Plaza de la Constitución, la plaza mayor desde la época musulmana. Alrededor, calle Granada y las callecitas de bares.","tip":"El mármol de Larios resbala mucho cuando está mojado. Plano en toda su extensión.","refs":["https://es.wikipedia.org/wiki/Calle_Marqu%C3%A9s_de_Larios"],"conf":"media","tags":["IA","Ruta 2"],"boro":"Málaga","sub":"A pie; empieza en la Alameda Principal","costN":"","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"mal_concepcion","n":"Jardín Botánico-Histórico La Concepción","cat":"parque","typ":"Parque / jardín","hood":"Ciudad Jardín","lat":36.7624626,"lng":-4.426552,"addr":"Camino del Jardín Botánico 3, Málaga","cost":3.1,"costN":"General 5,20 €; reducida 3,10 € para jubilados y pensionistas","dur":2.5,"closed":"lunes","free":"Domingos: octubre-marzo de 14:00 al cierre; abril-septiembre desde las 16:30 (web oficial)","why":"Uno de los jardines tropicales más importantes de Europa: bosque de palmeras, cascadas, una glorieta-mirador sobre la ciudad y un museo arqueológico al aire libre de los Loring. Es media jornada de verde, lejos del turismo del centro.","tip":"Está en ladera: los senderos suben y bajan, con bancos frecuentes. Llevar agua. Ojo con la caminata de 15 min desde el bus; el bus turístico 91 deja en la puerta.","season":"Primavera: floración plena. Otoño también vale; en verano mejor temprano.","refs":["https://laconcepcion.malaga.eu/es/visitas/","https://laconcepcion.malaga.eu/"],"conf":"alta","tags":["IA","Ruta 2"],"boro":"Málaga","sub":"Bus EMT línea 20 hasta la última parada y 15 min a pie; o el bus turístico línea 91 desde la estación de tren/bus (web oficial)","book":"","main":false,"src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"warn":[]},{"id":"mal_pedregalejo","n":"Paseo marítimo de Pedregalejo y El Palo","cat":"barrio","typ":"Barrio / paseo","hood":"Pedregalejo","lat":36.7208974,"lng":-4.3751813,"addr":"Paseo Marítimo El Pedregal, Málaga","cost":0,"dur":2.0,"why":"La Málaga de los malagueños: casitas bajas de pescadores, barcas en la arena y chiringuitos con espetos de sardinas asadas en barcas con brasas. Paseo plano de unos 3 km hasta El Palo.","tip":"Caminar a la tarde y quedarse a comer espetos. Todo llano y con bancos frente al mar.","refs":["https://es.wikipedia.org/wiki/Pedregalejo"],"conf":"media","tags":["IA","Ruta 2"],"boro":"Málaga","sub":"Bus EMT hacia El Palo por el paseo marítimo (línea 11 según guías; no verificada)","costN":"","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"mal_el_pimpi","n":"Bodega El Pimpi","cat":"comida","typ":"Restaurante","hood":"Centro Histórico","lat":36.7217974,"lng":-4.4180421,"addr":"Calle Granada 62, Málaga","cost":25,"costN":"Raciones para compartir 10-20 € (estimado)","dur":1.5,"main":true,"why":"La bodega emblemática de Málaga: un laberinto de salas con barricas firmadas (Antonio Banderas, la familia de Picasso) y terraza mirando a la Alcazaba. Para probar el vino dulce de Málaga con jamón, queso o ensaladilla.","tip":"Turística pero auténtica. Pedir una copa de moscatel o 'Pajarete'. La terraza frente al Teatro Romano es el lugar; ir fuera de hora pico.","refs":["https://www.directoalpaladar.com/viajes/esta-historica-bodega-andaluza-ha-sido-elegida-como-uno-restaurantes-legendarios-mundo","https://visita.malaga.eu/convention-bureau/en/auxiliar-services/bodega-el-pimpi-p103621","https://www.elpimpi.com"],"conf":"media","tags":["IA","Ruta 2"],"boro":"Málaga","sub":"A pie; calle Granada, frente al Teatro Romano","closed":"","free":"","book":"","src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"mal_casa_lola","n":"Casa Lola","cat":"comida","typ":"Bar de tapas / taberna","hood":"Centro Histórico","lat":36.7224406,"lng":-4.4203092,"addr":"Calle Granada 46, Málaga (hay otros locales en calle Strachan y plaza Uncibay)","aprox":true,"cost":18,"costN":"Tapas 3-5 € (estimado)","dur":1.0,"why":"Tapas malagueñas de manual a precio razonable: ajoblanco, croquetas, berenjenas con miel, montaditos. Es la forma barata de comer de pie o en mesa alta en el centro.","tip":"Se llena: ir entre la comida y la cena (17-19 h) para no hacer cola. Hay taburetes altos; si quieren silla baja, preguntar por mesa.","refs":["https://malagaguru.com/eat-drink/casa-lola/","https://www.casalola.es"],"conf":"media","tags":["IA","Ruta 2"],"boro":"Málaga","sub":"A pie; calle Granada","closed":"","free":"","book":"","main":false,"src":"propuesta","gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"mal_casa_guardia","n":"Antigua Casa de Guardia","cat":"comida","typ":"Bar de tapas / taberna","hood":"Centro","lat":36.7178132,"lng":-4.4233107,"addr":"Alameda Principal 18, Málaga",
