"cost":6,"costN":"Copa de vino 2-3 €; tapitas de marisco aparte (estimado)","dur":0.5,"main":true,"why":"La taberna más antigua de Málaga: barra de madera, barricas en la pared y el camarero que escribe con tiza lo que tomaste. Es una parada de media hora para probar moscatel, Pedro Ximénez o 'Pajarete' antes de comer.","tip":"No es para sentarse a comer: es de pie, con tapitas de mejillones o gambas. Ideal camino del Mercado de Atarazanas, que está a dos cuadras.","refs":["https://www.andalucia.org/en/malaga-where-to-eat-antigua-casa-de-guardia","https://theeuropeanbarguide.com/antigua-case-de-guardia-malaga/","https://www.antiguacasadeguardia.com"],"conf":"media","tags":["IA","Ruta 2"],"boro":"Málaga","sub":"A pie; Alameda Principal, esquina calle Pastora","closed":"","free":"","book":"","src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"mal_el_tintero","n":"El Tintero","cat":"comida","typ":"Restaurante","hood":"El Palo","lat":36.7168885,"lng":-4.3480936,"addr":"Avenida Salvador Allende 340, Málaga","cost":25,"costN":"Platos de pescado 8-15 € cada uno (estimado)","dur":1.5,"why":"Un clásico malagueño: no hay carta, los camareros pasan con bandejas cantando lo que llevan y uno levanta la mano. Pescaíto frito, espetos de sardinas, paella; la cuenta se hace contando platos.","tip":"Las reseñas están divididas: el 'show' depende de que esté lleno, y algunos lo encuentran caro. Ir un fin de semana al mediodía para verlo en su salsa. Se combina con el paseo de Pedregalejo.","refs":["https://malagaguru.com/eat-drink/el-tintero/","https://www.restauranteeltintero.com"],"conf":"media","tags":["IA","Ruta 2"],"boro":"Málaga","sub":"Bus EMT hacia El Palo (no verificado)","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"mal_casa_aranda","n":"Casa Aranda","cat":"comida","typ":"Café / pastelería","hood":"Centro Histórico","lat":36.7187929,"lng":-4.4234163,"addr":"Calle Herrería del Rey 3, Málaga","cost":5,"costN":"Chocolate con churros 4-6 € (estimado)","dur":0.5,"main":true,"why":"La churrería más antigua de Málaga, con la misma receta desde 1932, y 45 empleados que corren entre las mesas de un callejón entero. Se combina con el mercado de al lado.","tip":"Pedir 'tejeringos' (así llaman a los churros en Málaga) con chocolate. Y un café pedido a la malagueña: 'mitad' o 'nube'.","refs":["https://www.elespanol.com/malaga/vivir/gastronomia/20260225/casa-aranda-templo-churros-malaga-sin-turistas-no-empleados/1003744144030_0.html","https://malagaguru.com/eat-drink/casa-aranda/"],"conf":"media","tags":["IA","Ruta 2"],"boro":"Málaga","sub":"A pie; junto al Mercado de Atarazanas","closed":"","free":"","book":"","src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"mal_cafe_con_libros","n":"Café con Libros","cat":"comida","typ":"Café / pastelería","hood":"La Merced","lat":36.7236167,"lng":-4.4170232,"addr":"Plaza de la Merced 19, Málaga","cost":6,"costN":"Café y tostada 4-7 € (estimado)","dur":0.75,"why":"Un café tranquilo con paredes de libros que se pueden leer en la mesa, y terraza a la plaza. Desayuno de tostadas, zumos y crepes.","tip":"Buena parada antes o después de subir a la Alcazaba y Gibralfaro, que están a 5 minutos.","refs":["https://www.malagaguru.com/eat-drink/cafe-con-libros/","https://theculturetrip.com/articles/the-5-best-cafes-in-malaga"],"conf":"media","tags":["IA","Ruta 2"],"boro":"Málaga","sub":"A pie; Plaza de la Merced","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"ron_puente_nuevo","n":"Puente Nuevo y el Tajo de Ronda","cat":"mirador","typ":"Mirador","hood":"Centro","lat":36.7407148,"lng":-5.1658765,"addr":"Calle Armiñán, Ronda","cost":0,"dur":1.0,"main":true,"why":"Es la razón para ir a Ronda: la ciudad está partida en dos por un tajo de 100 m y el puente une las dos mitades. Desde los miradores de los lados se ve el puente entero con el valle detrás.","tip":"La mejor vista del puente es desde abajo (sendero hacia el Mirador de Aldehuela / camino de los molinos), pero es bajada fuerte y luego hay que volver a subir: solo si están con piernas. Desde arriba, la Plaza de María Auxiliadora y el Mirador de Aldehuela dan buena vista sin esfuerzo.","refs":["https://everyrail.com/es/trenes/ronda-a-malaga/","https://www.omio.es/viajes/malaga/ronda"],"conf":"media","tags":["IA","Ruta 2","Itinerario","Excursión"],"boro":"Ronda","sub":"Desde Málaga en bus (Damas, Avanza y otros; cerca de 2 h). El tren está cortado en 2026 (ver dudas). Desde la estación de bus de Ronda, 15 min a pie llanos","costN":"","closed":"","free":"","book":"","src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"ron_plaza_toros","n":"Plaza de toros de Ronda","gname":"Real Maestranza de Caballería de Ronda","cat":"arq","typ":"Monumento / edificio","hood":"El Mercadillo","lat":36.74236727,"lng":-5.16706576,"addr":"Calle Virgen de la Paz 15, Ronda","cost":10.5,"costN":"General 9 €; con audioguía 10,50 € (web oficial; no vi tarifa para mayores)","dur":1.0,"main":true,"why":"Se pisa el ruedo de arena y se recorren los corrales y la arquería de piedra de doble piso; el museo tiene trajes de luces, monturas y armas antiguas. Interesa también por la arquitectura, aunque no les gusten los toros.","tip":"La web avisa de obras de consolidación que pueden molestar la visita. Todo llano.","refs":["https://www.rmcr.org/en/visit-bullring-and-museum/"],"conf":"alta","tags":["IA","Ruta 2","Excursión"],"boro":"Ronda","sub":"A pie, a 2 min del Puente Nuevo","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"ron_alameda","n":"Alameda del Tajo y Paseo de Blas Infante","cat":"mirador","typ":"Mirador","hood":"El Mercadillo","lat":36.7437684,"lng":-5.1672314,"addr":"Alameda del Tajo, Ronda","cost":0,"dur":0.75,"main":true,"why":"Balcones de hierro colgados sobre 100 m de caída, con vista a la Serranía de Ronda. Es el lugar para sentarse a la sombra después de la plaza de toros.","tip":"Llano, con bancos y sombra. Lo mejor para descansar las piernas en la excursión.","conf":"baja","tags":["IA","Ruta 2","Excursión"],"boro":"Ronda","sub":"A pie, detrás de la plaza de toros","costN":"","closed":"","free":"","book":"","src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[],"refs":[]},{"id":"ron_banos_arabes","n":"Baños Árabes de Ronda","cat":"arq","typ":"Monumento / edificio","hood":"Barrio de San Miguel","lat":36.7389876,"lng":-5.1627098,"addr":"Calle San Miguel s/n, Ronda","cost":3,"costN":"General 4,50 €; reducida 3 € para jubilados","dur":0.75,"why":"Las salas con bóvedas y tragaluces en forma de estrella están casi intactas, igual que la noria y el acueducto que traía el agua. Un audiovisual corto explica cómo se usaba el baño.","tip":"Está ABAJO, junto al arroyo: se baja por calles empinadas y escalones de piedra desde La Ciudad, y después hay que volver a subir. Ir solo con tiempo y piernas; el aforo interior es de 10 personas.","refs":["https://www.juntadeandalucia.es/aaiicc/enclaves/enclave-arqueologico-banos-arabes-ronda"],"conf":"alta","tags":["IA","Ruta 2","Excursión"],"boro":"Ronda","sub":"A pie desde La Ciudad, bajando hacia el Puente Árabe (cuesta)","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"ron_rey_moro","n":"Casa del Rey Moro: jardines y la Mina","cat":"arq","typ":"Monumento / edificio","hood":"La Ciudad","lat":36.7398393,"lng":-5.1642976,"addr":"Calle Santo Domingo 9, Ronda","cost":10,"costN":"Unos 10 € según guías (no verificado en fuente oficial)","dur":1.0,"why":"Los jardines en terrazas sobre el tajo los diseñó el mismo paisajista de la Plaza de España de Sevilla. Lo espectacular es la Mina: una escalera tallada dentro de la roca que baja hasta el agua del río.","tip":"La Mina son cerca de 300 escalones irregulares, húmedos y con poca luz, y hay que subirlos de vuelta. Para gente de 70, solo los jardines, o la Mina con mucha calma.","refs":["https://www.frommers.com/destinations/ronda/attractions/casa-del-rey-moro/","https://www.andalucia.com/ronda/casadelrey.htm"],"conf":"media","tags":["IA","Ruta 2","Excursión"],"boro":"Ronda","sub":"A pie, cruzando el Puente Nuevo hacia La Ciudad","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"ron_lechuguita","n":"Bar El Lechuguita","cat":"comida","typ":"Bar de tapas / taberna","hood":"El Mercadillo","lat":36.7414513,"lng":-5.164662,"addr":"Calle Virgen de los Remedios 35, Ronda","cost":10,"costN":"Tapas 1-4 € (guías)","dur":1.0,"why":"El bar de los rondeños: lista larga de tapas a precio de antes, que se piden marcando con lápiz en un papel. La tapa que le da nombre es una cuña de lechuga aliñada.","tip":"Pequeño y lleno, de pie en la barra. Llegar al abrir. Confirmar si abre a mediodía: varias guías hablan de que abre a la noche, lo que no sirve para una excursión desde Málaga.","refs":["https://theculturetrip.com/europe/spain/articles/the-top-10-bars-in-ronda-spain","https://gastroranking.es/r/el-lechuguita_34423"],"conf":"media","tags":["IA","Ruta 2","Excursión"],"boro":"Ronda","sub":"A pie, cerca de la Plaza de España","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"cam_caminito","n":"Caminito del Rey","cat":"parque","typ":"Paseo / costa","hood":"Desfiladero de los Gaitanes (Ardales / Álora)","lat":36.915833,"lng":-4.772778,"addr":"Acceso norte: zona de El Kiosko / Gaitanejo, Ardales (Málaga), Caminito del Rey","cost":12.5,"costN":"Entrada general 10 € (guiada 18 €) + bus lanzadera 2,50 €. Sin descuento por edad que haya visto","dur":7.0,"main":true,"closed":"lunes (abre martes a domingo; cerrado 24, 25 y 31 de diciembre y 1 de enero)","book":"OBLIGATORIA y con anticipación en caminitodelrey.info (se agota). Entrada nominal con franja horaria; sin cambios ni devoluciones, salvo cierre por clima. Máx. 10 por compra","why":"Uno de los paseos más espectaculares de Europa: 2,9 km de pasarelas de madera pegadas a la roca dentro de un cañón, con un puente colgante al final. Es lineal y en bajada general, sin nada técnico.","tip":"PARA GENTE DE 70, LAS CONDICIONES OFICIALES: total 7,7 km (4,8 km de senderos de acceso + 2,9 km de pasarelas), 3-4 h, en un solo sentido de norte a sur. No hay edad máxima, solo mínima (8 años). Piden 'cierta forma física' por subidas, bajadas, escaleras y pasarelas, pero no capacidad atlética. Lo desaconsejan con vértigo y con problemas cardíacos o respiratorios. NO se permiten bastones ni muletas, ni de trekking: si alguno de los dos necesita bastón, no puede hacerlo. Casco provisto por ellos; calzado de trekking o deportivo cerrado (prohibidas las chancletas). Llegar 30 min antes de la franja. Puede cerrarse por lluvia fuerte o viento (avisan por mail/SMS); con llovizna se pasa con impermeable, sin paraguas. No hay baños ni bares en el recorrido: agua y algo para comer. Sale 100 m sobre el río: si alguno tiene miedo a la altura, no ir.","season":"Marzo-abril, flores en el cañón (web oficial). Verano: calor fuerte en las pasarelas expuestas; elegir la primera franja.","refs":["https://www.caminitodelrey.info/es/","https://www.caminitodelrey.info/es/tu-visita/preguntas-frecuentes","https://www.caminitodelrey.info/es/tu-visita/acceso-recorrido","https://www.caminitodelrey.info/es/tu-visita/como-llegar"],"conf":"alta","tags":["IA","Ruta 2","Itinerario","Excursión"],"boro":"Caminito del Rey","sub":"Tren regional de Renfe Málaga - El Chorro (estación 'El Chorro-Caminito del Rey'); de ahí el bus lanzadera (2,50 €, solo efectivo si no se compró online) al acceso norte. El recorrido termina caminando de vuelta a la estación","free":"","src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"warn":[]},{"id":"cam_estacion_chorro","n":"Estación El Chorro - Caminito del Rey","cat":"parque","typ":"Parque / jardín","hood":"El Chorro (Álora)","lat":36.90727778,"lng":-4.75927778,"addr":"El Chorro, Álora (Málaga), Caminito del Rey","cost":0,"costN":"Billete de tren aparte (precio no verificado)","dur":0.5,"why":"Es la llave logística del día: el tren desde Málaga llega acá, el bus lanzadera sale de acá hacia el acceso norte, y al terminar el Caminito se vuelve caminando unos 2 km hasta acá para tomar el tren de regreso.","tip":"Mirar los horarios de Renfe el día anterior y calcular la franja de entrada en función del primer tren: el bus lanzadera tarda 15-20 min y después hay 1,5-2,7 km a pie hasta el control. El último tramo de salida (2,1 km) empieza con escalones de subida.","refs":["https://www.caminitodelrey.info/es/tu-visita/como-llegar","https://www.caminitodelrey.info/es/tu-visita/preguntas-frecuentes"],"conf":"alta","tags":["IA","Ruta 2","Excursión"],"boro":"Caminito del Rey","sub":"Tren regional Renfe desde Málaga María Zambrano","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"cam_el_kiosko","n":"Restaurante El Kiosko (embalse del Conde de Guadalhorce)","cat":"comida","typ":"Restaurante","hood":"Ardales","lat":36.9317346,"lng":-4.8020514,"addr":"MA-9006, Pantano del Chorro, Ardales, Caminito del Rey","cost":15,"costN":"No verificado","dur":0.75,"why":"Es el único punto de servicios antes de entrar: café, baño y algo para comer frente al embalse. La web oficial lo usa como referencia del sendero de acceso de 2,7 km.","tip":"Usar el baño acá: en el recorrido no hay. No verifiqué precios ni que esté abierto en 2026.","refs":["https://www.caminitodelrey.info/es/tu-visita/preguntas-frecuentes"],"conf":"baja","tags":["IA","Ruta 2","Excursión"],"boro":"Caminito del Rey","sub":"Parada del bus lanzadera en la zona de El Kiosko","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"mar_casco_antiguo","n":"Casco antiguo de Marbella y Plaza de los Naranjos","cat":"barrio","typ":"Barrio / paseo","hood":"Casco antiguo","lat":36.5102335,"lng":-4.884986,"addr":"Plaza de los Naranjos, Marbella","cost":0,"dur":2.0,"main":true,"why":"El casco antiguo es lo opuesto a la Marbella de lujo: casas encaladas, rejas con geranios y la Plaza de los Naranjos con el ayuntamiento de 1568 y una fuente renacentista. A dos cuadras, la iglesia de la Encarnación y restos de la muralla del castillo.","tip":"Llano y caminable. Tomar algo en la plaza por la vista, pero comer en las calles laterales (Ancha, Tetuán, San Lázaro): en la plaza se paga de más.","refs":["https://www.malagatravelguide.net/marbella/old-town/","https://www.barcelo.com/guia-turismo/es/espana/marbella/que-ver/casco-historico-de-marbella/"],"conf":"media","tags":["IA","Ruta 2","Itinerario","Excursión"],"boro":"Marbella","sub":"Bus interurbano Málaga - Marbella (Avanza, cerca de 1 h; no verificado en fuente oficial). Desde la estación de Marbella, bus urbano o taxi al centro","costN":"","closed":"","free":"","book":"","src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"mar_avenida_del_mar","n":"Avenida del Mar (esculturas de Dalí)","cat":"arq","typ":"Monumento / edificio","hood":"Centro","lat":36.5078321,"lng":-4.886429,"addr":"Avenida del Mar, Marbella","cost":0,"dur":0.5,"main":true,"why":"Un museo al aire libre gratis: elefantes de patas largas, un Don Quijote y una Venus de Dalí en el camino del centro al mar.","tip":"Llano, con bancos y fuentes. Conecta directo con el paseo marítimo.","refs":["https://www.malagatravelguide.net/marbella/old-town/"],"conf":"media","tags":["IA","Ruta 2","Excursión"],"boro":"Marbella","sub":"A pie desde el casco antiguo (5 min)","costN":"","closed":"","free":"","book":"","src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"mar_paseo_maritimo","n":"Paseo marítimo de Marbella","cat":"parque","typ":"Paseo / costa","hood":"Centro","lat":36.5065,"lng":-4.8865,"addr":"Paseo Marítimo, Marbella","aprox":true,"cost":0,"dur":1.5,"main":true,"why":"Kilómetros de paseo llano frente al mar con chiringuitos; caminando hacia el oeste se llega a Puerto Banús (unos 6 km) para ver los yates.","tip":"Todo llano. Si se animan a llegar a Puerto Banús caminando, volver en bus. Al mediodía no hay sombra.","refs":["https://www.malagatravelguide.net/marbella/old-town/"],"conf":"media","tags":["IA","Ruta 2","Itinerario","Excursión"],"boro":"Marbella","sub":"A pie, al final de la Avenida del Mar","costN":"","closed":"","free":"","book":"","src":"propuesta","gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"mar_el_estrecho","n":"Bar El Estrecho","cat":"comida","typ":"Bar de tapas / taberna","hood":"Casco antiguo","lat":36.5097676,"lng":-4.8859494,"addr":"Calle San Lázaro 12, Marbella","cost":15,"costN":"Tapas y medias raciones 3-10 € (estimado)","dur":1.0,"why":"Tapas andaluzas de siempre en el corazón del casco viejo: pescaíto frito, gambas al pil-pil, gazpacho. Un bar de barrio en una ciudad de precios altos.","tip":"No toma reservas y es estrecho (de ahí el nombre): ir temprano a mediodía. Pagar en efectivo la cuenta entera.","refs":["https://doeatbetterexperience.com/es/blog/restaurantes-casco-antiguo-marbella/"],"conf":"media","tags":["IA","Ruta 2","Excursión"],"boro":"Marbella","sub":"A pie; calle San Lázaro, al lado de la Plaza de los Naranjos","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"mar_altamirano","n":"Bar Altamirano","cat":"comida","typ":"Bar de tapas / taberna","hood":"Casco antiguo","lat":36.5097186,"lng":-4.883191,"addr":"Plaza Altamirano 3, Marbella","aprox":true,"cost":20,"costN":"Raciones de pescado 8-15 € (estimado)","dur":1.0,"why":"Fritura malagueña y marisco a precio de bar en una placita del casco viejo. Alternativa con mesas al aire libre si El Estrecho está lleno.","tip":"No reserva: llegar antes de las 14. La coordenada es la de la plaza.","refs":["https://doeatbetterexperience.com/es/blog/restaurantes-casco-antiguo-marbella/"],"conf":"media","tags":["IA","Ruta 2","Excursión"],"boro":"Marbella","sub":"A pie; Plaza Altamirano, casco antiguo","closed":"","free":"","book":"","main":false,"src":"propuesta","gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"ner_balcon_europa","n":"Balcón de Europa","cat":"mirador","typ":"Mirador","hood":"Centro","lat":36.7442658,"lng":-3.8753957,"addr":"Paseo Balcón de Europa, Nerja","cost":0,"dur":1.0,"main":true,"why":"Una terraza de palmeras sobre los acantilados, donde estuvo un castillo, con vista a calas a ambos lados y la sierra detrás. Es el centro del pueblo blanco y el punto de partida para todo.","tip":"Llano, con bancos. Las calas de abajo se alcanzan por escaleras: mirar antes de bajar.","conf":"baja","tags":["IA","Ruta 2","Itinerario","Excursión"],"boro":"Nerja","sub":"Bus ALSA Málaga - Nerja (alrededor de 1 h 15; no verificado). Desde la parada, 10 min a pie al centro","costN":"","closed":"","free":"","book":"","src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[],"refs":[]},{"id":"ner_cueva","n":"Cueva de Nerja","cat":"parque","typ":"Parque / jardín","hood":"Maro","lat":36.7617499,"lng":-3.8448432,"addr":"Carretera de Maro s/n, Nerja","cost":13,"costN":"Adultos 15 €; mayores de 65: 13 € (según revendedores 2026; la web oficial no muestra precios sin JavaScript)","dur":1.5,"main":true,"book":"Conviene comprar online en entradas.cuevadenerja.es (más barato y sin cola)","why":"Salas del tamaño de una catedral descubiertas en 1959, con pinturas rupestres (no visibles en la visita general) y formaciones enormes. Tiene dos zonas de descanso con bancos dentro.","tip":"El recorrido interior tiene escaleras (no encontré el número). Adentro hace fresco y húmedo; suelo que puede resbalar. Se combina con Nerja en el mismo día.","refs":["https://www.cuevadenerja.es/","https://cuevadenerja.es/como-llegar-a-la-cueva-de-nerja/","https://cuevadenerja.es/la-cueva/visitas-y-otros-servicios-de-la-cueva-de-nerja/","https://www.taquilla.com/entradas/cueva-de-nerja"],"conf":"media","tags":["IA","Ruta 2","Excursión"],"boro":"Nerja","sub":"Bus ALSA con destino 'Nerja (Cuevas)' desde Málaga o desde Nerja (web oficial)","closed":"","free":"","src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"ner_burriana","n":"Playa de Burriana","cat":"parque","typ":"Paseo / costa","hood":"Burriana","lat":36.7500126,"lng":-3.8674182,"addr":"Paseo de Burriana, Nerja","cost":0,"dur":1.5,"why":"Playa larga con paseo marítimo y los chiringuitos más conocidos de Nerja, incluido el de las paellas a leña.","tip":"Para bajar desde el centro hay cuesta y escaleras; para volver, subir con calma o tomar taxi o el tren turístico.","conf":"baja","tags":["IA","Ruta 2","Excursión"],"boro":"Nerja","sub":"A pie desde el Balcón de Europa (unos 20 min, con bajada)","costN":"","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[],"refs":[]},{"id":"ner_ayo","n":"Ayo (paellas en Burriana)","gname":"La Parrala Ayo","cat":"comida","typ":"Restaurante","hood":"Burriana","lat":36.7512072,"lng":-3.8658884,"addr":"Paseo de Burriana 15, Nerja","cost":22,"costN":"Comida para dos con vino 40-55 € (guía, abril 2026)","dur":1.5,"why":"Desde los años 70 cocinan paellas en paelleras enormes sobre fuego de leña, a la vista desde la terraza. El plato se puede repetir de la paellera sin pagar de nuevo.","tip":"Ir antes de las 13 o reservar en temporada alta. Sillas de plástico, nada de lujo: se viene por la paella.","refs":["https://www.cargest.com/info/gastronomy/paella-nerja/","https://wearelifestyles.com/ayo-burriana-beach-nerja/"],"conf":"media","tags":["IA","Ruta 2","Excursión"],"boro":"Nerja","sub":"A pie; Playa de Burriana","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"fri_casco","n":"Casco histórico de Frigiliana (barrio morisco)","cat":"barrio","typ":"Barrio / paseo","hood":"Barrio Alto","lat":36.79085556,"lng":-3.89533056,"addr":"Calle Real, Frigiliana","cost":0,"dur":2.0,"main":true,"why":"Uno de los pueblos blancos más cuidados de Andalucía: casas encaladas con puertas de colores, macetas y placas de cerámica que cuentan la rebelión morisca de 1569. Vista al mar desde arriba.","tip":"Es TODO cuesta y escalones: callecitas empinadas con peldaños de piedra. Subir despacio, con paradas, y elegir bajar por la Calle Real. Mejor de mañana temprano, antes de los grupos.","refs":["https://es.wikipedia.org/wiki/Frigiliana","https://www.idealista.com/news/node/817140"],"conf":"media","tags":["IA","Ruta 2","Itinerario","Excursión"],"boro":"Frigiliana","sub":"Desde Nerja, bus local a Frigiliana (unos 15 min; operador y frecuencia no verificados)","costN":"","closed":"","free":"","book":"","src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"fri_ingenio","n":"El Ingenio (Palacio de los Condes de Frigiliana)","cat":"arq","typ":"Palacio / castillo","hood":"Centro","lat":36.7921285,"lng":-3.897396,"addr":"Calle Real, Frigiliana","aprox":true,"cost":0,"dur":0.25,"why":"La miel de caña de Frigiliana es un producto casi único en Europa, y se hacía en este palacio. Es la que se pone sobre las berenjenas fritas en toda la provincia.","tip":"Se ve por fuera; no verifiqué si se visita por dentro ni si sigue produciendo. Comprar un frasco de miel de caña en el pueblo. Coordenada aproximada.","conf":"baja","tags":["IA","Ruta 2","Excursión"],"boro":"Frigiliana","sub":"A pie, en la entrada baja del pueblo","costN":"","closed":"","free":"","book":"","main":false,"src":"propuesta","gname":"","must":0,"rate":0,"season":"","warn":[],"refs":[]},{"id":"fri_bodeguilla","n":"La Bodeguilla","cat":"comida","typ":"Bar de tapas / taberna","hood":"Casco histórico","lat":36.793302,"lng":-3.8991582,"addr":"Calle Chorruelo, Frigiliana","cost":15,"costN":"Platos 8-12 € (estimado)","dur":1.0,"why":"Un clásico de Frigiliana para probar lo del lugar: ajoblanco y berenjenas con miel de caña.","tip":"Alternativa con reseñas recientes (abril 2026) de comida casera barata: El Tangay. No pude verificar que La Bodeguilla siga abierta en 2026.","refs":["https://www.viajandoporelmundomundial.com/donde-comer-en-frigiliana/"],"conf":"baja","tags":["IA","Ruta 2","Excursión"],"boro":"Frigiliana","sub":"A pie, en el casco","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"gname":"","must":0,"rate":0,"season":"","warn":[]},{"id":"gra_alhambra","n":"Alhambra (Palacios Nazaríes, Alcazaba y Generalife)","gname":"Alhambra","cat":"arq","typ":"Palacio / castillo","hood":"Alhambra","lat":37.17634,"lng":-3.58821,"addr":"Calle Real de la Alhambra s/n, 18009 Granada","cost":15,"costN":"Visita Diurna General 22,27 € en la web oficial (21 € de precio público + comisión). Ciudadanos de la UE mayores de 65: tarifa reducida de 14 € + comisión (Orden de 17/7/2025). Menores de 12 gratis, pero igual hay que sacarles entrada.","dur":3.5,"main":true,"book":"IMPRESCINDIBLE con anticipación y SOLO en la web oficial tickets.alhambra-patronato.es (también por teléfono al 858 889 002). La Visita Diurna General incluye Alcazaba, Palacios Nazaríes, Generalife, Partal y jardines; los Nazaríes tienen hora fija impresa en la entrada (turnos de 300 personas cada media hora) y si se llega tarde se pierde ese acceso, sin cambio ni devolución. La entrada es nominativa: al comprar se pone el nombre y documento de cada uno, y adentro piden el pasaporte o DNI ORIGINAL. La tarifa de mayores de 65 de la UE exige mostrar el documento en el acceso; si no, cobran la diferencia. Las taquillas solo venden para el mismo día y según lo que sobre: no contar con eso. Si no hay día, mirar la web seguido: el Patronato libera entradas del cupo institucional no usado. Plan B oficial: «Alhambra Experiencias» (Nazaríes de noche + Alcazaba y Generalife de día, en dos días seguidos) o la Visita Nocturna a Palacios Nazaríes (12 € de precio público, 8 € reducida).","why":"Es el conjunto palaciego islámico mejor conservado de Europa: en los Palacios Nazaríes están el Patio de los Arrayanes, el Salón de Embajadores y el Patio de los Leones, con yeserías y techos de mocárabes originales. La Alcazaba es la fortaleza militar con la Torre de la Vela, la mejor vista sobre el Albaicín, y el Generalife era la finca de recreo de los sultanes, con huertas y el Patio de la Acequia. La ruta le dedica un día entero, y lo vale.","tip":"Elegir el turno de Nazaríes de media mañana y organizar el resto alrededor: cada espacio (Alcazaba, Nazaríes, Partal, Generalife) se puede entrar UNA sola vez. El Pabellón de Acceso queda lejos de los Nazaríes: no llegar con el tiempo justo. Son unas 3 horas de recorrido según el Patronato, con escalones y desniveles; en el recinto hay sillas de ruedas en préstamo si están disponibles y un itinerario accesible. Mochilas de más de 40×40 cm no entran (hay consigna gratis). Llevar agua y sombrero: hay mucho tramo al sol. Subir en el bus C30/C32 y bajar caminando por el bosque o la Cuesta de Gomérez ahorra las piernas.","season":"Horario de invierno (15/10–31/3) y verano (1/4–14/10) distintos; la visita nocturna a Nazaríes es todo el año pero en días distintos según temporada, y la nocturna a los jardines del Generalife solo de primavera a mediados de noviembre. En verano, calor fuerte: turno temprano. Cerrado el 25/12 y el 1/1.","refs":["https://www.alhambra-patronato.es/visitar/horarios-y-tarifas","https://www.alhambra-patronato.es/visitar/preguntas-frecuentes","https://www.alhambra-patronato.es/visitar/tipos-de-visitas","https://cdn.juntadeandalucia.es/boja/2025/142/BOJA25-142-00007-10352-01_00323950.pdf"],"conf":"alta","tags":["IA","Ruta 2","Itinerario"],"boro":"Granada","sub":"Bus C30 (Centro → Alhambra) o C32 (Alhambra → Albaicín) desde Plaza Isabel la Católica; a pie se sube por la Cuesta de Gomérez desde Plaza Nueva (cuesta fuerte).","closed":"","free":"","src":"propuesta","aprox":false,"must":0,"rate":0,"warn":[]},{"id":"gra_albaicin","n":"Albaicín","gname":"Albaicín","cat":"barrio","typ":"Barrio / paseo","hood":"Albaicín","lat":37.1817,"lng":-3.5983,"addr":"Albaicín, Granada","cost":0,"costN":"Gratis caminarlo.","dur":3,"main":true,"why":"Es la Granada andalusí que quedó en pie: trazado medieval, aljibes, iglesias levantadas sobre mezquitas y los cármenes (casas con huerto amurallado). La ruta lo hace el primer día y termina en el Mirador de San Nicolás al atardecer.","tip":"Es todo cuesta y empedrado resbaloso: zapatilla con buena suela. Truco de ahorro de piernas: subir en el bus C31 hasta arriba (San Nicolás o Plaza Larga) y hacer el paseo bajando hacia Plaza Nueva. La Plaza Larga y el Mirador de San Cristóbal son buenos puntos para sentarse.","refs":["https://es.wikipedia.org/wiki/Albaic%C3%ADn"],"conf":"media","tags":["IA","Ruta 2","Itinerario"],"boro":"Granada","sub":"Bus C31 (circular desde Plaza Nueva) o C32; a pie desde Plaza Nueva por la Carrera del Darro o por la Calderería Nueva.","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"gra_mirador_san_nicolas","n":"Mirador de San Nicolás","gname":"Mirador de San Nicolás","cat":"mirador","typ":"Mirador","hood":"Albaicín","lat":37.181041,"lng":-3.592662,"addr":"Plaza Mirador de San Nicolás, Albaicín, 18010 Granada","cost":0,"costN":"Gratis. La iglesia y torre de San Nicolás, al lado, cobran 3 €.","dur":1,"main":true,"why":"Es la postal de Granada: la Alhambra entera de costado, con la Alcazaba, los Palacios y el Generalife, y en días claros la sierra nevada al fondo. Al atardecer la piedra de la Alhambra se pone roja, que es lo que la ruta propone para el primer día.","tip":"Al atardecer se llena: llegar con tiempo para conseguir lugar en el murete. Hay músicos y vendedores. Subir en bus y bajar caminando. La torre de la iglesia de San Nicolás (3 €) da la misma vista con menos gente.","refs":["https://es.wikipedia.org/wiki/Iglesia_de_San_Nicol%C3%A1s_(Granada)","https://ticketsgranadacristiana.com/"],"conf":"media","tags":["IA","Ruta 2","Itinerario"],"boro":"Granada","sub":"Bus C31 o C32, parada San Nicolás.","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"gra_sacromonte","n":"Sacromonte y Museo Cuevas del Sacromonte","gname":"Museo Cuevas del Sacromonte","cat":"barrio","typ":"Barrio / paseo","hood":"Sacromonte","lat":37.18313,"lng":-3.584321,"addr":"Barranco de los Negros s/n, Sacromonte, Granada (museo)","cost":0,"costN":"El barrio es gratis; el Museo Cuevas cobra entrada (no verifiqué el precio).","dur":2.5,"main":true,"why":"Las cuevas siguen habitadas y algunas son tablaos de zambra, el flamenco gitano granadino. El Museo Cuevas del Sacromonte reconstruye varias cuevas con sus muebles y oficios tradicionales. Desde arriba hay una vista de la Alhambra desde el lado opuesto al de San Nicolás.","tip":"La coordenada es la del museo, que está arriba del barranco: subir en bus C34 y bajar caminando por el Camino del Sacromonte. Hay tramos de escalera y sin sombra. Si quieren ver zambra de noche, reservar tablao y volver en taxi.","refs":["https://www.wikidata.org/wiki/Q47517357","https://www.wikidata.org/wiki/Q2842387"],"conf":"media","tags":["IA","Ruta 2","Itinerario"],"boro":"Granada","sub":"Bus C34 (circular desde Plaza Nueva); a pie desde el Paseo de los Tristes por el Camino del Sacromonte.","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"gra_carrera_darro","n":"Carrera del Darro y Paseo de los Tristes","gname":"Carrera del Darro","cat":"barrio","typ":"Barrio / paseo","hood":"Albaicín","lat":37.178318,"lng":-3.592779,"addr":"Carrera del Darro, 18010 Granada","cost":0,"costN":"Gratis.","dur":1,"main":true,"why":"En menos de un kilómetro tiene puentes de piedra sobre el Darro, el Bañuelo (baños árabes del siglo XI), conventos, la casa de Castril y la vista de la Alhambra desde abajo. Termina en el Paseo de los Tristes, con terrazas mirando a las torres de la Alhambra.","tip":"Es casi plana, la más amable del Albaicín para las rodillas. Las veredas son angostas y pasan los minibuses: ir atentos. Buen lugar para sentarse a tomar algo es el Paseo de los Tristes al final.","refs":["https://www.wikidata.org/wiki/Q119001847"],"conf":"media","tags":["IA","Ruta 2","Itinerario"],"boro":"Granada","sub":"Bus C31, C32 o C34 (paradas sobre la Carrera del Darro, ej. «Carrera del Darro 33 - Bañuelo»); a pie desde Plaza Nueva.","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"gra_realejo","n":"Realejo","gname":"Realejo-San Matías","cat":"barrio","typ":"Barrio / paseo","hood":"Realejo","lat":37.17333333,"lng":-3.59388889,"addr":"Realejo, Granada","cost":0,"costN":"Gratis.","dur":2,"main":true,"why":"Era la judería hasta 1492; hoy es el barrio más de vecinos del centro, con el Campo del Príncipe, la Casa de los Tiros, el Cuarto Real de Santo Domingo y murales del artista El Niño de las Pinturas. Es también el barrio del tapeo: ahí están Taberna La Tana, Café Fútbol y Chikito, a pocas cuadras.","tip":"Las calles que suben hacia la Alhambra son empinadas; la parte baja (Campo del Príncipe, Plaza Mariana Pineda) es llana y con bancos. Combina bien con una tarde de tapas.","refs":["https://www.wikidata.org/wiki/Q6102193"],"conf":"media","tags":["IA","Ruta 2","Itinerario"],"boro":"Granada","sub":"A pie desde Plaza Isabel la Católica o Plaza Nueva (10 min); el Campo del Príncipe es el centro del barrio.","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"gra_catedral","n":"Catedral de Granada","gname":"Catedral de Granada (S.A.I. Catedral Metropolitana de la Encarnación)","cat":"arq","typ":"Iglesia / templo","hood":"Centro","lat":37.17599,"lng":-3.59904,"addr":"Calle Gran Vía de Colón 5, 18001 Granada","cost":10,"costN":"10 € individual en la venta oficial (incluye audioguía en el móvil). Combinado de seis templos (Catedral, Capilla Real, Abadía del Sacromonte, San Jerónimo, Cartuja y San Nicolás): 33 €.","dur":1,"main":true,"book":"No hace falta reservar; se puede comprar online en ticketsgranadacristiana.com.","why":"Fue la primera catedral renacentista de España: la Capilla Mayor es una rotonda blanca y dorada de Diego de Siloé con vidrieras del siglo XVI. Adentro hay pinturas y esculturas de Alonso Cano, el gran artista barroco granadino.","tip":"Las visitas se cortan durante el culto y la catedral avisa que el horario puede cambiar sin aviso: confirmar el día. Hay bancos adentro. Si van a ver varios templos, el combinado de 33 € ahorra 8 €.","refs":["https://catedraldegranada.com/precios-horarios-de-la-visita/","https://ticketsgranadacristiana.com/"],"conf":"alta","tags":["IA","Ruta 2"],"boro":"Granada","sub":"Centro peatonal: a pie desde Gran Vía o Plaza Isabel la Católica.","closed":"","free":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"gra_capilla_real","n":"Capilla Real de Granada","gname":"Capilla Real","cat":"arq","typ":"Iglesia / templo","hood":"Centro","lat":37.176298,"lng":-3.598621,"addr":"Calle Oficios 3, 18001 Granada","cost":7,"costN":"7 € individual en la venta oficial; entra en el combinado de 33 €.","dur":0.75,"main":true,"why":"Los Reyes Católicos eligieron enterrarse en la ciudad que conquistaron en 1492: sus sepulcros de mármol y la cripta con los ataúdes de plomo están ahí. En la sacristía-museo se ven la corona y el cetro de Isabel, la espada de Fernando y la colección de pintura flamenca de la reina.","tip":"Audioguía gratis para descargar en el móvil (unos 45 minutos): llevar auriculares. Se combina en una mañana con la Catedral, la Alcaicería y el Corral del Carbón, todo a pocos metros y en llano.","refs":["https://capillarealgranada.com/visita-cultural/","https://ticketsgranadacristiana.com/"],"conf":"alta","tags":["IA","Ruta 2"],"boro":"Granada","sub":"A pie, pegada a la Catedral, entrada por la calle Oficios.","closed":"","free":"","book":"","src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"gra_alcaiceria","n":"Alcaicería","gname":"Alcaicería","cat":"tienda","typ":"Compras","hood":"Centro","lat":37.175512,"lng":-3.598902,"addr":"Calle Alcaicería, 18001 Granada","cost":0,"costN":"Gratis pasear.","dur":0.5,"why":"Era el mercado de la seda de la Granada musulmana; se quemó en 1843 y se reconstruyó con arcos de aire nazarí. Hoy venden taracea (marquetería granadina), cerámica de Fajalauza y lámparas.","tip":"Es corto y plano. La artesanía de verdad (taracea, Fajalauza) convive con mucho souvenir importado: mirar la etiqueta. Sale directo a la Plaza de Bib-Rambla, buena para sentarse.","refs":["https://www.openstreetmap.org/?mlat=37.175512&mlon=-3.598902#map=19/37.175512/-3.598902"],"conf":"baja","tags":["IA","Ruta 2"],"boro":"Granada","sub":"A pie, entre la Plaza de Bib-Rambla y la calle Zacatín.","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"gra_banuelo","n":"El Bañuelo (baños árabes)","gname":"El Bañuelo","cat":"arq","typ":"Monumento / edificio","hood":"Albaicín","lat":37.178445,"lng":-3.592991,"addr":"Carrera del Darro 31, 18010 Granada","cost":2,"costN":"Precio público 2 € por monumento andalusí (Orden 17/7/2025); entra también en la «Dobla de Oro» de la Alhambra.","dur":0.5,"free":"Domingos, entrada gratuita (web del Patronato de la Alhambra).","why":"Tiene las tres salas de agua (fría, templada y caliente) con bóvedas perforadas por lucernarios en forma de estrella, por donde entra la luz. Es del siglo XI, anterior a la Alhambra.","tip":"Visita corta, de paso por la Carrera del Darro. Los domingos es gratis. Lo gestiona el Patronato de la Alhambra junto al Corral del Carbón, la Casa Horno de Oro y el Palacio de Dar al-Horra.","refs":["https://www.alhambra-patronato.es/visitar/horarios-y-tarifas","https://cdn.juntadeandalucia.es/boja/2025/142/BOJA25-142-00007-10352-01_00323950.pdf","https://www.wikidata.org/wiki/Q97603021"],"conf":"alta","tags":["IA","Ruta 2"],"boro":"Granada","sub":"Bus C31/C32/C34, parada Carrera del Darro 33 - Bañuelo.","closed":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"gra_corral_carbon","n":"Corral del Carbón","gname":"Corral del Carbón","cat":"arq","typ":"Monumento / edificio","hood":"Centro","lat":37.17492722,"lng":-3.59797634,"addr":"Calle Mariana Pineda s/n, 18009 Granada","cost":0,"costN":"Gratis (Orden 17/7/2025).","dur":0.3,"why":"Es el único edificio de este tipo que queda entero en la península: un patio de tres pisos de galerías donde dormían los comerciantes y guardaban la mercadería. Gratis y a dos cuadras de la Catedral.","tip":"Parada de diez minutos para sentarse a la sombra del patio. Adentro está también una de las máquinas para sacar entradas de la Alhambra.","refs":["https://www.alhambra-patronato.es/visitar/horarios-y-tarifas","https://cdn.juntadeandalucia.es/boja/2025/142/BOJA25-142-00007-10352-01_00323950.pdf","https://www.alhambra-patronato.es/visitar/preguntas-frecuentes"],"conf":"alta","tags":["IA","Ruta 2"],"boro":"Granada","sub":"A pie desde la calle Reyes Católicos, cerca de Puerta Real.","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"gra_abadia_sacromonte","n":"Abadía del Sacromonte","gname":"Abadía del Sacromonte","cat":"arq","typ":"Iglesia / templo","hood":"Sacromonte","lat":37.1828227,"lng":-3.57719702,"addr":"Camino del Sacromonte s/n, 18010 Granada","cost":7,"costN":"7 € individual en la venta oficial; entra en el combinado de seis templos (33 €). Audioguía incluida.","dur":1.25,"why":"Se visitan las Santas Cuevas, el claustro y la exposición con los «libros plúmbeos», láminas de plomo con textos en árabe que fueron uno de los grandes fraudes históricos del siglo XVI, y manuscritos árabes. Desde la explanada hay vista abierta del valle del Darro y la Alhambra.","tip":"Está bastante más arriba que las cuevas-vivienda: ir y volver en el C34 o taxi. La web de la Abadía avisa cierres puntuales por obras y actos: confirmar antes de subir.","refs":["https://abadiasacromonte.org/visita-abadia-general","https://ticketsgranadacristiana.com/"],"conf":"alta","tags":["IA","Ruta 2"],"boro":"Granada","sub":"Bus C34 hasta el final del recorrido; a pie desde el barrio es una subida larga.","closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"must":0,"rate":0,"season":"","warn":[]},{"id":"gra_cartuja","n":"Monasterio de la Cartuja","gname":"Monasterio de la Cartuja de Granada","cat":"arq","typ":"Iglesia / templo","hood":"Cartuja","lat":37.19192301,"lng":-3.59952798,"addr":"Paseo de Cartuja s/n, 18011 Granada","cost":7,"costN":"7 € individual en la venta oficial; entra en el combinado de 33 €.","dur":1,"why":"La sacristía es un estallido de estuco blanco, mármoles y puertas de taracea; el sagrario tiene un tabernáculo de mármoles de colores. Los cuadros de Sánchez Cotán del claustro cuentan el martirio de los cartujos ingleses.","tip":"Queda fuera del circuito a pie: combinarlo con taxi. Audioguía gratis descargable (unos 45 min), llevar auriculares. Los jueves a sábados de noche hacen «Silentia», experiencia de luz y sonido con cupo de 35 personas.","refs":["https://cartujadegranada.com/visita-cultural/","https://ticketsgranadacristiana.com/"],"conf":"media","tags":["IA","Ruta 2"],"boro":"Granada","sub":"Al norte del centro, junto let PLACES = DATA.places; const BASE_ITIN = DATA.itinerary, EX = DATA.extras;
/* ── La config del viaje ──────────────────────────────────────────────────────
   Todo lo que cambia entre un viaje y otro sale de acá y de ningún otro lado:
   la ciudad, los dos viajeros, cómo se llama el transporte, la moneda, los
   radios de caminabilidad. Si algo de esto vuelve a quedar escrito a mano en el
   medio del código, la app deja de servir para el viaje siguiente — que es
   exactamente el problema que este objeto vino a resolver. */
const TRIP = DATA.trip;
/* ── Los viajeros ─────────────────────────────────────────────────────────────
   La app NO sabe cuántos son. Cada viajero trae {id, nombre, corto, color} y el
   `id` es la clave con la que su interés vive adentro de cada lugar (p[vid]) y
   adentro del estado guardado (S.interest[pid][vid]).
   En nyc-2026 esos ids son 'jp' y 'th' — las iniciales que eligió ese viaje, no
   palabras del motor. Por eso su catálogo y su estado guardado siguen valiendo
   sin convertir nada: el formato viejo ES el formato nuevo. */
const VS = TRIP.viajeros, VIDS = VS.map(v => v.id), NV = VS.length;
const VBY = Object.fromEntries(VS.map(v => [v.id, v]));
const TPT = TRIP.transporte;                          /* {nombre, icono} */
/* De dónde sale la nota de un lugar. El motor no sabe qué es Tabelog: sabe que
   hay una nota, cómo se llama en ESTE viaje y desde qué valor es buena. En Japón
   3,0 ya es muy bueno; en Yelp sobre 5 eso sería mediocre. Con `nombre` vacío el
   viaje no usa notas y no se pinta nada. */
const CALIF = TRIP.calificacion || {nombre:'', max:5, bueno:0};
const HAY_NOTA = !!CALIF.nombre;
const R = TRIP.radios;
/* ── LA PLATA, EN LA MONEDA QUE UNO ENTIENDE ─────────────────────────────────
   Los costos se guardan en UNA sola moneda —la del país que se visita— y se
   convierten solo al pintarlos. Guardar tres números por lugar los dejaría
   desincronizados en cuanto alguien edite uno.

   Las cotizaciones vienen HORNEADAS del build con su fecha: la app corre
   offline y no puede consultarlas parada en una esquina. Por eso toda
   conversión se muestra con «~» y la fecha está a un toque.

   NUNCA Intl con style:"currency". Verificado en Chromium: en es-CO el peso
   colombiano sale «$ 1.235» y el dólar «US$ 1.234,50» —casi iguales— y el yen
   sale «JPY 1.235» en vez de «¥». A Intl se le piden solo los dígitos; el
   símbolo lo pone la tabla que arma el motor. */
const MONBASE = TRIP.moneda;
const SIMB = TRIP.simbolos || {};
const DECS = TRIP.decimales || {};
const FX = TRIP.fx || null;
const MONEDAS_VER = (TRIP.monedasVer && TRIP.monedasVer.length) ? TRIP.monedasVer : [MONBASE];
/* En qué moneda quiere ver ESTA persona. Es preferencia de cada uno, no del
   viaje: uno puede razonar en pesos y el otro en dólares mirando el mismo plan. */
function monedaVista(){
  const m = S && S.moneda;
  return (m && MONEDAS_VER.indexOf(m) >= 0) ? m : MONBASE;
}
/* La tasa que se usa: la del build, salvo que alguien la haya pisado a mano —
   la del cajero no es la del mercado, y la del aeropuerto menos. */
function tasa(a){
  if (a === MONBASE) return 1;
  const mia = S && S.fxMio && S.fxMio[a];
  if (Number.isFinite(+mia) && +mia > 0) return +mia;
  return (FX && FX.tasas && FX.tasas[a]) || null;
}
const MON = SIMB[MONBASE] || MONBASE;   /* compatibilidad con lo que ya lo usaba */

function fmtMoneda(v, cod){
  const d = DECS[cod] != null ? DECS[cod] : 0;
  const num = new Intl.NumberFormat('es-CO', {minimumFractionDigits: d, maximumFractionDigits: d})
    .format(v);
  return (SIMB[cod] || cod) + ' ' + num;
}
/* Convierte y formatea. `aprox` marca que el número pasó por una cotización.
   ⚠ Se convierte el TOTAL, nunca se suman convertidos: con siete filas
   redondeadas el total no cierra contra su propia columna y eso se ve. */
function plata(v, cod){
  const x = +v;
  if (!Number.isFinite(x)) return '—';
  cod = cod || monedaVista();
  if (cod === MONBASE) return fmtMoneda(x, cod);
  const t = tasa(cod);
  if (!t) return fmtMoneda(x, MONBASE);
  return '~ ' + fmtMoneda(x * t, cod);
}
const money0 = v => plata(Number.isFinite(+v) ? Math.round(+v) : 0);
/* ── EL CATÁLOGO ES UNA PROYECCIÓN, NO UNA CONSTANTE ──────────────────────────
   Hasta acá PLACES y PBY se armaban una sola vez al cargar y no se volvían a
   tocar: el catálogo venía entero del build y era inmutable. Ahora se puede
   crear, editar y borrar un lugar desde la app, así que lo que se ve es

       catálogo del build  +  S.edits  +  S.nuevos  menos  S.bajas

   y esa suma se recalcula con rebuildCatalog() en el arranque, después de cada
   alta / edición / baja, y después de importar un plan. La VERDAD son los tres
   deltas de S; PLACES y PBY son lo que se dibuja. Mutar directamente el objeto
   de DATA.places lo mostraría en pantalla pero no lo guardaría, porque S no lo
   contiene: ese es el error que este diseño evita. */
const BASE_PLACES = DATA.places;
let PBY = {};
/* subcategorías agrupadas por categoría, para los <optgroup> de los filtros.
   Se recalculan también: un tipo nuevo tiene que poder filtrarse. */
let SUBS = DATA.subs || {};

function rebuildCatalog(){
  const bajas = (S && S.bajas) || {}, edits = (S && S.edits) || {}, nuevos = (S && S.nuevos) || {};
  PLACES = BASE_PLACES
    .filter(p => !bajas[p.id])
    .map(p => edits[p.id] ? Object.assign({}, p, edits[p.id]) : p)
    .concat(Object.values(nuevos).filter(p => p && p.id && !bajas[p.id]));
  PBY = Object.fromEntries(PLACES.map(p => [p.id, p]));
  const subs = {};
  PLACES.forEach(p => {
    const t = p.typ || 'Sin clasificar';
    (subs[p.cat] = subs[p.cat] || new Set()).add(t);
  });
  SUBS = Object.fromEntries(Object.entries(subs).map(([k, v]) => [k, [...v].sort()]));
}

/* ── SANEAR ───────────────────────────────────────────────────────────────────
   hydrate() rellena claves que FALTAN en el primer nivel del estado; no mira
   nada por dentro. Esto es lo otro: valores guardados que ya no significan nada

   El caso concreto: alguien filtró el itinerario por un viajero y después ese
   viajero salió del viaje. `whoF` guardado apunta a un fantasma, ningún bloque
   matchea, y la app muestra «Sin bloques para este filtro» sin decir por qué. */
function sanear(s){
  let toco = false;
  if (s.whoF && s.whoF !== 'all' && s.whoF !== 'both' && !VBY[s.whoF]){
    s.whoF = 'all'; toco = true;
  }
  /* «Quién soy» apuntando a alguien que ya no viaja: se olvida y se vuelve a
     preguntar la próxima vez que haga falta. */
  if (s.yo && !VBY[s.yo]){ s.yo = ''; toco = true; }
  /* Una moneda que este viaje ya no ofrece: se vuelve a la del viaje. */
  if (s.moneda && MONEDAS_VER.indexOf(s.moneda) < 0){ s.moneda = ''; toco = true; }
  /* Un lugar creado a mano al que le falta lo mínimo tumbaría vistas enteras.
     Se descarta acá, en la puerta, y no en cada render. */
  if (s.nuevos && typeof s.nuevos === 'object'){
    for (const k of Object.keys(s.nuevos)){
      const p = s.nuevos[k];
      if (!p || typeof p !== 'object' || p.id !== k || !p.n || !CAT[p.cat]){
        delete s.nuevos[k]; toco = true;

     no tiene a qué aplicarse. */

    for (const k of Object.keys(s.edits))

    for (const pid of Object.keys(s.interest)){
      const o = s.interest[pid];
      if (!o || typeof o !== 'object'){ delete s.interest[pid]; toco = true; continue; }

   agregado después, todo lugar que alguien hubiera tocado alguna vez devolvía

const sigInt = v => v == null ? 2 : (v + 1) % 3;

   tocar el «0» podía dejar un 2. */

/* Guarda SOLO la clave que se tocó. La versión anterior congelaba el lugar
   entero al primer toque, y desde ese momento esa entrada dejaba de escuchar al
   catálogo para todos los viajeros, no solo para el que se tocó. */
function setInterest(id, vid, val){
  if (!VBY[vid]) return;                       // clave muerta: no se escribe basura

  if (!S.interest[id]) S.interest[id] = {};

/* IMPRESCINDIBLE: marca sí / vacío. Igual que el interés, el default sale del catálogo

/* La marca de un lugar tiene TRES estados:

/* La version anterior guardaba 0 al DES-marcar una estrella, o sea "esto NO es

const VER = DATA.ver || '—', VERID = DATA.verId || '';
/* ── ABRIR UN LUGAR EN GOOGLE MAPS ───────────────────────────────────────────
   Por orden de precisión, y el orden importa porque lo probamos:

   1 · `?cid=` abre LA FICHA EXACTA del negocio. Es lo que se saca del link que
       alguien pega (la segunda mitad del ftid !1s0x…:0x<cid>). Verificado

/* ── Apple Maps ────────────────────────────────────────────────────────────────

   source, waypoint (se repite, una por parada intermedia), destination y mode.
   SIN source, Maps arranca desde donde esté parado el que abre el link — que es
   justo el punto: seguir la ruta desde donde estés. Iniciada la navegación en el
   iPhone, el Watch la toma solo y va dando los taps en la muñeca.
   Ojo con dos cosas: ?daddr=lat,lng (el formato viejo) dejó de andar en 18.4, y
   pasarle nombre + dirección en vez de coordenadas hace que Maps muestre el lugar
   por su nombre en vez de un pin mudo. */
const AM_CIUDAD = TRIP.zonas || {};
const AM_MAX = 15;   /* tope de paradas de una ruta en Maps: destino + 14 waypoints */

   búsqueda: "Hotel Ink48 (29-31 ago)" encuentra peor que "Hotel Ink48". */
const amNombre = p => String(p.n || '').split(/\s+[—·(]/)[0].trim();
function amPunto(p){
  if (!p) return '';
  const ciudad = AM_CIUDAD[p.boro] || '';
  /* aprox = la dirección no se pudo verificar y el pin es del barrio: ahí el nombre
     manda, que lo busque Maps. Con dirección verificada, nombre + dirección. */
  const partes = (!p.aprox && p.addr) ? [amNombre(p), p.addr, ciudad]
                                      : [amNombre(p), p.hood, ciudad];
  return partes.filter(Boolean).join(', ') || (p.lat ? p.lat + ',' + p.lng : '');

/* Una ruta con todas las paradas en orden. La última es el destino, el resto van
   como waypoint. Sin source: Maps usa la ubicación actual. */
function amRuta(places, mode){
  const pts = places.map(amPunto).filter(Boolean).slice(0, AM_MAX);
  if (!pts.length) return '';
  const q = pts.slice(0, -1).map(t => 'waypoint=' + encodeURIComponent(t));
  q.push('destination=' + encodeURIComponent(pts[pts.length - 1]));
  q.push('mode=' + mode);

  return 'https://maps.apple.com/directions?' + q.join('&');

/* ── Google Maps, el plan B ────────────────────────────────────────────────────

   Sin origin arranca desde la ubicación del aparato, igual que Apple.
   EL LÍMITE MANDA EL DISEÑO: Google acepta hasta 3 waypoints EN NAVEGADOR MÓVIL
   (nueve en el resto de las plataformas), y los días tienen entre 6 y 11 paradas.
   Por eso la ruta se parte en tramos de 4 paradas — 3 waypoints + el destino —
   que es lo que entra seguro en el celular. Cada tramo arranca donde estés, así
   que al terminar uno se abre el siguiente y no hay que repetir la última parada. */
const GM_PARADAS = 4;
function gmRuta(places, mode){
  const pts = places.map(amPunto).filter(Boolean);
  if (!pts.length) return '';
  const q = ['api=1', 'travelmode=' + mode,
             'destination=' + encodeURIComponent(pts[pts.length - 1])];
  if (pts.length > 1) q.push('waypoints=' + pts.slice(0, -1).map(encodeURIComponent).join('%7C'));

/* Parte una lista en grupos de n, respetando el orden. */
function enTramos(arr, n){
  const out = [];
  for (let i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n));
  return out;
}
/* ── Lugares de paso ──────────────────────────────────────────────────────────
   Entre dos paradas consecutivas, qué del catálogo queda EN EL CAMINO. No son
   visitas y no tocan el itinerario: son referencia por si vale un desvío corto.

   La medida es el DESVÍO —cuánto se alarga el trayecto si paso por ahí,
   d(A,P) + d(P,B) - d(A,B)— y no la distancia al lugar, porque son preguntas
   distintas: el Puente de Brooklyn está a 800 m de DUMBO y cuesta CERO metros
   pasar por él, porque queda justo sobre la línea hacia el Oculus.

   Arriba de PASO_CORREDOR el tramo ya no se camina, se va en subte: ahí el
   corredor no existe (no pasás por el medio) y solo valen las puntas. */
const PASO_DESVIO = R.pasoDesvio;    /* m de desvío que se tolera en un tramo caminable */
/* En un tramo corto el desvío miente: si A y B están a 100 m, pasar por algo que está
   a la vuelta de la esquina "cuesta" 500 m y queda afuera. Por eso también entra lo
   que está a menos de PASO_CERCA de cualquiera de las dos puntas — es el caso del
   paseo por el Lower East Side, donde la parada siguiente está a una cuadra y el
   barrio entero está a tiro. */
const PASO_CERCA = R.pasoCerca;
const PASO_CORREDOR = R.pasoCorredor; /* m: hasta acá el tramo se hace a pie */
const PASO_PUNTA = R.pasoPunta;      /* m alrededor de cada punta en los tramos largos */
const PASO_TOP = R.pasoTop;          /* cuántos se muestran por tramo */
/* ACÁ CERCA: lo que está pegado a una parada, no en el camino hacia ella.
   Son preguntas distintas y confundirlas engaña. OddFellows está DENTRO de
   Domino Park, a 296 m del punto, y como referencia de tramo salía con
   «+591 m de desvío» colgado del traslado anterior — el número correcto es
   otro y el lugar donde mostrarlo también: va en la parada, mientras estás
   ahí parado una hora. */
const ACA_RADIO = R.acaRadio;       /* m alrededor de una parada */
const ACA_TOP = R.acaTop;
const PASO_FUERA = {transporte:1, alojamiento:1, evento:1, teatro:1};
/* Acá decía `hotel:1`, una categoría que nunca existió en CAT: la clave estaba
   muerta y no filtraba nada. Ahora se llama como la categoría de verdad.
   transporte y alojamiento son logística; evento y teatro tienen fecha, hora y entrada
   —Broadway no es un desvío de cinco minutos—. La música es el caso fino: un club
   de jazz cuesta $25-45 y hay que reservar, pero un bar con música en vivo se paga
   en la puerta y se entra sin nada. Solo pasa el segundo, y solo de noche: Bar
   Bayeux a las once de la mañana no es una referencia útil. */
const PASO_MUSICA_COVER = TRIP.musica.cover; /* hasta acá es cover de puerta, no una entrada */
const PASO_MUSICA_DESDE = TRIP.musica.desde; /* antes de esta hora un bar de música no sirve */
const esDesvioPosible = (p, horaTramo) =>
  p.cat !== 'musica' ? true
  : !p.book && (p.cost || 0) <= PASO_MUSICA_COVER && horaTramo >= PASO_MUSICA_DESDE;

function hav(a, b){
  const R = 6371000, r = Math.PI/180;
  const la1 = a[0]*r, la2 = b[0]*r, dla = (b[0]-a[0])*r, dlo = (b[1]-a[1])*r;
  const h = Math.sin(dla/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(dlo/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
/* Los de paso de un día entero: { idDelBloqueDestino: [{p, desvio}] }.
   Se calcula sobre el itinerario VIVO —no en el build— para que siga bien
   después de que Juan mueva, agregue o saque un bloque. */
function dePasoDelDia(d){
  const wd = DOW_IDX[d.dow];
  const usados = {};                     /* agendado en CUALQUIER día: no es novedad */
  S.itin.forEach(x => x.blocks.forEach(b => { if (b.pid) usados[b.pid] = 1; }));
  const cand = PLACES.filter(p => p.lat && !usados[p.id] && !PASO_FUERA[p.cat]
    && VIDS.some(v => interest(p.id)[v] !== 0)   /* lo que TODOS bajaron a 0 está descartado */
    && horario(p, wd) !== 'CERRADO');    /* cerrado ese día no es una referencia útil */

  const paradas = paradasDe(d);

  /* PRIMERO lo que está pegado a una parada: si algo está a menos de ACA_RADIO
     de donde vas a estar, la respuesta útil es «lo tenés acá», no «te queda de
     camino». Se lo queda la parada MÁS cercana, y sale del reparto de tramos. */
  const aca = {}, tomadoAca = {};
  paradas.forEach(({b, p: A}) => {
    const a = [A.lat, A.lng];
    const hora = parseInt(String(b.t).slice(0, 2), 10);
    cand.forEach(q => {
      if (!esDesvioPosible(q, hora)) return;
      const dist = hav(a, [q.lat, q.lng]);
      if (dist > ACA_RADIO) return;
      if (!tomadoAca[q.id] || dist < tomadoAca[q.id].dist)
        tomadoAca[q.id] = {p: q, dist, destino: b.id};
    });
  });
  Object.values(tomadoAca).forEach(x => (aca[x.destino] = aca[x.destino] || []).push(x));
  Object.keys(aca).forEach(k => {
    aca[k].sort((x, y) => x.dist - y.dist);
    aca[k] = aca[k].slice(0, ACA_TOP);
  });
  const yaEnAca = {};
  Object.values(aca).flat().forEach(x => { yaEnAca[x.p.id] = 1; });

  /* Qué candidatos tiene cada tramo, ordenados por lo que cuesta pasar. */
  const tramos = [];
  for (let i = 0; i < paradas.length - 1; i++){
    const A = paradas[i].p, B = paradas[i+1].p;
    const a = [A.lat, A.lng], b = [B.lat, B.lng], dab = hav(a, b);
    const hora = parseInt(String(paradas[i+1].b.t).slice(0, 2), 10);   /* a qué hora se pasa */
    const lista = [];
    cand.forEach(p => {
      if (!esDesvioPosible(p, hora)) return;
      const q = [p.lat, p.lng], da = hav(a, q), db = hav(q, b);
      const desvio = da + db - dab;
      const entra = dab <= PASO_CORREDOR
        ? (desvio <= PASO_DESVIO || Math.min(da, db) <= PASO_CERCA)
        : Math.min(da, db) <= PASO_PUNTA;
      if (entra && !yaEnAca[p.id]) lista.push({p, desvio});
    });
    lista.sort((x, y) => x.desvio - y.desvio);
    tramos.push({destino: paradas[i+1].b.id, lista});
  }

  /* El reparto va en DOS vueltas, y el orden importa. Con solo "cada lugar al tramo
     donde menos cuesta", los tramos cortos del mismo barrio quedaban mudos: el
     domingo, el Tenement Museum y compañía se los llevaba el tramo de las 10:30 con
     un metro de desvío, y la caminata por el Lower East Side —que los tiene a todos
     a la vuelta— no mostraba nada.
     Primera vuelta: cada tramo se queda con su mejor candidato todavía libre, así
     ninguno con opciones se queda sin nada. Segunda: el resto se reparte al tramo
     donde menos cuesta. Un lugar sigue apareciendo UNA sola vez por día. */
  const tomado = {}, out = {};
  const poner = (destino, x) => { (out[destino] = out[destino] || []).push(x); tomado[x.p.id] = 1; };
  tramos.forEach(t => {
    const primero = t.lista.find(x => !tomado[x.p.id]);
    if (primero) poner(t.destino, primero);
  });
  const resto = {};
  tramos.forEach(t => t.lista.forEach(x => {
    if (tomado[x.p.id]) return;
    if (!resto[x.p.id] || x.desvio < resto[x.p.id].desvio) resto[x.p.id] = {...x, destino: t.destino};
  }));
  Object.values(resto).forEach(x => poner(x.destino, x));

  Object.keys(out).forEach(k => {
    out[k].sort((x, y) => x.desvio - y.desvio);
    out[k] = out[k].slice(0, PASO_TOP);
  });
  return {paso: out, aca};
}
/* ── Qué hay dentro de un barrio ──────────────────────────────────────────────
   Un bloque de "caminar un barrio" no es una parada: son horas sueltas en un
   polígono. Ahí la pregunta no es "qué queda en el camino" —no hay camino— sino
   "qué tengo alrededor mientras camino".
   Se toma por barrio Y por radio: el `hood` del catálogo es la definición
   administrativa y no siempre coincide con lo que uno camina. */
const BARRIO_RADIO = R.barrioRadio;  /* m alrededor del punto del barrio */
const BARRIO_TOP = R.barrioTop;
function enElBarrio(pb){
  if (!pb || pb.cat !== 'barrio' || !pb.lat) return [];
  const usados = {};
  S.itin.forEach(x => x.blocks.forEach(b => { if (b.pid) usados[b.pid] = 1; }));
  const c = [pb.lat, pb.lng];
  return PLACES
    .filter(p => p.lat && p.id !== pb.id && !usados[p.id] && !PASO_FUERA[p.cat]
                 && VIDS.some(v => interest(p.id)[v] !== 0))
    .map(p => ({p, d: hav(c, [p.lat, p.lng])}))
    .filter(x => x.d <= BARRIO_RADIO || x.p.hood === pb.hood)
    .sort((x, y) => x.d - y.d)
    .slice(0, BARRIO_TOP);
}
/* Los mismos lugares, planos, para pintarlos en el mapa del día. */
function dePasoPlano(d){
  const r = dePasoDelDia(d);
  return Object.values(r.paso).flat()
    .concat(Object.values(r.aca).flat().map(x => ({p: x.p, desvio: x.dist})));
}
/* Las paradas de un día, en orden, sin repetir la misma dos bloques seguidos
   (el hotel al salir y al volver son dos paradas distintas; el mismo lugar en
   bloques pegados, una sola). */
function paradasDe(d){
  const out = [];
  d.blocks.forEach(b => {
    const p = b.pid ? PBY[b.pid] : null;
    /* ⚠ SIN COORDENADAS NO ES UNA PARADA para la geometría del día.
       amPunto() solo necesita un NOMBRE —le alcanza para armar un link de
       navegación— así que un lugar sin lat/lng entraba igual acá y después
       hav() lo comparaba contra todo el catálogo: distancia NaN, y como
       `NaN > ACA_RADIO` es false, se llevaba cuatro lugares de cualquier punto
       de la ciudad como «acá cerca» a NaN metros, robándoselos a las paradas
       reales. Con el catálogo editable desde la app, un lugar sin ubicación es
       un estado normal, así que esto pasó de hipótesis a certeza. */
    if (!tieneUbic(p)) return;
    if (!amPunto(p)) return;
    if (out.length && out[out.length - 1].p.id === p.id) return;
    out.push({b, p});
  });
  return out;
}
/* Un costo que no es número pintaba «$undefined» en nueve puntos. */
/* null es «precio sin verificar», no «gratis»: +null da 0 y lo pintaba como gratis. */
const money = n => { const v = +n; return n == null || !Number.isFinite(v) ? '—' : v === 0 ? 'gratis' : plata(v); };
/* El «por qué» recortado y escapado. p.why.slice reventaba en 4 puntos, y uno
   de ellos es el que arma el texto al agendar un lugar en un día. */
const why = (p, max) => { const w = String((p && p.why) || '');
  return w.length > max ? esc(w.slice(0, max)) + '…' : esc(w); };
/* El texto con el que un lugar entra a un día. Sin why, el nombre solo. */
const txtBloque = p => String(p.n || '') + (p.why ? ' — ' + String(p.why).slice(0, 120) : '');
const DIAS = ['lunes','martes','miércoles','jueves','viernes','sábado','domingo'];
/* Horario del lugar para un día de la semana (0=lunes). Devuelve null si no hay dato. */
function horario(p, wd){
  if (!p.hrs) return null;
  const w = p.hrs[wd];
  return w ? `${w[0]}–${w[1]}` : 'CERRADO';
}
/* Texto compacto de la semana entera, agrupando días con el mismo horario. */
function horarioSemana(p){
  if (!p.hrs) return '';
  const out = []; let ini = 0;
  for (let i = 1; i <= 6; i++){
    const a = JSON.stringify(p.hrs[i]), b = JSON.stringify(p.hrs[i-1]);
    if (a !== b){ out.push([ini, i-1]); ini = i; }
  }
  out.push([ini, 6]);
  return out.map(([a,b]) => {
    const w = p.hrs[a], r = a === b ? DIAS[a] : `${DIAS[a]} a ${DIAS[b]}`;
    return `${r}: ${w ? w[0]+'–'+w[1] : 'cerrado'}`;
  }).join(' · ');
}
/* ── El reloj ─────────────────────────────────────────────────────────────────
   `new Date().toISOString()` es UTC: en Nueva York (UTC-4) a partir de las 20:00
   locales devolvía el día SIGUIENTE, o sea que todas las noches del viaje —Birdland,
   el Vanguard, Café Wha— la app creía que ya era mañana. Va en hora local.
   `window.__NOW` existe solo para poder probar el "ahora" desde Playwright. */
function NOW(){ return window.__NOW ? new Date(window.__NOW) : new Date(); }
function hoyStr(){ const d = NOW();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
let TODAY = hoyStr();
const minOf = t => /^\d{1,2}:\d{2}$/.test(String(t)) ? (+String(t).slice(0,2))*60 + (+String(t).slice(3,5)) : null;
const minsNow = () => { const d = NOW(); return d.getHours()*60 + d.getMinutes(); };
const hhmmNow = () => { const d = NOW();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); };
const enMin = m => m < 60 ? m + ' min' : Math.floor(m/60) + ' h' + (m%60 ? ' ' + (m%60) + ' min' : '');

/* ── leadOf: jerarquía, no tijera ─────────────────────────────────────────────
   Los textos del catálogo ya vienen con una estructura: ★ al principio para lo
   destacado, y un separador temprano —" — ", ". " o ": "— entre el QUÉ y el
   POR QUÉ. Se parte ahí. El resto NO se pierde: se muestra entero al desplegar.
   El ":" se exige precedido de algo que no sea dígito para no cortar en "125 St: 12". */
function leadOf(txt){
  let t = String(txt == null ? '' : txt).trim(), star = 0;
  const m = t.match(/^([★☆]+)\s*/);
  if (m){ star = m[1].length; t = t.slice(m[0].length); }
  const cands = [];
  const cab = t.slice(0, 100);
  const e = cab.search(/\s[—–]\s/);       if (e > 6)  cands.push([e, 3]);
  const p = cab.search(/\.\s/);           if (p > 10) cands.push([p, 2]);
  const c = cab.search(/[^\d]:\s/);       if (c > 10) cands.push([c + 1, 2]);
  cands.sort((a, b) => a[0] - b[0]);
  let head, rest;
  if (cands.length){ head = t.slice(0, cands[0][0]).trim(); rest = t.slice(cands[0][0] + cands[0][1]).trim(); }
  else if (t.length > 92){ const sp = t.lastIndexOf(' ', 92);
    head = t.slice(0, sp > 20 ? sp : 92).trim() + '…'; rest = t; }
  else { head = t; rest = ''; }
  return {star, head, rest, full: t};
}
/* El catálogo escribe en MAYÚSCULAS dos cosas distintas: advertencias
   ("CIERRA LOS SÁBADOS", "RESERVA NO MODIFICABLE") y énfasis o nombres propios
   ("el MET", "SUMMIT", "JOSHUA REDMAN"). Marcar cualquier mayúscula encendía el ⚠
   en 51 de 143 bloques y dejaba de significar algo. Con este vocabulario quedan 28,
   y los 28 son advertencias de verdad: si el ⚠ aparece, hay que abrir el bloque. */
const RX_AVISO = /\b(NO|OJO|CIERRA|CERRAD[AO]S?|S[ÁA]BADOS?|DOMINGOS?|LUNES|MARTES|MI[ÉE]RCOLES|JUEVES|VIERNES|RESERVAR?|RESERVAD[AO]S?|MODIFICABLE|OBLIGAD[AO]S?|LLEGAR|SALIR|SALIDA|[ÚU]LTIM[AO]S?|M[ÁA]XIMO|M[ÍI]NIMO|TIMED|TICKET|AGOTAD[AO]S?|PEDIR|COMPRAR|EVITAR|CUIDADO|IMPRESCINDIBLE|PREINSCRIPCI[ÓO]N|HORARIO|ASIGNADO|PUNTUAL|CONFIRMAR|VERIFICAR|ANTES|EXACT[AO]S?|CUPO|FILA|COLA)\b/;
const tieneAviso = rest => RX_AVISO.test(String(rest || ''));

/* Índice del bloque que toca AHORA en un día: el último cuya hora ya pasó.
   Devuelve -1 si el día no es hoy o si todavía no arrancó. */
function idxAhora(d){
  if (!d || d.date !== TODAY) return -1;
  const m = minsNow(); let idx = -1;
  d.blocks.forEach((b, i) => { const t = minOf(b.t); if (t != null && t <= m) idx = i; });
  return idx;
}

function setStat(){
  const tot = S.itin.reduce((a,d) => a + d.blocks.length, 0);
  const dn  = S.itin.reduce((a,d) => a + d.blocks.filter(b => b.done).length, 0);
  const d = S.itin.find(x => x.n === S.day);
  /* Parado en la calle, "0/143" no dice nada: lo que importa es cómo va HOY.
     El estado de guardado se cuenta acá para que la barra no necesite el botón. */
  $('#stat').innerHTML = (S.tab === 'itin' && d)
    ? `<b>${d.blocks.filter(b => b.done).length}/${d.blocks.length}</b> del día ${d.n}` +
      `<span style="opacity:.55"> · ${dn}/${tot} en total${dirty ? ' · guardando…' : ''}</span>`
    : `<b>${dn}/${tot}</b> bloques hechos`;
  $('#bSave').textContent = dirty ? 'Guardando…' : 'Guardado ✓';
}

function importarLista(){
  pedirQuienSoy(() => planSheet('Importar una lista de Google Maps',
    'Pegá el archivo que te dio Google: el <b>CSV</b> de una lista de Takeout, el ' +
    '<b>Saved Places.json</b>, el <b>KML</b> de Mis Mapas, o una pila de links (uno por línea).<br>' +
    '<b>El link de una lista no sirve</b>: Google no deja leerla desde el navegador. ' +
    'Hay que bajar el archivo desde takeout.google.com o «Mis Mapas → Exportar a KML».',
    '', [{t: 'Leer', f: txt => {
      const filas = leerListaGoogle(txt);
      if (!filas || !filas.length){ toast('No reconocí ese formato'); return; }
      document.getElementById('planSheet').remove();
      revisarLista(filas);
    }},
    {t: 'Desde archivo', f: () => {
      const f = document.createElement('input');
      f.type = 'file'; f.accept = '.csv,.json,.kml,.txt,text/csv,application/json';
      f.onchange = () => { const r = new FileReader();
        r.onload = () => { const filas = leerListaGoogle(r.result);
          if (!filas || !filas.length){ toast('No reconocí ese formato'); return; }
          document.getElementById('planSheet').remove(); revisarLista(filas); };
        r.readAsText(f.files[0]); };
      f.click(); }}], true));
}

/* NO se importa a ciegas. Una lista de Google no trae categoría ni barrio —que
   el catálogo necesita— y trae duplicados de lo que ya está cargado. Además, a
   139 filas, un error que se ve recién después es carísimo de deshacer. */
function revisarLista(filas){
  /* La reconciliación: lo que ya se miró en una importación anterior no se
     vuelve a ofrecer. Sin esto, reimportar la lista para traer los nuevos
     obligaría a destildar de nuevo los cien de la vez pasada. */
  const vistos = new Set();
  Object.values(S.listas || {}).forEach(L => (L.vistos || []).forEach(k => vistos.add(k)));
  const clave = x => x.gcid ? 'c:' + x.gcid : 'n:' + normNom(x.n);
  const nuevas = filas.filter(x => !vistos.has(clave(x)));
  const repetidas = filas.length - nuevas.length;

  if (!nuevas.length){
    sheet(`<h2 style="font-size:17px;margin-bottom:5px">Nada nuevo</h2>
      <p class="sm muted">Las ${filas.length} filas de esta lista ya se miraron antes.
      Cuando agregues lugares en Google Maps y vuelvas a exportar, van a aparecer acá.</p>
      <button class="btn" onclick="closeSheet()" style="margin-top:11px">Cerrar</button>`);
    return;
  }
  const conUbic = nuevas.filter(tieneUbic).length;
  const dups = nuevas.map(yaEsta);

  sheet(`<h2 style="font-size:17px;margin-bottom:3px">Revisar antes de importar</h2>
    <p class="sm muted" style="margin:0 0 10px"><b>${nuevas.length}</b> lugar${nuevas.length !== 1 ? 'es' : ''} nuevo${nuevas.length !== 1 ? 's' : ''} ·
      <b>${conUbic}</b> con ubicación${repetidas ? ` · ${repetidas} ya se habían mirado` : ''}.
      Los que ya están en el viaje vienen destildados.</p>
    <div class="flex" style="gap:7px;margin-bottom:9px">
      <label class="fl" style="flex:1;margin:0">Categoría para todos
        <select class="search" id="liCat">${Object.entries(CAT).map(([k, v]) =>
          `<option value="${k}"${k==='comida'?' selected':''}>${esc(v.n)}</option>`).join('')}</select></label>
      <label class="fl" style="flex:1;margin:0">Barrio o ciudad
        <input class="search" id="liHood" placeholder="se puede editar después"></label>
    </div>
    <div id="liLista" style="max-height:38vh;overflow-y:auto;border:1px solid var(--line);
      border-radius:11px;padding:7px">
      ${nuevas.map((x, i) => `<label style="display:flex;gap:8px;align-items:flex-start;
        padding:6px 4px;border-bottom:1px solid var(--line)">
        <input type="checkbox" data-i="${i}"${dups[i] ? '' : ' checked'} style="margin-top:3px">
        <span style="flex:1;min-width:0">
          <b style="font-size:13.5px">${esc(x.n)}</b>
          <span class="xs muted" style="display:block">
            ${tieneUbic(x) ? '📍 con ubicación' : 'sin ubicación'}${x.gcid ? ' · abre exacto en Maps' : ''}
            ${dups[i] ? ' · <b style="color:var(--accent)">' + esc(dups[i]) + '</b>' : ''}</span>
          ${x.why ? `<span class="xs muted" style="display:block;font-style:italic">${esc(x.why.slice(0,110))}</span>` : ''}
        </span></label>`).join('')}
    </div>
    <div class="flex" style="margin-top:12px;justify-content:flex-end">
      <button class="btn ghost sm" id="liNada" style="margin-right:auto">No importar ninguno</button>
      <button class="btn ghost" id="liCancel">Cancelar</button>
      <button class="btn" id="liOk">Importar</button></div>`);

  const marcados = () => [...document.querySelectorAll('#liLista input:checked')]
    .map(e => nuevas[+e.dataset.i]);
  $('#liCancel').onclick = closeSheet;
  /* «No importar ninguno» NO es cancelar: marca las filas como vistas, así la
     próxima reconciliación no vuelve a ofrecerlas. Es la respuesta a «esta lista
     no me sirve» sin tener que destildar cien casillas cada vez. */
  $('#liNada').onclick = () => guardarLista(filas, []);
  $('#liOk').onclick = () => guardarLista(filas, marcados());
}

function guardarLista(todas, elegidos){
