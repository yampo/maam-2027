function drawMap(){
  if (!mapaListo()) return;
  mLimpiar();
  const dsel = $('#mday')?.value, csel = $('#mcat')?.value, fsel = $('#mfree')?.classList.contains('on');
  // csel viene como "c:<categoría>" o "s:<tipo>"
  const matchSel = p => !csel || (csel.startsWith('c:') ? p.cat === csel.slice(2) : p.typ === csel.slice(2));
  let items = [];
  /* ── Vista de conjunto: los 9 recorridos a la vez ───────────────────────── */
  if (dsel === 'todos'){
    /* La leyenda pasa a ser de DÍAS y es el control de aislamiento: tocar uno
       lo deja solo. Es la salida real cuando dos colores se parecen — y con
       nueve series siempre hay dos que se parecen. */
    const leg = $('#mleg');
    if (leg) leg.innerHTML = `<span class="xs muted" style="width:100%;margin-bottom:2px">
        El número de cada punto es el <b>orden de la parada dentro de su día</b>; el color dice qué día es.
        Tocá un día para verlo solo${SOLO_DIA ? ' · <b>tocá de nuevo para volver a los nueve</b>' : ''}.
        ${TRIP.zonasFuera.length ? 'No se dibuja lo que queda fuera de la ciudad (' + esc(TRIP.zonasFuera.join(', ')) + '), que deformaba el mapa.' : ''}</span>` +
      S.itin.map((d, i) => { const c = DIA_COLOR[i % DIA_COLOR.length];
        const on = !SOLO_DIA || SOLO_DIA === d.n;
        return `<button class="chip mdchip cc" data-dia="${d.n}" style="background:${c}${on?'22':'0d'};
          --cc:${on?c:'var(--mut)'};color:var(--cc);border:1.5px solid ${SOLO_DIA===d.n?c:'transparent'}">
          <b style="display:inline-block;width:15px;height:15px;border-radius:50%;background:${on?c:'var(--line)'};
          color:#fff;font-size:9.5px;line-height:15px;text-align:center;margin-right:4px">${d.n}</b>${d.dow.slice(0,3)} ${d.date.slice(8)}/${d.date.slice(5,7)}</button>`;
      }).join('');
    const pts = [];
    S.itin.forEach((d, di) => {
      if (SOLO_DIA && d.n !== SOLO_DIA) return;
      const col = DIA_COLOR[di % DIA_COLOR.length];
      const ruta = [], vistos = {}; let orden = 0;
      d.blocks.forEach(b => {
        const p = b.pid ? PBY[b.pid] : null;
        if (!p || !p.lat || vistos[p.id]) return;
        /* Fuera de la ciudad no entra: en NYC el hotel de Branchburg estaba a
           60 km y deformaba el encuadre — Manhattan quedaba apretado en una
           esquina y el recorrido, ilegible. Cada viaje declara sus zonasFuera. */
        if (TRIP.zonasFuera.includes(p.boro)) return;
        vistos[p.id] = 1; orden++;
        ruta.push([p.lat, p.lng]); pts.push([p.lat, p.lng]);
        /* El número es el ORDEN DE LA PARADA dentro del día, para poder seguir la
           secuencia; el color dice de qué día es. Ojo con el costo: con los nueve
           días juntos la identidad del día queda SOLO en el color, que con nueve
           series no alcanza — por eso el popup nombra el día y la leyenda aísla. */
        mMarca(p.lat, p.lng, `<div class="mdia" style="background:${col}">${orden}</div>`, [22,22], [11,11],
          `<h4>${esc(b.t)} · ${esc(p.n)}</h4>
            <div style="color:${col};font-weight:700;font-size:12px;margin-bottom:5px">
              Parada ${orden} del día ${d.n} · ${esc(d.dow)} ${d.date.slice(8)}/${d.date.slice(5,7)}</div>
            <div style="color:#66707d;font-size:12px">${esc(p.typ)} · ${esc(p.hood)}</div>`);
      });
      if (ruta.length > 1)
        mLinea(ruta, {color: col, weight: SOLO_DIA ? 4 : 2.5, opacity: SOLO_DIA ? .95 : .6});
    });
    if (pts.length) mEncuadrar(pts, SOLO_DIA ? 14 : 12);
    return;
  }
  if (dsel){
    const d = S.itin.find(x => x.n === +dsel);
    d.blocks.forEach(b => { if (b.pid && PBY[b.pid]) items.push({p:PBY[b.pid], num:items.length+1, t:b.t}); });
    /* Los de paso van SIN número y no entran en la línea del recorrido: son
       referencia, no paradas. Se marcan con `paso` para pintarlos distinto. */
    dePasoPlano(d).forEach(({p, desvio}) => items.push({p, num:null, paso:desvio}));
  } else {
    items = PLACES.filter(p => matchSel(p) && (!fsel || p.cost === 0 || p.free)).map(p => ({p, num:null}));
  }
  const leg = $('#mleg');
  if (leg) leg.innerHTML = Object.entries(CAT).map(([k,v]) =>
    `<span class="chip cc" style="background:${v.c}1a;--cc:${v.c};color:var(--cc)">● ${v.n}</span>`).join('');
  /* Lo de zonasFuera se dibuja pero NO manda en el encuadre del mapa de lugares.
     El mapa de los días juntos ya lo dejaba afuera; este no, y con Japón y Nueva
     York en el mismo viaje el encuadre se iba al medio del Pacífico, con las dos
     ciudades en puntos. En la vista de UN día sí cuenta: es el recorrido de ese día. */
  const fuera = p => !dsel && TRIP.zonasFuera.includes(p.boro);
  const pts = [], ptsFuera = [], ruta = [];
  items.forEach(({p,num,t,paso}) => {
    if (!p.lat) return;
    (fuera(p) ? ptsFuera : pts).push([p.lat, p.lng]);
    if (num) ruta.push([p.lat, p.lng]);      /* la línea une las paradas, no las referencias */
    const c = cat(p).c;
    const [html, tam, ancla] = num
      ? [`<div class="mnum" style="background:${c};width:27px;height:27px">${num}</div>`, [27,27], [13,13]]
      : paso != null
      ? [`<div class="mk mkpaso" style="border-color:${c}"></div>`, [15,15], [8,8]]
      : [`<div class="mk" style="background:${c};width:13px;height:13px"></div>`, [13,13], [7,7]];
    mMarca(p.lat, p.lng, html, tam, ancla,
      `<h4>${t ? t + ' · ' : ''}${esc(p.n)}</h4>
       ${paso != null ? `<div style="font-size:11.5px;color:#8a7f6d;margin-bottom:6px">
         De paso · no está en el itinerario · desvío +${paso < 950 ? Math.round(paso/10)*10 + ' m' : (paso/1000).toFixed(1) + ' km'}</div>` : ''}
       <div style="color:#66707d;font-size:12px;margin-bottom:6px"><b style="color:${cat(p).c}">${esc(p.typ)}</b> · ${esc(p.hood)} · ${money(p.cost)}</div>
       <div style="margin-bottom:8px">${why(p,190)}</div>
       <div style="font-size:11.5px;color:#66707d;margin-bottom:8px">${TPT.icono} ${esc(p.sub)}</div>
       <a href="${gmaps(p)}" target="_blank" rel="noopener"
          style="display:inline-block;background:#14293d;color:#fff;padding:7px 11px;border-radius:9px;
          text-decoration:none;font-weight:650;font-size:12px">Abrir en Google Maps ↗</a>`,
      /* las paradas numeradas, por encima de las referencias de paso */
      num ? 1000 : 0);
  });
  /* El color del recorrido es el del día, el mismo de la vista «los días juntos». */
  if (dsel && ruta.length > 1)
    mLinea(ruta, {color: DIA_COLOR[Math.max(0, S.itin.findIndex(x => x.n === +dsel)) % DIA_COLOR.length],
                  weight:2.5, opacity:.55, dash:'6,7'});
  /* Si el filtro deja SOLO lugares de afuera (una categoría que solo hay allá), se
     encuadra en ellos: un mapa vacío sería peor que uno lejano. */
  const encuadre = pts.length ? pts : ptsFuera;
  if (encuadre.length) mEncuadrar(encuadre, dsel ? 14 : 12);
}

/* ═══════════ BLOQUES GENÉRICOS ══════════════════════════════════════════════
   Las pestañas Costos y Transporte se dibujan con estos bloques, que el viaje
   declara en extras.py. Antes había una función de render por cada cosa —una
   para el aeropuerto de Newark, otra para el tren de New Jersey— y eso ataba la
   app a ese viaje: para el siguiente había que reescribir la vista entera.
   Los tipos están documentados en engine/lib/bloques.py. */

/* Convención de las tablas: ✅ en la primera celda resalta la fila, ❌ o 🚫 la
   atenúa. Sirve para que la recomendación se lea de un vistazo sin repetirla. */
const filaClase = f => /✅/.test(String(f[0])) ? 'hl' : (/❌|🚫/.test(String(f[0])) ? 'bad' : '');

function rBloque(b){
  switch (b.tipo){

        <tbody>${b.filas.map(f => `<tr class="${filaClase(f)}">${f.map((c,i) =>
          `<td class="${i===0?'b':(num.has(i)?'n':'sm')}">${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody>
      </table></div>${b.nota ? `<div class="hint" style="text-align:left">${esc(b.nota)}</div>` : ''}`;
    }

    case 'kv':
      return `<div class="card pad"><dl class="kv">${b.filas.map(([k,v]) =>
        `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl></div>`;

    case 'fichas':
      return b.fichas.map(f => `<div class="card pad" style="margin-bottom:9px">
        <div class="b" style="font-size:14.5px;margin-bottom:6px">${esc(f.titulo)}</div>
        ${(f.campos||[]).map(([k,v]) => `<div class="sm" style="margin-bottom:5px">
          <span class="muted">${esc(k)}:</span> ${esc(v)}</div>`).join('')}
        ${f.veredicto ? `<div class="banner ${f.estilo} sm" style="margin:0">${esc(f.veredicto)}</div>` : ''}
      </div>`).join('');

    case 'detalle':
      return `<details><summary>${esc(b.titulo)}</summary><div class="dbody">
        ${b.filas.map(([k,v],i) => `<p class="sm"${i===b.filas.length-1?' style="margin-bottom:0"':''}>
          <b>${esc(k)}:</b> ${esc(v)}</p>`).join('')}</div></details>`;

    case 'lista':
      return b.items.map((x,i) => `<div class="card pad sm" style="margin-bottom:8px">${
        b.numerada ? `<b style="color:var(--accent)">${i+1}.</b> ` : '▸ '}${esc(x)}</div>`).join('');

    case 'texto':
      return `<p class="sm">${esc(b.texto)}</p>`;

    default:
      return '';
  }
}

const rSeccion = s => `<div class="sect">${esc(s.titulo)}</div>` + s.bloques.map(rBloque).join('');

/* ═══════════ VISTA: COSTOS ═══════════ */
function rCosts(){
  /* La primera fila NO es un dato fijo: se recalcula con lo que esté marcado
     como "sí" en Lugares, así mover un 1 a un 2 se ve en el total al instante.
     Comida y Música quedan fuera porque tienen sus propias filas en extras.py:
     sumar el cover del Vanguard dos veces era el error de la primera versión. */
  const acum = {}; VIDS.forEach(v => acum[v] = 0);
  PLACES.forEach(p => { if (p.cat === 'comida' || p.cat === 'musica') return;
    const i = interest(p.id);
    VIDS.forEach(v => { if (i[v] === 2) acum[v] += (+p.cost || 0); }); });
  /* Cada fila es [concepto, {id: monto}, base]. Un viajero que no figura en una
     fila vale 0 acá, pero el build de extras.py CORTA si falta: un cero implícito
     falsea el total del viaje sin un solo mensaje. */
  const mto = (m, v) => Number.isFinite(+(m || {})[v]) ? +m[v] : 0;
  const rows = [{c:'Entradas de atracciones marcadas “sí”', m:acum,
    base:'Suma de los lugares con interés 2, excluyendo Comida y Música (que van en sus propias filas).'},
    ...(EX.costos.fijos || [])];
  const tot = {}; VIDS.forEach(v => tot[v] = rows.reduce((a,r) => a + mto(r.m, v), 0));
  const granTotal = VIDS.reduce((a,v) => a + tot[v], 0);
  const P = EX.pases;

  $('#v-costs').innerHTML =
    (P ? `<div class="banner ok"><b>Veredicto sobre los pases:</b> ${esc(P.veredicto)}</div>` : '') + `
    <div class="sect">Estimación de costos</div>
    <div class="tw"><table>
      <thead><tr><th>Concepto</th>${VS.map(v => `<th style="text-align:right">${esc(v.corto)}</th>`).join('')}

/* ── Tengo tiempo ─────────────────────────────────────────────────────────────
   Lo único de itinio que faltaba y que pesa en la calle: «estoy acá, la próxima
   parada es tal, tengo N minutos y ganas de X: ¿qué entra?».
   Es el mismo desvío de los lugares de paso —d(O,P) + d(P,B) - d(O,B)— pero en
   MINUTOS, desde donde estás parado y con el rato adentro del lugar sumado. Corre
   sin red: GPS, catálogo y cuentas, nada más. No agenda nada: «Llevame» abre Maps
   con el desvío de waypoint y la parada de siempre de destino.
   Lo que NO sabe: si algo está abierto cuando el lugar no tiene `hrs`. No se
   inventa: la opción sale igual, con el aviso arriba. */
const TT = TRIP.tengoTiempo, VEL = TRIP.velocidades;
/* Minutos de un tramo de m metros en línea recta, con las mismas velocidades que
   el build usa para los traslados estimados: lo más rápido entre caminar y el
   transporte con su espera. Por debajo de un kilómetro gana caminar solo, por la
   espera. NO se usa PASO_CORREDOR («hasta acá se camina»): con él, Ueno → Yanaka
   (2,2 km) contaba 39 min a pie contra 16 en tren, ir derecho salía carísimo, y
   cualquier desvío en tren hasta la estación de Tokio parecía costar 5 minutos. */
function ttTramo(m){
  const km = m * VEL.rodeo / 1000, pie = km * 60 / VEL.pie;
  const tpt = VEL.acceso + km * 60 / VEL.transporte;
  return tpt < pie ? {min: tpt, tpt: true} : {min: pie, tpt: false};
}
/* Desde qué parada se cuenta si no hay GPS. Si el día es hoy, la última antes de
   la próxima sin tildar DESPUÉS del bloque de ahora (o sea, donde deberías estar).
   Si no es hoy, la primera: es planificar, y se elige el tramo a mano. El destino
   siempre es la parada que sigue a la de partida. */
function ttPartida(d, ps){
  if (!ps.length) return null;
  if (d.date !== TODAY) return 0;
  const iNow = idxAhora(d);
  const k = ps.findIndex(x => d.blocks.indexOf(x.b) > iNow && !x.b.done);
  return k > 0 ? k - 1 : k < 0 ? ps.length - 1 : 0;
}
/* Todas las opciones desde `o` ([lat,lng]) hacia `dest` (un lugar, o null si no
   queda ninguna parada: ahí cuenta solo la ida). `ahora` en minutos del día, o
   null si el día no es hoy y no hay reloj contra el cual mirar horarios.
   Ordenadas por lo que cuestan; el tope de minutos lo aplica quien pregunta. */
function tengoTiempo(o, dest, wd, ahora, hora){
  const usados = {};                     /* agendado en cualquier día: ya va a pasar */
  S.itin.forEach(x => x.blocks.forEach(b => { if (b.pid) usados[b.pid] = 1; }));
  const b = dest ? [+dest.lat, +dest.lng] : null;
  const directo = b ? ttTramo(hav(o, b)).min : 0;
  const out = [];
  PLACES.forEach(p => {
    if (!tieneUbic(p) || usados[p.id] || PASO_FUERA[p.cat] || (dest && p.id === dest.id)) return;
    const it = interest(p.id);
    if (!VIDS.some(v => it[v] !== 0)) return;        /* todos lo bajaron a 0 */
    if (!esDesvioPosible(p, hora)) return;
    const q = [+p.lat, +p.lng], ida = ttTramo(hav(o, q));
    const vuelta = b ? ttTramo(hav(q, b)) : {min: 0, tpt: false};
    const estadia = p.dur > 0 ? p.dur * 60 : TT.estadia;
    /* Con el cambio de pie a transporte el triángulo puede dar negativo: un desvío
       nunca te ahorra tiempo. */
    const viaje = Math.max(0, ida.min + vuelta.min - directo);
    let hs = null;
    if (p.hrs){
      const w = p.hrs[wd];
      if (!w) return;                                /* cerrado ese día */
      hs = w[0] + '–' + w[1];
      const ab = minOf(w[0]); let ci = minOf(w[1]);
      if (ahora != null && ab != null && ci != null){
        if (ci <= ab) ci += 1440;                    /* cierra pasada la medianoche */
        const llega = ahora + ida.min;
        if (llega < ab || llega + estadia > ci) return;
      }
    }
    out.push({p, it, extra: Math.round(viaje + estadia), viaje: Math.round(viaje),
              estadia: Math.round(estadia), estimada: !(p.dur > 0), tpt: ida.tpt || vuelta.tpt, hs});
  });
  const sies = x => VIDS.filter(v => x.it[v] === 2).length;
  return out.sort((x, y) => x.extra - y.extra || sies(y) - sies(x));
}
function tengoTiempoSheet(dayN){
  const d = S.itin.find(x => x.n === dayN) || S.itin[0];
  const wd = DOW_IDX[d.dow], esHoy = d.date === TODAY;
  const ps = paradasDe(d);
  /* `desde`: 'gps', o el índice de la parada de la que se sale. Con GPS el destino
     es la que sigue a la de partida calculada; desde una parada, la siguiente. */
  const k0 = ttPartida(d, ps);
  let desde = k0, gps = null, minSel = null, gana = '';
  const MINS = TT.minutos;

  sheet(`<div id="tt"><h2 style="font-size:17px;margin-bottom:4px">Tengo tiempo</h2>
    <div class="fl" style="margin-bottom:6px"><select class="search" id="ttDesde"></select></div>
    <p class="sm muted" id="ttDe" style="margin-bottom:9px"></p>
    <div class="flex" id="ttMin" style="margin-bottom:7px">${MINS.map(m =>
      `<button class="chip" data-tm="${m}">${enMin(m)}</button>`).join('')}</div>
    <div class="flex" id="ttCat" style="margin-bottom:9px"></div>
    <div id="ttAviso"></div>
    <div id="ttList"></div></div>`);

  const pinta = () => {
    if (!document.getElementById('ttList')) return;   /* la hoja ya se cerró */
    const ahora = esHoy ? minsNow() : null;
    let O = null, txt = '', dest = null;
    if (desde === 'gps' && gps){
      O = gps.ll; dest = k0 != null ? ps[k0 + 1] || null : null;
      txt = 'Desde donde estás' + (gps.ac > 60 ? ' (GPS impreciso, ±' + gps.ac + ' m)' : '');
    } else if (desde != null && desde !== 'gps'){
      const x = ps[desde]; O = [+x.p.lat, +x.p.lng]; dest = ps[desde + 1] || null;
      txt = 'Desde ' + amNombre(x.p);
    }
    const P = dest ? dest.p : null;
    $('#ttDesde').innerHTML = (gps ? `<option value="gps"${desde === 'gps' ? ' selected' : ''}>Desde donde estás (GPS)</option>` : '') +
      ps.map((x, i) => `<option value="${i}"${desde === i ? ' selected' : ''}>Desde ${esc(x.b.t)} · ${esc(amNombre(x.p))}</option>`).join('');
    const hora = ahora != null ? Math.floor(ahora / 60) : P ? parseInt(String(dest.b.t).slice(0, 2), 10) || 12 : 12;
    const hacia = P ? `hasta <b>${esc(amNombre(P))}</b>${dest.b.t ? ' (' + esc(dest.b.t) + ')' : ''}`
                    : 'sin otra parada en el día';
    if (!O){
      $('#ttDe').innerHTML = 'Este día no tiene paradas con ubicación: no sé desde dónde contar.';
      $('#ttList').innerHTML = '';
      return;
    }
    const todas = tengoTiempo(O, P, wd, ahora, hora);
    /* Cuántos minutos libres hay de verdad: hasta la hora de la próxima, menos lo
       que tarda ir derecho. Es lo que elige el botón de entrada. */
    const directo = P ? Math.round(ttTramo(hav(O, [+P.lat, +P.lng])).min) : 0;
    const libre = esHoy && P && minOf(dest.b.t) != null ? minOf(dest.b.t) - ahora - directo : null;
    if (minSel == null)
      minSel = libre == null ? MINS[Math.min(1, MINS.length - 1)]
             : libre >= MINS[0] ? MINS.filter(m => m <= libre).pop() : MINS[0];
    $('#ttDe').innerHTML = esc(txt) + ' ' + hacia + '.' +
      (libre != null ? (libre > 0 ? ` Te quedan <b>~${enMin(libre)}</b> libres.` : ' <b>Ya vas justo</b>: ir derecho lleva ~' + enMin(directo) + '.') : '') +
      (esHoy ? '' : ' <b>No es hoy</b>: la cuenta va sin reloj.');
    $('#ttMin').querySelectorAll('[data-tm]').forEach(e => e.classList.toggle('on', +e.dataset.tm === minSel));

    const entran = todas.filter(x => x.extra <= minSel);
    const porCat = {};
    entran.forEach(x => { porCat[x.p.cat] = (porCat[x.p.cat] || 0) + 1; });
    if (gana && !porCat[gana]) gana = '';
    $('#ttCat').innerHTML = `<button class="chip${gana ? '' : ' on'}" data-tc="">lo que sea · ${entran.length}</button>` +
      Object.keys(porCat).sort((a, b) => porCat[b] - porCat[a]).map(k =>
        `<button class="chip${gana === k ? ' on' : ''}" data-tc="${esc(k)}">${esc(cat({cat: k}).n)} · ${porCat[k]}</button>`).join('');

    const lista = entran.filter(x => !gana || x.p.cat === gana).slice(0, TT.top);
    const sinHrs = lista.filter(x => !x.hs).length;
    $('#ttAviso').innerHTML = sinHrs
      ? `<div class="banner warn sm" style="margin-bottom:8px">${sinHrs === lista.length
           ? (lista.length === 1 ? 'No tiene' : 'Ninguno tiene')
           : sinHrs + ' de ' + lista.length + ' no ' + (sinHrs === 1 ? 'tiene' : 'tienen')}
         horario en el catálogo: mirá que esté abierto antes de ir.</div>` : '';
    $('#ttList').innerHTML = !lista.length
      ? `<p class="sm muted">Nada entra en ${enMin(minSel)}${gana ? ' con esas ganas' : ''}. Probá con más tiempo.</p>`
      : lista.map(x => {
          const ruta = P ? [x.p, P] : [x.p], modo = x.tpt ? 'transit' : 'walking';
          const sies = VIDS.filter(v => x.it[v] === 2);
          const quien = !sies.length ? '' : sies.length === VIDS.length ? (VIDS.length > 1 ? 'sí de todos' : 'sí')
                      : 'sí de ' + sies.map(v => VBY[v].corto).join(', ');
          return `<div class="tt1" data-tt="${esc(x.p.id)}" data-x="${x.extra}">
            <div class="ttn">${esc(x.p.n)}<span>+${enMin(x.extra)}</span></div>
            <div class="ttd">${esc(cat(x.p).n)}${x.p.hood ? ' · ' + esc(x.p.hood) : ''}${quien ? ' · <b>' + esc(quien) + '</b>' : ''}<br>
              ~${enMin(x.viaje)} de ${x.tpt ? 'viaje' : 'caminata'} de más + ${enMin(x.estadia)} ahí${x.estimada ? ' (estimado)' : ''}${x.hs ? ' · 🕐 ' + esc(x.hs) : ''}</div>
            <div class="flex">
              <a class="chip g" data-nav="apple" href="${amRuta(ruta, modo)}" target="_blank" rel="noopener">→ Llevame</a>
              <a class="chip g" data-nav="google" href="${gmRuta(ruta, modo)}" target="_blank" rel="noopener">→ Google</a>
              <button class="chip" data-ttf="${esc(x.p.id)}">Ficha</button>
            </div></div>`;
        }).join('');
  };
  $('#tt').onclick = e => {
    const m = e.target.closest('[data-tm]'); if (m){ minSel = +m.dataset.tm; pinta(); return; }
    const c = e.target.closest('[data-tc]'); if (c){ gana = c.dataset.tc; pinta(); return; }
    const f = e.target.closest('[data-ttf]'); if (f) showPlace(f.dataset.ttf);
  };
  $('#ttDesde').onchange = e => { desde = e.target.value === 'gps' ? 'gps' : +e.target.value; minSel = null; pinta(); };
  pinta();
  /* El GPS llega después, si llega. Sin él, la cuenta ya está hecha desde la parada. */
  if (navigator.geolocation)
    navigator.geolocation.getCurrentPosition(
      pos => { gps = {ll: [pos.coords.latitude, pos.coords.longitude], ac: Math.round(pos.coords.accuracy || 0)};
        if (esHoy || desde == null){ desde = 'gps'; minSel = null; }
        pinta(); },
      () => {},
      {enableHighAccuracy: true, timeout: 12000, maximumAge: 60000});
}
function pickPlace(dayN){
  sheet(`<h2 style="font-size:17px;margin-bottom:4px">Agregar al día ${dayN}</h2>
    <p class="sm muted" style="margin-bottom:11px">Buscá y tocá para agregar.</p>
    <input class="search" id="ps" placeholder="Buscar…" style="width:100%;margin-bottom:11px">
    <div id="pl"></div>`);
  const draw = q => { const list = PLACES.filter(p =>
      !q || (p.n+' '+p.hood+' '+p.why).toLowerCase().includes(q.toLowerCase())).slice(0,45);
    $('#pl').innerHTML = list.map(p => `<button class="opt" data-pp="${p.id}">${esc(p.n)}
      <b>${esc(p.typ)} · ${esc(p.hood)} · ${money(p.cost)}</b></button>`).join('') ||
      '<p class="sm muted">Nada coincide.</p>'; };

      txt:txtBloque(p), pid:p.id, who:d.who, kind:'', note:'agregado por vos',
      done:false, mynote:''});

}

$('#bMenu').onclick = () => {

  $('#oVer').onclick = async e => { e.target.textContent = 'Buscando…';

  $('#oCsv').onclick = doCsv;
  /* Los bloques plegados no tienen el texto completo EN EL DOM: imprimir así
     saldría recortado. Se despliegan todos, se imprime, y se vuelve a como estaba. */
  $('#oPrn').onclick = () => { closeSheet();
    const antes = new Set(OPEN_BLK);
    if (S.tab === 'itin'){ S.itin.forEach(x => x.blocks.forEach(z => OPEN_BLK.add(z.id))); rItin(); }
    setTimeout(() => {
      window.print();
      OPEN_BLK.clear(); antes.forEach(x => OPEN_BLK.add(x));
      if (S.tab === 'itin') rItin();
    }, 250); };
  $('#oRst').onclick = () => { if (confirm('¿Borrar todos tus cambios y volver al plan original?')){
    S = fresh(); save(); closeSheet(); go('itin'); } };
  $('#oImp').onclick = () => {
    closeSheet();
    const cargar = txt => {
      let o;
      try { o = JSON.parse(txt); if (!o || !o.itin) throw 0; }
      catch(e){ toast('Ese texto no es un plan válido. Copiá TODO lo que te dio Exportar.'); return; }
      /* De otro viaje no se importa: el itinerario y los ids de lugar son otros,
         y quedaría un plan mezclado que no se puede deshacer. */
      if (o._viaje && o._viaje !== TRIP.slug){
        toast('Ese plan es de otro viaje (' + o._viaje + '), no de ' + TRIP.slug); return;
      }
      /* Si el itinerario cambió desde que se exportó, va por migrate() —que
         adopta el itinerario nuevo conservando lo del usuario— y no por
         hydrate(), que solo rellena claves faltantes. */
      S = (o.baseHash === DATA.itinHash) ? hydrate(o) : migrate(o);
      ['_viaje','_ver','_quien','_cuando'].forEach(k => delete S[k]);
      save();
      rebuildCatalog(); buildDayMap();   /* lo importado puede traer lugares nuevos */
      document.getElementById('planSheet')?.remove(); go('itin');
      toast('Plan importado' + (MIGRATED ? ' y actualizado al itinerario nuevo' : ''));
    };
    planSheet('Importar plan',
      'Pegá el texto que te dio <b>Exportar</b> en el otro dispositivo, o cargá el archivo .json.',
      '', [{t:'Importar', f: cargar},
           {t:'Desde archivo', f: () => {
              const f = document.createElement('input'); f.type = 'file'; f.accept = '.json,application/json';
              f.onchange = () => { const r = new FileReader(); r.onload = () => cargar(r.result); r.readAsText(f.files[0]); };
              f.click(); }}], true); };
};

/* ¿El servidor tiene una versión más nueva que la que este navegador cargó?
   Solo funciona servido por http(s); con archivo local devuelve null. */
async function hayVersionNueva(){
  try {
    const r = await fetch(location.pathname + '?v=' + Date.now(), {cache: 'reload'});
    if (!r.ok) return null;
    const t = await r.text();
    const m = t.match(/"verId":"([a-f0-9]{6})"/);
    return m ? m[1] !== VERID : null;
  } catch(e){ return null; }
}
/* Al abrir, avisa una sola vez si quedó una versión vieja cacheada. */
async function avisarSiHayVersionNueva(){
  if (location.protocol === 'file:') return;
  if (await hayVersionNueva() === true)
    toast('Hay una versión más nueva del plan. Recargá la página para verla.');
}
function toast(msg){
  let t = document.getElementById('toast');
  if (!t){ t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.textContent = msg; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 4200);
}
const HOSTED = (() => { try { return window.self !== window.top; } catch(e){ return true; } })();
const puedeBajar = () => !HOSTED || !!DLNS;
let DLNS;   // namespace de descargas del visor (solo existe en el sitio publicado)
(async () => { try { DLNS = window.claude && await window.claude.use('downloads'); } catch(e){} })();
async function dl(name, text, type){
  if (DLNS){                                   // sitio publicado: lo guarda el visor, con confirmación
    try { await DLNS.save({ filename: name, data: new TextEncoder().encode(text) }); return true; }
    catch(e){
      if (e && e.code === 'declined') return false;
      toast('No se pudo descargar' + (e && e.code ? ' (' + e.code + ')' : '') + '. Copiá el plan a mano o abrí el archivo en la compu.');
      return false;
    }
  }
  const b = new Blob([text], {type}); const u = URL.createObjectURL(b);   // archivo local
  const a = document.createElement('a'); a.href = u; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(u), 2000);
  return true;
}
async function doExport(){
  closeSheet();
  /* El export se SELLA con el viaje y la versión. Sin eso, importar el plan de
     otro viaje entra sin chistar y se ve un itinerario ajeno hasta recargar.
     Los campos empiezan con _ para no chocar nunca con una clave del estado. */
  const txt = JSON.stringify(Object.assign({}, S,
    {_viaje: TRIP.slug, _ver: VERID, _quien: S.yo || '',
     _cuando: hoyStr() + ' ' + hhmmNow()}), null, 1);
  planSheet('Exportar mi plan',
    'Copiá este texto y pegalo en el otro dispositivo con <b>Importar plan</b>. También podés bajarlo como archivo.',
    txt, [{t:'Copiar', f: async () => {
        try { await navigator.clipboard.writeText(txt); toast('Plan copiado al portapapeles'); }
        catch(e){ const a = document.getElementById('planTxt'); a.select(); document.execCommand('copy'); toast('Plan copiado'); }
      }},
      ...(puedeBajar() ? [{t:'Bajar archivo', f: async () => {
        if (await dl(TRIP.slug + '-plan.json', txt, 'application/json')) toast('Plan exportado'); }}] : [])]);
}
/* Panel simple con un textarea y botones: sirve para exportar (texto listo para copiar)
   y para importar (pegar el texto del otro dispositivo). */
function planSheet(titulo, ayuda, valor, acciones, alPegar){
  const w = document.createElement('div');
  w.id = 'planSheet';
  w.innerHTML = `<div class="psBack"></div><div class="psBox" role="dialog" aria-modal="true" aria-label="${esc(titulo)}">
    <h3 style="margin:0 0 4px">${esc(titulo)}</h3>
    <p class="sm muted" style="margin:0 0 10px">${ayuda}</p>
    <textarea id="planTxt" spellcheck="false" ${alPegar ? 'placeholder="Pegá acá el texto exportado en el otro dispositivo"' : ''}>${esc(valor)}</textarea>
    <div class="flex" style="margin-top:11px;justify-content:flex-end">
      ${acciones.map((a, i) => `<button class="btn" data-a="${i}">${esc(a.t)}</button>`).join('')}
      <button class="btn" data-a="x">Cerrar</button></div></div>`;
  document.body.appendChild(w);
  w.querySelector('.psBack').onclick = () => w.remove();
  w.onclick = e => { const b = e.target.closest('[data-a]'); if (!b) return;
    if (b.dataset.a === 'x') { w.remove(); return; }
    acciones[+b.dataset.a].f(document.getElementById('planTxt').value); };
  if (alPegar) setTimeout(() => document.getElementById('planTxt').focus(), 50);
}
function doCsv(){
  const q = s => '"' + String(s == null ? '' : s).replace(/"/g,'""') + '"';
  const head = ['Lugar','Categoria','Tipo','Barrio','Zona',...VS.map(v => v.corto),'Costo','Horas','Turistico',
                'Cierra','Gratis/PWYW','Reserva',TPT.nombre,'PorQue','Direccion'];
  const rows = PLACES.map(p => { const i = interest(p.id);
    return [p.n, cat(p).n, p.typ, p.hood, p.boro, ...VIDS.map(v => i[v]), p.cost, p.dur,
            p.main?'SI':'no', p.closed, p.free, p.book, p.sub, p.why, p.addr].map(q).join(','); });
  const csv = head.map(q).join(',') + '\n' + rows.join('\n');
  closeSheet();
  if (puedeBajar()){ dl(TRIP.slug + '-lugares.csv', '\ufeff' + csv, 'text/csv;charset=utf-8'); return; }
  planSheet('Lugares en CSV',
    'Copiá este texto y pegalo en una hoja de cálculo: Excel y Google Sheets separan las columnas solos.',
    csv, [{t:'Copiar', f: async () => {
      try { await navigator.clipboard.writeText(csv); toast('CSV copiado'); }
      catch(e){ const a = document.getElementById('planTxt'); a.select(); document.execCommand('copy'); toast('CSV copiado'); } }}]);
}

/* ── Cambiar de día deslizando ────────────────────────────────────────────────
   Cambiar de día es lo que más se hace, y la tira de días está arriba de todo:
   con una mano y el celular grande, no se llega. El gesto tiene que ser claramente
   horizontal (más del doble que el vertical) para no comerse el scroll, y no cuenta
   si arrancó adentro de algo que ya scrollea solo. */
(function(){
  let x0 = null, y0 = null, ok = false;
  const v = $('#v-itin');
  v.addEventListener('touchstart', e => {
    if (e.touches.length !== 1){ ok = false; return; }
    const t = e.target;
    ok = !t.closest('.days, .tw, .tools, input, textarea, select, .leaflet-container, .bmeta, .aca, .paso, .hood');
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
  }, {passive:true});
  v.addEventListener('touchend', e => {
    if (!ok || x0 == null) return;
    const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
    x0 = null;
    if (Math.abs(dx) < 65 || Math.abs(dx) < Math.abs(dy) * 2.2) return;
    const i = S.itin.findIndex(z => z.n === S.day);
    const j = dx < 0 ? i + 1 : i - 1;
    if (j < 0 || j >= S.itin.length){ toast(dx < 0 ? 'Es el último día.' : 'Es el primer día.'); return; }
    S.day = S.itin[j].n; save(); rItin(); window.scrollTo({top:0});
  }, {passive:true});
})();

/* ── El reloj corre ──────────────────────────────────────────────────────────
   Cada 30 s se repinta SOLO la tarjeta "Ahora". El día entero se re-renderiza
   nada más cuando cambia el bloque actual, y nunca mientras alguien escribe. */
let ULT_I = null;
setInterval(() => {
  const t = hoyStr(), cambioDia = t !== TODAY;
  TODAY = t;
  if (S.tab !== 'itin') return;
  pintarAhora();
  const d = S.itin.find(x => x.n === S.day);
  const i = idxAhora(d);
  const escribiendo = /^(INPUT|TEXTAREA)$/.test((document.activeElement || {}).tagName || '');
  if ((i !== ULT_I || cambioDia) && !escribiendo){ ULT_I = i; rItin(); }
  else ULT_I = i;
}, 30000);

/* ═══════════ ARRANQUE ═══════════ */
(function(){
  $('#hbrand').textContent = TRIP.titulo;
  const t = S.itin.find(d => d.date === TODAY);
  if (t) { S.day = t.n; $('#hsub').textContent = 'hoy · día ' + t.n + ' · ' + t.dow.toLowerCase() + ' ' + (+t.date.slice(8)) + '/' + t.date.slice(5,7); }
  else   { $('#hsub').textContent = TRIP.subtitulo; }
  ULT_I = idxAhora(S.itin.find(x => x.n === S.day));
  go(S.tab || 'itin'); setStat();
  $('#hsub').title = 'Versión del plan: ' + VER + ' · ' + VERID;
  setTimeout(avisarSiHayVersionNueva, 2500);   // aviso si el navegador cargó una versión cacheada
  window.__ARRANCO = true;   // la mira la red de seguridad de arriba del body
})();
